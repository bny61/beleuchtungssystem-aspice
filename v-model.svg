<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1250" width="1900" height="1250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>V-model of the project with the agent and its role at each stage</title>
  <desc>Six V-model stages from system concept and requirements through architecture and analysis,
  hardware and software design, implementation, unit testing, system and integration test to
  validation and release. Each stage names the specialised agents that lead it together with their
  scope. config-manager and quality-assessor run continuously as supporting processes. A quick-start
  panel shows the phase-run command.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E85"/>
    </marker>
    <marker id="arrowThick" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B9C9DC"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D6FB8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="1250" rx="14" fill="#FFFFFF"/>

  <!-- Header -->
  <line x1="60" y1="58" x2="300" y2="58" stroke="#0F3A6B" stroke-width="4"/>
  <line x1="1600" y1="58" x2="1840" y2="58" stroke="#0F3A6B" stroke-width="4"/>
  <text x="950" y="72" text-anchor="middle" font-size="46" font-weight="700" fill="#0F3A6B" letter-spacing="1">V-MODEL — AI-ASSISTED ENGINEERING</text>
  <text x="950" y="110" text-anchor="middle" font-size="21" fill="#1F4E85">Developed along ASPICE PAM 4.0 and ISO 26262</text>
  <text x="950" y="138" text-anchor="middle" font-size="17" fill="#6B7A8D" font-style="italic">Teaching / reference project — not a production baseline, no assessment performed</text>

  <!-- What makes this V-model different -->
  <rect x="60" y="158" width="1780" height="64" rx="10" fill="#F4F8FC" stroke="#C3D6E8" stroke-width="2"/>
  <text x="88" y="185" font-size="16" font-weight="700" fill="#0F3A6B">What is different here:</text>
  <text x="272" y="185" font-size="16" fill="#33465C">no stage is worked by a generalist. Each one is led by a named agent with a defined scope, loading its own method skills</text>
  <text x="88" y="209" font-size="16" fill="#33465C">(EARS, HARA, AIAG-VDA, MagicGrid, GSN). Handoffs between agents are part of the definition, and two gates — the traceability check and an independent read-only review — sit between every result and its baseline.</text>

  <!-- V arms -->
  <path d="M 660 300 L 760 930" stroke="#DFE7F0" stroke-width="26" stroke-linecap="round" fill="none" marker-end="url(#arrowThick)"/>
  <path d="M 800 930 L 900 300" stroke="#DFE7F0" stroke-width="26" stroke-linecap="round" fill="none" marker-end="url(#arrowThick)"/>

  <!-- Traceability arrows -->
  <line x1="545" y1="340" x2="1000" y2="340" stroke="#1F4E85" stroke-width="2.5" stroke-dasharray="10 8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="595" y1="580" x2="950" y2="580" stroke="#1F4E85" stroke-width="2.5" stroke-dasharray="10 8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="645" y1="820" x2="900" y2="820" stroke="#1F4E85" stroke-width="2.5" stroke-dasharray="10 8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ============ LEFT BRANCH ============ -->
  <g>
    <rect x="60" y="240" width="470" height="200" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 60 250 a10 10 0 0 1 10 -10 h 46 v 200 h -46 a10 10 0 0 1 -10 -10 z" fill="#2E6FAE"/>
    <circle cx="88" cy="282" r="21" fill="#0F3A6B"/>
    <text x="88" y="289" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">1</text>
    <text x="140" y="278" font-size="23" font-weight="700" fill="#0F3A6B">System Concept &amp;</text>
    <text x="140" y="306" font-size="23" font-weight="700" fill="#0F3A6B">Requirements</text>
    <text x="140" y="345" font-size="15" font-weight="700" fill="#1D6FB8">systems-engineer</text>
    <text x="140" y="365" font-size="13" fill="#33465C">elicits CR, derives SYS-REQ, EARS wording, traces</text>
    <text x="140" y="394" font-size="15" font-weight="700" fill="#1D6FB8">safety-manager</text>
    <text x="140" y="414" font-size="13" fill="#33465C">item definition, HARA, safety goals, FSC</text>
  </g>

  <g>
    <rect x="110" y="480" width="470" height="200" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 110 490 a10 10 0 0 1 10 -10 h 46 v 200 h -46 a10 10 0 0 1 -10 -10 z" fill="#2E6FAE"/>
    <circle cx="138" cy="522" r="21" fill="#0F3A6B"/>
    <text x="138" y="529" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">2</text>
    <text x="190" y="520" font-size="23" font-weight="700" fill="#0F3A6B">Architecture &amp; Analysis</text>
    <text x="190" y="556" font-size="15" font-weight="700" fill="#1D6FB8">systems-engineer</text>
    <text x="190" y="575" font-size="13" fill="#33465C">E/E architecture, interfaces, TSR allocation</text>
    <text x="190" y="601" font-size="15" font-weight="700" fill="#1D6FB8">mbse-modeler</text>
    <text x="190" y="620" font-size="13" fill="#33465C">MagicGrid matrix, SysML views as PlantUML</text>
    <text x="190" y="646" font-size="15" font-weight="700" fill="#1D6FB8">safety-analyst</text>
    <text x="190" y="665" font-size="13" fill="#33465C">FMEA, FTA, FMEDA, DFA, STPA</text>
  </g>

  <g>
    <rect x="160" y="720" width="470" height="200" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 160 730 a10 10 0 0 1 10 -10 h 46 v 200 h -46 a10 10 0 0 1 -10 -10 z" fill="#2E6FAE"/>
    <circle cx="188" cy="762" r="21" fill="#0F3A6B"/>
    <text x="188" y="769" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">3</text>
    <text x="240" y="758" font-size="23" font-weight="700" fill="#0F3A6B">Hardware &amp;</text>
    <text x="240" y="786" font-size="23" font-weight="700" fill="#0F3A6B">Software Design</text>
    <text x="240" y="825" font-size="15" font-weight="700" fill="#1D6FB8">hardware-engineer</text>
    <text x="240" y="845" font-size="13" fill="#33465C">HW-REQ, safety mechanisms SM-xx, derating</text>
    <text x="240" y="874" font-size="15" font-weight="700" fill="#1D6FB8">software-engineer</text>
    <text x="240" y="894" font-size="13" fill="#33465C">SW-REQ, SWC detailed design, MISRA C</text>
  </g>

  <!-- ============ RIGHT BRANCH ============ -->
  <g>
    <rect x="990" y="240" width="470" height="200" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 1404 240 h 46 a10 10 0 0 1 10 10 v 180 a10 10 0 0 1 -10 10 h -46 z" fill="#2E6FAE"/>
    <circle cx="1025" cy="282" r="21" fill="#0F3A6B"/>
    <text x="1025" y="289" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">6</text>
    <text x="1068" y="289" font-size="23" font-weight="700" fill="#0F3A6B">Validation &amp; Release</text>
    <text x="1068" y="332" font-size="15" font-weight="700" fill="#1D6FB8">verification-engineer</text>
    <text x="1068" y="352" font-size="13" fill="#33465C">validates the safety goals at vehicle level</text>
    <text x="1068" y="381" font-size="15" font-weight="700" fill="#1D6FB8">safety-manager</text>
    <text x="1068" y="401" font-size="13" fill="#33465C">safety case, confirmation measures, release criteria</text>
  </g>

  <g>
    <rect x="940" y="480" width="470" height="200" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 1354 480 h 46 a10 10 0 0 1 10 10 v 180 a10 10 0 0 1 -10 10 h -46 z" fill="#2E6FAE"/>
    <circle cx="975" cy="522" r="21" fill="#0F3A6B"/>
    <text x="975" y="529" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">5</text>
    <text x="1018" y="520" font-size="23" font-weight="700" fill="#0F3A6B">System &amp; Integration Test</text>
    <text x="1018" y="563" font-size="15" font-weight="700" fill="#1D6FB8">verification-engineer</text>
    <text x="1018" y="583" font-size="13" fill="#33465C">TC-xxx, fault injection, measured against the FTTI</text>
    <text x="1018" y="616" font-size="13" fill="#6B7A8D" font-style="italic">every test case names the requirement it covers —</text>
    <text x="1018" y="636" font-size="13" fill="#6B7A8D" font-style="italic">otherwise the traceability check reports it</text>
  </g>

  <g>
    <rect x="890" y="720" width="470" height="200" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 1304 720 h 46 a10 10 0 0 1 10 10 v 180 a10 10 0 0 1 -10 10 h -46 z" fill="#2E6FAE"/>
    <circle cx="925" cy="762" r="21" fill="#0F3A6B"/>
    <text x="925" y="769" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">4</text>
    <text x="968" y="769" font-size="23" font-weight="700" fill="#0F3A6B">Unit Testing</text>
    <text x="968" y="812" font-size="15" font-weight="700" fill="#1D6FB8">software-engineer</text>
    <text x="968" y="832" font-size="13" fill="#33465C">unit tests, structural coverage required for ASIL B</text>
    <text x="968" y="861" font-size="15" font-weight="700" fill="#1D6FB8">hardware-engineer</text>
    <text x="968" y="881" font-size="13" fill="#33465C">component verification, DV/PV, EMC, ISO 16750</text>
  </g>

  <!-- Implementation -->
  <path d="M 560 945 h 420 l -34 78 h -352 z" fill="#0F3A6B"/>
  <text x="770" y="980" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Implementation / Realization</text>
  <text x="770" y="1006" text-anchor="middle" font-size="14" fill="#B9CCE4">Requirements-as-Code · analyses · test cases</text>

  <!-- ============ QUICK START ============ -->
  <rect x="1500" y="240" width="350" height="560" rx="12" fill="#F7FAFD" stroke="#CBDCEE" stroke-width="2"/>
  <path d="M 1500 252 a12 12 0 0 1 12 -12 h 326 a12 12 0 0 1 12 12 v 68 h -350 z" fill="#0F3A6B"/>
  <text x="1675" y="277" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">QUICK START</text>
  <text x="1675" y="303" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">INSTRUCTIONS</text>

  <text x="1675" y="363" text-anchor="middle" font-size="18" font-weight="700" fill="#1D6FB8">Automated phase run</text>
  <rect x="1530" y="383" width="290" height="46" rx="8" fill="#FFFFFF" stroke="#9FC0DE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1675" y="412" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">/phase-run</text>
  <line x1="1675" y1="439" x2="1675" y2="467" stroke="#1D6FB8" stroke-width="3" marker-end="url(#arrowDown)"/>
  <text x="1555" y="502" font-size="17" fill="#33465C">then type</text>
  <rect x="1660" y="480" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#9FC0DE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1740" y="506" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">next</text>
  <text x="1675" y="547" text-anchor="middle" font-size="13" fill="#6B7A8D">the skill routes the phase to its agent</text>

  <line x1="1530" y1="574" x2="1820" y2="574" stroke="#D8E3EF" stroke-width="2"/>

  <text x="1675" y="608" text-anchor="middle" font-size="18" font-weight="700" fill="#1D6FB8">Direct invocation</text>
  <rect x="1530" y="626" width="290" height="66" rx="8" fill="#FFFFFF" stroke="#9FC0DE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1675" y="652" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">"use the safety-analyst</text>
  <text x="1675" y="675" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">agent to..."</text>
  <text x="1675" y="714" text-anchor="middle" font-size="15" fill="#6B7A8D">or load a method skill directly</text>
  <rect x="1600" y="730" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#9FC0DE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1675" y="756" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">/hara</text>

  <!-- ============ SUPPORTING PROCESSES ============ -->
  <rect x="130" y="1055" width="1300" height="130" rx="12" fill="#F4F9F5" stroke="#CFE3D6" stroke-width="2"/>
  <line x1="160" y1="1087" x2="470" y2="1087" stroke="#1D6B4E" stroke-width="2"/>
  <line x1="1090" y1="1087" x2="1400" y2="1087" stroke="#1D6B4E" stroke-width="2"/>
  <text x="780" y="1094" text-anchor="middle" font-size="20" font-weight="700" fill="#1D6B4E" letter-spacing="0.5">SUPPORTING PROCESSES (CONTINUOUS)</text>

  <circle cx="255" cy="1140" r="26" fill="#1D6B4E"/>
  <text x="255" y="1148" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">C</text>
  <text x="298" y="1135" font-size="19" font-weight="700" fill="#1D6B4E">config-manager</text>
  <text x="298" y="1160" font-size="14" fill="#33465C">repo structure, Requirements-as-Code, baselines, GitHub evidence</text>

  <line x1="800" y1="1110" x2="800" y2="1170" stroke="#CFE3D6" stroke-width="2"/>

  <circle cx="870" cy="1140" r="26" fill="#1D6B4E"/>
  <text x="870" y="1148" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Q</text>
  <text x="913" y="1135" font-size="19" font-weight="700" fill="#1D6B4E">quality-assessor</text>
  <text x="913" y="1160" font-size="14" fill="#33465C">independent review, read-only — reports findings, never patches</text>

  <text x="780" y="1225" text-anchor="middle" font-size="17" font-style="italic" fill="#6B7A8D">Bi-directional traceability between development and verification activities keeps specification and evidence aligned.</text>
</svg>
