<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1090" width="1900" height="1090" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>V-model of the project with the agent assigned to each stage</title>
  <desc>Six V-model stages: system concept and requirements, architecture and analysis, hardware and
  software design at the bottom implementation, then unit testing, system and integration test,
  validation and release. Each stage names its assigned agents. config-manager and quality-assessor
  run continuously as supporting processes. A quick-start panel shows the phase-run command.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E85"/>
    </marker>
    <marker id="arrowThick" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B9C9DC"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D6FB8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="1090" rx="14" fill="#FFFFFF"/>

  <!-- Header -->
  <line x1="60" y1="58" x2="330" y2="58" stroke="#0F3A6B" stroke-width="4"/>
  <line x1="1570" y1="58" x2="1840" y2="58" stroke="#0F3A6B" stroke-width="4"/>
  <text x="950" y="72" text-anchor="middle" font-size="46" font-weight="700" fill="#0F3A6B" letter-spacing="1">V-MODEL — AI-ASSISTED ENGINEERING</text>
  <text x="950" y="112" text-anchor="middle" font-size="21" fill="#1F4E85">Developed along ASPICE PAM 4.0 and ISO 26262</text>
  <text x="950" y="141" text-anchor="middle" font-size="17" fill="#6B7A8D" font-style="italic">Teaching / reference project — not a production baseline, no assessment performed</text>

  <!-- V arms -->
  <path d="M 585 200 L 735 700" stroke="#DFE7F0" stroke-width="26" stroke-linecap="round" fill="none" marker-end="url(#arrowThick)"/>
  <path d="M 800 700 L 950 200" stroke="#DFE7F0" stroke-width="26" stroke-linecap="round" fill="none" marker-end="url(#arrowThick)"/>

  <!-- Traceability arrows -->
  <line x1="530" y1="255" x2="1000" y2="255" stroke="#1F4E85" stroke-width="2.5" stroke-dasharray="10 8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="580" y1="440" x2="950" y2="440" stroke="#1F4E85" stroke-width="2.5" stroke-dasharray="10 8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="630" y1="625" x2="900" y2="625" stroke="#1F4E85" stroke-width="2.5" stroke-dasharray="10 8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ============ LEFT BRANCH ============ -->
  <g>
    <rect x="60" y="175" width="450" height="160" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 60 185 a10 10 0 0 1 10 -10 h 46 v 160 h -46 a10 10 0 0 1 -10 -10 z" fill="#2E6FAE"/>
    <circle cx="88" cy="215" r="21" fill="#0F3A6B"/>
    <text x="88" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">1</text>
    <text x="140" y="222" font-size="24" font-weight="700" fill="#0F3A6B">System Concept &amp;</text>
    <text x="140" y="252" font-size="24" font-weight="700" fill="#0F3A6B">Requirements</text>
    <text x="140" y="288" font-size="15" font-weight="700" fill="#1D6FB8">Assigned agents:</text>
    <text x="140" y="312" font-size="16" fill="#33465C">systems-engineer, safety-manager</text>
  </g>

  <g>
    <rect x="110" y="360" width="450" height="160" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 110 370 a10 10 0 0 1 10 -10 h 46 v 160 h -46 a10 10 0 0 1 -10 -10 z" fill="#2E6FAE"/>
    <circle cx="138" cy="400" r="21" fill="#0F3A6B"/>
    <text x="138" y="407" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">2</text>
    <text x="190" y="407" font-size="24" font-weight="700" fill="#0F3A6B">Architecture &amp; Analysis</text>
    <text x="190" y="443" font-size="15" font-weight="700" fill="#1D6FB8">Assigned agents:</text>
    <text x="190" y="467" font-size="16" fill="#33465C">systems-engineer, mbse-modeler,</text>
    <text x="190" y="491" font-size="16" fill="#33465C">safety-analyst</text>
  </g>

  <g>
    <rect x="160" y="545" width="450" height="160" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 160 555 a10 10 0 0 1 10 -10 h 46 v 160 h -46 a10 10 0 0 1 -10 -10 z" fill="#2E6FAE"/>
    <circle cx="188" cy="585" r="21" fill="#0F3A6B"/>
    <text x="188" y="592" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">3</text>
    <text x="240" y="585" font-size="24" font-weight="700" fill="#0F3A6B">Hardware &amp;</text>
    <text x="240" y="615" font-size="24" font-weight="700" fill="#0F3A6B">Software Design</text>
    <text x="240" y="651" font-size="15" font-weight="700" fill="#1D6FB8">Assigned agents:</text>
    <text x="240" y="675" font-size="16" fill="#33465C">hardware-engineer, software-engineer</text>
  </g>

  <!-- ============ RIGHT BRANCH ============ -->
  <g>
    <rect x="1000" y="175" width="450" height="160" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 1394 175 h 46 a10 10 0 0 1 10 10 v 140 a10 10 0 0 1 -10 10 h -46 z" fill="#2E6FAE"/>
    <circle cx="1035" cy="215" r="21" fill="#0F3A6B"/>
    <text x="1035" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">6</text>
    <text x="1078" y="215" font-size="24" font-weight="700" fill="#0F3A6B">Validation &amp; Release</text>
    <text x="1078" y="256" font-size="15" font-weight="700" fill="#1D6FB8">Assigned agents:</text>
    <text x="1078" y="280" font-size="16" fill="#33465C">verification-engineer,</text>
    <text x="1078" y="304" font-size="16" fill="#33465C">safety-manager</text>
  </g>

  <g>
    <rect x="950" y="360" width="450" height="160" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 1344 360 h 46 a10 10 0 0 1 10 10 v 140 a10 10 0 0 1 -10 10 h -46 z" fill="#2E6FAE"/>
    <circle cx="985" cy="400" r="21" fill="#0F3A6B"/>
    <text x="985" y="407" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">5</text>
    <text x="1028" y="400" font-size="24" font-weight="700" fill="#0F3A6B">System &amp;</text>
    <text x="1028" y="430" font-size="24" font-weight="700" fill="#0F3A6B">Integration Test</text>
    <text x="1028" y="466" font-size="15" font-weight="700" fill="#1D6FB8">Assigned agent:</text>
    <text x="1028" y="490" font-size="16" fill="#33465C">verification-engineer</text>
  </g>

  <g>
    <rect x="900" y="545" width="450" height="160" rx="10" fill="#FFFFFF" stroke="#CBDCEE" stroke-width="2"/>
    <path d="M 1294 545 h 46 a10 10 0 0 1 10 10 v 140 a10 10 0 0 1 -10 10 h -46 z" fill="#2E6FAE"/>
    <circle cx="935" cy="585" r="21" fill="#0F3A6B"/>
    <text x="935" y="592" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">4</text>
    <text x="978" y="585" font-size="24" font-weight="700" fill="#0F3A6B">Unit Testing</text>
    <text x="978" y="621" font-size="15" font-weight="700" fill="#1D6FB8">Assigned agents:</text>
    <text x="978" y="645" font-size="16" fill="#33465C">software-engineer,</text>
    <text x="978" y="669" font-size="16" fill="#33465C">hardware-engineer</text>
  </g>

  <!-- Implementation -->
  <path d="M 560 715 h 420 l -34 78 h -352 z" fill="#0F3A6B"/>
  <text x="770" y="750" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Implementation / Realization</text>
  <text x="770" y="776" text-anchor="middle" font-size="14" fill="#B9CCE4">Requirements-as-Code · analyses · test cases</text>

  <!-- ============ QUICK START ============ -->
  <rect x="1490" y="175" width="350" height="530" rx="12" fill="#F7FAFD" stroke="#CBDCEE" stroke-width="2"/>
  <path d="M 1490 187 a12 12 0 0 1 12 -12 h 326 a12 12 0 0 1 12 12 v 68 h -350 z" fill="#0F3A6B"/>
  <text x="1665" y="212" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">QUICK START</text>
  <text x="1665" y="238" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">INSTRUCTIONS</text>

  <text x="1665" y="298" text-anchor="middle" font-size="18" font-weight="700" fill="#1D6FB8">Automated phase run</text>
  <rect x="1520" y="318" width="290" height="46" rx="8" fill="#FFFFFF" stroke="#9FC0DE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1665" y="347" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">/phase-run</text>
  <line x1="1665" y1="374" x2="1665" y2="402" stroke="#1D6FB8" stroke-width="3" marker-end="url(#arrowDown)"/>
  <text x="1545" y="437" font-size="17" fill="#33465C">then type</text>
  <rect x="1650" y="415" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#9FC0DE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1730" y="441" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">next</text>

  <line x1="1520" y1="482" x2="1810" y2="482" stroke="#D8E3EF" stroke-width="2"/>

  <text x="1665" y="518" text-anchor="middle" font-size="18" font-weight="700" fill="#1D6FB8">Direct invocation</text>
  <rect x="1520" y="536" width="290" height="66" rx="8" fill="#FFFFFF" stroke="#9FC0DE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1665" y="562" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">"use the safety-analyst</text>
  <text x="1665" y="585" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">agent to..."</text>
  <text x="1665" y="628" text-anchor="middle" font-size="16" fill="#6B7A8D">or</text>
  <rect x="1590" y="645" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#9FC0DE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1665" y="671" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#0F3A6B">/hara</text>

  <!-- ============ SUPPORTING PROCESSES ============ -->
  <rect x="130" y="850" width="1290" height="130" rx="12" fill="#F4F9F5" stroke="#CFE3D6" stroke-width="2"/>
  <line x1="160" y1="882" x2="480" y2="882" stroke="#1D6B4E" stroke-width="2"/>
  <line x1="1070" y1="882" x2="1390" y2="882" stroke="#1D6B4E" stroke-width="2"/>
  <text x="775" y="889" text-anchor="middle" font-size="20" font-weight="700" fill="#1D6B4E" letter-spacing="0.5">SUPPORTING PROCESSES (CONTINUOUS)</text>

  <circle cx="255" cy="935" r="26" fill="#1D6B4E"/>
  <text x="255" y="943" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">C</text>
  <text x="298" y="930" font-size="19" font-weight="700" fill="#1D6B4E">config-manager:</text>
  <text x="298" y="955" font-size="16" fill="#33465C">Repo structure, Req-as-Code, baselines</text>

  <line x1="775" y1="905" x2="775" y2="965" stroke="#CFE3D6" stroke-width="2"/>

  <circle cx="845" cy="935" r="26" fill="#1D6B4E"/>
  <text x="845" y="943" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Q</text>
  <text x="888" y="930" font-size="19" font-weight="700" fill="#1D6B4E">quality-assessor:</text>
  <text x="888" y="955" font-size="16" fill="#33465C">Independent read-only reviews</text>

  <text x="775" y="1030" text-anchor="middle" font-size="17" font-style="italic" fill="#6B7A8D">Bi-directional traceability between development and verification activities keeps specification and evidence aligned.</text>
</svg>
