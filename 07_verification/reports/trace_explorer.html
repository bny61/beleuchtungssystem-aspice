const DATA = {"nodes": [{"id": "CR-001", "kind": "CR", "asil": "B", "status": "draft", "type": "functional", "text": "When the driver moves the light switch to the \"low beam\" position, the lighting system shall activate the low beam within 300 ms.", "file": "01_requirements/customer/CR-001.md", "level": 0}, {"id": "CR-002", "kind": "CR", "asil": "B", "status": "draft", "type": "functional", "text": "When ambient brightness decreases, the lighting system shall switch to low beam in good time and with sufficient brightness.", "file": "01_requirements/customer/CR-002.md", "level": 0}, {"id": "CR-003", "kind": "CR", "asil": "A", "status": "draft", "type": "functional", "text": "When the vehicle sensor system reports oncoming or preceding vehicles, the lighting system shall mask the affected high-beam segment within 500 ms.", "file": "01_requirements/customer/CR-003.md", "level": 0}, {"id": "CR-004", "kind": "CR", "asil": "A", "status": "draft", "type": "functional", "text": "While the vehicle speed exceeds 10 km/h, the lighting system shall prevent activation of the work lamps.", "file": "01_requirements/customer/CR-004.md", "level": 0}, {"id": "CR-005", "kind": "CR", "asil": "A", "status": "draft", "type": "functional", "text": "When the steering angle exceeds 15 degrees, the lighting system shall switch on the cornering light via the LIN-controlled stepper motor and shall additionally switch it off again when the angle falls below 5 degrees and store the state in the fault memory.", "file": "01_requirements/customer/CR-005.md", "level": 0}, {"id": "CR-006", "kind": "CR", "asil": "QM", "status": "draft", "type": "functional", "text": "When the ignition is switched on, the lighting system shall activate the daytime running lights within 2 s.", "file": "01_requirements/customer/CR-006.md", "level": 0}, {"id": "CR-007", "kind": "CR", "asil": "B", "status": "reviewed", "type": "functional", "text": "The lighting system shall detect the failure of a low-beam channel and indicate it visually to the driver in the instrument cluster within 2 s.", "file": "01_requirements/customer/CR-007.md", "level": 0}, {"id": "CR-008", "kind": "CR", "asil": "B", "status": "draft", "type": "functional", "text": "When a low-beam channel fails, the lighting system shall continue to operate the remaining channel and store the failure in the fault memory.", "file": "01_requirements/customer/CR-008.md", "level": 0}, {"id": "CR-009", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "The lighting system shall comply with the installation and switching requirements of ECE Regulation R48 for class N3 vehicles.", "file": "01_requirements/customer/CR-009.md", "level": 0}, {"id": "CR-010", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "The low-beam and high-beam functions shall meet the photometric requirements of ECE Regulations R112 and R123.", "file": "01_requirements/customer/CR-010.md", "level": 0}, {"id": "CR-011", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "Where a rotating beacon is fitted, its control shall meet the requirements of ECE Regulation R65.", "file": "01_requirements/customer/CR-011.md", "level": 0}, {"id": "CR-012", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "The lighting system shall comply with the EMC requirements of ECE Regulation R10.", "file": "01_requirements/customer/CR-012.md", "level": 0}, {"id": "CR-013", "kind": "CR", "asil": "QM", "status": "draft", "type": "environmental-mechanical", "text": "The lighting system shall withstand the mechanical loads per ISO 16750-3 for the front-module mounting location.", "file": "01_requirements/customer/CR-013.md", "level": 0}, {"id": "CR-014", "kind": "CR", "asil": "QM", "status": "draft", "type": "environmental-mechanical", "text": "The lighting system shall remain functional across an ambient temperature range from -40 °C to +85 °C.", "file": "01_requirements/customer/CR-014.md", "level": 0}, {"id": "CR-015", "kind": "CR", "asil": "QM", "status": "draft", "type": "environmental-mechanical", "text": "The ECU housing shall meet protection class IP6K9K per ISO 20653.", "file": "01_requirements/customer/CR-015.md", "level": 0}, {"id": "CR-016", "kind": "CR", "asil": "B", "status": "draft", "type": "electrical", "text": "The lighting system shall be supplied via a buck converter with a downstream 5 V linear regulator so that it operates across the vehicle supply range from 16 V to 32 V.", "file": "01_requirements/customer/CR-016.md", "level": 0}, {"id": "CR-017", "kind": "CR", "asil": "B", "status": "draft", "type": "electrical", "text": "While transients per ISO 7637-2 are present at the vehicle supply connection, the lighting system shall maintain the low-beam function without loss of function.", "file": "01_requirements/customer/CR-017.md", "level": 0}, {"id": "CR-018", "kind": "CR", "asil": "QM", "status": "draft", "type": "electrical", "text": "While the vehicle is in the ignition-off state, the lighting system shall not exceed a quiescent current of 1 mA after the run-on time has elapsed.", "file": "01_requirements/customer/CR-018.md", "level": 0}, {"id": "CR-019", "kind": "CR", "asil": "QM", "status": "draft", "type": "diagnostics", "text": "When a diagnostic tester sends a UDS request per ISO 14229, the lighting system shall provide the stored DTCs within 100 ms.", "file": "01_requirements/customer/CR-019.md", "level": 0}, {"id": "CR-020", "kind": "CR", "asil": "B", "status": "draft", "type": "communication", "text": "The lighting system shall exchange control and status information with the vehicle via CAN FD per SAE J1939.", "file": "01_requirements/customer/CR-020.md", "level": 0}, {"id": "CR-021", "kind": "CR", "asil": "QM", "status": "draft", "type": "communication", "text": "The lighting system shall connect actuator-side components via LIN per ISO 17987.", "file": "01_requirements/customer/CR-021.md", "level": 0}, {"id": "CR-022", "kind": "CR", "asil": "QM", "status": "draft", "type": "durability", "text": "The lighting system shall achieve an operating life of 30,000 h or a mileage of 1,500,000 km without exceeding the permissible failure rate.", "file": "01_requirements/customer/CR-022.md", "level": 0}, {"id": "CR-023", "kind": "CR", "asil": "QM", "status": "draft", "type": "interface", "text": "The lighting system shall meet the interface requirements of the vehicle-level cybersecurity concept per ISO 21434.", "file": "01_requirements/customer/CR-023.md", "level": 0}, {"id": "CR-024", "kind": "CR", "asil": "QM", "status": "draft", "type": "functional", "text": "While the low beam is active in its base light distribution, the lighting system shall provide an illuminance of at least 12 lx at measuring point 75R on the measuring screen.", "file": "01_requirements/customer/CR-024.md", "level": 0}, {"id": "CR-025", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "While the low beam is active, the lighting system shall not exceed an illuminance of 0.7 lx at measuring point B50L on the measuring screen.", "file": "01_requirements/customer/CR-025.md", "level": 0}, {"id": "CR-026", "kind": "CR", "asil": "QM", "status": "draft", "type": "functional", "text": "If one low-beam channel has failed, the lighting system shall continue to provide, with the remaining channel, at least the photometric minimum that the applicable ECE Regulation for the passing beam requires (ECE R112/R123, photometric requirements).", "file": "01_requirements/customer/CR-026.md", "level": 0}, {"id": "CR-027", "kind": "CR", "asil": "QM", "status": "draft", "type": "functional", "text": "When a change of the adaptive light-distribution mode is requested, the lighting system shall have completed the transition to the illuminance distribution of the new mode within 1000 ms.", "file": "01_requirements/customer/CR-027.md", "level": 0}, {"id": "CR-028", "kind": "CR", "asil": "QM", "status": "draft", "type": "functional", "text": "While the low beam is active and thermal derating is not active, the lighting system shall keep the illuminance at measuring point 75R within +/-10 % of its value at 25 degC ambient temperature over the ambient temperature range from -40 degC to +85 degC and over the normal supply-voltage range.", "file": "01_requirements/customer/CR-028.md", "level": 0}, {"id": "FSR-001", "kind": "FSR", "asil": "B", "status": "reviewed", "type": "safety", "text": "When a low-beam channel fails, the lighting system shall detect the failure within the fault reaction time, transition to the safe state and warn the driver.", "file": "02_safety/03_fsc/FSR-001.md", "level": 2}, {"id": "FSR-002", "kind": "FSR", "asil": "B", "status": "draft", "type": "safety", "text": "The lighting system shall prevent any deactivation of the low beam that was not requested by the driver.", "file": "02_safety/03_fsc/FSR-002.md", "level": 2}, {"id": "FSR-003", "kind": "FSR", "asil": "B", "status": "draft", "type": "safety", "text": "While only one low-beam channel has failed, the lighting system shall continue to operate the remaining channel.", "file": "02_safety/03_fsc/FSR-003.md", "level": 2}, {"id": "FSR-004", "kind": "FSR", "asil": "B", "status": "draft", "type": "safety", "text": "When the lighting system has detected the failure of a low-beam channel, it shall warn the driver visually within 2 s.", "file": "02_safety/03_fsc/FSR-004.md", "level": 2}, {"id": "FSR-005", "kind": "FSR", "asil": "A", "status": "draft", "type": "safety", "text": "When an oncoming or preceding vehicle is reported, the lighting system shall switch off the glaring high-beam segment within the fault reaction time.", "file": "02_safety/03_fsc/FSR-005.md", "level": 2}, {"id": "FSR-006", "kind": "FSR", "asil": "QM(A)", "status": "draft", "type": "safety", "text": "The lighting system shall determine the high-beam segment to be deactivated from the reported object data and control it accordingly.", "file": "02_safety/03_fsc/FSR-006.md", "level": 2}, {"id": "FSR-007", "kind": "FSR", "asil": "A(A)", "status": "draft", "type": "safety", "text": "When the high-beam state contradicts the reported traffic situation, a monitor independent of the control path shall switch off the high beam within the fault reaction time.", "file": "02_safety/03_fsc/FSR-007.md", "level": 2}, {"id": "FSR-008", "kind": "FSR", "asil": "A", "status": "draft", "type": "safety", "text": "While the vehicle speed exceeds 10 km/h, the lighting system shall inhibit activation of the work lamps.", "file": "02_safety/03_fsc/FSR-008.md", "level": 2}, {"id": "H-01", "kind": "H", "asil": "B", "status": "draft", "type": "hazard", "text": "Failure of the low beam (both channels) during night driving: carriageway unlit at 80 km/h, running off the road or colliding with an unlit obstacle.", "file": "02_safety/02_hara/H-01.md", "level": 0}, {"id": "H-02", "kind": "H", "asil": "A", "status": "draft", "type": "hazard", "text": "High beam remains active despite a detected oncoming vehicle: glare to the oncoming driver, head-on collision.", "file": "02_safety/02_hara/H-02.md", "level": 0}, {"id": "H-03", "kind": "H", "asil": "A", "status": "draft", "type": "hazard", "text": "Work lamps unintentionally active while driving: glare to oncoming and following traffic.", "file": "02_safety/02_hara/H-03.md", "level": 0}, {"id": "H-04", "kind": "H", "asil": "B", "status": "draft", "type": "hazard", "text": "Unintended deactivation of the low beam during operation: same effect as H-01, additionally unexpected for the driver.", "file": "02_safety/02_hara/H-04.md", "level": 0}, {"id": "H-05", "kind": "H", "asil": "A", "status": "draft", "type": "hazard", "text": "Headlamp levelling permanently set too high: sustained glare to oncoming traffic.", "file": "02_safety/02_hara/H-05.md", "level": 0}, {"id": "H-06", "kind": "H", "asil": "QM", "status": "draft", "type": "hazard", "text": "Failure of the daytime running lights during daytime driving with good visibility: reduced conspicuity of the vehicle.", "file": "02_safety/02_hara/H-06.md", "level": 0}, {"id": "H-07", "kind": "H", "asil": "A", "status": "draft", "type": "hazard", "text": "Cornering light swivels into the oncoming lane: glare to oncoming traffic, unexpected and not correctable by the affected driver.", "file": "02_safety/02_hara/H-07.md", "level": 0}, {"id": "HW-REQ-001", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The current sensing of a low-beam channel shall measure the channel load current with a total uncertainty of not more than +/-20 mA at a channel current of 150 mA, over an ambient temperature range of -40 C to +85 C and including the residual error under the conducted-disturbance test levels of the HW verification plan.", "file": "05_hardware/HW-REQ-001.md", "level": 4}, {"id": "HW-REQ-002", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The current sensing of a low-beam channel shall guarantee that a true channel current below 130 mA is always evaluated as below the classification threshold and that a true channel current above 170 mA is never evaluated as below the classification threshold.", "file": "05_hardware/HW-REQ-002.md", "level": 4}, {"id": "HW-REQ-003", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The analogue-to-digital conversion of the low-beam channel current shall be triggered by the PWM timer unit of the LED driver stage, with a sampling instant inside the PWM on-phase not earlier than 50 us after the rising edge and not later than 20 us before the falling edge.", "file": "05_hardware/HW-REQ-003.md", "level": 4}, {"id": "HW-REQ-004", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "Where the commanded PWM on-time of a low-beam channel is shorter than 150 us, the LED driver stage shall insert a diagnostic measurement window of at least 200 us at the commanded set point at intervals of not more than 10 ms.", "file": "05_hardware/HW-REQ-004.md", "level": 4}, {"id": "HW-REQ-005", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "The current sensing of a low-beam channel shall evaluate the measured current during the PWM off-phase and shall signal a current-sensing fault if the measured value exceeds 30 mA in the off-phase for more than 20 ms.", "file": "05_hardware/HW-REQ-005.md", "level": 4}, {"id": "HW-REQ-006", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The LED driver stage shall provide the channel output voltage to the microcontroller as a measured value in both the PWM on-phase and the PWM off-phase, with a resolution of at least 100 mV over a range of 0 V to 40 V.", "file": "05_hardware/HW-REQ-006.md", "level": 4}, {"id": "HW-REQ-007", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "interface", "text": "The LED driver stage shall provide its over-voltage, over-current and over-temperature status to the microcontroller as a readable signal with an update interval of not more than 10 ms.", "file": "05_hardware/HW-REQ-007.md", "level": 4}, {"id": "HW-REQ-008", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The thermal derating function of a low-beam channel shall not command a channel set point below 400 mA while the channel is commanded on.", "file": "05_hardware/HW-REQ-008.md", "level": 4}, {"id": "HW-REQ-009", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "safety", "text": "The hardware detection path of the low-beam open-load mechanism shall report a detected open load to the software fault reaction within 80 ms of the occurrence of the fault.", "file": "05_hardware/HW-REQ-009.md", "level": 4}, {"id": "HW-REQ-010", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "The microcontroller shall verify the plausibility of the analogue-to-digital converter reference used for the ware/HW-REQ-015.md", "level": 4}, {"id": "HW-REQ-016", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "safety", "text": "When the protected supply voltage leaves the range 9 V to 36 V, the supply monitor of the Power_Supply_Unit shall signal the condition to the microcontroller within 10 ms, and when it exceeds 60 V the supply monitor shall de-energise the LED driver stages via the enable gate within 1 ms.", "file": "05_hardware/HW-REQ-016.md", "level": 4}, {"id": "HW-REQ-017", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "safety", "text": "When an internal supply rail leaves its specified tolerance band, the ASIC_Watchdog shall hold the microcontroller in reset and assert SAFE_OFF within 5 ms of the deviation.", "file": "05_hardware/HW-REQ-017.md", "level": 4}, {"id": "HW-REQ-018", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "safety", "text": "The ASIC_Watchdog shall run a question/answer protocol on a time base independent of the microcontroller clock and shall assert SAFE_OFF within 50 ms of the first missing or incorrect answer.", "file": "05_hardware/HW-REQ-018.md", "level": 4}, {"id": "HW-REQ-019", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The enable input of each LED driver stage shall be driven by the logical conjunction of the microcontroller enable signal and the negated SAFE_OFF and OV_SHUTDOWN signals, and shall bring the channel into its de-energised state within 10 ms of SAFE_OFF or OV_SHUTDOWN becoming active.", "file": "05_hardware/HW-REQ-019.md", "level": 4}, {"id": "HW-REQ-020", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "When the channel output voltage of a low-beam channel measured during the PWM off-phase exceeds 3 V for more than 30 ms, the lighting ECU shall classify the channel as \"short to battery\".", "file": "05_hardware/HW-REQ-020.md", "level": 4}, {"id": "HW-REQ-021", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The LED driver stage shall limit the channel output current to 1.8 A, shall latch the channel off within 5 ms if the limit is active continuously, and shall report the event in DriverStatus within 10 ms.", "file": "05_hardware/HW-REQ-021.md", "level": 4}, {"id": "HW-REQ-022", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The Temp_Sense_Chain shall measure the LED module temperature over the range -40 C to +150 C with an accuracy of +/-3 K between +80 C and +140 C, shall update the value at least every 100 ms, and shall classify a measured value outside the band -50 C to +160 C as a sensor fault.", "file": "05_hardware/HW-REQ-022.md", "level": 4}, {"id": "HW-REQ-023", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "While the measured LED module temperature is above 105 C, the lighting ECU shall reduce the channel set point linearly by 40 mA per kelvin from 1.20 A down to the derating floor of HW-REQ-008, and shall hold the set point at that floor above 125 C.", "file": "05_hardware/HW-REQ-023.md", "level": 4}, {"id": "HW-REQ-024", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The thermal design of a low-beam channel shall keep the LED junction temperature at or below 135 C for a headlamp cavity temperature up to 105 C, with the derating curve of HW-REQ-023 active and the module heat path degraded to twice its nominal thermal resistance.", "file": "05_hardware/HW-REQ-024.md", "level": 4}, {"id": "HW-REQ-025", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "interface", "text": "The CAN_FD_Transceiver shall withstand a permanent short of either bus line to the supply voltage or to ground without damage and shall release the bus within 5 ms if its transmit input remains dominant.", "file": "05_hardware/HW-REQ-025.md", "level": 4}, {"id": "HW-REQ-026", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "When the microcontroller enable signal of a low-beam channel becomes active while neither SAFE_OFF nor OV_SHUTDOWN is active, the enable gate shall present the effective enable signal at the input of the LED driver stage within 1 ms.", "file": "05_hardware/HW-REQ-026.md", "level": 4}, {"id": "HW-REQ-027", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "When the effective enable signal of a low-beam channel becomes active, the LED driver stage shall raise the channel current from 0 mA to at least 95 % of the commanded set point within 20 ms, with a monotonic current ramp of not less than 5 ms duration.", "file": "05_hardware/HW-REQ-027.md", "level": 4}, {"id": "HW-REQ-028", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "When both low-beam channels are enabled by the same light request, the difference between the instants at which the two channels reach 95 % of their commanded set point shall not exceed 10 ms.", "file": "05_hardware/HW-REQ-028.md", "level": 4}, {"id": "HW-REQ-029", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "When both low-beam channels are switched on simultaneously at a supply voltage within 18 V to 32 V, the current drawn at the supply input shall not exceed 8 A at any instant, and the protected supply voltage VBAT_PROT shall not drop by more than 1 V below its pre-switch-on value.", "file": "05_hardware/HW-REQ-029.md", "level": 4}, {"id": "HW-REQ-030", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "While less than 30 ms have elapsed since the effective enable signal of a low-beam channel became active, the lighting ECU shall suppress the open-load classification of that channel, and shall resume it at the end of that interval without reusing any sample acquired within it.", "file": "05_hardware/HW-REQ-030.md", "level": 4}, {"id": "RISK-01", "kind": "RISK", "asil": "", "status": "draft", "type": "risk", "text": "The exposure rating of hazard H-01 (E3 rather than E4) determines ASIL B versus ASIL C for the entire Golden Thread and therefore the target ASIL of the project.", "file": "02_safety/05_analyses/RISK-01.md", "level": 6}, {"id": "RISK-02", "kind": "RISK", "asil": "", "status": "draft", "type": "risk", "text": "The ASIL decomposition of FSR-005 into FSR-006 (QM(A)) and FSR-007 (A(A)) is not demonstrated until the DFA is available.", "file": "02_safety/05_analyses/RISK-02.md", "level": 6}, {"id": "SG-01", "kind": "SG", "asil": "B", "status": "reviewed", "type": "safety-goal", "text": "No undetected failure of the low beam while driving.", "file": "02_safety/03_fsc/SG-01.md", "level": 1}, {"id": "SG-02", "kind": "SG", "asil": "A", "status": "draft", "type": "safety-goal", "text": "No unintended glare to other road users caused by high beam or work lamps.", "file": "02_safety/03_fsc/SG-02.md", "level": 1}, {"id": "SM-01", "kind": "SM", "asil": "B", "status": "draft", "type": "safety-mechanism", "text": "Open-load detection in the low-beam channel via PWM-synchronous shunt current measurement with threshold comparison, debouncing, off-phase zero-current self-test and discrimination against short-to-battery and commanded current reduction using the channel output voltage and the LED driver status; reported to SWC_LightManager for the fault reaction.", "file": "05_hardware/SM-01.md", "level": 4}, {"id": "SM-02", "kind": "SM", "asil": "B", "status": "draft", "type": "safety-mechanism", "text": "Program-execution monitoring by the ASIC_Watchdog with an independent time base and a question/answer protocol, with a hardware disable path (SAFE_OFF) to the enable gate of every LED driver stage that is dominant over the microcontroller enable signal.", "file": "05_hardware/SM-02.md", "level": 4}, {"id": "SM-03", "kind": "SM", "asil": "B", "status": "draft", "type": "safety-mechanism", "text": "Short-to-battery detection on a low-beam channel by evaluating the channel output voltage during the PWM off-phase against a threshold, debounced, and used to discriminate a short to battery from an open load before the fault reaction is triggered.", "file": "05_hardware/SM-03.md", "level": 4}, {"id": "SM-04", "kind": "SM", "asil": "B", "status": "draft", "type": "safety-mechanism", "text": "Overcurrent protection in the LED driver stage: hardware current limit at the output stage, latch-off on a persistent limit condition, and reporting of the event through DriverStatus to the microcontroller.", "file": "05_hardware/SM-04.md", "level": 4}, {"id": "SM-05", "kind": "SM", "asil": "B", "status": "draft", "type": "safety-mechanism", "text": "Overtemperature protection of the LED modules by NTC measurement with plausibility band and a linear derating curve that reduces the channel set point between 105 C and 125 C down to the 400 mA derating floor, with a diagnostic trouble code once derating is active.", "file": "05_hardware/SM-05.md", "level": 4}, {"id": "SM-06", "kind": "SM", "asil": "B", "status": "draft", "type": "safety-mechanism", "text": "Supply voltage monitoring: window comparators on the protected battery voltage in the Power_Supply_Unit with a reported condition and a hardware overvoltage shutdown of the driver stages, plus independent monitoring of the internal rails by the ASIC_Watchdog with reset and SAFE_OFF.", "file": "05_hardware/SM-06.md", "level": 4}, {"id": "SYS-REQ-001", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "When the driver requests low beam via the light switch signal, the lighting ECU shall energise both low-beam channels within 300 ms.", "file": "01_requirements/system/SYS-REQ-001.md", "level": 3}, {"id": "SYS-REQ-002", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "When the ambient brightness signal remains below 1000 lx for more than 3 s, the lighting ECU shall switch from daytime running lights to low beam within 500 ms.", "file": "01_requirements/system/SYS-REQ-002.md", "level": 3}, {"id": "SYS-REQ-003", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "When the ambient brightness signal remains above 2000 lx for more than 30 s, the lighting ECU shall switch from low beam to daytime running lights within 2 s.", "file": "01_requirements/system/SYS-REQ-003.md", "level": 3}, {"id": "SYS-REQ-004", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "functional", "text": "When the vehicle gateway reports an oncoming or preceding vehicle, the lighting ECU shall mask the affected high-beam segment within 500 ms.", "file": "01_requirements/system/SYS-REQ-004.md", "level": 3}, {"id": "SYS-REQ-005", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "functional", "text": "While the vehicle speed signal exceeds 10 km/h, the lighting ECU shall inhibit energising of the work-lamp output stages.", "file": "01_requirements/system/SYS-REQ-005.md", "level": 3}, {"id": "SYS-REQ-006", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "functional", "text": "When the steering angle signal exceeds 15 degrees, the lighting ECU shall activate the cornering light of the corresponding side within 200 ms.", "file": "01_requirements/system/SYS-REQ-006.md", "level": 3}, {"id": "SYS-REQ-007", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "functional", "text": "When the steering angle signal falls below 5 degrees, the lighting ECU shall deactivate the cornering light within 200 ms.", "file": "01_requirements/system/SYS-REQ-007.md", "level": 3}, {"id": "SYS-REQ-008", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "diagnostics", "text": "When the cornering light does not reach its commanded state, the lighting ECU shall store a diagnostic trouble code.", "file": "01_requirements/system/SYS-REQ-008.md", "level": 3}, {"id": "SYS-REQ-009", "kind": "SYS-REQ", "asil": "QM", "status": "draft", "type": "functional", "text": "When the ignition signal changes to on, the lighting ECU shall energise the daytime running lights within 2 s.", "file": "01_requirements/system/SYS-REQ-009.md", "level": 3}, {"id": "SYS-REQ-010", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "When the lighting ECU has classified a low-beam channel as failed, it shall request the driver warning via the vehicle gateway within 2 s of the classification.", "file": "01_requirements/system/SYS-REQ-010.md", "level": 3}, {"id": "SYS-REQ-011", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "While exactly one low-beam channel is classified as failed, the lighting ECU shall continue to operate the remaining channel at its commanded set point.", "file": "01_requirements/system/SYS-REQ-011.md", "level": 3}, {"id": "SYS-REQ-012", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "While the vehicle supply voltage is within 16 V to 32 V, the lighting ECU shall provide all lighting functions without restriction.", "file": "01_requirements/system/SYS-REQ-012.md", "level": 3}, {"id": "SYS-REQ-013", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "While the vehicle supply voltage is between 9 V and 16 V, the lighting ECU shall keep the low beam energised at a reduced set point of at least 400 mA per channel and shall set a diagnostic trouble code.", "file": "01_requirements/system/SYS-REQ-013.md", "level": 3}, {"id": "SYS-REQ-014", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "When the load current of a low-beam channel, measured during the PWM on-phase, remains below 150 mA for more than 50 ms, the lighting ECU shall classify the channel as \"open load\".", "file": "01_requirements/system/SYS-REQ-014.md", "level": 3}, {"id": "SYS-REQ-015", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "When a low-beam channel is classified as \"open load\", the lighting ECU shall increment the fault counter of that channel.", "file": "01_requirements/system/SYS-REQ-015.md", "level": 3}, {"id": "SYS-REQ-016", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The lighting ECU shall measure the load current of a low-beam channel with a total uncertainty of not more than +/-20 mA at the 150 mA classification threshold, over an ambient temperature range of -40 C to +85 C.", "file": "01_requirements/system/SYS-REQ-016.md", "level": 3}, {"id": "SYS-REQ-017", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "While the PWM on-time of a low-beam channel is shorter than 150 us, the lighting ECU shall report the open-load diagnosis of that channel as \"not available\".", "file": "01_requirements/system/SYS-REQ-017.md", "level": 3}, {"id": "SYS-REQ-018", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "safety", "text": "When an open load occurs in a low-beam channel, the lighting ECU shall report the fault to the fault reaction within 100 ms of fault occurrence.", "file": "01_requirements/system/SYS-REQ-018.md", "level": 3}, {"id": "SYS-REQ-019", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "When the measured load current of a low-beam channel falls below 150 mA, the lighting ECU shall classify the cause as exactly one of \"open load\", \"short-to-battery\" or \"commanded current reduction\" before triggering a fault reaction.", "file": "01_requirements/system/SYS-REQ-019.md", "level": 3}, {"id": "SYS-REQ-020", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "communication", "text": "The lighting ECU shall exchange light request, vehicle speed, steering angle, ambient brightness, object data and lighting status with the vehicle gateway via CAN FD according to SAE J1939.", "file": "01_requirements/system/SYS-REQ-020.md", "level": 3}, {"id": "SYS-REQ-021", "kind": "SYS-REQ", "asil": "QM", "status": "draft", "type": "diagnostics", "text": "When a diagnostic tester sends a UDS request according to ISO 14229, the lighting ECU shall provide the stored diagnostic trouble codes within 100 ms.", "file": "01_requirements/system/SYS-REQ-021.md", "level": 3}, {"id": "SYS-REQ-022", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "communication", "text": "The lighting ECU shall protect every safety-relevant signal group exchanged with the vehicle gateway with an alive counter and a checksum computed over the payload of that signal group.", "file": "01_requirements/system/SYS-REQ-022.md", "level": 3}, {"id": "SYS-REQ-023", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "communication", "text": "If the alive counter of a received safety-relevant signal group does not increase by one modulo its range, or if the received checksum does not match the checksum recomputed over the payload, the lighting ECU shall mark that signal group as invalid within one reception cycle.", "file": "01_requirements/system/SYS-REQ-023.md", "level": 3}, {"id": "SYS-REQ-024", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "communication", "text": "If a safety-relevant signal group is not received within the timeout defined for that signal group in the interface table, the lighting ECU shall mark that signal group as invalid.", "file": "01_requirements/system/SYS-REQ-024.md", "level": 3}, {"id": "SYS-REQ-025", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "safety", "text": "While the light request signal group is marked as invalid and the low beam was energised at the moment of invalidation, the lighting ECU shall keep the low-beam channels energised at the last valid set point until a valid light request signal group is received again or the ignition signal changes to off.", "file": "01_requirements/system/SYS-REQ-025.md", "level": 3}, {"id": "SYS-REQ-026", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "communication", "text": "When the lighting ECU has classified a low-beam channel as failed, it shall transmit the driver warning signal group as an event-triggered frame within 20 ms of the classification and subsequently with a cyclic repetition of 500 ms.", "file": "01_requirements/system/SYS-REQ-026.md", "level": 3}, {"id": "SYS-REQ-027", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "communication", "text": "The lighting ECU shall include a signal-group-specific data identifier in the checksum computation of every safety-relevant signal group, and shall use a different data identifier for each signal group.", "file": "01_requirements/system/SYS-REQ-027.md", "level": 3}, {"id": "SYS-REQ-028", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "communication", "text": "The lighting ECU shall occupy not more than 1.0 % of the nominal capacity of the CAN FD segment to which it is connected with its own transmitted frames, measured over any 100 ms window and under any operating condition including the fault reaction.", "file": "01_requirements/system/SYS-REQ-028.md", "level": 3}, {"id": "TC-021", "kind": "TC", "asil": "B", "status": "draft", "type": "fault-injection", "text": "Fault injection of an open load on low-beam channel 1: evidence of detection, fault reaction within the fault reaction time, driver warning and DTC entry.", "file": "07_verification/testcases/TC-021.md", "level": 5}, {"id": "TSR-001", "kind": "TSR", "asil": "B", "status": "draft", "type": "safety", "text": "The lighting ECU shall monitor its own program execution by an external watchdog with an independent time base and shall de-energise the LED driver stages into the defined off state if the watchdog is not served within 50 ms.", "file": "02_safety/04_tsc/TSR-001.md", "level": 3}, {"id": "TSR-002", "kind": "TSR", "asil": "B", "status": "draft", "type": "safety", "text": "The lighting ECU shall prevent energising or de-energising of a low-beam channel that was not requested by the light request signal, by evaluating the commanded state and the measured channel s }

let selected = null;

  $("#asilf").insertAdjacentHTML("beforeend", `<option>${a}</option>`);

function pill(n) {
  const bg = DATA.colors[n.kind] || "#eee", st = DATA.strokes[n.kind] || "#888";
  return `<span class="pill" style="background:${bg};border-color:${st};color:#1a1a1a">${n.kind}</span>`;
}

function renderList() {
  const q = $("#q").value.toLowerCase(), k = $("#kindf").value, a = $("#asilf").value;
  const rows = DATA.nodes.filter(n =>
    (!k || n.kind === k) && (!a || n.asil === a) &&
    (!q || n.id.toLowerCase().includes(q) || n.text.toLowerCase().includes(q)));
  $("#count").textContent = `${rows.length} of ${DATA.nodes.length} records`;
  $("#list").innerHTML = rows.map(n =>
    `<div class="row${n.id === selected ? " sel" : ""}" data-id="${n.id}">${pill(n)}

  for (const el of document.querySelectorAll("#list .row"))
    el.onclick = () => select(el.dataset.id);
}

function links(list) {
  if (!list || !list.length) return '<span class="muted">none</span>';
  return list.map(([id, rel]) =>
    `<a href="#" data-id="${id}">${id} <span class="rel">${rel}</span></a>`).join("");
}

function graph(id) {
  const nodes = [[id, 0]];
  for (const [n] of (up[id] || [])) nodes.push([n, -1]);
  for (const [n] of (down[id] || [])) nodes.push([n, 1]);
  const cols = {"-1": [], "0": [], "1": []};
  for (const [n, c] of nodes) cols[c].push(n);
  const W = 900, H = 300, colX = {"-1": 120, "0": W / 2, "1": W - 120};
  let out = `<svg viewBox="0 0 ${W} ${H}">`;
  const pos = {};
  for (const c of ["-1", "0", "1"]) {
    const arr = cols[c], step = H / (arr.length + 1);
    arr.forEach((n, i) => pos[n] = [colX[c], step * (i + 1)]);
  }
  for (const [n] of (up[id] || []))
    out += `<line x1="${pos[n][0] + 55}" y1="${pos[n][1]}" x2="${pos[id][0] - 55}" y2="${pos[id][1]}"
            stroke="#8FA3BA" stroke-width="1.5" marker-end="url(#a)"/>`;
  for (const [n] of (down[id] || []))
    out += `<line x1="${pos[id][0] + 55}" y1="${pos[id][1]}" x2="${pos[n][0] - 55}" y2="${pos[n][1]}"
            stroke="#8FA3BA" stroke-width="1.5" marker-end="url(#a)"/>`;
  for (const n in pos) {
    const nd = byId[n], bg = DATA.colors[nd.kind] || "#eee", st = DATA.strokes[nd.kind] || "#888";
    out += `<g><rect x="${pos[n][0] - 55}" y="${pos[n][1] - 16}" width="110" height="32" rx="7"
            fill="${bg}" stroke="${st}" stroke-width="${n === id ? 2.5 : 1.5}"/>
            <text x="${pos[n][0]}" y="${pos[n][1] + 5}" text-anchor="middle" font-size="13"
            fill="#1a1a1a" font-weight="${n === id ? 700 : 400}">${n}</text></g>`;
  }
  out += `<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8FA3BA"/></marker></defs></svg>`;
  return out;
}

function select(id) {
  selected = id;
  const n = byId[id];
  $("#detail").innerHTML = `
    <h2>${pill(n)} ${n.id}</h2>
    <p class="muted">${n.type} · ASIL ${n.asil || "—"} · status ${n.status || "—"} ·
       <code>${n.file}</code></p>
    <p>${n.text || ""}</p>
    ${graph(id)}
    <div class="grid">
      <div class="box"><h3>Upstream — derives from</h3>${links(up[id])}</div>
      <div class="box"><h3>Downstream — feeds</h3>${links(down[id])}</div>

  for (const el of document.querySelectorAll("#detail a[data-id]"))
    el.onclick = e => { e.preventDefault(); select(el.dataset.id); renderList(); };
  renderList();
}
