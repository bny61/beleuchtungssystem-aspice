const DATA = {"nodes": [{"id": "CR-001", "kind": "CR", "asil": "B", "status": "draft", "type": "functional", "text": "When the driver moves the light switch to the \"low beam\" position, the lighting system shall activate the low beam within 300 ms.", "file": "01_requirements/customer/CR-001.md", "level": 0}, {"id": "CR-002", "kind": "CR", "asil": "B", "status": "draft", "type": "functional", "text": "When ambient brightness decreases, the lighting system shall switch to low beam in good time and with sufficient brightness.", "file": "01_requirements/customer/CR-002.md", "level": 0}, {"id": "CR-003", "kind": "CR", "asil": "A", "status": "draft", "type": "functional", "text": "When the vehicle sensor system reports oncoming or preceding vehicles, the lighting system shall mask the affected high-beam segment within 500 ms.", "file": "01_requirements/customer/CR-003.md", "level": 0}, {"id": "CR-004", "kind": "CR", "asil": "A", "status": "draft", "type": "functional", "text": "While the vehicle speed exceeds 10 km/h, the lighting system shall prevent activation of the work lamps.", "file": "01_requirements/customer/CR-004.md", "level": 0}, {"id": "CR-005", "kind": "CR", "asil": "A", "status": "draft", "type": "functional", "text": "When the steering angle exceeds 15 degrees, the lighting system shall switch on the cornering light via the LIN-controlled stepper motor and shall additionally switch it off again when the angle falls below 5 degrees and store the state in the fault memory.", "file": "01_requirements/customer/CR-005.md", "level": 0}, {"id": "CR-006", "kind": "CR", "asil": "QM", "status": "draft", "type": "functional", "text": "When the ignition is switched on, the lighting system shall activate the daytime running lights within 2 s.", "file": "01_requirements/customer/CR-006.md", "level": 0}, {"id": "CR-007", "kind": "CR", "asil": "B", "status": "reviewed", "type": "functional", "text": "The lighting system shall detect the failure of a low-beam channel and indicate it visually to the driver in the instrument cluster within 2 s.", "file": "01_requirements/customer/CR-007.md", "level": 0}, {"id": "CR-008", "kind": "CR", "asil": "B", "status": "draft", "type": "functional", "text": "When a low-beam channel fails, the lighting system shall continue to operate the remaining channel and store the failure in the fault memory.", "file": "01_requirements/customer/CR-008.md", "level": 0}, {"id": "CR-009", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "The lighting system shall comply with the installation and switching requirements of ECE Regulation R48 for class N3 vehicles.", "file": "01_requirements/customer/CR-009.md", "level": 0}, {"id": "CR-010", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "The low-beam and high-beam functions shall meet the photometric requirements of ECE Regulations R112 and R123.", "file": "01_requirements/customer/CR-010.md", "level": 0}, {"id": "CR-011", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "Where a rotating beacon is fitted, its control shall meet the requirements of ECE Regulation R65.", "file": "01_requirements/customer/CR-011.md", "level": 0}, {"id": "CR-012", "kind": "CR", "asil": "QM", "status": "draft", "type": "legal", "text": "The lighting system shall comply with the EMC requirements of ECE Regulation R10.", "file": "01_requirements/customer/CR-012.md", "level": 0}, {"id": "CR-013", "kind": "CR", "asil": "QM", "status": "draft", "type": "environmental-mechanical", "text": "The lighting system shall withstand the mechanical loads per ISO 16750-3 for the front-module mounting location.", "file": "01_requirements/customer/CR-013.md", "level": 0}, {"id": "CR-014", "kind": "CR", "asil": "QM", "status": "draft", "type": "environmental-mechanical", "text": "The lighting system shall remain functional across an ambient temperature range from -40 °C to +85 °C.", "file": "01_requirements/customer/CR-014.md", "leve ": "CR", "asil": "QM", "status": "draft", "type": "durability", "text": "The lighting system shall achieve an operating life of 30,000 h or a mileage of 1,500,000 km without exceeding the permissible failure rate.", "file": "01_requirements/customer/CR-022.md", "level": 0}, {"id": "CR-023", "kind": "CR", "asil": "QM", "status": "draft", "type": "interface", "text": "The lighting system shall meet the interface requirements of the vehicle-level cybersecurity concept per ISO 21434.", "file": "01_requirements/customer/CR-023.md", "level": 0}, {"id": "FSR-001", "kind": "FSR", "asil": "B", "status": "reviewed", "type": "safety", "text": "When a low-beam channel fails, the lighting system shall detect the failure within the fault reaction time, transition to the safe state and warn the driver.", "file": "02_safety/03_fsc/FSR-001.md", "level": 2}, {"id": "FSR-002", "kind": "FSR", "asil": "B", "status": "draft", "type": "safety", "text": "The lighting system shall prevent any deactivation of the low beam that was not requested by the driver.", "file": "02_safety/03_fsc/FSR-002.md", "level": 2}, {"id": "FSR-003", "kind": "FSR", "asil": "B", "status": "draft", "type": "safety", "text": "While only one low-beam channel has failed, the lighting system shall continue to operate the remaining channel.", "file": "02_safety/03_fsc/FSR-003.md", "level": 2}, {"id": "FSR-004", "kind": "FSR", "asil": "B", "status": "draft", "type": "safety", "text": "When the lighting system has detected the failure of a low-beam channel, it shall warn the driver visually within 2 s.", "file": "02_safety/03_fsc/FSR-004.md", "level": 2}, {"id": "FSR-005", "kind": "FSR", "asil": "A", "status": "draft", "type": "safety", "text": "When an oncoming or preceding vehicle is reported, the lighting system shall switch off the glaring high-beam segment within the fault reaction time.", "file": "02_safety/03_fsc/FSR-005.md", "level": 2}, {"id": "FSR-006", "kind": "FSR", "asil": "QM(A)", "status": "draft", "type": WM on-time of a low-beam channel is shorter than 150 us, the LED driver stage shall insert a diagnostic measurement window of at least 200 us at the commanded set point at intervals of not more than 10 ms.", "file": "05_hardware/HW-REQ-004.md", "level": 4}, {"id": "HW-REQ-005", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "The current sensing of a low-beam channel shall evaluate the measured current during the PWM off-phase and shall signal a current-sensing fault if the measured value exceeds 30 mA in the off-phase for more than 20 ms.", "file": "05_hardware/HW-REQ-005.md", "level": 4}, {"id": "HW-REQ-006", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The LED driver stage shall provide the channel output voltage to the microcontroller as a measured value in both the PWM on-phase and the PWM off-phase, with a resolution of at least 100 mV over a range of 0 V to 40 V.", "file": "05_hardware/HW-REQ-006.md", "level": 4}, {"id": "HW-REQ-007", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "interface", "text": "The LED driver stage shall provide its over-voltage, over-current and over-temperature status to the microcontroller as a readable signal with an update interval of not more than 10 ms.", "file": "05_hardware/HW-REQ-007.md", "level": 4}, {"id": "HW-REQ-008", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "electrical", "text": "The thermal derating function of a low-beam channel shall not command a channel set point below 400 mA while the channel is commanded on.", "file": "05_hardware/HW-REQ-008.md", "level": 4}, {"id": "HW-REQ-009", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "safety", "text": "The hardware detection path of the low-beam open-load mechanism shall report a detected open load to the software fault reaction within 80 ms of the occurrence of the fault.", "file": "05_hardware/HW-REQ-009.md", "level": 4}, {"id": "HW-REQ-010", "kind": "HW-REQ", "asil": "B", "status": "draft", "type": "diagnostics", "text": "The microcontroller shall verify the plausibility of the analogue-to-digital converter reference used for the low-beam current measurement against an independent reference at intervals of not more than 100 ms.", "file": "05_hardware/HW-REQ-010.md", "level": 4}, {"id": "RISK-01", "kind": "RISK", "asil": "", "status": "draft", "type": "risk", "text": "The exposure rating of hazard H-01 (E3 rather than E4) determines ASIL B versus ASIL C for the entire Golden Thread and therefore the target ASIL of the project.", "file": "02_safety/05_analyses/RISK-01.md", "level": 6}, {"id": "RISK-02", "kind": "RISK", "asil": "", "status": "draft", "type": "risk", "text": "The ASIL decomposition of FSR-005 into FSR-006 (QM(A)) and FSR-007 (A(A)) is not demonstrated until the DFA is available.", "file": "02_safety/05_analyses/RISK-02.md", "level": 6}, {"id": "SG-01", "kind": "SG", "asil": "B", "status": "reviewed", "type": "safety-goal", "text": "No undetected failure of the low beam while driving.", "file": "02_safety/03_fsc/SG-01.md", "level": 1}, {"id": "SG-02", "kind": "SG", "asil": "A", "status": "draft", "type": "safety-goal", "text": "No unintended glare to other road users caused by high beam or work lamps.", "file": "02_safety/03_fsc/SG-02.md", "level": 1}, {"id": "SM-01", "kind": "SM", "asil": "B", "status": "draft", "type": "safety-mechanism", "text": "Open-load detection in the low-beam channel via PWM-synchronous shunt current measurement with threshold comparison, debouncing, off-phase zero-current self-test and discrimination against short-to-battery and commanded current reduction using the channel output voltage and the LED driver status; reported to SWC_LightManager for the fault reaction.", "file": "05_hardware/SM-01.md", "level": 4}, {"id": "SYS-REQ-001", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "When the driver requests low beam via the light switch signal, the lighting ECU shall energise both low-beam channels within 300 ms.", "file": "01_requirements/system/SYS-REQ-001.md", "level": 3}, {"id": "SYS-REQ-002", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "When the ambient brightness signal remains below 1000 lx for more than 3 s, the lighting ECU shall switch from daytime running lights to low beam within 500 ms.", "file": "01_requirements/system/SYS-REQ-002.md", "level": 3}, {"id": "SYS-REQ-003", "kind": "SYS-REQ", "asil": "B", "status": "draft", "type": "functional", "text": "When the ambient brightness signal remains above 2000 lx for more than 30 s, the lighting ECU shall switch from low beam to daytime running lights within 2 s.", "file": "01_requirements/system/SYS-REQ-003.md", "level": 3}, {"id": "SYS-REQ-004", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "functional", "text": "When the vehicle gateway reports an oncoming or preceding vehicle, the lighting ECU shall mask the affected high-beam segment within 500 ms.", "file": "01_requirements/system/SYS-REQ-004.md", "level": 3}, {"id": "SYS-REQ-005", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "functional", "text": "While the vehicle speed signal exceeds 10 km/h, the lighting ECU shall inhibit energising of the work-lamp output stages.", "file": "01_requirements/system/SYS-REQ-005.md", "level": 3}, {"id": "SYS-REQ-006", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "functional", "text": "When the steering angle signal exceeds 15 degrees, the lighting ECU shall activate the cornering light of the corresponding side within 200 ms.", "file": "01_requirements/system/SYS-REQ-006.md", "level": 3}, {"id": "SYS-REQ-007", "kind": "SYS-REQ", "asil": "A", "status": "draft", "type": "functional", "text": "When the steering angle signal falls below 5 degrees, the lighting ECU shall deactivate the cornering light within 200 ms.", "file": "01_requirements/system/SYS-REQ-007.md", "level": 3}, {"id": "SYS-REQ 002", "rel": "derived_from"}, {"from": "SG-01", "to": "FSR-003", "rel": "derived_from"}, {"from": "SG-01", "to": "FSR-004", "rel": "derived_from"}, {"from": "SG-01", "to": "TC-021", "rel": "derived_from"}, {"from": "SG-01", "to": "TC-021", "rel": "verified_by"}, {"from": "SG-02", "to": "FSR-005", "rel": "derived_from"}, {"from": "SG-02", "to": "FSR-008", "rel": "derived_from"}, {"from": "SM-01", "to": "TC-021", "rel": "verified_by"}, {"from": "SYS-REQ-014", "to": "HW-REQ-003", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "HW-REQ-005", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "HW-REQ-008", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "SM-01", "rel": "allocated_to"}, {"from": "SYS-REQ-014", "to": "SYS-REQ-015", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "SYS-REQ-016", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "SYS-REQ-017", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "SYS-REQ-018", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "SYS-REQ-019", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "TC-021", "rel": "derived_from"}, {"from": "SYS-REQ-014", "to": "TC-021", "rel": "verified_by"}, {"from": "SYS-REQ-016", "to": "HW-REQ-001", "rel": "derived_from"}, {"from": "SYS-REQ-016", "to": "HW-REQ-002", "rel": "derived_from"}, {"from": "SYS-REQ-017", "to": "HW-REQ-004", "rel": "derived_from"}, {"from": "SYS-REQ-018", "to": "HW-REQ-009", "rel": "derived_from"}, {"from": "SYS-REQ-018", "to": "SM-01", "rel": "allocated_to"}, {"from": "SYS-REQ-018", "to": "TC-021", "rel": "derived_from"}, {"from": "SYS-REQ-019", "to": "HW-REQ-006", "rel": "derived_from"}, {"from": "SYS-REQ-019", "to": "HW-REQ-007", "rel": "derived_from"}, {"from": "TSR-003", "to": "SM-01", "rel": "allocated_to"}, {"from": "TSR-003", "to": "SM-01", "rel": "derived_from"}], "colors": {"H": "#fdf0e3", "CR": "#e7f0fb", "SG": "#fbeaea", "FSR": "#fbeaea", "TSR": "#f0edf7", "SYS-REQ": "#e7f0fb", "HW-REQ": "#eaf4ea", "SW-REQ": "#eaf4ea", "SM": "# const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const down = {}, up = {};
for (const e of DATA.edges) {
  (down[e.from] = down[e.from] || []).push([e.to, e.rel]);
  (up[e.to] = up[e.to] || []).push([e.from, e.rel]);
}
const $ = s => document.querySelector(s);
let selected = null;

for (const k of [...new Set(DATA.nodes.map(n => n.kind))].sort())
  $("#kindf").insertAdjacentHTML("beforeend", `<option>${k}</option>`);
for (const a of [...new Set(DATA.nodes.map(n => n.asil).filter(Boolean))].sort())
  $("#asilf").insertAdjacentHTML("beforeend", `<option>${a}</option>`);

function pill(n) {
  const bg = DATA.colors[n.kind] || "#eee", st = DATA.strokes[n.kind] || "#888";
  return `<span class="pill" style="background:${bg};border-color:${st};color:#1a1a1a">${n.kind}</span>`;
}

function renderList() {
  const q = $("#q").value.toLowerCase(), k = $("#kindf").value, a = $("#asilf").value;
  const rows = DATA.nodes.filter(n =>
    (!k || n.kind === k) && (!a || n.asil === a) &&
    (!q || n.id.toLowerCase().includes(q) || n.text.toLowerCase().includes(q)));
  $("#count").textContent = `${rows.length} of ${DATA.nodes.length} records`;
  $("#list").innerHTML = rows.map(n =>
    `<div class="row${n.id === selected ? " sel" : ""}" data-id="${n.id}">${pill(n)}
     <span>${n.id}</span><span class="muted" style="margin-left:auto">${n.asil}</span></div>`).join("");
  for (const el of document.querySelectorAll("#list .row"))
    el.onclick = () => select(el.dataset.id);
}

function links(list) {
  if (!list || !list.length) return '<span class="muted">none</span>';
  return list.map(([id, rel]) =>
    `<a href="#" data-id="${id}">${id} <span class="rel">${rel}</span></a>`).join("");
}

function graph(id) {
  const nodes = [[id, 0]];
  for (const [n] of (up[id] || [])) nodes.push([n, -1]);
  for (const [n] of (down[id] || [])) nodes.push([n, 1]);
  const cols = {"-1": [], "0": [], "1": []};
  for (const [n, c] of nodes) cols[c].push(n);
  const W = 900, H = 300, colX = {"-1": 120, "0": W / 2, "1": W - 120};
  let out = `<svg viewBox="0 0 ${W} ${H}">`;
  const pos = {};
  for (const c of ["-1", "0", "1"]) {
    const arr = cols[c], step = H / (arr.length + 1);
    arr.forEach((n, i) => pos[n] = [colX[c], step * (i + 1)]);
  }
  for (const [n] of (up[id] || []))
    out += `<line x1="${pos[n][0] + 55}" y1="${pos[n][1]}" x2="${pos[id][0] - 55}" y2="${pos[id][1]}"
            stroke="#8FA3BA" stroke-width="1.5" marker-end="url(#a)"/>`;
  for (const [n] of (down[id] || []))
    out += `<line x1="${pos[id][0] + 55}" y1="${pos[id][1]}" x2="${pos[n][0] - 55}" y2="${pos[n][1]}"
            stroke="#8FA3BA" stroke-width="1.5" marker-end="url(#a)"/>`;
  for (const n in pos) {
    const nd = byId[n], bg = DATA.colors[nd.kind] || "#eee", st = DATA.strokes[nd.kind] || "#888";
    out += `<g><rect x="${pos[n][0] - 55}" y="${pos[n][1] - 16}" width="110" height="32" rx="7"
            fill="${bg}" stroke="${st}" stroke-width="${n === id ? 2.5 : 1.5}"/>
            <text x="${pos[n][0]}" y="${pos[n][1] + 5}" text-anchor="middle" font-size="13"
            fill="#1a1a1a" font-weight="${n === id ? 700 : 400}">${n}</text></g>`;
  }
  out += `<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8FA3BA"/></marker></defs></svg>`;
  return out;
}

function select(id) {
  selected = id;
  const n = byId[id];
  $("#detail").innerHTML = `
    <h2>${pill(n)} ${n.id}</h2>
    <p class="muted">${n.type} · ASIL ${n.asil || "—"} · status ${n.status || "—"} ·
       <code>${n.file}</code></p>
    <p>${n.text || ""}</p>
    ${graph(id)}
    <div class="grid">
      <div class="box"><h3>Upstream — derives from</h3>${links(up[id])}</div>
      <div class="box"><h3>Downstream — feeds</h3>${links(down[id])}</div>
    </div>`;
  for (const el of document.querySelectorAll("#detail a[data-id]"))
    el.onclick = e => { e.preventDefault(); select(el.dataset.id); renderList(); };
  renderList();
}

for (const el of ["#q", "#kindf", "#asilf"]) $(el).oninput = renderList;
renderList();
</script></body></html>
