":"09_process","exists":true,"html":"<p><strong>Owner:<\/strong> config-manager · <strong>Status:<\/strong> draft · <strong>Process reference:<\/strong> ASPICE SUP.8, MAN.3 ·<br>ISO 26262-2 (safety management)<\/p><blockquote>Teaching/reference project. The allocation below says where a work product <em>belongs<\/em>; it does not claim the work product exists. Whether an area is populated is computed from the repo by <code>tools/gen_req_browser.py<\/code>, never asserted here — an area with nothing allocated to it shows up as empty, and that is the point.<\/blockquote><h4>Why this file exists<\/h4><p>Process references used to live as prose inside individual records (&quot;ASPICE SYS.2&quot;, &quot;ISO 26262-4&quot;),<br>which meant no one could answer &quot;what is missing&quot; without reading everything. This table is the<br>single place where the allocation is stated, so it can be reviewed, and so the requirements browser<br>can present the project along the V-model instead of along the folder tree.<\/p><p><strong>A record can appear under both frameworks.<\/strong> <code>HW-REQ-011<\/code> is an ASPICE HWE.1 work product <em>and<\/em><br>part of ISO 26262-5. That is not double counting — the two frameworks ask different questions of the<br>same artefact, and forcing a single home would lose one of them.<\/p><h4>How to read the table<\/h4><div class='tw'><table><thead><tr><th>Column<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>Area<\/code><\/td><td>Process area (ASPICE) or part (ISO 26262)<\/td><\/tr><tr><td><code>Framework<\/code><\/td><td><code>ASPICE<\/code> or <code>ISO<\/code> — selects which grouping the row appears in<\/td><\/tr><tr><td><code>Level<\/code><\/td><td><code>system<\/code>, <code>software<\/code>, <code>hardware<\/code>, <code>concept<\/code> or <code>supporting<\/code> — groups the V-model tiers<\/td><\/tr><tr><td><code>Side<\/code><\/td><td><code>left<\/code> (specification), <code>right<\/code> (verification) or <code>supporting<\/code><\/td><\/tr><tr><td><code>Records<\/code><\/td><td>Which Requirements-as-Code records belong here: <code>path:&lt;folder&gt;<\/code> or <code>id:&lt;ID prefix&gt;<\/code><\/td><\/tr><tr><td><code>Documents<\/code><\/td><td>Narrative work products, as repo-relative paths<\/td><\/tr><\/tbody><\/table><\/div><p><code>-<\/code> means nothing is allocated yet. For most <code>SWE.*<\/code> rows that is the honest state of this project:<br>phase 7 has not been run.<\/p><h4>Mapping<\/h4><div class='tw'><table><thead><tr><th>Area<\/th><th>Framework<\/th><th>Name<\/th><th>Level<\/th><th>Side<\/th><th>Records<\/th><th>Documents<\/th><\/tr><\/thead><tbody><tr><td>SYS.1<\/td><td>ASPICE<\/td><td>Requirements elicitation<\/td><td>system<\/td><td>left<\/td><td>path:01_requirements/customer<\/td><td>-<\/td><\/tr><tr><td>SYS.2<\/td><td>ASPICE<\/td><td>System requirements analysis<\/td><td>system<\/td><td>left<\/td><td>path:01_requirements/system<\/td><td>-<\/td><\/tr><tr><td>SYS.3<\/td><td>ASPICE<\/td><td>System architectural design<\/td><td>system<\/td><td>left<\/td><td>-<\/td><td>04_architecture/ee_architecture.md, 04_architecture/allocation.md, 03_model/magicgrid.md<\/td><\/tr><tr><td>SYS.4<\/td><td>ASPICE<\/td><td>System integration and integration test<\/td><td>system<\/td><td>right<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>SYS.5<\/td><td>ASPICE<\/td><td>System qualification test<\/td><td>system<\/td><td>right<\/td><td>id:TC-<\/td><td>07_verification/reports/traceability_matrix.md<\/td><\/tr><tr><td>SWE.1<\/td><td>ASPICE<\/td><td>Software requirements analysis<\/td><td>software<\/td><td>left<\/td><td>id:SW-REQ-<\/td><td>-<\/td><\/tr><tr><td>SWE.2<\/td><td>ASPICE<\/td><td>Software architectural design<\/td><td>software<\/td><td>left<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>SWE.3<\/td><td>ASPICE<\/td><td>Software detailed design and unit construction<\/td><td>software<\/td><td>left<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>SWE.4<\/td><td>ASPICE<\/td><td>Software unit verification<\/td><td>software<\/td><td>right<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>SWE.5<\/td><td>ASPICE<\/td><td>Software integration and integration test<\/td><td>software<\/td><td>right<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>SWE.6<\/td><td>ASPICE<\/td><td>Software qualification test<\/td><td>software<\/td><td>right<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>HWE.1<\/td><td>ASPICE<\/td><td>Hardware requirements analysis<\/td><td>hardware<\/td><td>left<\/td><td>id:HW-REQ-<\/td><td>05_hardware/analysis_current_sensing.md<\/td><\/tr><tr><td>HWE.2<\/td><td>ASPICE<\/td><td>Hardware design<\/td><td>hardware<\/td><td>left<\/td><td>id:SM-<\/td><td>05_hardware/hw_architecture.md, 05_hardware/analysis_supply_and_transients.md, 05_hardware/analysis_thermal_derating.md<\/td><\/tr><tr><td>HWE.3<\/td><td>ASPICE<\/td><td>Verification against the hardware design<\/td><td>hardware<\/td><td>right<\/td><td>-<\/td><td>05_hardware/analysis_sm01_coverage.md<\/td><\/tr><tr><td>HWE.4<\/td><td>ASPICE<\/td><td>Hardware verification<\/td><td>hardware<\/td><td>right<\/td><td>-<\/td><td>05_hardware/hw_verification_plan.md<\/td><\/tr><tr><td>MAN.3<\/td><td>ASPICE<\/td><td>Project management<\/td><td>supporting<\/td><td>supporting<\/td><td>-<\/td><td>09_process/project_status.md<\/td><\/tr><tr><td>SUP.1<\/td><td>ASPICE<\/td><td>Quality assurance<\/td><td>supporting<\/td><td>supporting<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>SUP.4<\/td><td>ASPICE<\/td><td>Joint review<\/td><td>supporting<\/td><td>supporting<\/td><td>-<\/td><td>.github/pull_request_template.md<\/td><\/tr><tr><td>SUP.8<\/td><td>ASPICE<\/td><td>Configuration management<\/td><td>supporting<\/td><td>supporting<\/td><td>-<\/td><td>09_process/plans/tool_qualification.md, 09_process/aspice_mapping.md<\/td><\/tr><tr><td>SUP.9<\/td><td>ASPICE<\/td><td>Problem resolution management<\/td><td>supporting<\/td><td>supporting<\/td><td>-<\/td><td>.github/ISSUE_TEMPLATE/problem_report.yml<\/td><\/tr><tr><td>SUP.10<\/td><td>ASPICE<\/td><td>Change request management<\/td><td>supporting<\/td><td>supporting<\/td><td>-<\/td><td>.github/ISSUE_TEMPLATE/change_request.yml<\/td><\/tr><tr><td>Part 2<\/td><td>ISO<\/td><td>Safety management, safety case<\/td><td>supporting<\/td><td>supporting<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>Part 3<\/td><td>ISO<\/td><td>Concept phase: item definition, HARA, FSC<\/td><td>concept<\/td><td>left<\/td><td>path:02_safety/02_hara, path:02_safety/03_fsc<\/td><td>02_safety/01_item_definition/item_definition.md, 02_safety/02_hara/hara.md, 02_safety/02_hara/operational_situations.md, 02_safety/02_hara/sec_classification.md<\/td><\/tr><tr><td>Part 4<\/td><td>ISO<\/td><td>Product development at system level (TSC)<\/td><td>system<\/td><td>left<\/td><td>path:02_safety/04_tsc<\/td><td>04_architecture/ee_architecture.md<\/td><\/tr><tr><td>Part 5<\/td><td>ISO<\/td><td>Product development at hardware level<\/td><td>hardware<\/td><td>left<\/td><td>id:HW-REQ-, id:SM-<\/td><td>05_hardware/hw_architecture.md, 05_hardware/hw_verification_plan.md<\/td><\/tr><tr><td>Part 6<\/td><td>ISO<\/td><td>Product development at software level<\/td><td>software<\/td><td>left<\/td><td>id:SW-REQ-<\/td><td>-<\/td><\/tr><tr><td>Part 8<\/td><td>ISO<\/td><td>Supporting processes<\/td><td>supporting<\/td><td>supporting<\/td><td>-<\/td><td>09_process/assumptions.md, 09_process/plans/tool_qualification.md<\/td><\/tr><tr><td>Part 9<\/td><td>ISO<\/td><td>ASIL-oriented and safety-oriented analyses<\/td><td>supporting<\/td><td>supporting<\/td><td>path:02_safety/05_analyses<\/td><td>-<\/td><\/tr><\/tbody><\/table><\/div><h4>Known gaps this table makes visible<\/h4><ul><li><strong><code>SWE.1<\/code> … <code>SWE.6<\/code> and ISO 26262-6 are empty.<\/strong> Phase 7 has not been run; <code>06_software/<\/code> holds skeleton folders only.<\/li><li><strong><code>SYS.4<\/code> is empty and <code>SYS.5<\/code> holds a single test case<\/strong> for 94 requirements. The test strategy is owed by phase 8.<\/li><li><strong><code>HWE.3<\/code> and <code>HWE.4<\/code> carry plans, not results.<\/strong> The verification plan exists (<code>HV-01<\/code> … <code>HV-12<\/code>); no verification has been performed, which is expected for a reference project.<\/li><li><strong>ISO 26262-2 has nothing.<\/strong> <code>08_safety_case/<\/code> is a skeleton; the GSN argument and the confirmation measures are owed by phase 9, and phase 0 (roles, independence, tailoring) was skipped — tracked as <code>OP-13<\/code>.<\/li><li><strong><code>SUP.1<\/code> has no work product.<\/strong> Reviews happen through the PR template and CODEOWNERS; a quality assurance plan does not exist.<\/li><\/ul><p>Naming a process area and its topic is deliberate; no clause numbers are cited here, in line with<br>the project rule on standard citations.<\/p>"},{"path":"09_process/assumptions.md","title":"Assumptions (`A-xx`)","folder":"09_process","exists":true,"html":"<p>Every assumption not backed by a requirement or a stakeholder document is tracked here.<br>Safety-relevant assumptions are validation targets (ISO 26262-4, validation).<\/p><div class='tw'><table><thead><tr><th>ID<\/th><th>Assumption<\/th><th>Rationale / source<\/th><th>Safety-relevant<\/th><th>Validation target<\/th><th>Status<\/th><\/tr><\/thead><tbody><tr><td>A-01<\/td><td>The vehicle supply provides 24 V nominal with tolerances per ISO 16750-2.<\/td><td>Standard supply of an N3 vehicle<\/td><td>yes<\/td><td>Evidence in the HW verification plan<\/td><td>open<\/td><\/tr><tr><td>A-02<\/td><td>The vehicle gateway forwards diagnostic requests (UDS) to the lighting ECU unchanged.<\/td><td>Vehicle-level system architecture, outside the item boundary<\/td><td>no<\/td><td>—<\/td><td>open<\/td><\/tr><tr><td>A-03<\/td><td>The driver responds to a visual warning in the instrument cluster within the assumed reaction time.<\/td><td>Controllability rating in the HARA<\/td><td>yes<\/td><td>Validation at vehicle level<\/td><td>open<\/td><\/tr><tr><td>A-04<\/td><td>The type of driver warning is specified by the OEM HMI concept.<\/td><td>Open alignment relating to CR-007<\/td><td>no<\/td><td>Clarification with the OEM<\/td><td>open<\/td><\/tr><tr><td>A-05<\/td><td>Object detection for the glare-free high beam is provided by the vehicle via CAN FD and lies outside the item boundary.<\/td><td>System delimitation relating to CR-003<\/td><td>yes<\/td><td>Interface safeguarding in phase 3, validation at vehicle level<\/td><td>open<\/td><\/tr><tr><td>A-06<\/td><td>Light switch position and ignition status are provided by the vehicle as bus signals; no direct wiring to the lighting ECU.<\/td><td>System delimitation relating to CR-001, CR-006<\/td><td>yes<\/td><td>Interface table phase 3<\/td><td>open<\/td><\/tr><tr><td>A-07<\/td><td>The usage profile corresponds to N3 long-haul operation with a predominant night share in the winter half-year.<\/td><td>Basis for the exposure rating of the HARA and for CR-022<\/td><td>yes<\/td><td>Confirmation through OEM usage data<\/td><td>open<\/td><\/tr><tr><td>A-08<\/td><td>A low-beam channel is driven by a constant-current buck LED driver at a nominal set point of 1.20 A, in two parallel strings of 600 mA.<\/td><td>Basis of the tolerance chain and of the parallel-string blindness (HW-REQ-001)<\/td><td>yes<\/td><td>HW design review, DV measurement<\/td><td>open<\/td><\/tr><tr><td>A-09<\/td><td>Low-beam PWM dimming runs at 400 Hz with a duty of at least 20 % in normal operation.<\/td><td>Basis of the sampling raster and of the detection-time arithmetic (HW-REQ-003)<\/td><td>yes<\/td><td>HW verification plan, DV<\/td><td>open<\/td><\/tr><tr><td>A-10<\/td><td>The LED driver provides OVP/OCP/thermal status as a signal readable by the microcontroller.<\/td><td>Precondition for HW-REQ-007 and for the diagnostic coverage of SM-01<\/td><td>yes<\/td><td>Component selection, datasheet review<\/td><td>open<\/td><\/tr><tr><td>A-11<\/td><td>The sensing chain is qualified over -40 C to +85 C ambient; the sense amplifier junction temperature does not exceed +105 C.<\/td><td>Basis of the drift terms in the tolerance chain (HW-REQ-001)<\/td><td>yes<\/td><td>ISO 16750-4 environmental test<\/td><td>open<\/td><\/tr><tr><td>A-12<\/td><td>The thermal derating curve of a low-beam channel never commands below 400 mA.<\/td><td>Precondition for the fixed-threshold approach (HW-REQ-008)<\/td><td>yes<\/td><td>Derating curve review, DV over temperature<\/td><td>open<\/td><\/tr><tr><td>A-13<\/td><td>The luminous flux of a low-beam channel follows Phi = Phi_ref <em> (I / I_ref) <\/em> (1 - k * (T_j - T_ref)) with Phi_ref = 1200 lm at I_ref = 1.20 A, T_ref = 25 C and k = 0.004 1/K.<\/td><td>Basis of the parametric diagram and of the assessment of the limp-home state against the legal minimum luminous flux<\/td><td>yes<\/td><td>Photometric measurement, LED supplier data<\/td><td>open<\/td><\/tr><tr><td>A-14<\/td><td>The lighting ECU is connected to one CAN FD segment operated at 500 kbit/s in the arbitration phase and 2 Mbit/s in the data phase, and the background bus load produced by all other ECUs on that segment does not exceed 35 %.<\/td><td>Basis of the bus load and timing analysis in phase 3 (<code>OP-22<\/code>)<\/td><td>yes<\/td><td>Bus load measurement at vehicle level, OEM network design data<\/td><td>open<\/td><\/tr><tr><td>A-15<\/td><td>The vehicle gateway implements the receiving and transmitting counterpart of the end-to-end protection (alive counter, checksum, data identifier) for every safety-relevant signal group of the message catalogue.<\/td><td>Precondition for <code>SYS-REQ-022<\/code> … <code>SYS-REQ-027<\/code>; the protection is only effective end to end<\/td><td>yes<\/td><td>Interface agreement (DIA) with the vehicle manufacturer, <code>OP-10<\/code><\/td><td>open<\/td><\/tr><tr><td>A-16<\/td><td>The J1939 source addresses and the proprietary-B parameter group numbers used in the message catalogue are allocated by the vehicle manufacturer; the values documented in phase 3 are placeholders.<\/td><td>The item cannot allocate addresses on a vehicle network it does not own<\/td><td>no<\/td><td>Confirmation against the OEM J1939 database, <code>OP-27<\/code><\/td><td>open<\/td><\/tr><tr><td>A-17<\/td><td>The vehicle gateway forwards a received driver warning request to the instrument cluster within 100 ms.<\/td><td>Basis of the end-to-end latency of chain B in the timing analysis; complements <code>A-04<\/code><\/td><td>yes<\/td><td>Vehicle-level timing measurement<\/td><td>open<\/td><\/tr><tr><td>A-18<\/td><td>Cranking and supply-interruption events at the vehicle supply are limited to the ranges of the operating-range table in <code>05_hardware/analysis_supply_and_transients.md<\/code>; the ECU is not required to bridge a supply interruption longer than 2 ms without a functional deviation.<\/td><td>Basis of the functional status classes of HW-REQ-012 and HW-REQ-014<\/td><td>yes<\/td><td>ISO 16750-2 electrical-load tests, DV (HV-06, HV-07)<\/td><td>open<\/td><\/tr><tr><td>A-19<\/td><td>Load dump is suppressed centrally in the vehicle; the ECU has to withstand only the clamped case with a peak of 58 V and a decay time constant of 400 ms, and the unsuppressed case (ISO 7637-2 pulse 5a) does not apply.<\/td><td>Basis of HW-REQ-013 and of the 60 V shutdown threshold of HW-REQ-016; needs an interface agreement with the vehicle manufacturer<\/td><td>yes<\/td><td>Interface agreement, DV load-dump test (HV-07)<\/td><td>open<\/td><\/tr><tr><td>A-20<\/td><td>Thermal model of a low-beam channel: 12 LEDs, 30 % radiant fraction, R_th junction-solder point 3.5 K/W per LED, R_th module-cavity 2.2 K/W (degraded case twice that), headlamp cavity up to 105 C, junction design limit 135 C against a 150 C component rating.<\/td><td>Basis of the derating curve HW-REQ-023 and of the feasibility of the 400 mA floor (HW-REQ-024, closes OP-16)<\/td><td>yes<\/td><td>ISO 16750-4 climatic test with junction-temperature measurement (HV-05), LED supplier data<\/td><td>open<\/td><\/tr><tr><td>A-21<\/td><td>The thermal fault tolerant time interval of an LED module overtemperature is at least 10 s, following from a module thermal time constant of about 60 s.<\/td><td>Justifies why SM-05 is budgeted against a thermal FTTI and not against the 300 ms FTTI of SG-01<\/td><td>yes<\/td><td>Thermal step-response measurement in DV (HV-05)<\/td><td>open<\/td><\/tr><tr><td>A-22<\/td><td>Photometric requirements of the item are stated against the ECE measuring convention for the passing beam: a measuring screen at 25 m distance, the point designations 75R, 50V and B50L, and the headlamp aimed to the nominal inclination of the vehicle in its unladen reference loading state.<\/td><td>Measuring convention for <code>CR-024<\/code>, <code>CR-025<\/code>, <code>CR-026<\/code>, <code>CR-028<\/code>; the customer specification extract states illuminance values without naming screen distance or aim<\/td><td>yes<\/td><td>Photometric laboratory test procedure, confirmation with the OEM<\/td><td>open<\/td><\/tr><\/tbody><\/table><\/div><blockquote>New assumptions are added with consecutive numbers. An assumption is never deleted, only set to <code>confirmed<\/code>, <code>refuted<\/code> or <code>superseded by A-xx<\/code>.<\/blockquote>"},{"path":"09_process/plans/tool_qualification.md","title":"Tool qualification — note on the CI scripts (ISO 26262-8, Clause 11)","folder":"09_process/plans","exists":true,"html":"<p><strong>Status:<\/strong> Preliminary consideration, not a qualification record. Teaching/reference project.<\/p><h4>Tools considered<\/h4><div class='tw'><table><thead><tr><th>Tool<\/th><th>Purpose in the project<\/th><th>Produces evidence?<\/th><th>Consideration<\/th><\/tr><\/thead><tbody><tr><td><code>tools/trace_check.py<\/code><\/td><td>Checks traceability consistency, produces the traceability matrix and coverage KPIs<\/td><td><strong>yes<\/strong><\/td><td>Qualification candidate — see below<\/td><\/tr><tr><td><code>tools/gen_index.py<\/code><\/td><td>Produces the folder overviews of the requirements<\/td><td>indirectly<\/td><td>Derived artefact: the record remains the source. An error would be visible in review since overview and record sit side by side. Lower confidence need than <code>trace_check.py<\/code>.<\/td><\/tr><tr><td><code>tools/gen_req_browser.py<\/code><\/td><td>Produces the requirements browser (<code>07_verification/reports/requirements_browser.html<\/code>) — records, attributes, links and the rendered model views in one page<\/td><td>indirectly<\/td><td>Derived artefact, and the strongest case of &quot;presentation between the reader and the record&quot;: it re-renders record text, resolves links and embeds diagrams. Two consequences are deliberate — it takes its KPIs from <code>trace_check.kpis()<\/code> verbatim rather than recomputing them, so the page cannot report a different coverage than the gate; and every record view names the record file as the source of truth. A reviewer reads it to navigate, and cites the record.<\/td><\/tr><tr><td><code>tools/gen_trace_graph.py<\/code><\/td><td>Produces the Mermaid traceability views and the HTML explorer<\/td><td>indirectly<\/td><td>Derived artefacts: the records remain the source, and every view carries a link table that a reviewer can check against the record. The <strong>HTML explorer additionally places JavaScript between the record and its presentation<\/strong> - a rendering fault there is not visible in the file itself. For that reason the Mermaid views, not the explorer, are the artefact to cite in a review; the explorer is a convenience.<\/td><\/tr><tr><td><code>tools/jobs.py<\/code><\/td><td>Captures tasks written by the human in the requirements browser and runs them through the Claude Code CLI<\/td><td>no<\/td><td>Produces no work product of its own, but it is the one tool here that <strong>runs an agent against the repository<\/strong>, so its failure mode is not a wrong artefact but an unintended change. Four properties carry the argument: <strong>no work runs without a plan a human read and approved<\/strong> — <code>plan<\/code> uses the CLI&#x27;s read-only plan mode and <code>run<\/code> refuses anything not <code>approved<\/code>, with <code>planned_at<\/code> and <code>approved_at<\/code> in the record as the trail; <code>run<\/code> prints the job and the exact command and waits for confirmation; work happens on its own branch and is never committed or pushed; and the companion server binds to loopback and never accepts a path from the client. A job file is data that becomes an instruction — one arriving from someone else is read before it is run, and jobs are never run in CI.<\/td><\/tr><tr><td>GitHub Actions runner<\/td><td>Executes the checks, archives artefacts<\/td><td>indirectly<\/td><td>Infrastructure; the evidence lies in the archived artefacts<\/td><\/tr><tr><td>PlantUML<\/td><td>Renders model views from text sources, and gates their syntax in CI<\/td><td>no (presentation)<\/td><td>The source is the text, not the image — a rendering error is detectable in review. <strong>Version pinned<\/strong> (see below), because the check is only meaningful if it is reproducible<\/td><\/tr><tr><td>Compiler / static analysis / coverage tool<\/td><td>Software verification<\/td><td>yes<\/td><td>Separate consideration required in the SW plan (phase 7)<\/td><\/tr><\/tbody><\/table><\/div><h4>Line of argument for <code>trace_check.py<\/code><\/h4><p><strong>Use case:<\/strong> the script can <em>introduce<\/em> an error (wrong matrix) or <em>fail to detect<\/em> an existing one<br>(a missing trace stays unnoticed). The second case is the more relevant one: the script acts as a<br>verification measure.<\/p><p><strong>Failure modes:<\/strong><\/p><ol><li>Front matter is parsed incorrectly → a record is silently ignored.<\/li><li>The check logic contains an error → a finding is not reported.<\/li><li>A folder lies outside <code>SEARCH_DIRS<\/code> → records are not captured.<\/li><\/ol><p><strong>Measures reducing the confidence need:<\/strong><\/p><ul><li>Standard library only — no unqualified third-party dependency.<\/li><li>The script reports the number of records found; an unexpectedly low value is detectable in review (failure modes 1 and 3 thereby become observable).<\/li><li>Additional mandatory human review (CODEOWNERS, PR checklist) — the CI check does not replace the review, it complements it.<\/li><li>Negative tests: deliberately faulty records must trigger the expected findings.<\/li><\/ul><p><strong>Open point:<\/strong> an actual qualification record (tool classification with TI/TD, the resulting TCL and<br>the qualification method following from it) has <strong>not<\/strong> been produced. For a production baseline it<br>would have to be. This file names the gap; it does not close it.<\/p><h4>Note on the PlantUML version<\/h4><p>PlantUML needs no qualification argument — it produces presentation, and the text source stays the<br>authoritative artefact. Its <strong>version<\/strong>, however, is a configuration item, because the CI syntax<br>check is a gate: an unpinned tool means the gate answers a different question on every run.<\/p><p>That was not theoretical. The job installed whatever <code>apt-get install plantuml<\/code> shipped on the<br>runner, which lagged the current release by years. <code>ibd_ecu.puml<\/code> used <code>portin<\/code> / <code>portout<\/code>, the<br>runner&#x27;s version did not know them, and the gate went red on a diagram that was correct and rendered<br>locally without complaint. The failure survived several commits because the red run looked like the<br>traceability check failing, which it never was.<\/p><p>The version is therefore pinned in <code>.github/workflows/traceability.yml<\/code> to a release asset with a<br>recorded SHA-256, and Graphviz availability is asserted with <code>-testdot<\/code> before any diagram is<br>checked. Raising the version is a reviewable change with an impact on every model view, not a<br>silent drift.<\/p><p><strong>Pinning the version is not the same as reproducible output.<\/strong> PlantUML lays text out with the<br>fonts of the machine it runs on, so the same source at the same version renders to different SVG<br>bytes on macOS and on the CI runner — every one of the eleven model views differed. For the<br>requirements browser, which embeds the rendered SVG, that meant the page appeared to change on every<br>platform switch: one commit back from CI per push, and a false &quot;stale&quot; verdict for anyone<br>regenerating on a different operating system. <code>gen_req_browser.py<\/code> therefore compares pages with the<br>SVG payloads blanked. A real change to a diagram is still caught, because the PlantUML source is<br>embedded next to the rendering and compared normally; only the pixels move.<\/p><p><strong>Residual point:<\/strong> the locally installed PlantUML is not pinned by anything, so a diagram authored<br>with a newer local version can still fail the syntax gate. The gate is the authority; local<br>rendering is convenience. Worth revisiting if the model views ever become cited evidence rather than<br>illustration.<\/p><h4>Honest limitation<\/h4><p>As long as tool qualification is open, a green CI run may be argued in the safety case only as<br><em>supporting<\/em> evidence (Sn-07), not as sole evidence of requirements completeness.<\/p><p>The same applies, more strongly, to the visual views: a diagram that omits links for readability -<br>as the large safety goal views deliberately do - must never be cited as evidence of completeness.<br>Completeness is argued from <code>traceability_matrix.md<\/code> and from <code>trace_check.py<\/code>, not from a picture.<\/p>"},{"path":"09_process/project_status.md","title":"Project status — current state and open points","folder":"09_process","exists":true,"html":"<blockquote>This file is the re-entry point. It is updated at the end of every phase. Last update: after the E/E architecture refinement (systems-engineer + hardware-engineer, between phase 4 and phase 5).<\/blockquote><h4>Phase status<\/h4><div class='tw'><table><thead><tr><th>Phase<\/th><th>Content<\/th><th>Status<\/th><th>Lead<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Project frame, stakeholders, roles, tailoring, glossary<\/td><td><strong>skipped<\/strong><\/td><td>safety-manager, config-manager<\/td><\/tr><tr><td>1<\/td><td>Customer requirements <code>CR-001 … CR-028<\/code> (SYS.1)<\/td><td><strong>complete<\/strong> (draft)<\/td><td>systems-engineer<\/td><\/tr><tr><td>2<\/td><td>Item definition, HARA, safety goals, FSC (ISO 26262-3)<\/td><td><strong>complete<\/strong> (draft)<\/td><td>safety-manager<\/td><\/tr><tr><td>3<\/td><td><code>SYS-REQ<\/code>, <code>TSR<\/code>, E/E architecture (SYS.2, SYS.3)<\/td><td><strong>complete<\/strong> (draft)<\/td><td>systems-engineer<\/td><\/tr><tr><td>4<\/td><td>MBSE model, MagicGrid, 8 SysML views<\/td><td><strong>complete<\/strong> (draft)<\/td><td>mbse-modeler<\/td><\/tr><tr><td>4a<\/td><td>E/E architecture refinement — bus catalogue, timing, HW architecture detail<\/td><td><strong>complete<\/strong> (draft)<\/td><td>systems-engineer, hardware-engineer<\/td><\/tr><tr><td>5<\/td><td>FMEA, DFMEA, FTA, FMEDA, DFA, STPA<\/td><td><strong>next phase<\/strong><\/td><td>safety-analyst<\/td><\/tr><tr><td>6<\/td><td>Hardware (HWE.1–4, Part 5)<\/td><td><strong>partly pulled forward<\/strong> in 4a<\/td><td>hardware-engineer<\/td><\/tr><tr><td>7<\/td><td>Software (SWE.1–6, Part 6)<\/td><td>open<\/td><td>software-engineer<\/td><\/tr><tr><td>8<\/td><td>Verification &amp; validation (SYS.4, SYS.5)<\/td><td>open<\/td><td>verification-engineer<\/td><\/tr><tr><td>9<\/td><td>Safety case, confirmation measures<\/td><td>open<\/td><td>safety-manager, quality-assessor<\/td><\/tr><tr><td>10<\/td><td>GitHub configuration management and evidence<\/td><td>partly prepared<\/td><td>config-manager<\/td><\/tr><tr><td>11<\/td><td>Traceability &amp; metrics<\/td><td>open<\/td><td>config-manager, quality-assessor<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Phase 0 was skipped<\/strong> and needs to be caught up — the role model, independence levels and<br>tailoring decisions are missing but will be required at the latest for phase 9.<\/p><h4>Results so far<\/h4><ul><li><strong>28 customer requirements<\/strong> <code>CR-001 … CR-028<\/code>, covering all categories of the customer specification. Three of them (<code>CR-002<\/code>, <code>CR-005<\/code>, <code>CR-016<\/code>) are <strong>deliberately weak<\/strong> and marked as such in the <code>rationale<\/code> field (teaching purpose).<\/li><li><strong>SYS.1 increment &quot;illuminance&quot; (after phase 4a):<\/strong> <code>CR-024<\/code> … <code>CR-028<\/code> add the photometric side of the adaptive front lighting — base level at 75R, glare limit at B50L, the degraded-channel case, the AFS mode-change time and the stability band. All five are <code>asil: QM<\/code> <strong>as a placeholder only<\/strong>; the classification is the safety-manager&#x27;s (<code>OP-41<\/code>). <code>CR-026<\/code> is deliberately left unquantified so that it cannot contradict the <code>SG-01<\/code> safe state, see <code>OP-38<\/code>. Measuring convention: <code>A-22<\/code>. No <code>SYS-REQ<\/code> is derived from them yet — the derivation follows in the next SYS.2 increment, after the ASIL of <code>OP-41<\/code> is settled.<\/li><li><strong>7 hazards<\/strong> <code>H-01 … H-07<\/code>, six of them with a safety goal, one resulting in QM.<\/li><li><strong>2 safety goals<\/strong>: <code>SG-01<\/code> (ASIL B, Golden Thread) and <code>SG-02<\/code> (ASIL A, second thread).<\/li><li><strong>8 FSR<\/strong> <code>FSR-001 … FSR-008<\/code>, incl. the ASIL decomposition <code>FSR-005 → FSR-006 QM(A) + FSR-007 A(A)<\/code>.<\/li><li><strong>Timing budget SG-01<\/strong> closes: 80 ms detection + 150 ms reaction = 230 ms &lt; FTTI 300 ms. (Phase 2 stated 70 ms / 220 ms; the tolerance analysis of the current sensing raised the detection time to 80 ms — worst case 77.6 ms in the chain-A analysis of <code>ee_architecture.md<\/code>.)<\/li><li><strong>Documented phase 2 work products:<\/strong> <code>02_safety/01_item_definition/item_definition.md<\/code>, <code>02_safety/02_hara/hara.md<\/code>, <code>operational_situations.md<\/code>, <code>sec_classification.md<\/code>.<\/li><li><strong>Phase 3 refinement of <code>SYS-REQ-014<\/code><\/strong> (hardware-engineer): tolerance analysis of the current sensing closed. <code>SYS-REQ-014<\/code> split, <code>SYS-REQ-015<\/code> … <code>SYS-REQ-019<\/code> and <code>HW-REQ-001<\/code> … <code>HW-REQ-010<\/code> created, <code>SM-01<\/code> detection time 70 → 80 ms, diagnostic coverage 90 % made conditional. Analysis: <code>05_hardware/analysis_current_sensing.md<\/code>.<\/li><li><strong>Phase 3:<\/strong> 15 further system requirements (<code>SYS-REQ-001<\/code> … <code>013<\/code>, <code>020<\/code>, <code>021<\/code>), 8 technical safety requirements <code>TSR-001<\/code> … <code>TSR-008<\/code> incl. the decomposed pair <code>TSR-006 QM(A)<\/code> / <code>TSR-007 A(A)<\/code>, E/E architecture with interface table and TSR allocation matrix (<code>04_architecture/ee_architecture.md<\/code>). ASIL of all customer requirements set from the HARA.<\/li><li><strong>Phase 4:<\/strong> MagicGrid matrix and the eight SysML views as PlantUML (<code>03_model/magicgrid.md<\/code>, <code>03_model/plantuml/<\/code>), function allocation (<code>04_architecture/allocation.md<\/code>). PlantUML installed locally, all ten diagrams syntax-checked and rendered.<\/li><li><strong>Architecture refinement (4a), systems side:<\/strong> CAN FD / SAE J1939 message catalogue at frame level and the bus load / timing analysis (<code>04_architecture/ee_architecture.md<\/code>, now 7 sections), closing <code>OP-21<\/code> and <code>OP-22<\/code>. Seven new system requirements <code>SYS-REQ-022<\/code> … <code>SYS-REQ-028<\/code> for end-to-end protection (alive counter, checksum, data identifier), invalidation on mismatch and on timeout, hold-last-valid for the low beam, the event-triggered warning frame and the ECU transmit budget. Interface table gained an <code>Integrity<\/code> column and the missing <code>IgnitionStatus<\/code> row. SG-01 chain A: <strong>77.6 ms detection + 150 ms reaction = 230 ms<\/strong> against FTTI 300 ms, and the chain is bus-independent. Lighting signal set ≈ 1.9 % bus load, segment ≈ 37 %.<\/li><li><strong>Architecture refinement (4a), hardware side:<\/strong> <code>05_hardware/hw_architecture.md<\/code> plus four analyses (supply and transients, thermal derating, SM-01 coverage, HW verification plan with <code>HV-01<\/code> … <code>HV-12<\/code>). New records <code>HW-REQ-011<\/code> … <code>HW-REQ-025<\/code> (supply ranges 9–36 V, clamped load dump 58 V / 400 ms, ISO 7637-2 pulse classes, reverse polarity, rail and watchdog monitoring, enable-gate topology, short-to-battery, overcurrent, thermal derating, CAN transceiver robustness) and safety mechanisms <code>SM-02<\/code> … <code>SM-06<\/code>, each with an explicit FTTI budget. <code>ibd_ecu.puml<\/code> rewritten as a hardware view; new <code>ibd_current_sense_chain.puml<\/code> as the 🔍 DEEP DIVE of the Golden Thread element. <strong><code>OP-16<\/code> closed:<\/strong> the 400 mA derating floor is confirmed — the degraded heat path at 105 °C cavity reaches T_j ≈ 130 °C, 5 K below the 135 °C design limit. <strong><code>OP-24<\/code> and the hardware side of <code>OP-4<\/code> closed.<\/strong><\/li><li><strong><code>SM-01<\/code> coverage made checkable rather than assertive:<\/strong> bare scheme 59.4 %, all four measures 93.0 %; dropping any single measure gives 84.5 / 79.9 / 85.0 / 89.0 %, so none is optional. The 90 % claim stays conditional until the FMEDA confirms it (<code>OP-15<\/code>).<\/li><li>Traceability check green, <strong>110 records<\/strong>, requirements coverage 81/94 = 86 %.<\/li><\/ul><h5>Housekeeping from the parallel refinement<\/h5><p>The two agents ran concurrently and both appended assumptions numbered <code>A-14<\/code> … <code>A-17<\/code>. The<br>collision was resolved <strong>before any commit<\/strong> by renumbering the hardware set to<br><strong><code>A-18<\/code> … <code>A-21<\/code><\/strong> (supply interruption, central load-dump suppression, thermal model, thermal<br>FTTI); the systems set keeps <code>A-14<\/code> … <code>A-17<\/code> (bus segment, gateway E2E counterpart, placeholder<br>PGNs, gateway forwarding time). All references were updated; <code>A-01<\/code> … <code>A-21<\/code> are unique. Two further<br>reconciliations: <code>ibd_ecu.puml<\/code> annotated <code>CAN_FD_Transceiver<\/code> with <code>HW-REQ-024<\/code> (the thermal<br>requirement) instead of <code>HW-REQ-025<\/code>, and <code>HW-REQ-004<\/code> lacked the variant marking that the phase 3<br><code>OP-17<\/code> decision implies. Both fixed.<\/p><h4>Open points<\/h4><div class='tw'><table><thead><tr><th>ID<\/th><th>Point<\/th><th>Owner<\/th><th>Due<\/th><\/tr><\/thead><tbody><tr><td>OP-1<\/td><td><del>Carry the ASIL of the <code>tbd<\/code> customer requirements over from the HARA<\/del><\/td><td>systems-engineer<\/td><td><strong>done<\/strong> (phase 3)<\/td><\/tr><tr><td>OP-2<\/td><td><del>Behaviour outside the normal supply range is missing<\/del> — undervoltage in <code>SYS-REQ-013<\/code>, overvoltage and load dump in <code>HW-REQ-011<\/code> … <code>HW-REQ-016<\/code>. Residual: the system-level requirement for &lt; 9 V / &gt; 32 V, see <code>OP-36<\/code><\/td><td>systems-engineer, hardware-engineer<\/td><td><strong>done<\/strong> (4a)<\/td><\/tr><tr><td>OP-3<\/td><td><code>CR-007<\/code> is not atomic (detection + indication); change only via a requirement-change issue<\/td><td>systems-engineer<\/td><td>before baseline<\/td><\/tr><tr><td>OP-15<\/td><td>Confirm the 90 % diagnostic coverage of <code>SM-01<\/code> against the FMEDA — blocks <code> erification methods and test cases for <code>SYS-REQ-022<\/code> … <code>SYS-REQ-028<\/code> (E2E fault injection, bus load and latency measurement)<\/td><td>verification-engineer<\/td><td>Phase 8<\/td><\/tr><tr><td>OP-34<\/td><td><strong><code>SM-02<\/code> conflicts with <code>SG-01<\/code><\/strong>: <code>TSR-001<\/code> de-energises the driver stages on SAFE_OFF — applied to the low beam that is exactly <code>H-01<\/code>. Differentiate the disable path by channel class<\/td><td>safety-manager, systems-engineer<\/td><td>Phase 5<\/td><\/tr><tr><td>OP-35<\/td><td><code>CR-017<\/code> demands &quot;no loss of function for all pulses&quot;, which is neither designed nor achievable; reword against the pulse/class table<\/td><td>systems-engineer<\/td><td>before baseline<\/td><\/tr><tr><td>OP-36<\/td><td>Missing <code>SYS-REQ<\/code> for behaviour below 9 V / above 32 V and for thermal derating — <code>HW-REQ-023<\/code> carries ASIL B but hangs off the QM requirement <code>CR-014<\/code><\/td><td>systems-engineer<\/td><td>Phase 5<\/td><\/tr><tr><td>OP-37<\/td><td>Interface table additions from the hardware view: <code>U_Batt<\/code>, <code>RailStatus<\/code>, and <code>SAFE_OFF<\/code> / <code>OV_SHUTDOWN<\/code> into the enable gate<\/td><td>systems-engineer<\/td><td>Phase 5<\/td><\/tr><tr><td>OP-38<\/td><td>Photometric compliance at the 400 mA floor (≈ 232 lm/channel) against the legal minimum — affects the <code>SG-01<\/code> safe state and <code>SYS-REQ-013<\/code>, not only the derating curve<\/td><td>safety-manager, systems-engineer<\/td><td>Phase 5<\/td><\/tr><tr><td>OP-39<\/td><td><code>A-19<\/code> (central load-dump suppression) needs an interface agreement with the vehicle manufacturer, like <code>A-05<\/code><\/td><td>safety-manager<\/td><td>Phase 6<\/td><\/tr><tr><td>OP-40<\/td><td><code>A-12<\/code> (&quot;the derating curve never commands below 400 mA&quot;) restates <code>HW-REQ-008<\/code>, which requires exactly that. Since the requirement exists, the assumption should be confirmed or marked superseded rather than left <code>open<\/code> — an assumption and a requirement asserting the same thing invite them to drift apart<\/td><td>hardware-engineer<\/td><td>Phase 6<\/td><\/tr><tr><td>OP-41<\/td><td>ASIL of the illuminance requirements <code>CR-024<\/code> … <code>CR-028<\/code> is unassigned — all five carry <code>asil: QM<\/code> as a placeholder. Classify them from the HARA, as was done for the <code>tbd<\/code> records in <code>OP-1<\/code>; <code>CR-024<\/code>/<code>CR-026<\/code> touch <code>SG-01<\/code>, <code>CR-025<\/code> touches <code>SG-02<\/code><\/td><td>safety-manager<\/td><td>Phase 5<\/td><\/tr><tr><td>OP-13<\/td><td>Catch up phase 0: role model, independence levels, tailoring, glossary<\/td><td>safety-manager<\/td><td>before phase 9<\/td><\/tr><tr><td>OP-14<\/td><td><del>HARA and item definition existed only in chat, not as work products<\/del><\/td><td>safety-manager<\/td><td><strong>done<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h4>Next step<\/h4><p><strong>Phase 5<\/strong> — safety analyses: System-FMEA and DFMEA per AIAG-VDA with B/A/E and AP, FTA with<br>minimal cut sets, FMEDA with SPFM/LFM/PMHF against the ASIL B targets, DFA for the decomposed path,<br>STPA, verification matrix. Points to observe:<\/p><ul><li>The DFA is blocking: <code>RISK-02<\/code> states the decomposition <code>TSR-006<\/code> / <code>TSR-007<\/code> is not demonstrated until it exists.<\/li><li>The FMEDA must re-derive the diagnostic coverage of <code>SM-01<\/code>; the 90 % claim is conditional (<code>OP-15<\/code>) and the bare scheme is worth about 60 %.<\/li><li><code>OP-23<\/code>: the decision against per-string sensing has to be revisited against the FMEDA result.<\/li><li><strong>New input from 4a:<\/strong> <code>05_hardware/analysis_sm01_coverage.md<\/code> decomposes the SM-01 claim into six failure-mode groups with a per-measure contribution and a sensitivity table. The FMEDA should confirm or reject that decomposition rather than start from scratch.<\/li><li><strong>New input from 4a:<\/strong> <code>SM-02<\/code> … <code>SM-06<\/code> now exist with declared detection/reaction times and FTTI budgets, and the coverage figures in them are marked as <strong>unconfirmed targets<\/strong> owned by <code>safety-analyst<\/code>. They are FMEDA input, not FMEDA results.<\/li><li><strong><code>OP-34<\/code> is a concept-level conflict, not an analysis detail:<\/strong> <code>SM-02<\/code> de-energises the driver stages on SAFE_OFF, which applied to the low beam produces <code>H-01<\/code> — the hazard <code>SG-01<\/code> exists to prevent. This wants resolving in the TSC before the FMEDA quantifies anything around it.<\/li><li><code>OP-29<\/code>, <code>OP-38<\/code>: two further findings that touch safety goals rather than hardware detail.<\/li><li>Element names are binding: <code>ECU_LightingCtrl<\/code>, <code>LED_Driver_Stage_1<\/code>, <code>SWC_LightManager<\/code>, <code>SWC_HighBeamControl<\/code>, <code>SWC_HighBeamMonitor<\/code>, <code>SWC_WorkLampControl<\/code>, <code>Vehicle_Gateway<\/code>, <code>Item_LightingSystem<\/code>, <code>Current_Sense_Chain<\/code>, <code>MCU_Lockstep<\/code>, <code>ASIC_Watchdog<\/code>, <code>Power_Supply_Unit<\/code>, <code>Temp_Sense_Chain<\/code>, <code>SWC_DiagnosticManager<\/code>, <code>CAN_FD_Transceiver<\/code>, <code>LIN_Transceiver<\/code>.<\/li><\/ul><blockquote><strong>Language:<\/strong> the project is English throughout since the translation. German remains only in <code>09_process/prompts/<\/code> — that is the original commissioning document and is deliberately unchanged. Two element names were renamed with the translation: <code>Item_Beleuchtungssystem<\/code> → <code>Item_LightingSystem<\/code> and <code>Fahrzeug_Gateway<\/code> → <code>Vehicle_Gateway<\/code>.<\/blockquote>"}],"plantuml":true,"stats":{"Requirements coverage":"85/99 = 86 %","Test coverage":"3/3 = 100 %","Records total":"115"},"ndiagram <script>
const D = JSON.parse(document.getElementById('data').textContent);
const items = D.items, mods = D.modules;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function kindPill(k) {
  const c = D.colors[k] || '#777';
  return `<span class="pill kind" style="background:${c}">${esc(k)}</span>`;
}
function chips(ids) {
  if (!ids || !ids.length) return '<span class="none">-</span>';
  return ids.map(id => items[id]
    ? `<a class="chip" href="#r/${encodeURIComponent(id)}">${esc(id)}</a>`
    : `<span class="chip" title="not a record">${esc(id)}</span>`).join('');
}

/* ---- filters ---- */
const F = { q:'', kind:'', asil:'', status:'' };
function fill(sel, label, values) {
  const el = document.getElementById(sel);
  el.innerHTML = `<option value="">${label}</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
}
fill('fKind', 'All types', D.kinds);
fill('fAsil', 'All ASIL', D.asils);
fill('fStatus', 'All statuses', D.statuses);

function matches(r) {
  if (F.kind && r.kind !== F.kind) return false;
  if (F.asil && r.asil !== F.asil) return false;
  if (F.status && r.status !== F.status) return false;
  if (F.q) {
    const hay = (r.id + ' ' + r.text + ' ' + r.rationale + ' ' + r.alloc.join(' ') + ' ' +
                 r.type + ' ' + r.file).toLowerCase();
    if (!hay.includes(F.q)) return false;
  }
  return true;
}

/* ---- navigation ---- */
function renderNav() {
  const cur = location.hash;
  const nav = document.getElementById('nav');
  const keepScroll = nav.scrollTop;
  // A record is "in" its module, so opening one keeps the module highlighted.
  let openMod = null;
  if (cur.startsWith('#r/')) {
    const r = items[decodeURIComponent(cur.slice(3))];
    if (r) openMod = (mods.find(m => m.ids.includes(r.id)) || {}).id;
  }
  let h = `<h2>Grouping</h2>
    <select id="grouping">
      <option value="aspice">ASPICE process areas</option>
      <option value="iso">ISO 26262 parts</option>
      <option value="folder">Repository folders</option>
    </select>
    <a class="mod${cur.startsWith('#v') || cur === '' ? ' sel' : ''}" href="#v/${grouping === 'folder' ? 'aspice' : grouping}">
       V-model overview<span class="sub">all process areas, populated or not</span></a>`;

  if (grouping === 'folder') {
    h += '<h2>Modules</h2>';
    for (const m of mods) {
      const n = m.ids.filter(id => matches(items[id])).length;
      const sel = (cur === '#m/' + encodeURIComponent(m.id) || m.id === openMod) ? ' sel' : '';
      h += `<a class="mod${sel}" href="#m/${encodeURIComponent(m.id)}">
              <span class="n">${n}/${m.ids.length}</span>${esc(m.title)}
              <span class="sub">${esc(m.path)}${m.process ? ' &middot; ' + esc(m.process) : ''}</span>
            </a>`;
    }
  } else {
    const fw = grouping === 'iso' ? 'ISO' : 'ASPICE';
    for (const lvl of D.levels) {
      const inLevel = D.areas.filter(a => a.framework === fw && a.level === lvl.id);
      if (!inLevel.length) continue;
      h += `<h2>${esc(lvl.title)}</h2>`;
      for (const a of inLevel) {
        const n = a.ids.filter(id => matches(items[id])).length;
        const sel = cur === '#a/' + encodeURIComponent(a.id) ? ' sel' : '';
        // Records and documents are different things; mixing them into one ratio made
        // an area with three documents and no records read as "0/3", i.e. as nothing done.
        const count = a.empty ? 'empty'
          : a.ids.length ? `${n}/${a.ids.length}`
          : `${a.docs.length} doc${a.docs.length > 1 ? 's' : ''}`;
        h += `<a class="mod${sel}" href="#a/${encodeURIComponent(a.id)}">
                <span class="n">${count}</span>${esc(a.id)}
                <span class="sub">${esc(a.name)}</span></a>`;
      }
    }
  }
  h += '<h2>Model views</h2>';
  for (const d of D.diagrams) {
    const sel = cur === '#d/' + encodeURIComponent(d.name) ? ' sel' : '';
    h += `<a class="mod${sel}" href="#d/${encodeURIComponent(d.name)}">${esc(d.name)}
            <span class="sub">${esc(d.title)}</span></a>`;
  }
  h += '<h2>Documents</h2>';
  for (const doc of D.documents) {
    if (!doc.exists) continue;
    const sel = cur === '#doc/' + doc.path ? ' sel' : '';
    h += doc.html
      ? `<a class="mod${sel}" href="#doc/${doc.path}">${esc(doc.title)}
           <span class="sub">${esc(doc.path)}</span></a>`
      : `<a class="mod" href="../../${doc.path}">${esc(doc.title)}
           <span class="sub">${esc(doc.path)} &middot; opens outside</span></a>`;
  }
  nav.innerHTML = h;
  nav.scrollTop = keepScroll;
  const g = document.getElementById('grouping');
  g.value = grouping;
  // The grouping goes into the URL like everything else, so a reload keeps it and a
  // link can point at "the ISO view" rather than at whatever the recipient last chose.
  g.onchange = e => {
    grouping = e.target.value;
    location.hash = grouping === 'folder' ? '#m/' + encodeURIComponent(mods[0].id)
                                          : '#v/' + grouping;
  };
}

/* ---- views ---- */
let grouping = 'aspice';
let sortCol = 'id', sortAsc = true;
const COLS = [['id','ID'],['text','Text'],['type','Type'],['asil','ASIL'],
              ['status','Status'],['up','Derived from'],['down','Refined by'],['vby','Verified by']];

function table(ids) {
  const rows = ids.map(id => items[id]).filter(matches);
  rows.sort((a, b) => {
    let x = a[sortCol], y = b[sortCol];
    if (Array.isArray(x)) { x = x.length; y = y.length; }
    if (sortCol === 'id') {
      const na = parseInt(a.id.split('-').pop(), 10), nb = parseInt(b.id.split('-').pop(), 10);
      x = a.kind + String(na).padStart(4, '0'); y = b.kind + String(nb).padStart(4, '0');
    }
    return (x > y ? 1 : x < y ? -1 : 0) * (sortAsc ? 1 : -1);
  });
  if (!rows.length) return '<p class="none">No record matches the current filter.</p>';
  const head = COLS.map(([k, l]) =>
    `<th data-c="${k}">${l}${sortCol === k ? (sortAsc ? ' &uarr;' : ' &darr;') : ''}</th>`).join('');
  const body = rows.map(r => `<tr>
      <td class="id">${kindPill(r.kind)} <a href="#r/${encodeURIComponent(r.id)}">${esc(r.id)}</a></td>
      <td class="txt">${esc(r.text)}</td>
      <td>${esc(r.type)}</td>
      <td><span class="pill">${esc(r.asil || '-')}</span></td>
      <td><span class="pill">${esc(r.status)}</span></td>
      <td>${chips(r.up)}</td>
      <td>${chips(r.down)}</td>
      <td>${chips(r.vby.length ? r.vby : r.verifies)}</td>
    </tr>`).join('');
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function viewModule(id) {
  const m = mods.find(x => x.id === id) || mods[0];
  return `<h2 class="title">${esc(m.title)}</h2>
          <p class="sub">${esc(m.path)}${m.process ? ' &middot; ' + esc(m.process) : ''}
             &middot; ${m.ids.length} records</p>${table(m.ids)}`;
}

function viewRecord(id) {
  const r = items[id];
  if (!r) return `<p class="none">Unknown record ${esc(id)}.</p>`;
  return `<h2 class="title">${kindPill(r.kind)} ${esc(r.id)}</h2>
    <p class="sub">${esc(r.file)}</p>${flagsFor(r.id)}
    <div class="card"><h3>Requirement text</h3>
      <div class="reqtext">${esc(r.text)}</div></div>
    <dl class="grid">
      <dt>Type</dt><dd>${esc(r.type || '-')}</dd>
      <dt>ASIL</dt><dd><span class="pill">${esc(r.asil || '-')}</span></dd>
      <dt>Status</dt><dd><span class="pill">${esc(r.status || '-')}</span></dd>
      <dt>Source</dt><dd>${esc(r.source || '-')}</dd>
      <dt>Derived from</dt><dd>${chips(r.up)}</dd>
      <dt>Refined by</dt><dd>${chips(r.down)}</dd>
      <dt>Allocated to</dt><dd>${r.alloc.length
        ? r.alloc.map(a => `<span class="chip">${esc(a)}</span>`).join('') : '<span class="none">-</span>'}</dd>
      <dt>Verified by</dt><dd>${chips(r.vby)}</dd>
      ${r.verifies.length ? `<dt>Verifies</dt><dd>${chips(r.verifies)}</dd>` : ''}
      ${r.tags.length ? `<dt>Tags</dt><dd>${r.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</dd>` : ''}
    </dl>
    ${r.rationale ? `<div class="card"><h3>Rationale</h3><div>${esc(r.rationale)}</div></div>` : ''}
    ${r.body ? `<div class="body">${r.body}</div>` : ''}
    <p class="foot">Source of truth is the record file, not this page:
       <a href="../../${r.file}">${esc(r.file)}</a></p>`;
}

function viewDiagram(name) {
  const d = D.diagrams.find(x => x.name === name);
  if (!d) return '<p class="none">Unknown diagram.</p>';
  const img = d.svg
    ? `<div class="diagram"><img alt="${esc(d.title)}" src="data:image/svg+xml;base64,${d.svg}"></div>`
    : `<div class="banner">Not rendered - PlantUML was unavailable when this page was generated.
         The source below is authoritative either way.</div>`;
  return `<h2 class="title">${esc(d.title)}</h2>
    <p class="sub">${esc(d.file)}</p>${flagsFor(d.name)}${img}
    <p style="margin:12px 0"><button class="link" onclick="
       var e=document.getElementById('src');
       e.style.display = e.style.display === 'none' ? 'block' : 'none';">Show / hide source</button></p>
    <pre class="code" id="src" style="display:none">${esc(d.src)}</pre>`;
}

function areaCard(a) {
  const n = a.ids.filter(id => matches(items[id])).length;
  const bits = [];
  if (a.ids.length) bits.push(`${n}/${a.ids.length} records`);
  if (a.docs.length) bits.push(`${a.docs.length} document${a.docs.length > 1 ? 's' : ''}`);
  return `<a class="acard${a.empty ? ' empty' : ''}" href="#a/${encodeURIComponent(a.id)}">
            <span class="ac">${bits.length ? bits.join(' &middot; ') : 'not started'}</span>
            <span class="aid">${esc(a.id)}</span>
            <span class="an">${esc(a.name)}</span></a>`;
}

function viewVModel() {
  const fw = grouping === 'iso' ? 'ISO' : 'ASPICE';
  const label = fw === 'ISO' ? 'ISO 26262 parts' : 'ASPICE process areas';
  let h = `<h2 class="title">V-model overview</h2>
    <p class="sub">${esc(label)} &middot; allocation from
       <a href="../../09_process/aspice_mapping.md">09_process/aspice_mapping.md</a>.
       An area with a dashed border has no work product yet -- that is the project's state,
       not a rendering gap.</p>`;

  for (const lvl of D.levels) {
    const inLevel = D.areas.filter(a => a.framework === fw && a.level === lvl.id);
    if (!inLevel.length) continue;
    const left = inLevel.filter(a => a.side === 'left');
    const right = inLevel.filter(a => a.side === 'right');
    const sup = inLevel.filter(a => a.side === 'supporting');
    h += `<div class="vlevel"><h3>${esc(lvl.title)}</h3>`;
    // Two columns only where both arms exist. The ISO 26262 parts are not split into a
    // specification and a verification arm, so forcing the layout would print an empty
    // "Verification" column at every level and imply a gap that is not there.
    if (left.length && right.length) {
      h += `<div class="vcols">
              <div><h4>Specification</h4>${left.map(areaCard).join('')}</div>
              <div><h4>Verification</h4>${right.map(areaCard).join('')}</div>
            </div>`;
    } else if (left.length || right.length) {
      h += left.concat(right).map(areaCard).join('');
    }
    if (sup.length) h += sup.map(areaCard).join('');
    h += '</div>';
  }
  return h;
}

function viewArea(id) {
  const a = D.areas.find(x => x.id === id);
  if (!a) return `<p class="none">Unknown process area ${esc(id)}.</p>`;
  const side = a.side === 'left' ? 'specification' : a.side === 'right' ? 'verification' : 'supporting';
  let h = `<h2 class="title">${esc(a.id)} &mdash; ${esc(a.name)}</h2>
    <p class="sub">${esc(a.framework === 'ISO' ? 'ISO 26262' : 'ASPICE')} &middot;
       ${esc(a.level)} level &middot; ${esc(side)}</p>`;

  if (a.empty) {
    h += `<div class="banner">No work product is allocated to this area yet.
            The allocation itself is stated in
            <a href="../../09_process/aspice_mapping.md">aspice_mapping.md</a>;
            an empty area means the phase that would produce it has not been run.</div>`;
  }
  if (a.docs.length) {
    h += `<div class="card"><h3>Documents</h3><div class="doclist">` +
      a.docs.map(d => docLink(d.path, d.path)).join('') +
      `</div></div>`;
  }
  if (a.ids.length) h += `<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.6px;
                            color:var(--muted);margin:18px 0 8px">Records</h3>` + table(a.ids);
  return h;
}

function docLink(path, label) {
  const d = D.documents.find(x => x.path === path);
  const text = esc(label || (d ? d.title : path));
  if (d && d.html) return `<a href="#doc/${path}">${text}</a>`;
  if (d && !d.exists) return `<span class="missing">${text} &mdash; allocated but not present</span>`;
  return `<a href="../../${path}">${text}</a>`;
}

function viewDocument(path) {
  const d = D.documents.find(x => x.path === path);
  if (!d) return `<p class="none">Unknown document ${esc(path)}.</p>`;
  if (!d.html) return `<p class="none">${esc(d.path)} is not rendered in this page.
    <a href="../../${d.path}">Open it directly</a>.</p>`;
  const areas = D.areas.filter(a => a.doc_src.includes(d.path));
  return `<h2 class="title">${esc(d.title)}</h2>
    <p class="sub">${esc(d.path)}${areas.length ? ' &middot; ' +
       areas.map(a => `<a href="#a/${encodeURIComponent(a.id)}">${esc(a.id)}</a>`).join(', ') : ''}</p>
    ${flagsFor(d.path)}
    <div class="body doc">${d.html}</div>
    <p class="foot">Rendered from the Markdown source; the file is what counts:
       <a href="../../${d.path}">${esc(d.path)}</a></p>`;
}

function viewDocs() {
  const byFolder = {};
  for (const d of D.documents) (byFolder[d.folder] = byFolder[d.folder] || []).push(d);
  let h = `<h2 class="title">Documents</h2>
    <p class="sub">${D.documents.filter(d => d.html).length} narrative work products rendered in
       this page; the rest open in the repository.</p>`;
  for (const folder of Object.keys(byFolder).sort()) {
    h += `<div class="card"><h3>${esc(folder)}</h3><div class="doclist">` +
      byFolder[folder].map(d => docLink(d.path)).join('') + `</div></div>`;
  }
  return h;
}

/* ---- findings the agents raised, and jobs the human wrote ---- */
function opsFor(target) {
  return D.openPoints.filter(o => o.targets.includes(target));
}
function jobsFor(target) {
  return D.jobs.filter(j => j.target === target);
}

function flagsFor(target) {
  const ops = opsFor(target), js = jobsFor(target);
  if (!ops.length && !js.length) return '';
  let h = '<div class="flags">';
  for (const o of ops) {
    h += `<div class="flag${o.done ? ' done' : ''}">
            <span class="fa">${esc(o.owner)}</span>
            <span class="fid">${esc(o.id)}</span>${o.html}
            ${o.done ? '' : ` &middot; <button class="link"
              onclick="openTaskPanel('${esc(o.id)}')">make a job from this</button>`}
          </div>`;
  }
  for (const j of js) {
    h += `<div class="jrow"><span class="fa">${esc(j.status)}</span>
            <span class="fid"><a href="#job/${encodeURIComponent(j.id)}">${esc(j.id)}</a></span>${esc(j.task.split('\n')[0])}
          </div>`;
  }
  return h + '</div>';
}

// Nothing here writes: the plan is reviewed in an editor and approved in the CLI.
function nextStep(j) {
  const cmd = c => `<code>python3 tools/jobs.py ${c} ${esc(j.id)}</code>`;
  if (j.status === 'open') return 'No plan yet &mdash; ' + cmd('plan');
  if (j.status === 'planned') return 'Read and edit the plan in ' +
    `<a href="../../${j.file}">${esc(j.file)}</a>, then ` + cmd('approve');
  if (j.status === 'approved') return 'Approved &mdash; ' + cmd('run');
  if (j.status === 'failed') return 'Failed &mdash; inspect, then ' + cmd('run');
  return j.branch ? `Ran on branch <code>${esc(j.branch)}</code>` : '';
}

function jobById(id) { return D.jobs.find(j => j.id === id); }

function viewJob(id) {
  const j = jobById(id);
  if (!j) return `<p class="none">Unknown job ${esc(id)}.</p>`;
  const meta = [
    j.target ? esc(j.target) : 'no target',
    esc(j.agent || 'default agent'),
    j.planned_at ? 'planned ' + esc(j.planned_at) : '',
    j.approved_at ? 'approved ' + esc(j.approved_at) : '',
    j.branch ? 'branch ' + esc(j.branch) : '',
  ].filter(Boolean).join(' &middot; ');
  return `<h2 class="title">${esc(j.id)} &middot; ${esc(j.status)}</h2>
    <p class="sub">${meta}</p>
    ${j.relates_to && j.relates_to.length
      ? `<p class="sub">Relates to ${j.relates_to.map(r => esc(r)).join(', ')}</p>` : ''}
    <div class="banner" style="border-color:var(--line);color:inherit">${nextStep(j)}</div>
    <div class="card"><h3>Task</h3><div class="body doc">${j.task_html}</div></div>
    ${j.context_html ? `<div class="card"><h3>Context captured when it was written</h3>
       <div class="body doc">${j.context_html}</div></div>` : ''}
    ${j.plan_html ? `<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.6px;
         color:var(--muted);margin:20px 0 8px">Plan${j.approved_at
         ? ' &middot; approved ' + esc(j.approved_at) : ' &middot; not approved yet'}</h3>
       <div class="body doc">${j.plan_html}</div>` : ''}
    ${j.result_html ? `<div class="card"><h3>Result</h3>
       <div class="body doc">${j.result_html}</div></div>` : ''}
    <p class="foot">The record is the source, not this page:
       <a href="../../${j.file}">${esc(j.file)}</a></p>`;
}

function viewJobs() {
  let h = `<h2 class="title">Jobs</h2>
    <p class="sub">Tasks you wrote for an agent. Nothing runs before a plan has been written,
       read and approved: <code>plan</code> &rarr; <code>approve</code> &rarr; <code>run</code>.
       Open points are the other direction &mdash; those are written by the agents, and appear
       on the element they concern.</p>`;
  if (!D.jobs.length) {
    return h + `<div class="banner">No jobs yet. Press <strong>t</strong> while looking at any
            record, document or diagram to write one.</div>`;
  }
  const rows = D.jobs.map(j => `<tr>
      <td class="id"><a href="#job/${encodeURIComponent(j.id)}">${esc(j.id)}</a></td>
      <td><span class="pill">${esc(j.status)}</span></td>
      <td>${esc(j.target || '-')}</td>
      <td>${esc(j.agent || 'default')}</td>
      <td class="txt">${esc(j.task.split('\n')[0])}</td>
      <td>${nextStep(j)}</td>
    </tr>`).join('');
  return h + `<div class="tw"><table><thead><tr>
      <th>ID</th><th>Status</th><th>Target</th><th>Agent</th><th>Task</th><th>Next</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---- capture panel ---- */
const P = { target: '', kind: 'general' };

function currentTarget() {
  const h = location.hash;
  if (h.startsWith('#r/')) return [decodeURIComponent(h.slice(3)), 'record'];
  if (h.startsWith('#doc/')) return [decodeURIComponent(h.slice(5)), 'document'];
  if (h.startsWith('#d/')) return [decodeURIComponent(h.slice(3)), 'diagram'];
  if (h.startsWith('#a/')) return [decodeURIComponent(h.slice(3)), 'area'];
  if (h.startsWith('#m/')) return [decodeURIComponent(h.slice(3)), 'general'];
  return ['', 'general'];
}

function targetContext(target, kind) {
  if (kind === 'record' && items[target]) {
    const r = items[target];
    return `${r.id} (${r.type}, ASIL ${r.asil || '-'}, ${r.status}) in ${r.file}\n` +
           `Text: ${r.text}\n` +
           `Derived from: ${r.up.join(', ') || '-'} | Refined by: ${r.down.join(', ') || '-'}`;
  }
  if (kind === 'document') return `Document ${target}`;
  if (kind === 'diagram') {
    const d = D.diagrams.find(x => x.name === target);
    return d ? `Model view ${d.title} (${d.file})` : `Model view ${target}`;
  }
  if (kind === 'area') {
    const a = D.areas.find(x => x.id === target);
    return a ? `Process area ${a.id} - ${a.name}` : `Process area ${target}`;
  }
  return '';
}

function openTaskPanel(relates) {
  const [target, kind] = currentTarget();
  P.target = target; P.kind = kind;
  document.getElementById('pTarget').textContent =
    target ? `${target}  (${kind})` : 'the project in general';
  document.getElementById('pRelates').value = relates || '';
  if (relates) {
    const op = D.openPoints.find(o => o.id === relates);
    if (op && !document.getElementById('pPrompt').value.trim()) {
      document.getElementById('pPrompt').value = `Address ${op.id}: ${op.text}\n\n`;
    }
  }
  document.getElementById('pSaid').className = 'said';
  document.getElementById('panel').classList.add('open');
  document.getElementById('panel').setAttribute('aria-hidden', 'false');
  document.getElementById('pPrompt').focus();
}

function closeTaskPanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panel').setAttribute('aria-hidden', 'true');
}

function jobPayload() {
  const relates = document.getElementById('pRelates').value.trim();
  return {
    target: P.target,
    target_kind: P.kind,
    agent: document.getElementById('pAgent').value,
    prompt: document.getElementById('pPrompt').value.trim(),
    context: targetContext(P.target, P.kind),
    relates_to: relates ? relates.split(/[,\s]+/).filter(Boolean) : []
  };
}

function jobFileText(j, id) {
  return ['---', 'id: ' + (id || 'JOB-xxx'),
    'created: ' + new Date().toISOString().replace(/\.\d+Z$/, '+00:00'),
    'status: open', 'target: ' + (j.target || '""'),
    'target_kind: ' + j.target_kind, 'agent: ' + (j.agent || '""'),
    'relates_to: [' + j.relates_to.join(', ') + ']', 'branch: ""', 'result: ""',
    '---', '', '## Task', '', j.prompt, '',
    ...(j.context ? ['## Context', '', j.context, ''] : [])].join('\n');
}

function said(kind, msg) {
  const el = document.getElementById('pSaid');
  el.className = 'said ' + kind;
  el.textContent = msg;
}

// Same-origin first, then the loopback server by absolute address. The second candidate
// is what makes Save work when the page was opened from disk: the server allows the
// "null" origin of a file:// page, and the request is deliberately a simple one
// (text/plain, no preflight) so the browser does not block it.
function apiCandidates() {
  const abs = 'http://127.0.0.1:' + D.jobsPort + '/api/jobs';
  return location.protocol.startsWith('http') ? ['/api/jobs', abs] : [abs];
}

async function submitJob() {
  const j = jobPayload();
  if (!j.prompt) { said('bad', 'Write the task first.'); return; }
  for (const url of apiCandidates()) {
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },   // simple request: no preflight
        body: JSON.stringify(j)
      });
    } catch (e) {
      continue;   // not reachable at this address; try the next one
    }
    let out = null;
    try { out = await res.json(); } catch (e) { /* not our server */ }
    // Only a reply that is recognisably ours ends the search. A plain file server
    // answering 501 to a POST is not a rejection of the job, it is the wrong address --
    // treating its status as final stopped the fallback before it ever ran.
    if (out && out.id) {
      said('ok', `Saved as ${out.id}. Run it with: python3 tools/jobs.py run ${out.id}`);
      document.getElementById('pPrompt').value = '';
      return;
    }
    if (out && out.error) { said('bad', out.error); return; }
  }
  said('bad', 'No companion server reachable. Start it with:  python3 tools/jobs.py serve  '
            + '- or use Copy / Download and put the file in ' + D.jobsPath + '/.');
}

function viewSearch() {
  const total = Object.keys(items).length;
  const n = Object.keys(items).filter(id => matches(items[id])).length;
  return `<h2 class="title">Search results</h2>
    <p class="sub">${n} of ${total} records match &ldquo;${esc(F.q)}&rdquo;
       &middot; <button class="link" onclick="clearSearch()">clear the search</button></p>` +
    table(Object.keys(items));
}
function clearSearch() {
  F.q = '';
  document.getElementById('q').value = '';
  showSearch = false;
  render();
}

// Which of the two wins: typing in the search box shows results, following a link
// shows that record or diagram. Without this, clicking a search result appears to do
// nothing, because the results view would keep overriding it.
let showSearch = false;

function render() {
  const h = location.hash;
  let out;
  if (h.startsWith('#v/')) {
    const g = h.slice(3);
    if (g === 'aspice' || g === 'iso') grouping = g;
  } else if (h.startsWith('#m/')) {
    grouping = 'folder';
  } else if (h.startsWith('#a/')) {
    // Keep the sidebar on the framework the opened area belongs to.
    const a = D.areas.find(x => x.id === decodeURIComponent(h.slice(3)));
    if (a) grouping = a.framework === 'ISO' ? 'iso' : 'aspice';
  }
  if (F.q && showSearch) out = viewSearch();
  else if (h.startsWith('#doc/')) out = viewDocument(decodeURIComponent(h.slice(5)));
  else if (h === '#docs') out = viewDocs();
  else if (h.startsWith('#job/')) out = viewJob(decodeURIComponent(h.slice(5)));
  else if (h === '#jobs') out = viewJobs();
  else if (h.startsWith('#a/')) out = viewArea(decodeURIComponent(h.slice(3)));
  else if (h.startsWith('#r/')) out = viewRecord(decodeURIComponent(h.slice(3)));
  else if (h.startsWith('#d/')) out = viewDiagram(decodeURIComponent(h.slice(3)));
  else if (h.startsWith('#m/')) out = viewModule(decodeURIComponent(h.slice(3)));
  else if (h === '#all') out = `<h2 class="title">All records</h2>
      <p class="sub">${Object.keys(items).length} records across ${mods.length} modules</p>` +
      table(Object.keys(items));
  else out = viewVModel();
  document.getElementById('content').innerHTML = out;
  document.getElementById('content').scrollTop = 0;
  document.querySelectorAll('th[data-c]').forEach(th => th.onclick = () => {
    const c = th.dataset.c;
    if (sortCol === c) sortAsc = !sortAsc; else { sortCol = c; sortAsc = true; }
    render();
  });
  renderNav();
}

document.getElementById('stats').innerHTML =
  Object.entries(D.stats).map(([k, v]) => `${esc(k)}: <strong>${esc(v)}</strong>`).join(' &middot; ') +
  ` &middot; ${D.ndiagrams} model views &middot; <a href="#v/aspice">V-model</a>
    &middot; <a href="#docs">documents</a> &middot; <a href="#jobs">jobs (${D.jobs.length})</a>
    &middot; <a href="#all">all records</a>`;

document.getElementById('q').oninput = e => {
  F.q = e.target.value.toLowerCase();
  showSearch = true;
  render();
};
for (const [sel, key] of [['fKind','kind'],['fAsil','asil'],['fStatus','status']]) {
  document.getElementById(sel).onchange = e => { F[key] = e.target.value; render(); };
}
document.getElementById('pAgent').innerHTML =
  '<option value="">default agent</option>' +
  D.agents.map(a => `<option value="${esc(a.name)}" title="${esc(a.description)}">${esc(a.name)}</option>`).join('');
document.getElementById('pHint').textContent =
  'Save needs "python3 tools/jobs.py serve" running on port ' + D.jobsPort +
  '; it then writes the job into ' + D.jobsPath + '/ even if you opened this file ' +
  'directly. Without the server, use Copy or Download.';
document.getElementById('newTask').onclick = () => openTaskPanel('');
document.getElementById('pClose').onclick = closeTaskPanel;
document.getElementById('pSave').onclick = submitJob;
document.getElementById('pCopy').onclick = () => {
  const j = jobPayload();
  if (!j.prompt) { said('bad', 'Write the task first.'); return; }
  navigator.clipboard.writeText(jobFileText(j)).then(
    () => said('ok', 'Copied. Save it under ' + D.jobsPath +
                       '/, then run: python3 tools/jobs.py adopt'),
    () => said('bad', 'The browser refused clipboard access; use Download.'));
};
document.getElementById('pDownload').onclick = () => {
  const j = jobPayload();
  if (!j.prompt) { said('bad', 'Write the task first.'); return; }
  const blob = new Blob([jobFileText(j)], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'JOB-xxx.md';
  a.click();
  URL.revokeObjectURL(a.href);
  said('ok', 'Downloaded. Move it into ' + D.jobsPath +
                   '/, then run: python3 tools/jobs.py adopt');
};
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    if (e.key === 'Escape') closeTaskPanel();
    return;
  }
  if (e.key === 't') { e.preventDefault(); openTaskPanel(''); }
  if (e.key === 'Escape') closeTaskPanel();
});

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSearch();
});
window.addEventListener('hashchange', () => { showSearch = false; render(); });
render();
</script>
</body>
