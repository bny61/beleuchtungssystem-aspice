-&gt;<\/p><p><strong>Affected IDs:<\/strong><br><strong>Reference (issue / CR / problem report):<\/strong><\/p><h4>Classification<\/h4><ul><li>[ ] safety-relevant (ASIL B) — CODEOWNERS approval by the safety manager required<\/li><li>[ ] QM-relevant<\/li><li>[ ] process/infrastructure change only<\/li><\/ul><h4>Review checklist<\/h4><h5>Requirements<\/h5><ul><li>[ ] EARS-compliant, unambiguous, verifiable, atomic<\/li><li>[ ] <code>derived_from<\/code> set and correct<\/li><li>[ ] <code>allocated_to<\/code> set (mandatory for ASIL other than QM)<\/li><li>[ ] <code>verified_by<\/code> set (mandatory from status <code>reviewed<\/code> onward)<\/li><li>[ ] ID scheme observed, no ID silently changed<\/li><\/ul><h5>Consistency<\/h5><ul><li>[ ] Values consistent with already published phases (ASIL, FTTI, thresholds, DC)<\/li><li>[ ] Model views (<code>03_model/plantuml/<\/code>) updated to match the change<\/li><li>[ ] Safety analyses (FMEA / FTA / FMEDA / DFA) checked for impact<\/li><li>[ ] Assumptions recorded as <code>A-xx<\/code> in <code>09_process/assumptions.md<\/code><\/li><\/ul><h5>Evidence<\/h5><ul><li>[ ] Traceability check green (<code>tools/trace_check.py<\/code>)<\/li><li>[ ] Requirement overviews up to date (<code>tools/gen_index.py --check<\/code>)<\/li><li>[ ] Affected test cases identified or added<\/li><li>[ ] No invented standard citations, no verbatim normative text<\/li><li>[ ] Numeric values marked as plausible example values<\/li><\/ul><h4>Impact analysis (when changing released artefacts)<\/h4><p>&lt;!-- Affected baseline (tag), affected downstream artefacts, regression scope --&gt;<\/p><h4>Reviewers<\/h4><ul><li>Technical review: @<\/li><li>Safety review (where ASIL-relevant, independent of the author): @<\/li><\/ul><blockquote>The author must not approve their own work product (ISO 26262-2, confirmation measures).<\/blockquote>"},{"path":"02_safety/01_item_definition/item_definition.md","title":"Item Definition","folder":"02_safety/01_item_definition","exists":true,"html":"<p><strong>Item:<\/strong> Adaptive front-lighting system incl. work-lamp control<br><strong>Vehicle:<\/strong> Heavy truck, class N3, 18 t tractor unit<br><strong>Standard:<\/strong> ISO 26262-3 (Item Definition)<br><strong>Status:<\/strong> Phase 2, draft<br><strong>Owner:<\/strong> safety-manager<\/p><blockquote>Teaching/reference project, not a production baseline. Numeric values are plausible example values.<\/blockquote><hr><h4>1 Purpose and functions<\/h4><p>The item provides the forward lighting and the work-lamp control:<\/p><div class='tw'><table><thead><tr><th>Function<\/th><th>Short description<\/th><\/tr><\/thead><tbody><tr><td>Low beam<\/td><td>Basic illumination of the carriageway, implemented across several channels<\/td><\/tr><tr><td>High beam<\/td><td>Long-range illumination, segment-wise maskable for glare-free operation<\/td><\/tr><tr><td>Daytime running lights<\/td><td>Conspicuity in daylight<\/td><\/tr><tr><td>Cornering light<\/td><td>Swivelling as a function of steering angle and speed<\/td><\/tr><tr><td>Headlamp levelling<\/td><td>Load-dependent inclination correction<\/td><\/tr><tr><td>Work lamps<\/td><td>Illumination at standstill and while manoeuvring<\/td><\/tr><tr><td>Diagnostics<\/td><td>Fault detection, DTC management, UDS access<\/td><\/tr><\/tbody><\/table><\/div><h4>2 Item boundary<\/h4><h5>Inside the item boundary<\/h5><div class='tw'><table><thead><tr><th>Element<\/th><th>Role<\/th><\/tr><\/thead><tbody><tr><td><code>ECU_LightingCtrl<\/code><\/td><td>Lighting ECU, control and monitoring of all lighting functions<\/td><\/tr><tr><td><code>LED_Driver_Stage_1..n<\/code><\/td><td>LED driver stages of the individual channels<\/td><\/tr><tr><td>Current and temperature sensing<\/td><td>Feedback for diagnostics and derating<\/td><\/tr><tr><td>Headlamp modules<\/td><td>Low beam, high beam and cornering light<\/td><\/tr><tr><td>Work-lamp output stages<\/td><td>Control of the work lamps<\/td><\/tr><\/tbody><\/table><\/div><h5>Outside the item boundary (interfaces)<\/h5><div class='tw'><table><thead><tr><th>Element<\/th><th>Relationship<\/th><th>Assumption<\/th><\/tr><\/thead><tbody><tr><td>Vehicle supply 24 V<\/td><td>Supply KL30 / KL15, 16–32 V<\/td><td><code>A-01<\/code><\/td><\/tr><tr><td>Vehicle gateway (CAN FD / J1939)<\/td><td>Light request, speed, steering angle, status feedback<\/td><td><code>A-02<\/code><\/td><\/tr><tr><td>Environment sensing (object detection)<\/td><td>Object list for the glare-free high beam<\/td><td><code>A-05<\/code><\/td><\/tr><tr><td>Light switch, ignition<\/td><td>As bus signals, no direct wiring<\/td><td><code>A-06<\/code><\/td><\/tr><tr><td>Instrument cluster<\/td><td>Display of the driver warning<\/td><td><code>A-04<\/code><\/td><\/tr><tr><td>Diagnostic tester (workshop)<\/td><td>UDS per ISO 14229<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><h5>Explicitly out of scope<\/h5><p>Rear lighting · interior lighting · indicators and hazard warning lights · fog lamps ·<br>body-builder lighting behind the body interface.<\/p><blockquote>The exclusions are listed explicitly on purpose. A tacit delimitation is a finding in an assessment, not a simplification.<\/blockquote><h4>3 Context diagram<\/h4><p>Source: <a href=\"../../03_model/plantuml/ctx_item.puml\"><code>../../03_model/plantuml/ctx_item.puml<\/code><\/a><\/p><p>The yellow block is the item boundary — only what lies inside it is developed in this project.<br>Grey blocks are external systems. Every edge crossing the boundary is an interface to be specified<br>in phase 3 with signal, direction, type, value range, timing and ASIL.<\/p><blockquote>The diagram has <strong>not<\/strong> been syntax-checked so far (PlantUML not installed locally, <code>OP-12<\/code>). In CI this is done by the <code>Modell-Syntaxpruefung<\/code> job.<\/blockquote><h4>4 Operating modes<\/h4><div class='tw'><table><thead><tr><th>Mode<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Init<\/td><td>Self-test after ignition on<\/td><\/tr><tr><td>Normal operation<\/td><td>All lighting functions available<\/td><\/tr><tr><td>Degraded<\/td><td>Partial failure detected, remaining channels active<\/td><\/tr><tr><td>Safe state (limp-home)<\/td><td>Reduced power, driver warning active, DTC stored<\/td><\/tr><tr><td>Sleep<\/td><td>Ignition off, quiescent-current operation after the run-on time<\/td><\/tr><\/tbody><\/table><\/div><h4>5 Dependencies on other items<\/h4><div class='tw'><table><thead><tr><th>Dependency<\/th><th>Safety impact<\/th><\/tr><\/thead><tbody><tr><td>Object detection (vehicle level)<\/td><td>Part of the effect chain of <code>SG-02<\/code>; requires an interface agreement (DIA) — <code>OP-10<\/code><\/td><\/tr><tr><td>Vehicle supply<\/td><td>Supply quality affects all lighting functions; a common cause of failure, to be considered in the DFA<\/td><\/tr><tr><td>Instrument cluster<\/td><td>Carries the driver warning from <code>FSR-004<\/code> and thereby the C rating of H-01<\/td><\/tr><\/tbody><\/table><\/div><h4>6 Further reading<\/h4><ul><li>Hazard analysis: <a href=\"#doc/02_safety/02_hara/hara.md\"><code>../02_hara/hara.md<\/code><\/a><\/li><li>Safety goals and FSC: <a href=\"../../02_safety/03_fsc\"><code>../03_fsc/<\/code><\/a><\/li><li>Assumptions: <a href=\"#doc/09_process/assumptions.md\"><code>../../09_process/assumptions.md<\/code><\/a><\/li><\/ul><p><strong>Process reference:<\/strong> ISO 26262 <strong>Part 3<\/strong> (Item Definition) · ASPICE <strong>SYS.1<\/strong> (system context).<\/p>"},{"path":"02_safety/02_hara/hara.md","title":"Hazard Analysis and Risk Assessment (HARA)","folder":"02_safety/02_hara","exists":true,"html":"<p><strong>Item:<\/strong> Adaptive front-lighting system incl. work-lamp control<br><strong>Vehicle:<\/strong> Heavy truck, class N3, 18 t tractor unit<br><strong>Standard:<\/strong> ISO 26262-3 (Hazard Analysis and Risk Assessment)<br><strong>Status:<\/strong> Phase 2, draft — not confirmed by a confirmation review<br><strong>Owner:<\/strong> safety-manager<\/p><blockquote><strong>Not a production baseline.<\/strong> All ratings and numeric values are plausible example values of a teaching/reference project, not validated data and no substitute for a real HARA.<\/blockquote><hr><h4>1 Method<\/h4><ol><li><strong>Define the item boundary<\/strong> — see <a href=\"#doc/02_safety/01_item_definition/item_definition.md\"><code>../01_item_definition/item_definition.md<\/code><\/a>.<\/li><li><strong>Build operational situations<\/strong> as the cross product of driving situation x operating mode x environment, then reduce to the relevant combinations — see <a href=\"#doc/02_safety/02_hara/operational_situations.md\"><code>operational_situations.md<\/code><\/a>.<\/li><li><strong>Derive malfunctioning behaviour systematically<\/strong> per function using the fault classes <em>loss of function · unintended activation · incorrect value · too early / too late · stuck<\/em>.<\/li><li><strong>State the hazard at vehicle level<\/strong> (the effect in traffic, not the component fault).<\/li><li><strong>Rate S/E/C<\/strong> with a written rationale per rating — see <a href=\"#doc/02_safety/02_hara/sec_classification.md\"><code>sec_classification.md<\/code><\/a>.<\/li><li><strong>Determine the ASIL<\/strong> from the combination per the determination table of ISO 26262-3.<\/li><li><strong>Derive safety goals<\/strong>, merging hazards with identical goal wording and carrying the highest ASIL.<\/li><\/ol><hr><h4>2 Hazard table<\/h4><div class='tw'><table><thead><tr><th>ID<\/th><th>OS<\/th><th>Malfunctioning behaviour<\/th><th>Hazard at vehicle level<\/th><th>S<\/th><th>E<\/th><th>C<\/th><th><strong>ASIL<\/strong><\/th><th>Safety goal<\/th><\/tr><\/thead><tbody><tr><td><strong>H-01<\/strong><\/td><td>BS-01<\/td><td>Failure of the low beam (both channels)<\/td><td>Carriageway unlit at 80 km/h, running off the road or colliding with an unlit obstacle<\/td><td>3<\/td><td>3<\/td><td>2<\/td><td><strong>B<\/strong><\/td><td>SG-01<\/td><\/tr><tr><td><strong>H-02<\/strong><\/td><td>BS-02<\/td><td>High beam stays active with oncoming traffic<\/td><td>Glare to the oncoming driver, head-on collision<\/td><td>3<\/td><td>2<\/td><td>2<\/td><td><strong>A<\/strong><\/td><td>SG-02<\/td><\/tr><tr><td><strong>H-03<\/strong><\/td><td>BS-01<\/td><td>Work lamps unintentionally active while driving<\/td><td>Glare to oncoming and following traffic<\/td><td>3<\/td><td>2<\/td><td>2<\/td><td><strong>A<\/strong><\/td><td>SG-02<\/td><\/tr><tr><td><strong>H-04<\/strong><\/td><td>BS-03<\/td><td>Unintended deactivation of the low beam<\/td><td>As H-01, additionally unexpected for the driver<\/td><td>3<\/td><td>3<\/td><td>2<\/td><td><strong>B<\/strong><\/td><td>SG-01<\/td><\/tr><tr><td><strong>H-05<\/strong><\/td><td>BS-01<\/td><td>Headlamp levelling permanently too high<\/td><td>Sustained glare to oncoming traffic<\/td><td>2<\/td><td>3<\/td><td>2<\/td><td><strong>A<\/strong><\/td><td>SG-02<\/td><\/tr><tr><td><strong>H-06<\/strong><\/td><td>BS-06<\/td><td>Failure of the daytime running lights<\/td><td>Reduced conspicuity of the vehicle in good visibility<\/td><td>1<\/td><td>3<\/td><td>1<\/td><td><strong>QM<\/strong><\/td><td>—<\/td><\/tr><tr><td><strong>H-07<\/strong><\/td><td>BS-05<\/td><td>Cornering light swivels into the oncoming lane<\/td><td>Glare to oncoming traffic, unexpected and not correctable by the affected driver<\/td><td>2<\/td><td>2<\/td><td>3<\/td><td><strong>A<\/strong><\/td><td>SG-02<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Result:<\/strong> 7 hazards, 6 of them leading to a safety goal and one (H-06) resulting in QM.<br>Highest resulting ASIL: <strong>B<\/strong> (H-01, H-04) — ASIL B is therefore the target ASIL of the project.<\/p><blockquote><strong>Machine-readable form:<\/strong> every row of this table also exists as a record <code>H-01.md<\/code> … <code>H-07.md<\/code> in this folder (overview: <a href=\"../../02_safety/02_hara/README.md\"><code>README.md<\/code><\/a>). The safety goals reference them via <code>derived_from: [H-xx]<\/code>; <code>tools/trace_check.py<\/code> reports any hazard with an ASIL other than QM that has no safety goal (<code>hazard-uncovered<\/code>).  <strong>Deliberate redundancy:<\/strong> the values appear both in this table and in the front matter of the records. When changing either, update <strong>both<\/strong> — the check does not detect a divergence between table and record.<\/blockquote><hr><h4>3 Rationale for the ratings<\/h4><h5>H-01 — Failure of the low beam (design-driving case)<\/h5><div class='tw'><table><thead><tr><th><\/th><th>Rating<\/th><th>Rationale<\/th><\/tr><\/thead><tbody><tr><td><strong>S<\/strong><\/td><td><strong>S3<\/strong><\/td><td>Complete loss of carriageway illumination at 80 km/h on an unlit rural road. Running off the road or colliding with an unlit obstacle at 18 t gross mass is highly likely to cause life-threatening or fatal injuries, including to uninvolved third parties.<\/td><\/tr><tr><td><strong>E<\/strong><\/td><td><strong>E3<\/strong><\/td><td>Night driving on unlit rural roads occurs regularly in N3 long-haul operation, but not predominantly. Under usage profile <code>A-07<\/code> the share is in the range of a few percent of operating time — medium probability.<\/td><\/tr><tr><td><strong>C<\/strong><\/td><td><strong>C2<\/strong><\/td><td>The driver notices the failure immediately (the carriageway goes dark) and can decelerate in a controlled manner; residual light from position lamps/daytime running lights and ambient light remains. A safe stop succeeds for the majority of drivers, but not practically all — hence C2 and not C1.<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Borderline discussion (deliberately disclosed, tracked as <code>RISK-01<\/code>):<\/strong><br>With <strong>E4<\/strong> instead of E3 the determination table would yield <strong>ASIL C<\/strong> instead of B. E3 was chosen<br>because the hazard is bound to the combination <em>night + unlit + rural-road speed<\/em>, not to night<br>driving in general. This is the most sensitive single decision of the entire HARA — it determines<br>the target ASIL of the project and thereby the target values for SPFM, LFM and PMHF, the required<br>independence and the structural coverage in software. It must be explicitly confirmed in the<br>confirmation review of SG-01.<\/p><h5>H-02 and H-03 — Glare from high beam or work lamps<\/h5><div class='tw'><table><thead><tr><th><\/th><th>Rating<\/th><th>Rationale<\/th><\/tr><\/thead><tbody><tr><td><strong>S<\/strong><\/td><td>S3<\/td><td>Glare to oncoming traffic can cause a head-on collision; with an 18 t combination involved, fatal injuries are likely.<\/td><\/tr><tr><td><strong>E<\/strong><\/td><td>E2<\/td><td>The hazard requires night, oncoming traffic and a fault to coincide — low exposure.<\/td><\/tr><tr><td><strong>C<\/strong><\/td><td>C2<\/td><td>The dazzled driver can typically respond by decelerating and holding the lane; the glare is brief and recognised as such.<\/td><\/tr><\/tbody><\/table><\/div><h5>H-04 — Unintended deactivation<\/h5><p>The effect is identical to H-01, hence the same rating <strong>S3/E3/C2<\/strong>. The difference is the fault<br>class: H-01 is a failure, H-04 an unintended deactivation. Both lead to <strong>SG-01<\/strong> but are addressed<br>by different safety requirements (<code>FSR-001<\/code> versus <code>FSR-002<\/code>).<\/p><h5>H-05 — Headlamp levelling too high<\/h5><p><strong>S2<\/strong> — the glare builds up less abruptly than in H-02, leaving oncoming traffic reaction time;<br>severe but survivable injuries are the more likely outcome.<br><strong>E3<\/strong> — affects essentially every night drive with oncoming traffic.<br><strong>C2<\/strong> — controllable by decelerating.<\/p><h5>H-06 — Failure of the daytime running lights (result QM)<\/h5><p><strong>S1<\/strong> — an 18 t vehicle remains clearly visible by its silhouette in daylight and good visibility;<br>at most light injuries are to be expected.<br><strong>E3<\/strong> — daytime driving in good visibility is frequent, though the failure itself is the precondition.<br><strong>C1<\/strong> — the situation is controllable by practically all road users.<\/p><blockquote><strong>Result QM — no safety goal arises.<\/strong> The associated requirement remains legally relevant (ECE R48, daytime running light switching requirement) but is not safety-relevant in the sense of ISO 26262. This case is included deliberately to show that not every hazard leads to a safety goal.<\/blockquote><h5>H-07 — Cornering light swivels into the oncoming lane<\/h5><p><strong>S2<\/strong> — glare with remaining reaction time, as H-05.<br><strong>E2<\/strong> — requires cornering at night with oncoming traffic and a fault.<br><strong>C3<\/strong> — the misalignment occurs unexpectedly and cannot be corrected by the affected driver<br>himself; he can only decelerate. Therefore difficult to control.<\/p><hr><h4>4 Derived safety goals<\/h4><div class='tw'><table><thead><tr><th>ID<\/th><th>Wording<\/th><th>ASIL<\/th><th>Safe state<\/th><th>FTTI<\/th><th>Fault reaction time<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td><strong>SG-01<\/strong><\/td><td>No undetected failure of the low beam while driving<\/td><td><strong>B<\/strong><\/td><td>Limp-home operation: remaining channels active at reduced power, driver warning active, DTC stored<\/td><td><strong>300 ms<\/strong><\/td><td><strong>150 ms<\/strong><\/td><td>H-01, H-04<\/td><\/tr><tr><td><strong>SG-02<\/strong><\/td><td>No unintended glare to other road users caused by high beam or work lamps<\/td><td><strong>A<\/strong><\/td><td>High beam and work lamps deactivated, low beam remains active<\/td><td>500 ms<\/td><td>250 ms<\/td><td>H-02, H-03, H-05, H-07<\/td><\/tr><\/tbody><\/table><\/div><p>Records: <a href=\"../../02_safety/03_fsc/SG-01.md\"><code>../03_fsc/SG-01.md<\/code><\/a> · <a href=\"../../02_safety/03_fsc/SG-02.md\"><code>../03_fsc/SG-02.md<\/code><\/a><\/p><h5>Rationale for the safe state of SG-01<\/h5><p>&quot;Lights off&quot; would be the wrong safe state — it <em>is<\/em> the hazard. The safe state is therefore<br><em>degraded but visible<\/em>: the intact channel keeps operating (<code>FSR-003<\/code>), the driver is warned<br>(<code>FSR-004<\/code>) and can end the journey in a controlled manner. It is precisely this warning that<br>underpins the C2 rating of H-01. Assumption <strong><code>A-03<\/code><\/strong> (driver response to the warning) is thereby<br>safety-relevant and a validation target at vehicle level, not a side note.<\/p><h5>Timing budget SG-01<\/h5><pre class='code'>Detection       SM-01, PWM-synchronous (HW-REQ-009):\n                2.5 ms sync + 0.1 ms acquisition + 50 ms window\n                + 20 ms debounce + 5 ms task latency           =  80 ms\nFault reaction  transition to limp-home                        = 150 ms   (fault reaction time)\n                                                         Total = 230 ms\nFTTI                                                           = 300 ms\nMargin                                                         =  70 ms   (23 %)<\/pre><blockquote>Updated with the phase 3 refinement of <code>SYS-REQ-014<\/code> (detection 70 ms -&gt; 80 ms). The PWM- synchronous measurement adds synchronisation, acquisition and task latency. See <a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>../../05_hardware/analysis_current_sensing.md<\/code><\/a>.<\/blockquote><p>The budget closes against the values held in <code>SG-01<\/code> and <code>SM-01<\/code>. The 2 s driver warning from<br><code>CR-007<\/code> / <code>FSR-004<\/code> lies <strong>outside<\/strong> this budget: it is an information requirement, not a fault<br>reaction. This separation is binding — otherwise the design is dimensioned against the wrong<br>time limit.<\/p><hr><h4>5 Assumptions used<\/h4><div class='tw'><table><thead><tr><th>ID<\/th><th>Assumption<\/th><th>Safety-relevant<\/th><\/tr><\/thead><tbody><tr><td><code>A-03<\/code><\/td><td>The driver responds to the visual warning within the assumed reaction time<\/td><td>yes — underpins the C rating of H-01<\/td><\/tr><tr><td><code>A-05<\/code><\/td><td>Object detection for the glare-free high beam lies outside the item boundary<\/td><td>yes — part of the SG-02 chain<\/td><\/tr><tr><td><code>A-06<\/code><\/td><td>Light switch position and ignition status arrive as bus signals<\/td><td>yes<\/td><\/tr><tr><td><code>A-07<\/code><\/td><td>Usage profile N3 long-haul with a predominant night share in the winter half-year<\/td><td>yes — basis of the E rating<\/td><\/tr><\/tbody><\/table><\/div><p>Full list: <a href=\"#doc/09_process/assumptions.md\"><code>../../09_process/assumptions.md<\/code><\/a><\/p><hr><h4>6 Open points<\/h4><div class='tw'><table><thead><tr><th>ID<\/th><th>Point<\/th><th>Owner<\/th><\/tr><\/thead><tbody><tr><td>OP-7 / <code>RISK-01<\/code><\/td><td>Confirm the E rating of H-01 (E3 versus E4) in the confirmation review<\/td><td>safety-manager<\/td><\/tr><tr><td>OP-9<\/td><td>Plan <code>A-03<\/code> as a validation target at vehicle level<\/td><td>verification-engineer<\/td><\/tr><tr><td>OP-10<\/td><td>Interface agreement (DIA) for the object detection outside the item boundary<\/td><td>safety-manager<\/td><\/tr><tr><td>OP-13<\/td><td>Role model and independence levels are missing (phase 0 skipped) — a precondition for the confirmation review of this HARA<\/td><td>safety-manager<\/td><\/tr><\/tbody><\/table><\/div><hr><p><strong>Work products:<\/strong> <code>hara.md<\/code>, <code>operational_situations.md<\/code>, <code>sec_classification.md<\/code> → <code>02_safety/02_hara/<\/code><br><strong>Process reference:<\/strong> ISO 26262 <strong>Part 3<\/strong> (Hazard Analysis and Risk Assessment, Safety Goals) ·<br><strong>Part 2<\/strong> (confirmation review of the HARA) · ASPICE <strong>SYS.1/SYS.2<\/strong> as the requirements basis.<\/p>"},{"path":"02_safety/02_hara/operational_situations.md","title":"Operational situations (situation catalogue)","folder":"02_safety/02_hara","exists":true,"html":"<p>Basis of the hazard analysis in <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>. The catalogue is formed as the cross product<br><strong>driving situation x operating mode x environment<\/strong> and then reduced to the combinations relevant<br>to the lighting functions.<\/p><blockquote>Values are plausible example values of a teaching project, not validated usage data. The usage profile is based on assumption <code>A-07<\/code>.<\/blockquote><h4>1 Dimensions<\/h4><div class='tw'><table><thead><tr><th>Dimension<\/th><th>Values<\/th><\/tr><\/thead><tbody><tr><td><strong>Driving situation<\/strong><\/td><td>standstill · manoeuvring (&lt; 10 km/h) · urban (50 km/h) · rural road (80 km/h) · motorway (85 km/h)<\/td><\/tr><tr><td><strong>Operating mode<\/strong><\/td><td>daytime running lights · low beam · high beam · cornering light · work lamps · limp-home<\/td><\/tr><tr><td><strong>Environment<\/strong><\/td><td>day / dusk / night · lit / unlit · dry / rain / fog · oncoming traffic yes / no<\/td><\/tr><\/tbody><\/table><\/div><p>The full cross product spans several hundred combinations. It was reduced by two criteria:<br>(1) the combination is technically possible, (2) it is relevant to at least one lighting function.<br>Combinations without hazard potential (e.g. standstill with daytime running lights in daylight) are<br>deliberately not carried.<\/p><h4>2 Relevant operational situations<\/h4><div class='tw'><table><thead><tr><th>ID<\/th><th>Driving situation<\/th><th>Operating mode<\/th><th>Environment<\/th><th>Used in<\/th><\/tr><\/thead><tbody><tr><td><strong>BS-01<\/strong><\/td><td>Rural road, 80 km/h<\/td><td>Low beam active<\/td><td>Night, unlit, dry<\/td><td>H-01, H-03, H-05<\/td><\/tr><tr><td><strong>BS-02<\/strong><\/td><td>Rural road, 80 km/h<\/td><td>High beam active<\/td><td>Night, oncoming traffic<\/td><td>H-02<\/td><\/tr><tr><td><strong>BS-03<\/strong><\/td><td>Motorway, 85 km/h<\/td><td>Low beam active<\/td><td>Night, rain<\/td><td>H-04<\/td><\/tr><tr><td><strong>BS-04<\/strong><\/td><td>Construction site / yard, &lt; 10 km/h<\/td><td>Work lamps active<\/td><td>Night<\/td><td>— (intended use)<\/td><\/tr><tr><td><strong>BS-05<\/strong><\/td><td>Urban traffic, 50 km/h<\/td><td>Low beam + cornering light<\/td><td>Night, lit<\/td><td>H-07<\/td><\/tr><tr><td><strong>BS-06<\/strong><\/td><td>Rural road, 80 km/h<\/td><td>Daytime running lights active<\/td><td>Day, good visibility<\/td><td>H-06<\/td><\/tr><tr><td><strong>BS-07<\/strong><\/td><td>Standstill, ignition on<\/td><td>Work lamps active<\/td><td>Night, loading point<\/td><td>— (intended use)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>BS-04<\/strong> and <strong>BS-07<\/strong> lead to no hazard because work-lamp operation is intended there. They remain<br>in the catalogue because they justify the delimitation against H-03: only the combination of <em>work<br>lamps active<\/em> with <em>driving operation<\/em> is hazardous, not the operating mode as such. It is exactly<br>this distinction that <code>FSR-008<\/code> implements via the speed threshold.<\/p><h4>3 Usage profile (basis of the E rating)<\/h4><div class='tw'><table><thead><tr><th>Situation<\/th><th>Estimated share of operating time<\/th><th>Rating<\/th><\/tr><\/thead><tbody><tr><td>Night driving overall<\/td><td>approx. 25 %<\/td><td>—<\/td><\/tr><tr><td>Of which night driving on unlit rural roads (BS-01)<\/td><td>a few percent<\/td><td><strong>E3<\/strong><\/td><\/tr><tr><td>Night driving with oncoming traffic and high beam active (BS-02)<\/td><td>low<\/td><td><strong>E2<\/strong><\/td><\/tr><tr><td>Daytime driving in good visibility (BS-06)<\/td><td>predominant<\/td><td><strong>E3<\/strong> in the context of H-06<\/td><\/tr><\/tbody><\/table><\/div><blockquote>Assigning <em>unlit rural road at night<\/em> to <strong>E3<\/strong> rather than E4 is the critical decision of the HARA and is tracked as <code>RISK-01<\/code>. Confirmation through real OEM usage data is outstanding (<code>A-07<\/code>).<\/blockquote>"},{"path":"02_safety/02_hara/sec_classification.md","title":"S/E/C classification — interpretation applied in this project","folder":"02_safety/02_hara","exists":true,"html":"<p>Supplement to <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>. Documents <strong>how<\/strong> the classes were interpreted in this project<br>so that the ratings are traceable in the confirmation review.<\/p><blockquote><strong>Not a standard extract.<\/strong> The classes S0–S3, E0–E4 and C0–C3 and the determination table are defined in ISO 26262-3. What follows is exclusively the project-specific interpretation in our own words — no normative text, no reproduced determination table.<\/blockquote><h4>1 Severity — severity of harm<\/h4><div class='tw'><table><thead><tr><th>Class<\/th><th>Interpretation in this project<\/th><th>Example from this HARA<\/th><\/tr><\/thead><tbody><tr><td>S0<\/td><td>No injuries expected<\/td><td>Damage to the lamp unit without a driving situation<\/td><\/tr><tr><td>S1<\/td><td>Light injuries, normally healing without consequences<\/td><td>H-06: reduced conspicuity in daylight<\/td><\/tr><tr><td>S2<\/td><td>Severe injuries, survival probable<\/td><td>H-05, H-07: glare with remaining reaction time<\/td><\/tr><tr><td>S3<\/td><td>Life-threatening or fatal injuries<\/td><td>H-01, H-02, H-03: unlit carriageway or abrupt glare at 80 km/h<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Project rule:<\/strong> where an 18 t combination is involved, harm to third parties is considered, not<br>only to the vehicle occupants. For collision scenarios this systematically leads to S3.<\/p><h4>2 Exposure — probability of the operational situation<\/h4><div class='tw'><table><thead><tr><th>Class<\/th><th>Interpretation in this project<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>E0<\/td><td>Practically impossible<\/td><td>—<\/td><\/tr><tr><td>E1<\/td><td>Very low probability<\/td><td>—<\/td><\/tr><tr><td>E2<\/td><td>Low probability; several conditions must coincide<\/td><td>H-02, H-03, H-07<\/td><\/tr><tr><td>E3<\/td><td>Medium probability; occurs regularly but not predominantly<\/td><td>H-01, H-04, H-05, H-06<\/td><\/tr><tr><td>E4<\/td><td>High probability; predominant part of operating time<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Project rule:<\/strong> what is rated is the <strong>operational situation<\/strong>, not the fault. The governing<br>measure is the share of operating time per usage profile <code>A-07<\/code><br>(see <a href=\"#doc/02_safety/02_hara/operational_situations.md\"><code>operational_situations.md<\/code><\/a>).<\/p><p><strong>Deliberate delimitation:<\/strong> &quot;night driving&quot; in general would be E4 in long-haul operation. What is<br>hazard-relevant, however, is the narrower situation <em>night + unlit + rural-road speed<\/em>, and that is<br>E3. This delimitation decides between ASIL B and ASIL C and is tracked as <code>RISK-01<\/code>.<\/p><h4>3 Controllability<\/h4><div class='tw'><table><thead><tr><th>Class<\/th><th>Interpretation in this project<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>C0<\/td><td>Controllable in general<\/td><td>—<\/td><\/tr><tr><td>C1<\/td><td>Simply controllable; practically all drivers control the situation<\/td><td>H-06<\/td><\/tr><tr><td>C2<\/td><td>Normally controllable; the majority of drivers control the situation<\/td><td>H-01, H-02, H-03, H-04, H-05<\/td><\/tr><tr><td>C3<\/td><td>Difficult to control or uncontrollable<\/td><td>H-07<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Project rule:<\/strong> what is rated is controllability by the person who actually has to act. In glare<br>scenarios that is the <strong>dazzled<\/strong> driver, not the driver of the causing vehicle.<\/p><p><strong>What the C rating depends on:<\/strong> for H-01, C2 presumes that the driver notices the failure and<br>responds. That presumption is assumption <code>A-03<\/code> and is technically supported by <code>FSR-004<\/code> (driver<br>warning within 2 s). Without the warning, C3 would have to be examined — with a corresponding<br>increase in ASIL. <strong>The warning is therefore not optional; it carries the rating.<\/strong><\/p><h4>4 Combinations used and result<\/h4><p>Only the combinations that actually occurred in this HARA, with the result of the determination<br>table per ISO 26262-3:<\/p><div class='tw'><table><thead><tr><th>S<\/th><th>E<\/th><th>C<\/th><th>ASIL<\/th><th>Hazard<\/th><\/tr><\/thead><tbody><tr><td>S3<\/td><td>E3<\/td><td>C2<\/td><td><strong>B<\/strong><\/td><td>H-01, H-04<\/td><\/tr><tr><td>S3<\/td><td>E2<\/td><td>C2<\/td><td><strong>A<\/strong><\/td><td>H-02, H-03<\/td><\/tr><tr><td>S2<\/td><td>E3<\/td><td>C2<\/td><td><strong>A<\/strong><\/td><td>H-05<\/td><\/tr><tr><td>S2<\/td><td>E2<\/td><td>C3<\/td><td><strong>A<\/strong><\/td><td>H-07<\/td><\/tr><tr><td>S1<\/td><td>E3<\/td><td>C1<\/td><td><strong>QM<\/strong><\/td><td>H-06<\/td><\/tr><\/tbody><\/table><\/div><p>For context on the borderline discussion: the combination S3/E4/C2 leads to <strong>ASIL C<\/strong>. That is<br>exactly why the E rating of H-01 is the critical decision of this project.<\/p>"},{"path":"03_model/magicgrid.md","title":"MBSE model — MagicGrid (SysML v1.6)","folder":"03_model","exists":true,"html":"<p><strong>Phase 4 · Owner:<\/strong> mbse-modeler · <strong>Status:<\/strong> draft<\/p><blockquote>Teaching/reference project. All numeric values are plausible example values, not validated data.<\/blockquote><p>The model does not restate the requirements — it makes their structure and behaviour inspectable.<br>Every element carries the project ID it comes from; nothing in the model exists that is not in the<br>requirements or the architecture.<\/p><hr><h4>1 MagicGrid matrix<\/h4><p>Filled with the concrete artefacts of this project.<\/p><div class='tw'><table><thead><tr><th><\/th><th><strong>Requirements<\/strong><\/th><th><strong>Behavior<\/strong><\/th><th><strong>Structure<\/strong><\/th><th><strong>Parameters<\/strong><\/th><\/tr><\/thead><tbody><tr><td><strong>Problem Domain<\/strong>&lt;br/&gt;(black box)<\/td><td><code>CR-001<\/code> … <code>CR-023<\/code>&lt;br/&gt;<code>H-01<\/code> … <code>H-07<\/code>&lt;br/&gt;<code>SG-01<\/code>, <code>SG-02<\/code>&lt;br/&gt;<code>FSR-001<\/code> … <code>FSR-008<\/code><\/td><td>Use cases <code>UC-1<\/code> … <code>UC-7<\/code>&lt;br/&gt;Activity &quot;activate low beam&quot;&lt;br/&gt;Operational situations <code>BS-01<\/code> … <code>BS-07<\/code><\/td><td>Item boundary&lt;br/&gt;(<code>ctx_item.puml<\/code>)&lt;br/&gt;<code>Item_LightingSystem<\/code><\/td><td>24 V supply, <code>T_amb<\/code> −40…+85 °C&lt;br/&gt;FTTI 300 ms, FRT 150 ms&lt;br/&gt;Usage profile <code>A-07<\/code><\/td><\/tr><tr><td><strong>Solution Domain<\/strong>&lt;br/&gt;(white box)<\/td><td><code>SYS-REQ-001<\/code> … <code>SYS-REQ-021<\/code>&lt;br/&gt;<code>TSR-001<\/code> … <code>TSR-008<\/code><\/td><td>State machine &quot;operating states&quot;&lt;br/&gt;Sequence &quot;open load → DTC&quot;<\/td><td>BDD system decomposition&lt;br/&gt;IBD <code>ECU_LightingCtrl<\/code>&lt;br/&gt;(<code>bdd_system.puml<\/code>, <code>ibd_ecu.puml<\/code>)<\/td><td>Detection ≤ 80 ms&lt;br/&gt;Threshold 150 mA / 50 ms&lt;br/&gt;PWM 400 Hz, duty ≥ 20 %<\/td><\/tr><tr><td><strong>Implementation<\/strong><\/td><td><code>HW-REQ-001<\/code> … <code>HW-REQ-010<\/code>&lt;br/&gt;<code>SM-01<\/code>&lt;br/&gt;(SW-REQ: phase 7)<\/td><td>Task and cycle time model&lt;br/&gt;(phase 7)<\/td><td>HW blocks <code>MCU_Lockstep<\/code>,&lt;br/&gt;<code>ASIC_Watchdog<\/code>, <code>LED_Driver_Stage_1<\/code>,&lt;br/&gt;<code>Current_Sense_Chain<\/code>&lt;br/&gt;SW blocks <code>SWC_*<\/code><\/td><td>Measurement uncertainty ±20 mA&lt;br/&gt;Derating floor 400 mA&lt;br/&gt;Luminous flux model <code>A-13<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Read the columns as <em>what is required · how it behaves · what it is made of · by which values it is<br>constrained<\/em>; the rows as increasing commitment to a solution.<\/p><hr><h4>2 The eight views<\/h4><p>All sources in <a href=\"../../03_model/plantuml\"><code>plantuml/<\/code><\/a>. Rendered exports are CI artefacts and deliberately not<br>committed — the text is the source of truth.<\/p><h5>2.1 Use cases — <a href=\"../../03_model/plantuml/uc_lighting.puml\"><code>uc_lighting.puml<\/code><\/a><\/h5><p>Actors driver, workshop, vehicle gateway and environment against the seven use cases of the item.<\/p><p><strong>Reading it:<\/strong> <code>UC-1<\/code> includes <code>UC-5<\/code> — failure detection is not an optional add-on to operating<br>the low beam but part of it. <code>UC-5<\/code> and <code>UC-2<\/code> extend into <code>UC-7<\/code> (safe state), which is where both<br>safety goals attach.<\/p><h5>2.2 Requirements — <a href=\"../../03_model/plantuml/req_golden_thread.puml\"><code>req_golden_thread.puml<\/code><\/a><\/h5><p>The Golden Thread with the SysML relations <code>«deriveReqt»<\/code>, <code>«satisfy»<\/code> and <code>«verify»<\/code>.<\/p><p><strong>Reading it:<\/strong> the chain runs hazard → safety goal → FSR → TSR → SYS-REQ → HW-REQ; <code>SM-01<\/code> and<br><code>SWC_LightManager<\/code> satisfy it, <code>TC-021<\/code> verifies three levels of it at once. That <code>TC-021<\/code> alone<br>carries the verification of <code>SG-01<\/code>, <code>TSR-003<\/code> and <code>SYS-REQ-014<\/code> is visible here — and is a thin<br>spot, see the open points.<\/p><h5>2.3 Activity — <a href=\"../../03_model/plantuml/act_low_beam.puml\"><code>act_low_beam.puml<\/code><\/a><\/h5><p>Activating the low beam including the fault path.<\/p><p><strong>Reading it:<\/strong> the red path is the fault case. The decision &quot;PWM on-time ≥ 150 µs&quot; is the gating<br>question from <code>SYS-REQ-017<\/code>: below it the diagnosis reports &quot;not available&quot; rather than a wrong<br>result.<\/p><h5>2.4 Sequence — <a href=\"../../03_model/plantuml/seq_open_load.puml\"><code>seq_open_load.puml<\/code><\/a><\/h5><p>Open load → fault reaction → diagnostic DTC, with the timing budget as notes.<\/p><p><strong>Reading it:<\/strong> the two notes carry the safety argument — classification at ≤ 80 ms, safe state at<br>≤ 230 ms against an FTTI of 300 ms. The off-phase zero check (<code>HW-REQ-005<\/code>) runs <em>before<\/em> the<br>reaction, because a stuck sense chain would otherwise trigger a false safe-state transition.<\/p><h5>2.5 State machine — <a href=\"../../03_model/plantuml/stm_lighting.puml\"><code>stm_lighting.puml<\/code><\/a><\/h5><p>Operating states Init, Normal, Degraded, Safe state, Sleep.<\/p><p><strong>Reading it:<\/strong> the safe state is highlighted and is reached from two directions — via <code>Degraded<\/code><br>after a detected channel loss, and directly from <code>Normal_Operation<\/code> when the watchdog is not served<br>(<code>TSR-001<\/code>). Leaving it requires an ignition cycle, so a sporadic fault cannot silently self-clear.<\/p><h5>2.6 Structure — <a href=\"../../03_model/plantuml/bdd_system.puml\"><code>bdd_system.puml<\/code><\/a> and <a href=\"../../03_model/plantuml/ibd_ecu.puml\"><code>ibd_ecu.puml<\/code><\/a><\/h5><p>System decomposition and the internal signal flows of the ECU.<\/p><p><strong>Reading it:<\/strong> the BDD shows the software components as named blocks without internals — their<br>design is phase 7, and inventing it here would be a model that outruns its requirements. In the IBD<br>the safety-relevant loop <code>LED_Driver → Current_Sense_Chain → MCU → LED_Driver<\/code> is closed, and the<br>watchdog has its own path to the driver stages, bypassing the microcontroller.<\/p><h5>2.7 Parametric — <a href=\"../../03_model/plantuml/par_luminous_flux.puml\"><code>par_luminous_flux.puml<\/code><\/a><\/h5><p>Constraint luminous flux ↔ junction temperature ↔ channel current.<\/p><p><strong>Reading it:<\/strong> the constraint binds the derating floor of <code>HW-REQ-008<\/code> to the legal minimum<br>luminous flux. At 400 mA and 110 °C junction temperature the model yields roughly 264 lm — below<br>the legal minimum. That is the intended reading: <strong>limp-home is a fault state, not a permitted<br>operating mode<\/strong>, and it must end the journey rather than continue it.<\/p><h5>2.8 Allocation<\/h5><p>Function → logical element → physical element:<br><a href=\"#doc/04_architecture/allocation.md\"><code>../04_architecture/allocation.md<\/code><\/a><\/p><hr><h4>3 What the model exposed<\/h4><p>Modelling is a review technique, not decoration. Three things became visible:<\/p><ol><li><strong><code>TC-021<\/code> is a single point of verification.<\/strong> In the requirements diagram three <code>«verify»<\/code> edges converge on one test case. Verification depth does not match specification depth — new test cases are owed for <code>HW-REQ-001<\/code> … <code>HW-REQ-010<\/code> (<code>OP-19<\/code>) and for the <code>SG-02<\/code> thread.<\/li><li><strong><code>SG-02<\/code> has no behavioural view.<\/strong> The state machine and the sequence cover the low beam only. The decomposed high-beam path (<code>TSR-006<\/code> / <code>TSR-007<\/code>) is structurally present but behaviourally unmodelled — which is consistent with it being the deliberately shallower thread, but it should be a conscious decision, not an oversight. Recorded as <code>OP-25<\/code>.<\/li><li><strong>The software components are empty shells.<\/strong> Legitimate for phase 4, but it means the IBD cannot yet show where freedom from interference between <code>SWC_HighBeamControl<\/code> (QM) and <code>SWC_HighBeamMonitor<\/code> (ASIL A) is enforced. Phase 7 owes that.<\/li><\/ol><hr><p><strong>Work products:<\/strong> <code>magicgrid.md<\/code>, <code>plantuml/uc_lighting.puml<\/code>, <code>req_golden_thread.puml<\/code>,<br><code>act_low_beam.puml<\/code>, <code>seq_open_load.puml<\/code>, <code>stm_lighting.puml<\/code>, <code>bdd_system.puml<\/code>, <code>ibd_ecu.puml<\/code>,<br><code>par_luminous_flux.puml<\/code> → <code>03_model/<\/code> · <code>allocation.md<\/code> → <code>04_architecture/<\/code><\/p><p><strong>Open points:<\/strong> <code>OP-25<\/code> behavioural views for the <code>SG-02<\/code> thread · <code>OP-19<\/code> test cases for the<br>hardware requirements · <code>OP-26<\/code> freedom-from-interference view once the SW architecture exists<\/p><p><strong>Process reference:<\/strong> MBSE / MagicGrid · ASPICE <strong>SYS.3<\/strong> (the structural views document the<br>system architectural design) · ISO 26262 <strong>Part 4<\/strong> — the model supports the technical safety<br>concept but is not itself the safety argument.<\/p>"},{"path":"04_architecture/allocation.md","title":"Allocation — function → logical element → physical element","folder":"04_architecture","exists":true,"html":"<p><strong>Phase 4 · MagicGrid view 8 · Owner:<\/strong> systems-engineer with mbse-modeler<\/p><blockquote>Companion to the TSR allocation matrix in <a href=\"#doc/04_architecture/ee_architecture.md\"><code>ee_architecture.md<\/code><\/a>. That matrix allocates <em>requirements<\/em>; this table allocates <em>functions<\/em>.<\/blockquote><div class='tw'><table><thead><tr><th>Function<\/th><th>Requirement<\/th><th>Logical element<\/th><th>Physical element<\/th><th>ASIL<\/th><\/tr><\/thead><tbody><tr><td>Operate low beam<\/td><td><code>SYS-REQ-001<\/code>, <code>SYS-REQ-012<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>MCU_Lockstep<\/code>, <code>LED_Driver_Stage_1<\/code>, headlamp module<\/td><td>B<\/td><\/tr><tr><td>Automatic light control<\/td><td><code>SYS-REQ-002<\/code>, <code>SYS-REQ-003<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>MCU_Lockstep<\/code> (ambient light via <code>Vehicle_Gateway<\/code>)<\/td><td>B<\/td><\/tr><tr><td>Detect channel failure<\/td><td><code>SYS-REQ-014<\/code> … <code>019<\/code>, <code>TSR-003<\/code><\/td><td><code>SWC_LightManager<\/code>, <code>SM-01<\/code><\/td><td><code>Current_Sense_Chain<\/code>, <code>LED_Driver_Stage_1<\/code><\/td><td>B<\/td><\/tr><tr><td>Fault reaction, limp-home<\/td><td><code>SYS-REQ-011<\/code>, <code>TSR-004<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>MCU_Lockstep<\/code>, <code>LED_Driver_Stage_1<\/code><\/td><td>B<\/td><\/tr><tr><td>Driver warning<\/td><td><code>SYS-REQ-010<\/code>, <code>SYS-REQ-026<\/code>, <code>TSR-005<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>CAN_FD_Transceiver<\/code> → instrument cluster (external)<\/td><td>B<\/td><\/tr><tr><td>Program flow monitoring<\/td><td><code>TSR-001<\/code><\/td><td>— (hardware function)<\/td><td><code>ASIC_Watchdog<\/code> incl. disable path<\/td><td>B<\/td><\/tr><tr><td>Glare-free high beam<\/td><td><code>SYS-REQ-004<\/code>, <code>TSR-006<\/code><\/td><td><code>SWC_HighBeamControl<\/code><\/td><td><code>MCU_Lockstep<\/code>, <code>LED_Driver_Stage_1<\/code><\/td><td>QM(A)<\/td><\/tr><tr><td>High-beam plausibility monitor<\/td><td><code>TSR-007<\/code><\/td><td><code>SWC_HighBeamMonitor<\/code><\/td><td><code>MCU_Lockstep<\/code> (separate partition), separate enable path<\/td><td>A(A)<\/td><\/tr><tr><td>Work-lamp inhibit<\/td><td><code>SYS-REQ-005<\/code>, <code>TSR-008<\/code><\/td><td><code>SWC_WorkLampControl<\/code><\/td><td><code>MCU_Lockstep<\/code>, work-lamp output stages<\/td><td>A<\/td><\/tr><tr><td>Cornering light<\/td><td><code>SYS-REQ-006<\/code> … <code>008<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>LIN_Transceiver<\/code>, actuator (external)<\/td><td>A<\/td><\/tr><tr><td>Daytime running lights<\/td><td><code>SYS-REQ-009<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>LED_Driver_Stage_1<\/code><\/td><td>QM<\/td><\/tr><tr><td>Thermal derating<\/td><td><code>HW-REQ-008<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>Temp_Sense_Chain<\/code>, <code>LED_Driver_Stage_1<\/code><\/td><td>B<\/td><\/tr><tr><td>Diagnostics, DTC, UDS<\/td><td><code>SYS-REQ-021<\/code><\/td><td><code>SWC_DiagnosticManager<\/code><\/td><td><code>MCU_Lockstep<\/code>, <code>CAN_FD_Transceiver<\/code><\/td><td>QM<\/td><\/tr><tr><td>Supply and monitoring<\/td><td><code>SYS-REQ-012<\/code>, <code>SYS-REQ-013<\/code><\/td><td>— (hardware function)<\/td><td><code>Power_Supply_Unit<\/code><\/td><td>B<\/td><\/tr><tr><td>Bus communication<\/td><td><code>SYS-REQ-020<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>CAN_FD_Transceiver<\/code>, <code>Vehicle_Gateway<\/code> (external)<\/td><td>B<\/td><\/tr><tr><td>End-to-end protection of the signal groups<\/td><td><code>SYS-REQ-022<\/code>, <code>SYS-REQ-023<\/code>, <code>SYS-REQ-027<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>MCU_Lockstep<\/code>, <code>CAN_FD_Transceiver<\/code><\/td><td>B<\/td><\/tr><tr><td>Signal timeout and invalidation<\/td><td><code>SYS-REQ-024<\/code>, <code>TSR-008<\/code><\/td><td><code>SWC_LightManager<\/code>, <code>SWC_WorkLampControl<\/code><\/td><td><code>MCU_Lockstep<\/code><\/td><td>B<\/td><\/tr><tr><td>Hold last valid low beam on invalid request<\/td><td><code>SYS-REQ-025<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>MCU_Lockstep<\/code>, <code>LED_Driver_Stage_1<\/code><\/td><td>B<\/td><\/tr><tr><td>Transmit scheduling and bus budget<\/td><td><code>SYS-REQ-026<\/code>, <code>SYS-REQ-028<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td><code>CAN_FD_Transceiver<\/code><\/td><td>B<\/td><\/tr><\/tbody><\/table><\/div><h4>Three observations from the allocation<\/h4><p><strong><code>MCU_Lockstep<\/code> carries functions from QM to ASIL B side by side.<\/strong> <code>SWC_HighBeamControl<\/code> (QM(A))<br>and <code>SWC_HighBeamMonitor<\/code> (A(A)) run on the same physical element. Freedom from interference —<br>memory partitioning and timing monitoring — is therefore not optional but a precondition for the<br>decomposition to hold. Owed by phase 7, tracked with <code>RISK-02<\/code>.<\/p><p><strong>Two functions have no logical element.<\/strong> Program flow monitoring and supply monitoring are pure<br>hardware functions. That is correct, not a gap — but it means their verification cannot be a<br>software test, which the test strategy in phase 8 has to reflect.<\/p><p><strong><code>SWC_LightManager<\/code> now carries four communication functions on top of the lighting logic.<\/strong> The<br>E2E protection, the invalidation rule, the hold-last-valid behaviour and the transmit scheduling<br>were all allocated to it because they are ASIL B and <code>SWC_DiagnosticManager<\/code> is QM, so the QM<br>component must not sit in the data path. The consequence is that <code>SWC_LightManager<\/code> is now the<br>single largest ASIL B software element in the item, and the software architecture in phase 7 has to<br>decide whether the E2E handling becomes a component of its own. Recorded here rather than silently<br>carried into phase 7.<\/p><blockquote><strong>Change note (phase 3 communication refinement).<\/strong> Five rows added (<code>Bus communication<\/code>, <code>End-to-end protection<\/code>, <code>Signal timeout and invalidation<\/code>, <code>Hold last valid low beam<\/code>, <code>Transmit scheduling<\/code>); the <code>Driver warning<\/code> row gained <code>SYS-REQ-026<\/code>. No existing allocation was changed. Derivation: <a href=\"#doc/04_architecture/ee_architecture.md\"><code>ee_architecture.md<\/code><\/a>, sections 3 to 5.<\/blockquote>"},{"path":"04_architecture/ee_architecture.md","title":"E/E architecture — Lighting ECU","folder":"04_architecture","exists":true,"html":"<p><strong>Phase 3 · ASPICE SYS.3 · ISO 26262-4 (technical safety concept)<\/strong><br><strong>Status:<\/strong> draft · <strong>Owner:<\/strong> systems-engineer, with safety-manager for the TSR allocation<br><strong>Revision:<\/strong> phase 3 refinement — communication design added (<code>OP-21<\/code>, <code>OP-22<\/code>), see the change<br>notes in sections 2, 5 and 6.<\/p><blockquote>Teaching/reference project. All numeric values are plausible example values, not validated data.<\/blockquote><hr><h4>1 📋 OVERVIEW — Architecture blocks<\/h4><div class='tw'><table><thead><tr><th>Block<\/th><th>Element name<\/th><th>Function<\/th><th>ASIL<\/th><\/tr><\/thead><tbody><tr><td>Microcontroller<\/td><td><code>MCU_Lockstep<\/code><\/td><td>Application, monitoring, diagnostics; dual-core lockstep<\/td><td>B<\/td><\/tr><tr><td>External watchdog<\/td><td><code>ASIC_Watchdog<\/code><\/td><td>Independent time base, question/answer watchdog, disable path to the driver stages<\/td><td>B<\/td><\/tr><tr><td>LED driver stages<\/td><td><code>LED_Driver_Stage_1..n<\/code><\/td><td>Constant-current control per channel, PWM dimming, OVP/OCP/thermal status. Base variant <strong>without<\/strong> the forced diagnostic window of <code>HW-REQ-004<\/code> (see section 6, <code>OP-17<\/code>)<\/td><td>B<\/td><\/tr><tr><td>Current sensing<\/td><td><code>Current_Sense_Chain<\/code><\/td><td>Shunt, amplifier, ADC input per channel; PWM-synchronous sampling. Carries <code>SM-01<\/code>, worst-case detection time 80 ms (<code>HW-REQ-009<\/code>)<\/td><td>B<\/td><\/tr><tr><td>Temperature sensing<\/td><td><code>Temp_Sense_Chain<\/code><\/td><td>LED module NTC and ECU board sensor; input to the derating function<\/td><td>B<\/td><\/tr><tr><td>Supply<\/td><td><code>Power_Supply_Unit<\/code><\/td><td>16–32 V input, buck plus linear stage, undervoltage and overvoltage monitoring<\/td><td>B<\/td><\/tr><tr><td>Bus interface<\/td><td><code>CAN_FD_Transceiver<\/code>, <code>LIN_Transceiver<\/code><\/td><td>CAN FD / SAE J1939 to the vehicle gateway incl. end-to-end protection of the safety-relevant signal groups (<code>SYS-REQ-022<\/code>), LIN to the actuator<\/td><td>B / QM<\/td><\/tr><tr><td>Diagnostic path<\/td><td><code>SWC_DiagnosticManager<\/code><\/td><td>DTC memory, UDS server per ISO 14229<\/td><td>QM<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Decision on the microcontroller concept:<\/strong> lockstep MCU <strong>and<\/strong> external watchdog, not one or the<br>other. The lockstep core covers random faults of the computing core; it cannot cover a stalled<br>clock or a hung application, which is what the watchdog with its independent time base addresses<br>(<code>TSR-001<\/code>). For ASIL B this pairing is deliberate over-provisioning, and it is what makes the<br>freedom-from-interference argument for the mixed ASIL B / QM software feasible in phase 7.<\/p><div class=\"diagram\"><img alt=\"diagram\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIiBjb250ZW50U3R5bGVUeXBlPSJ0ZXh0L2NzcyIgZGF0YS1kaWFncmFtLXR5cGU9IkRFU0NSSVBUSU9OIiBoZWlnaHQ9IjEwNzBweCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSIgc3R5bGU9IndpZHRoOjEyMjBweDtoZWlnaHQ6MTA3MHB4O2JhY2tncm91bmQ6I0ZGRkZGRjsiIHZlcnNpb249IjEuMSIgdmlld0JveD0iMCAwIDEyMjAgMTA3MCIgd2lkdGg9IjEyMjBweCIgem9vbUFuZFBhbj0ibWFnbmlmeSI+PD9wbGFudHVtbCAxLjIwMjYuNj8+PGRlZnMvPjxnPjxnIGNsYXNzPSJ0aXRsZSIgZGF0YS1zb3VyY2UtbGluZT0iMSI+PHRleHQgZmlsbD0iIzAwMDAwMCIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZvbnQtd2VpZ2h0PSI3MDAiIGxlbmd0aEFkanVzdD0ic3BhY2luZyIgdGV4dExlbmd0aD0iMjgwLjQ1MTIiIHg9IjQ2Ni42Njg3IiB5PSIyMy41MzUyIj5FL0UgYXJjaGl0ZWN0dXJlIC0gTGlnaHRpbmcgRUNVIChTWVMuMyk8L3RleHQ+PC9nPjwhLS1jbHVzdGVyIFZFSC0tPjxnIGNsYXNzPSJjbHVzdGVyIiBkYXRhLXF1YWxpZmllZC1uYW1lPSJWRUgiIGRhdGEtc291cmNlLWxpbmU9IjciIGlkPSJlbnQwMDAxIj48cmVjdCBmaWxsPSIjRDNEM0QzIiBoZWlnaHQ9IjEyMC40NyIgcng9IjIuNSIgcnk9IjIuNSIgc3R5bGU9InN0cm9rZTojMTgxODE4O3N0cm9rZS13aWR0aDoxOyIgd2lkdGg9IjQxNSIgeD0iMzUyLjcyIiB5PSI0NC40ODgzIi8+PHRleHQgZmlsbD0iIzAwMDAwMCIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZvbnQtd2VpZ2h0PSI3MDAiIGxlbmd0aEFkanVzdD0ic3BhY2luZyIgdGV4dExlbmd0aD0i  km/h<\/td><td>cyclic 20 ms, timeout 100 ms<\/td><td>A<\/td><td>E2E, group <code>SG_VehicleDynamics<\/code><\/td><\/tr><tr><td><code>SteeringAngle<\/code><\/td><td>Gateway → ECU<\/td><td>int16, 0.1 °<\/td><td>−540 … +540 °<\/td><td>cyclic 20 ms, timeout 100 ms<\/td><td>A<\/td><td>E2E, group <code>SG_VehicleDynamics<\/code><\/td><\/tr><tr><td><code>AmbientLight<\/code><\/td><td>Gateway → ECU<\/td><td>uint16, 1 lx<\/td><td>0 … 60000 lx<\/td><td>cyclic 100 ms, timeout 500 ms<\/td><td>B<\/td><td>E2E, group <code>SG_Environment<\/code><\/td><\/tr><tr><td><code>ObjectList<\/code><\/td><td>Gateway → ECU<\/td><td>struct, ≤ 8 objects<\/td><td>—<\/td><td>cyclic 50 ms, timeout 200 ms<\/td><td>QM(A)<\/td><td>timeout + per-object valid flag only, <strong>no E2E<\/strong><\/td><\/tr><tr><td><code>DriverWarningReq<\/code><\/td><td>ECU → Gateway<\/td><td>enum {none, lowBeamFault}<\/td><td>2 states<\/td><td>event + cyclic 500 ms<\/td><td>B<\/td><td>E2E, group <code>SG_DriverWarning<\/code><\/td><\/tr><tr><td><code>LightingStatus<\/code><\/td><td>ECU → Gateway<\/td><td>bitfield per channel<\/td><td>16 bit<\/td><td>cyclic 100 ms<\/td><td>B<\/td><td>E2E, group <code>SG_LightingStatus<\/code><\/td><\/tr><tr><td><code>I_Load_Ch1..n<\/code><\/td><td>Sense chain → MCU<\/td><td>uint12 ADC<\/td><td>0 … 1.5 A<\/td><td>PWM-synchronous, 2.5 ms raster<\/td><td>B<\/td><td>ADC reference plausibility (<code>HW-REQ-010<\/code>)<\/td><\/tr><tr><td><code>U_Channel_Ch1..n<\/code><\/td><td>Driver → MCU<\/td><td>uint12 ADC<\/td><td>0 … 40 V<\/td><td>10 ms<\/td><td>B<\/td><td>range plausibility<\/td><\/tr><tr><td><code>DriverStatus_Ch1..n<\/code><\/td><td>Driver → MCU<\/td><td>bitfield OVP/OCP/OT<\/td><td>3 bit<\/td><td>≤ 10 ms<\/td><td>B<\/td><td>driver-internal status readback<\/td><\/tr><tr><td><code>T_LED<\/code>, <code>T_Board<\/code><\/td><td>Sense chain → MCU<\/td><td>uint12 ADC<\/td><td>−40 … +150 °C<\/td><td>100 ms<\/td><td>B<\/td><td>open/short detection by range check<\/td><\/tr><tr><td><code>PWM_Ch1..n<\/code><\/td><td>MCU → Driver<\/td><td>PWM<\/td><td>400 Hz, duty 0 … 100 %<\/td><td>continuous<\/td><td>B<\/td><td>feedback via <code>I_Load_Ch1..n<\/code> (<code>TSR-002<\/code>)<\/td><\/tr><tr><td><code>Enable_Ch1..n<\/code><\/td><td>MCU → Driver<\/td><td>digital<\/td><td>0 / 1<\/td><td>continuous<\/td><td>B<\/td><td>feedback via <code>I_Load_Ch1..n<\/code> (<code>TSR-002<\/code>)<\/td><\/tr><tr><td><code>WD_Disable<\/code><\/td><td>Watchdog → Driver<\/td><td>digital<\/td><td>0 / 1<\/td><td>≤ 50 ms<\/td><td>B<\/td><td>independent path, not routed via <code>MCU_Lockstep<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong>Change note (phase 3 refinement).<\/strong> Two changes to the published table, no value was silently<br>altered:<\/p><ol><li><strong>New column <code>Integrity<\/code>.<\/strong> The table previously named only timeouts. A timeout covers loss but not corruption, repetition or an incorrect sequence, which is not enough for an ASIL B signal. The column names the mechanism per signal; the requirements behind it are <code>SYS-REQ-022<\/code> … <code>SYS-REQ-024<\/code> and <code>SYS-REQ-027<\/code>.<\/li><li><strong>New row <code>IgnitionStatus<\/code>.<\/strong> The signal was used by <code>SYS-REQ-009<\/code> and is presumed by <code>A-06<\/code>, but it was missing from the interface table — a genuine gap, not a new function. It is carried in the <code>SG_LightRequest<\/code> group, so it inherits the group protection although it is QM by itself.<\/li><li><strong><code>DriverWarningReq<\/code> timing<\/strong> changed from &quot;cyclic 500 ms&quot; to &quot;event + cyclic 500 ms&quot;, see <code>SYS-REQ-026<\/code> and chain B of the timing analysis in section 4.<\/li><\/ol><p><strong>Timeout handling is part of the interface, not of the application.<\/strong> Every safety-relevant input<br>carries a timeout; on timeout the receiving function must assume the signal invalid (<code>SYS-REQ-024<\/code>).<br><code>TSR-008<\/code> makes this explicit for the speed signal, because an inhibit that can be defeated by a<br>lost frame is not an inhibit.<\/p><p><strong>Protection is per signal group, not per signal.<\/strong> Counter and checksum are computed over a group<br>of signals that is transmitted in one frame, because that is the unit that is lost, repeated or<br>corrupted. A group is invalid as a whole; a single signal within it cannot be &quot;partly valid&quot;. This<br>is why <code>IgnitionStatus<\/code> (QM) rides in an ASIL B group instead of getting its own frame.<\/p><p><strong>On <code>ObjectList<\/code> at QM(A):<\/strong> the signal originates outside the item boundary (<code>A-05<\/code>) and feeds the<br>QM path of the decomposition (<code>TSR-006<\/code>). It is deliberately <strong>not<\/strong> E2E-protected — protecting it<br>would suggest an integrity level the QM path does not have and does not need. The safety argument<br>rests on the independent monitor <code>TSR-007<\/code>, which does not use this signal. The interface agreement<br>with the vehicle manufacturer is still open (<code>OP-10<\/code>).<\/p><hr><h4>3 🔍 DEEP DIVE — CAN FD / J1939 message catalogue (<code>OP-21<\/code>)<\/h4><h5>3.1 Conventions<\/h5><div class='tw'><table><thead><tr><th>Item<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Physical layer<\/td><td>CAN FD, 500 kbit/s arbitration phase, 2 Mbit/s data phase, BRS enabled (<code>A-14<\/code>)<\/td><\/tr><tr><td>Identifier<\/td><td>29-bit J1939 identifier, `ID = priority&lt;&lt;26 \\<\/td><td>DP&lt;&lt;24 \\<\/td><td>PF&lt;&lt;16 \\<\/td><td>PS&lt;&lt;8 \\<\/td><td>SA`<\/td><\/tr><tr><td>Parameter groups<\/td><td>PDU2 proprietary B (<code>PF = 0xFF<\/code>), i.e. broadcast, no destination address<\/td><\/tr><tr><td>Source addresses<\/td><td><code>0x21<\/code> lighting ECU, <code>0x27<\/code> vehicle gateway (placeholders, <code>A-16<\/code>)<\/td><\/tr><tr><td>Byte order<\/td><td>little-endian (Intel), byte index 0-based, bit 0 = LSB of the byte<\/td><\/tr><tr><td>Encoding<\/td><td>SPN style: <code>physical = raw × resolution + offset<\/code>; top raw values reserved for &quot;error&quot; and &quot;not available&quot;<\/td><\/tr><tr><td>E2E profile<\/td><td>equivalent to AUTOSAR E2E Profile 1: 4-bit alive counter, CRC-8 (SAE J1850 polynomial 0x1D, init 0xFF, final XOR 0xFF), 16-bit data identifier prepended to the CRC input<\/td><\/tr><\/tbody><\/table><\/div><p>All PGNs, source addresses, data identifiers and byte positions below are <strong>plausible example<br>values<\/strong>. They are placeholders until the OEM J1939 database is available (<code>A-16<\/code>, <code>OP-27<\/code>).<\/p><h5>3.2 Message overview<\/h5><div class='tw'><table><thead><tr><th>Message<\/th><th>PGN<\/th><th>CAN ID<\/th><th>Prio<\/th><th>Payload<\/th><th>Direction<\/th><th>Cycle<\/th><th>Timeout<\/th><th>Signal group<\/th><th>ASIL<\/th><\/tr><\/thead><tbody><tr><td><code>LGT_Request_1<\/code><\/td><td>0xFF20 / 65312<\/td><td><code>0x0CFF2027<\/code><\/td><td>3<\/td><td>8 byte<\/td><td>Gateway → ECU<\/td><td>100 ms<\/td><td>300 ms<\/td><td><code>SG_LightRequest<\/code>, DataID <code>0x0101<\/code><\/td><td>B<\/td><\/tr><tr><td><code>VEH_Dynamics_1<\/code><\/td><td>0xFF21 / 65313<\/td><td><code>0x0CFF2127<\/code><\/td><td>3<\/td><td>8 byte<\/td><td>Gateway → ECU<\/td><td>20 ms<\/td><td>100 ms<\/td><td><code>SG_VehicleDynamics<\/code>, DataID <code>0x0102<\/code><\/td><td>A<\/td><\/tr><tr><td><code>VEH_Environment_1<\/code><\/td><td>0xFF22 / 65314<\/td><td><code>0x18FF2227<\/code><\/td><td>6<\/td><td>8 byte<\/td><td>Gateway → ECU<\/td><td>100 ms<\/td><td>500 ms<\/td><td><code>SG_Environment<\/code>, DataID <code>0x0103<\/code><\/td><td>B<\/td><\/tr><tr><td><code>OBJ_List_1<\/code><\/td><td>0xFF23 / 65315<\/td><td><code>0x18FF2327<\/code><\/td><td>6<\/td><td>32 byte<\/td><td>Gateway → ECU<\/td><td>50 ms<\/td><td>200 ms<\/td><td>— (no E2E)<\/td><td>QM(A)<\/td><\/tr><tr><td><code>LGT_Status_1<\/code><\/td><td>0xFF30 / 65328<\/td><td><code>0x18FF3021<\/code><\/td><td>6<\/td><td>8 byte<\/td><td>ECU → Gateway<\/td><td>100 ms<\/td><td>—<\/td><td><code>SG_LightingStatus<\/code>, DataID <code>0x0201<\/code><\/td><td>B<\/td><\/tr><tr><td><code>LGT_Warning_1<\/code><\/td><td>0xFF31 / 65329<\/td><td><code>0x0CFF3121<\/code><\/td><td>3<\/td><td>8 byte<\/td><td>ECU → Gateway<\/td><td>event + 500 ms<\/td><td>—<\/td><td><code>SG_DriverWarning<\/code>, DataID <code>0x0202<\/code><\/td><td>B<\/td><\/tr><\/tbody><\/table><\/div><p><code>LGT_Warning_1<\/code> and <code>LGT_Request_1<\/code> carry priority 3 while the status and environment messages carry<br>priority 6. The warning is the one lighting message whose latency is argued against a safety budget<br>(chain B, section 4), so it must not queue behind a 32-byte object list.<\/p><h5>3.3 🔍 DEEP DIVE — Golden Thread messages (SG-01)<\/h5><p><strong><code>LGT_Request_1<\/code> — PGN 0xFF20, 8 byte, 100 ms<\/strong><\/p><div class='tw'><table><thead><tr><th>Byte.bit<\/th><th>Signal<\/th><th>Length<\/th><th>Encoding<\/th><th>Range / states<\/th><\/tr><\/thead><tbody><tr><td>0.0 … 0.3<\/td><td><code>LightRequest<\/code><\/td><td>4 bit<\/td><td>enum, 1/bit, offset 0<\/td><td>0 = off, 1 = DRL, 2 = low, 3 = high, 4 = work, 5 … 13 reserved, 14 = error, 15 = not available<\/td><\/tr><tr><td>0.4 … 0.5<\/td><td><code>IgnitionStatus<\/code><\/td><td>2 bit<\/td><td>enum, 1/bit, offset 0<\/td><td>0 = off, 1 = on, 2 = crank, 3 = not available<\/td><\/tr><tr><td>0.6 … 0.7<\/td><td>reserved<\/td><td>2 bit<\/td><td>—<\/td><td>transmitted as <code>11b<\/code><\/td><\/tr><tr><td>1.0 … 1.3<\/td><td><code>SG_LightRequest_Counter<\/code><\/td><td>4 bit<\/td><td>1/bit<\/td><td>0 … 14 incrementing, 15 = invalid<\/td><\/tr><tr><td>1.4 … 1.7<\/td><td>reserved<\/td><td>4 bit<\/td><td>—<\/td><td>transmitted as <code>1111b<\/code><\/td><\/tr><tr><td>2 … 6<\/td><td>reserved<\/td><td>5 byte<\/td><td>—<\/td><td>transmitted as <code>0xFF<\/code><\/td><\/tr><tr><td>7<\/td><td><code>SG_LightRequest_CRC<\/code><\/td><td>8 bit<\/td><td>CRC-8 over DataID <code>0x0101<\/code> (LSB first) followed by bytes 0 … 6<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p><strong><code>LGT_Warning_1<\/code> — PGN 0xFF31, 8 byte, event + 500 ms<\/strong><\/p><div class='tw'><table><thead><tr><th>Byte.bit<\/th><th>Signal<\/th><th>Length<\/th><th>Encoding<\/th><th>Range / states<\/th><\/tr><\/thead><tbody><tr><td>0.0 … 0.1<\/td><td><code>DriverWarningReq<\/code><\/td><td>2 bit<\/td><td>enum, 1/bit, offset 0<\/td><td>0 = none, 1 = lowBeamFault, 2 = reserved, 3 = not available<\/td><\/tr><tr><td>0.2 … 0.7<\/td><td>reserved<\/td><td>6 bit<\/td><td>—<\/td><td>transmitted as <code>1<\/code>s<\/td><\/tr><tr><td>1.0 … 1.3<\/td><td><code>SG_DriverWarning_Counter<\/code><\/td><td>4 bit<\/td><td>1/bit<\/td><td>0 … 14 incrementing, 15 = invalid<\/td><\/tr><tr><td>1.4 … 1.7, 2 … 6<\/td><td>reserved<\/td><td>—<\/td><td>—<\/td><td>transmitted as <code>1<\/code>s<\/td><\/tr><tr><td>7<\/td><td><code>SG_DriverWarning_CRC<\/code><\/td><td>8 bit<\/td><td>CRC-8 over DataID <code>0x0202<\/code> (LSB first) followed by bytes 0 … 6<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p><strong><code>LGT_Status_1<\/code> — PGN 0xFF30, 8 byte, 100 ms.<\/strong> The 16-bit <code>LightingStatus<\/code> bitfield of the<br>interface table is resolved as seven 2-bit channel states with the common encoding<br><code>0 = off, 1 = on, 2 = degraded, 3 = failed<\/code>:<\/p><div class='tw'><table><thead><tr><th>Byte.bit<\/th><th>Signal<\/th><th>Length<\/th><th>Range / states<\/th><\/tr><\/thead><tbody><tr><td>0.0 … 0.1<\/td><td><code>LowBeam_Ch1_State<\/code><\/td><td>2 bit<\/td><td>off / on / degraded / failed<\/td><\/tr><tr><td>0.2 … 0.3<\/td><td><code>LowBeam_Ch2_State<\/code><\/td><td>2 bit<\/td><td>off / on / degraded / failed<\/td><\/tr><tr><td>0.4 … 0.5<\/td><td><code>HighBeam_State<\/code><\/td><td>2 bit<\/td><td>off / on / degraded / failed<\/td><\/tr><tr><td>0.6 … 0.7<\/td><td><code>DRL_State<\/code><\/td><td>2 bit<\/td><td>off / on / degraded / failed<\/td><\/tr><tr><td>1.0 … 1.1<\/td><td><code>CorneringLeft_State<\/code><\/td><td>2 bit<\/td><td>off / on / degraded / failed<\/td><\/tr><tr><td>1.2 … 1.3<\/td><td><code>CorneringRight_State<\/code><\/td><td>2 bit<\/td><td>off / on / degraded / failed<\/td><\/tr><tr><td>1.4 … 1.5<\/td><td><code>WorkLamp_State<\/code><\/td><td>2 bit<\/td><td>off / on / degraded / failed<\/td><\/tr><tr><td>1.6 … 1.7<\/td><td>reserved<\/td><td>2 bit<\/td><td>transmitted as <code>11b<\/code><\/td><\/tr><tr><td>2.0 … 2.1<\/td><td><code>OpenLoadDiagAvailable<\/code><\/td><td>2 bit<\/td><td>0 = available, 1 = not available (<code>SYS-REQ-017<\/code>), 2/3 reserved<\/td><\/tr><tr><td>2.2 … 2.7, 4 … 6<\/td><td>reserved<\/td><td>—<\/td><td>transmitted as <code>1<\/code>s<\/td><\/tr><tr><td>3.0 … 3.3<\/td><td><code>SG_LightingStatus_Counter<\/code><\/td><td>4 bit<\/td><td>0 … 14, 15 = invalid<\/td><\/tr><tr><td>7<\/td><td><code>SG_LightingStatus_CRC<\/code><\/td><td>8 bit<\/td><td>CRC-8 over DataID <code>0x0201<\/code> and bytes 0 … 6<\/td><\/tr><\/tbody><\/table><\/div><p><code>OpenLoadDiagAvailable<\/code> is the bus-visible form of <code>SYS-REQ-017<\/code>: when the PWM on-time is below the<br>minimum usable window the diagnosis is declared unavailable rather than silently degraded, and the<br>vehicle is told so. Without this bit the decision taken under <code>OP-17<\/code> would be invisible outside the<br>ECU.<\/p><h5>3.4 🔍 DEEP DIVE — SG-02 messages<\/h5><p><strong><code>VEH_Dynamics_1<\/code> — PGN 0xFF21, 8 byte, 20 ms<\/strong> (feeds <code>TSR-008<\/code> work-lamp inhibit and the<br>cornering light)<\/p><div class='tw'><table><thead><tr><th>Byte.bit<\/th><th>Signal<\/th><th>Length<\/th><th>Encoding<\/th><th>Range<\/th><\/tr><\/thead><tbody><tr><td>0 … 1<\/td><td><code>VehicleSpeed<\/code><\/td><td>16 bit<\/td><td>0.01 km/h per bit, offset 0<\/td><td>raw 0 … 15000 → 0 … 150 km/h; <code>0xFEFF<\/code> = error, <code>0xFFFF<\/code> = not available<\/td><\/tr><tr><td>2 … 3<\/td><td><code>SteeringAngle<\/code><\/td><td>16 bit<\/td><td>0.1 ° per bit, offset −540.0 °<\/td><td>raw 0 … 10800 → −540 … +540 °; <code>0xFFFF<\/code> = not available<\/td><\/tr><tr><td>4.0 … 4.3<\/td><td><code>SG_VehicleDynamics_Counter<\/code><\/td><td>4 bit<\/td><td>1/bit<\/td><td>0 … 14, 15 = invalid<\/td><\/tr><tr><td>4.4 … 6<\/td><td>reserved<\/td><td>—<\/td><td>—<\/td><td><code>0xFF<\/code><\/td><\/tr><tr><td>7<\/td><td><code>SG_VehicleDynamics_CRC<\/code><\/td><td>8 bit<\/td><td>CRC-8 over DataID <code>0x0102<\/code> and bytes 0 … 6<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><blockquote><strong>Note on <code>SteeringAngle<\/code>.<\/strong> The interface table describes the <em>application-level<\/em> type as <code>int16, 0.1 °<\/code>. At frame level the J1939 convention of an unsigned raw value with an offset is used instead. Physical range and resolution are identical; only the wire representation differs. No published value changed.<\/blockquote><p><strong><code>VEH_Environment_1<\/code> — PGN 0xFF22, 8 byte, 100 ms<\/strong><\/p><div class='tw'><table><thead><tr><th>Byte.bit<\/th><th>Signal<\/th><th>Length<\/th><th>Encoding<\/th><th>Range<\/th><\/tr><\/thead><tbody><tr><td>0 … 1<\/td><td><code>AmbientLight<\/code><\/td><td>16 bit<\/td><td>1 lx per bit, offset 0<\/td><td>0 … 60000 lx; <code>0xFFFF<\/code> = not available<\/td><\/tr><tr><td>2.0 … 2.3<\/td><td><code>SG_Environment_Counter<\/code><\/td><td>4 bit<\/td><td>1/bit<\/td><td>0 … 14, 15 = invalid<\/td><\/tr><tr><td>7<\/td><td><code>SG_Environment_CRC<\/code><\/td><td>8 bit<\/td><td>CRC-8 over DataID <code>0x0103<\/code> and bytes 0 … 6<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><h5>3.5 📋 OVERVIEW — remaining messages<\/h5><p><strong><code>OBJ_List_1<\/code> — PGN 0xFF23, 32 byte CAN FD payload, 50 ms.<\/strong> Byte 0 carries <code>ObjectCount<\/code><br>(0 … 8, 15 = not available), bytes 1 … 24 carry eight 3-byte object records<br>(<code>Azimuth<\/code> 12 bit at 0.1 ° with offset −204.8 °, <code>Distance<\/code> 8 bit at 1 m, <code>ObjectClass<\/code> 3 bit,<br><code>ObjectValid<\/code> 1 bit), bytes 25 … 31 are reserved. No alive counter and no CRC — see the argument in<br>section 2.<\/p><p><strong>LIN actuator (<code>LIN_Transceiver<\/code>).<\/strong> Classic LIN 2.x at 19.2 kbit/s with a 20 ms schedule table;<br>the frame set is QM and is specified with the actuator supplier. Not detailed here.<\/p><p><strong>UDS (<code>SWC_DiagnosticManager<\/code>).<\/strong> ISO 14229 services over the same CAN FD segment using the<br>OEM-assigned diagnostic identifiers; addressing is functional plus physical. Diagnostic traffic is<br>not part of the cyclic budget in section 4 because it only occurs at standstill in the workshop<br>(<code>SYS-REQ-021<\/code>, QM).<\/p><hr><h4>4 🔍 DEEP DIVE — Bus load and timing analysis (<code>OP-22<\/code>)<\/h4><h5>4.1 Frame time on the wire<\/h5><p>A CAN FD frame with a 29-bit identifier is transmitted partly at the arbitration bit rate and partly<br>at the data bit rate. Counted in bits:<\/p><div class='tw'><table><thead><tr><th>Portion<\/th><th>Bits<\/th><th>Rate<\/th><th>Time<\/th><\/tr><\/thead><tbody><tr><td>SOF, ID (11 + 18), SRR, IDE, RRS, FDF, res, BRS<\/td><td>36<\/td><td>500 kbit/s<\/td><td>72 µs<\/td><\/tr><tr><td>worst-case dynamic stuff bits in that portion<\/td><td>8<\/td><td>500 kbit/s<\/td><td>16 µs<\/td><\/tr><tr><td>ESI, DLC, data (8 byte = 64 bit), stuff count, CRC-17, fixed stuff bits<\/td><td>≈ 96<\/td><td>2 Mbit/s<\/td><td>48 µs<\/td><\/tr><tr><td>CRC delimiter, ACK slot, ACK delimiter, EOF, intermission<\/td><td>13<\/td><td>500 kbit/s<\/td><td>26 µs<\/td><\/tr><tr><td><strong>Total, 8-byte payload<\/strong><\/td><td><\/td><td><\/td><td><strong>≈ 162 µs, budgeted as 165 µs<\/strong><\/td><\/tr><tr><td><strong>Total, 32-byte payload<\/strong> (data phase ≈ 306 bit)<\/td><td><\/td><td><\/td><td><strong>≈ 267 µs, budgeted as 270 µs<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p>Engineering estimate, plausible example values. The stuffing terms are upper bounds; a real<br>calculation would come from the network design tool.<\/p><h5>4.2 Bus load contribution<\/h5><div class='tw'><table><thead><tr><th>Message<\/th><th>Frames/s<\/th><th>Frame time<\/th><th>Load<\/th><\/tr><\/thead><tbody><tr><td><code>LGT_Request_1<\/code><\/td><td>10<\/td><td>165 µs<\/td><td>0.17 %<\/td><\/tr><tr><td><code>VEH_Dynamics_1<\/code><\/td><td>50<\/td><td>165 µs<\/td><td>0.83 %<\/td><\/tr><tr><td><code>VEH_Environment_1<\/code><\/td><td>10<\/td><td>165 µs<\/td><td>0.17 %<\/td><\/tr><tr><td><code>OBJ_List_1<\/code><\/td><td>20<\/td><td>270 µs<\/td><td>0.54 %<\/td><\/tr><tr><td><code>LGT_Status_1<\/code><\/td><td>10<\/td><td>165 µs<\/td><td>0.17 %<\/td><\/tr><tr><td><code>LGT_Warning_1<\/code><\/td><td>2<\/td><td>165 µs<\/td><td>0.03 %<\/td><\/tr><tr><td><strong>Lighting signal set, total<\/strong><\/td><td><strong>102<\/strong><\/td><td><\/td><td><strong>≈ 1.9 %<\/strong><\/td><\/tr><tr><td>of which transmitted by <code>ECU_LightingCtrl<\/code><\/td><td>12<\/td><td><\/td><td><strong>≈ 0.20 %<\/strong><\/td><\/tr><tr><td>Background load of other ECUs (<code>A-14<\/code>)<\/td><td><\/td><td><\/td><td>≤ 35 %<\/td><\/tr><tr><td><strong>Segment total<\/strong><\/td><td><\/td><td><\/td><td><strong>≈ 37 %<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p>The design target for a segment carrying safety-relevant signals is 50 % (<code>A-14<\/code> background plus<br>this item&#x27;s contribution leaves 13 percentage points of headroom). The ECU&#x27;s own transmit budget is<br>bounded by <code>SYS-REQ-028<\/code> at 1.0 % over any 100 ms window; the worst 100 ms window contains one<br><code>LGT_Status_1<\/code>, one event-triggered and one cyclic <code>LGT_Warning_1<\/code> plus one jitter frame — four<br>frames, 660 µs, <strong>0.66 %<\/strong>.<\/p><h5>4.3 🔍 DEEP DIVE — Chain A: SG-01 fault detection to safe state<\/h5><div class='tw'><table><thead><tr><th>Step<\/th><th>Element<\/th><th>Contribution<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td>PWM synchronisation of the sample<\/td><td><code>Current_Sense_Chain<\/code><\/td><td>2.5 ms<\/td><td><code>SM-01<\/code><\/td><\/tr><tr><td>ADC acquisition<\/td><td><code>Current_Sense_Chain<\/code><\/td><td>0.1 ms<\/td><td><code>SM-01<\/code><\/td><\/tr><tr><td>Threshold window<\/td><td><code>SM-01<\/code><\/td><td>50 ms<\/td><td><code>SYS-REQ-014<\/code><\/td><\/tr><tr><td>Debounce<\/td><td><code>SM-01<\/code><\/td><td>20 ms<\/td><td><code>SM-01<\/code><\/td><\/tr><tr><td>Task latency to <code>SWC_LightManager<\/code><\/td><td><code>MCU_Lockstep<\/code><\/td><td>5 ms<\/td><td><code>SM-01<\/code><\/td><\/tr><tr><td><strong>Detection subtotal<\/strong><\/td><td><\/td><td><strong>77.6 ms, specified ≤ 80 ms<\/strong><\/td><td><code>HW-REQ-009<\/code><\/td><\/tr><tr><td><strong>Bus contribution<\/strong><\/td><td>—<\/td><td><strong>0 ms<\/strong><\/td><td>see below<\/td><\/tr><tr><td>Fault reaction to the safe state<\/td><td><code>SWC_LightManager<\/code>, <code>LED_Driver_Stage_1<\/code><\/td><td>150 ms<\/td><td><code>TSR-004<\/code>, <code>SG-01<\/code><\/td><\/tr><tr><td><strong>Total<\/strong><\/td><td><\/td><td><strong>230 ms<\/strong><\/td><td><\/td><\/tr><tr><td><strong>FTTI<\/strong><\/td><td><\/td><td><strong>300 ms<\/strong><\/td><td><code>SG-01<\/code><\/td><\/tr><tr><td><strong>Margin<\/strong><\/td><td><\/td><td><strong>70 ms (23 %)<\/strong><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p><strong>The bus is not in the SG-01 timing chain.<\/strong> Detection, decision and fault reaction all happen<br>inside <code>ECU_LightingCtrl<\/code>; the safe state — remaining channel kept at its set point — needs no<br>message. This is an architectural property, not an accident, and it is the reason the FTTI argument<br>survives any bus load assumption. The two bus-borne consequences of the fault, the driver warning<br>and the status message, are both outside the FTTI budget.<\/p><p><strong>Change note.<\/strong> The detection budget in this document previously implied the 70 ms figure of the<br>phase 2 status. The hardware refinement raised it to 80 ms worst case (<code>SM-01<\/code>, <code>HW-REQ-009<\/code>)<br>because PWM synchronisation, acquisition and task latency were not counted before. The allocated cap<br>of <code>SYS-REQ-018<\/code> stays at 100 ms, so the requirement did not change — the design value did, and the<br>budget still closes with 70 ms of margin.<\/p><h5>4.4 🔍 DEEP DIVE — Chain B: driver warning over the bus<\/h5><div class='tw'><table><thead><tr><th>Step<\/th><th>Contribution<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td>Classification complete (end of chain A detection)<\/td><td>t = 0<\/td><td>—<\/td><\/tr><tr><td>Transmit task period<\/td><td>10 ms<\/td><td>plausible example value<\/td><\/tr><tr><td>Worst-case queuing and arbitration delay on the segment<\/td><td>2.5 ms<\/td><td>1 × in-progress 64-byte frame (0.41 ms) + up to 10 higher-priority frames<\/td><\/tr><tr><td>Frame transmission <code>LGT_Warning_1<\/code><\/td><td>0.17 ms<\/td><td>section 4.1<\/td><\/tr><tr><td><strong>Inside the item boundary<\/strong><\/td><td><strong>≈ 13 ms, specified ≤ 20 ms<\/strong><\/td><td><code>SYS-REQ-026<\/code><\/td><\/tr><tr><td>Gateway forwarding to the instrument cluster<\/td><td>100 ms<\/td><td><code>A-17<\/code><\/td><\/tr><tr><td><strong>To the cluster input<\/strong><\/td><td><strong>≈ 113 ms<\/strong><\/td><td><\/td><\/tr><tr><td><strong>Budget<\/strong><\/td><td><strong>2000 ms<\/strong><\/td><td><code>SYS-REQ-010<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>If the first frame is lost, the cyclic repetition of <code>TSR-005<\/code> delivers the warning after at most a<br>further 500 ms, giving 613 ms — still inside the 2 s budget with a factor of three. That is what the<br>cyclic repetition buys, and it is why <code>SYS-REQ-026<\/code> adds the event-triggered frame rather than<br>replacing the cycle: the event frame removes the average latency, the cycle covers the loss case.<\/p><h5>4.5 📋 OVERVIEW — Chain C: SG-02 high-beam monitor<\/h5><div class='tw'><table><thead><tr><th>Step<\/th><th>Contribution<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td>Age of <code>AmbientLight<\/code> at evaluation (normal operation)<\/td><td>≤ 100 ms<\/td><td>interface table<\/td><\/tr><tr><td>Monitor task period<\/td><td>20 ms<\/td><td>plausible example value<\/td><\/tr><tr><td><strong>Detection subtotal<\/strong><\/td><td><strong>120 ms<\/strong><\/td><td><\/td><\/tr><tr><td>Fault reaction, de-energise high beam<\/td><td>250 ms<\/td><td><code>TSR-007<\/code>, <code>SG-02<\/code><\/td><\/tr><tr><td><strong>Total<\/strong><\/td><td><strong>370 ms<\/strong><\/td><td><\/td><\/tr><tr><td><strong>FTTI<\/strong><\/td><td><strong>500 ms<\/strong><\/td><td><code>SG-02<\/code><\/td><\/tr><tr><td><strong>Margin<\/strong><\/td><td><strong>130 ms (26 %)<\/strong><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p><strong>Finding — the <code>AmbientLight<\/code> timeout is longer than the SG-02 FTTI.<\/strong> The interface table gives<br><code>AmbientLight<\/code> a timeout of 500 ms, which equals the whole SG-02 FTTI. If the signal simply stops,<br><code>SWC_HighBeamMonitor<\/code> would not declare it invalid until the FTTI has already elapsed. The published<br>value is deliberately left unchanged here; two resolutions are on the table and the choice belongs<br>to <code>safety-manager<\/code>:<\/p><ol><li>shorten the <code>AmbientLight<\/code> timeout to ≤ 200 ms, or<\/li><li>require <code>SWC_HighBeamMonitor<\/code> to treat a stale — not yet timed-out — ambient signal older than 200 ms as &quot;high beam not plausible&quot; and de-energise.<\/li><\/ol><p>Option 2 is preferred because it keeps the timeout consistent with the 100 ms transmit cycle of a<br>QM-grade light sensor and puts the safety reaction where the ASIL sits. Tracked as <code>OP-29<\/code>.<\/p><hr><h4>5 🔍 DEEP DIVE — TSR allocation matrix<\/h4><div class='tw'><table><thead><tr><th>TSR<\/th><th>ASIL<\/th><th>Hardware measure<\/th><th>Software measure<\/th><th>System measure<\/th><\/tr><\/thead><tbody><tr><td>TSR-001<\/td><td>B<\/td><td><code>ASIC_Watchdog<\/code>, independent time base, disable path to the driver stages<\/td><td>Watchdog service task, question/answer protocol<\/td><td>—<\/td><\/tr><tr><td>TSR-002<\/td><td>B<\/td><td><code>Current_Sense_Chain<\/code> feedback<\/td><td><code>SWC_LightManager<\/code>: command/feedback comparison per cycle; E2E check of <code>SG_LightRequest<\/code> before the command is accepted (<code>SYS-REQ-023<\/code>)<\/td><td>Command source integrity per <code>SYS-REQ-022<\/code>, <code>SYS-REQ-027<\/code><\/td><\/tr><tr><td><strong>TSR-003<\/strong><\/td><td><strong>B<\/strong><\/td><td><strong><code>SM-01<\/code><\/strong> — shunt sensing, PWM-synchronous sampling, off-phase self-test (<code>HW-REQ-001<\/code> … <code>HW-REQ-010<\/code>), worst-case detection 80 ms (<code>HW-REQ-009<\/code>)<\/td><td>Threshold evaluation, debouncing, cause discrimination (<code>SYS-REQ-019<\/code>)<\/td><td>Detection budget cap 100 ms (<code>SYS-REQ-018<\/code>); chain A of the timing analysis, no bus contribution<\/td><\/tr><tr><td>TSR-004<\/td><td>B<\/td><td>Channel-wise independent driver stages<\/td><td><code>SWC_LightManager<\/code>: limp-home state machine; hold last valid set point on invalid light request (<code>SYS-REQ-025<\/code>)<\/td><td>Safe state defined in <code>SG-01<\/code>, reachable without the bus<\/td><\/tr><tr><td>TSR-005<\/td><td>B<\/td><td><code>CAN_FD_Transceiver<\/code><\/td><td>Event-triggered warning frame ≤ 20 ms plus cyclic 500 ms (<code>SYS-REQ-026<\/code>), E2E-protected group <code>SG_DriverWarning<\/code><\/td><td>Driver warning displayed by the instrument cluster (<code>A-04<\/code>), gateway forwarding (<code>A-17<\/code>)<\/td><\/tr><tr><td>TSR-006<\/td><td>QM(A)<\/td><td>—<\/td><td><code>SWC_HighBeamControl<\/code><\/td><td>Object d
