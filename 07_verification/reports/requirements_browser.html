udget of SG-01 (150 mA / 50 ms: plausible example values, not validated data). Measurement uncertainty at the threshold is +/-20 mA per HW-REQ-001; guaranteed trip below 130 mA, guaranteed no trip above 170 mA per HW-REQ-002.","up":["CR-007","FSR-001"],"down":["HW-REQ-003","HW-REQ-005","HW-REQ-008","SYS-REQ-015","SYS-REQ-016","SYS-REQ-017","SYS-REQ-018","SYS-REQ-019","TC-021"],"alloc":["ECU_LightingCtrl","SWC_LightManager","SM-01"],"vby":["TC-021"],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-014.md","body":"<h4>Context<\/h4><p>Reference record for the Requirements-as-Code format and part of the Golden Thread.<\/p><h4>Change note (phase 3 refinement, hardware-engineer)<\/h4><p>Previous wording: &quot;When the load current of a low-beam channel falls below 150 mA for more than 50 ms, the lighting ECU shall classify the channel as &#x27;open load&#x27; and increment the fault counter.&quot;<\/p><p>Two defects were resolved:<\/p><ol><li><strong>Not atomic<\/strong> — the fault counter was a second testable statement. Split out as <code>SYS-REQ-015<\/code>.<\/li><li><strong>Not unambiguous<\/strong> — the text did not say when the current is measured. Under PWM dimming the current is genuinely zero in every off-phase, so an ungated comparison trips on every dim cycle. The measurement is now bound to the PWM on-phase.<\/li><\/ol><p>The ID is retained because it carries the original meaning and is part of the Golden Thread. Status dropped from <code>reviewed<\/code> to <code>draft<\/code>; re-review required. Analysis: <a href=\"../../05_hardware/analysis_current_sensing.md\"><code>../../05_hardware/analysis_current_sensing.md<\/code><\/a><\/p><h4>Open points<\/h4><ol><li>Tolerance analysis of the current sensing — <strong>closed<\/strong>, see <code>HW-REQ-001<\/code> / <code>HW-REQ-002<\/code>.<\/li><\/ol>"},"SYS-REQ-015":{"id":"SYS-REQ-015","kind":"SYS-REQ","text":"When a low-beam channel is classified as \"open load\", the lighting ECU shall increment the fault counter of that channel.","type":"diagnostics","asil":"B","status":"draft","source":"SYS-REQ-014","rationale":"Split out of SYS-REQ-014 for atomicity - counting is a separate testable statement from classifying.","up":["SYS-REQ-014"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-015.md","body":"<h4>Context<\/h4><p>Created with the phase 3 refinement of SYS-REQ-014.<\/p>"},"SYS-REQ-016":{"id":"SYS-REQ-016","kind":"SYS-REQ","text":"The lighting ECU shall measure the load current of a low-beam channel with a total uncertainty of not more than +/-20 mA at the 150 mA classification threshold, over an ambient temperature range of -40 C to +85 C.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-014, FSR-001","rationale":"Makes the 150 mA threshold verifiable. Without a stated uncertainty the threshold cannot be tested and the classification is not falsifiable. Value from the tolerance chain, plausible example value.","up":["SYS-REQ-014","FSR-001"],"down":["HW-REQ-001","HW-REQ-002"],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-016.md","body":"<h4>Context<\/h4><p>Realised in hardware by HW-REQ-001 and HW-REQ-002.<\/p>"},"SYS-REQ-017":{"id":"SYS-REQ-017","kind":"SYS-REQ","text":"While the PWM on-time of a low-beam channel is shorter than 150 us, the lighting ECU shall report the open-load diagnosis of that channel as \"not available\".","type":"diagnostics","asil":"B","status":"draft","source":"SYS-REQ-014","rationale":"Below the minimum usable on-time no valid sample exists. Reusing the last valid sample would make the detection time unbounded, which cannot be argued against the FTTI. Plausible example value.","up":["SYS-REQ-014"],"down":["HW-REQ-004"],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-017.md","body":"<h4>Context<\/h4><p>Alternative to HW-REQ-004 (forced diagnostic window). Which of the two applies is a system-level decision - see open point in the analysis document.<\/p>"},"SYS-REQ-018":{"id":"SYS-REQ-018","kind":"SYS-REQ","text":"When an open load occurs in a low-beam channel, the lighting ECU shall report the fault to the fault reaction within 100 ms of fault occurrence.","type":"safety","asil":"B","status":"draft","source":"SYS-REQ-014, FSR-001","rationale":"Makes the detection budget explicit and testable. 100 ms is the allocated cap; the worst-case design value is 80 ms (HW-REQ-009). With the 150 ms fault reaction time of SG-01 the total stays below the 300 ms FTTI under any implementation variant.","up":["SYS-REQ-014","FSR-001"],"down":["HW-REQ-009","TC-021"],"alloc":["ECU_LightingCtrl","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-018.md","body":"<h4>Context<\/h4><p>The cap, not the design value, is the requirement - it leaves the implementation room while keeping the FTTI argument valid.<\/p>"},"SYS-REQ-019":{"id":"SYS-REQ-019","kind":"SYS-REQ","text":"When the measured load current of a low-beam channel falls below 150 mA, the lighting ECU shall classify the cause as exactly one of \"open load\", \"short-to-battery\" or \"commanded current reduction\" before triggering a fault reaction.","type":"diagnostics","asil":"B","status":"draft","source":"SYS-REQ-014","rationale":"A single current threshold cannot separate these causes. Short-to-battery reads as open load, and a commanded reduction through thermal derating is not a fault at all. Implementation-free - the means are specified in HW-REQ-006 and HW-REQ-007.","up":["SYS-REQ-014"],"down":["HW-REQ-006","HW-REQ-007","HW-REQ-020","SM-03"],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-019.md","body":"<h4>Context<\/h4><p>Does not cover partial string failure: with a constant-current driver that fault is invisible in the current domain, see the analysis document.<\/p>"},"SYS-REQ-020":{"id":"SYS-REQ-020","kind":"SYS-REQ","text":"The lighting ECU shall exchange light request, vehicle speed, steering angle, ambient brightness, object data and lighting status with the vehicle gateway via CAN FD according to SAE J1939.","type":"communication","asil":"B","status":"draft","source":"CR-020","rationale":"Carries signals used by safety functions; ASIL inherited from the highest function using them (SG-01, B). Signal detail in the interface table.","up":["CR-020"],"down":["HW-REQ-025","SYS-REQ-022","SYS-REQ-028"],"alloc":["ECU_LightingCtrl","Vehicle_Gateway"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-020.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-021":{"id":"SYS-REQ-021","kind":"SYS-REQ","text":"When a diagnostic tester sends a UDS request according to ISO 14229, the lighting ECU shall provide the stored diagnostic trouble codes within 100 ms.","type":"diagnostics","asil":"QM","status":"draft","source":"CR-019","rationale":"Reading the fault memory is not part of the safety chain; the safety-relevant warning path is SYS-REQ-010. QM.","up":["CR-019"],"down":[],"alloc":["ECU_LightingCtrl"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-021.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-022":{"id":"SYS-REQ-022","kind":"SYS-REQ","text":"The lighting ECU shall protect every safety-relevant signal group exchanged with the vehicle gateway with an alive counter and a checksum computed over the payload of that signal group.","type":"communication","asil":"B","status":"draft","source":"CR-020","rationale":"SYS-REQ-020 fixed the transport (CAN FD / SAE J1939) but not the data integrity. A bus signal that carries an ASIL B function needs protection against loss, repetition, insertion, incorrect sequence and corruption; a timeout alone covers only loss. Counter plus checksum is the minimum set. The concrete profile (4-bit alive counter, CRC-8, data identifier) is fixed in the message catalogue of the E/E architecture and is a plausible example value.","up":["CR-020","SYS-REQ-020"],"down":["SYS-REQ-023","SYS-REQ-024","SYS-REQ-027"],"alloc":["ECU_LightingCtrl","CAN_FD_Transceiver","SWC_LightManager","Vehicle_Gateway"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-022.md","body":"<h4>Context<\/h4><p>Created with the phase 3 refinement of the E/E architecture (open point <code>OP-21<\/code> / <code>OP-22<\/code>). Signal groups, data identifiers and the byte position of counter and checksum: <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>, section &quot;Message catalogue&quot;.<\/p><p>The receiver-side counterpart in the vehicle gateway is outside the item boundary and is covered by assumption <code>A-15<\/code>; it is part of the interface agreement tracked as <code>OP-10<\/code>.<\/p>"},"SYS-REQ-023":{"id":"SYS-REQ-023","kind":"SYS-REQ","text":"If the alive counter of a received safety-relevant signal group does not increase by one modulo its range, or if the received checksum does not match the checksum recomputed over the payload, the lighting ECU shall mark that signal group as invalid within one reception cycle.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-022","rationale":"Detection rule belonging to the protection of SYS-REQ-022. \"Within one reception cycle\" makes the detection latency bounded and testable; a tolerance of repeated counters is deliberately not granted, because the receiving functions all run slower than the transmit cycle.","up":["SYS-REQ-022"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-023.md","body":"<h4>Context<\/h4><p>The reaction to an invalid signal group is function-specific and is not part of this requirement: low beam see <code>SYS-REQ-025<\/code>, work-lamp inhibit see <code>TSR-008<\/code>, high-beam monitor see <code>TSR-007<\/code>.<\/p>"},"SYS-REQ-024":{"id":"SYS-REQ-024","kind":"SYS-REQ","text":"If a safety-relevant signal group is not received within the timeout defined for that signal group in the interface table, the lighting ECU shall mark that signal group as invalid.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-022","rationale":"Makes the timeout column of the interface table a requirement instead of a table entry. Covers the loss failure mode, which the counter and checksum of SYS-REQ-023 cannot cover on their own once transmission stops entirely.","up":["SYS-REQ-022"],"down":["SYS-REQ-025"],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-024.md","body":"<h4>Context<\/h4><p>The timeout values themselves stay in the interface table of <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a> so that they are maintained in one place. <code>TSR-008<\/code> is the oldest instance of this rule and is now a special case of it.<\/p>"},"SYS-REQ-025":{"id":"SYS-REQ-025","kind":"SYS-REQ","text":"While the light request signal group is marked as invalid and the low beam was energised at the moment of invalidation, the lighting ECU shall keep the low-beam channels energised at the last valid set point until a valid light request signal group is received again or the ignition signal changes to off.","type":"safety","asil":"B","status":"draft","source":"SYS-REQ-024","rationale":"Golden Thread. A communication fault must not switch off the low beam at night: that would be exactly hazard H-04 (unintended deactivation) triggered by the safety measure itself. Failing silent towards \"keep the light on\" is the correct direction for SG-01, and it is bounded because the loss is reported by SYS-REQ-024 and shown to the driver via the warning path.","up":["SYS-REQ-024","FSR-002"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-025.md","body":"<h4>Context<\/h4><p>The mirror case - light request invalid while the low beam is <em>not<\/em> energised - deliberately does not switch the low beam on. Automatic activation is covered by the ambient-brightness path (<code>SYS-REQ-002<\/code>), which carries its own validity information.<\/p>"},"SYS-REQ-026":{"id":"SYS-REQ-026","kind":"SYS-REQ","text":"When the lighting ECU has classified a low-beam channel as failed, it shall transmit the driver warning signal group as an event-triggered frame within 20 ms of the classification and subsequently with a cyclic repetition of 500 ms.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-010","rationale":"TSR-005 fixes only the cyclic repetition. Purely cyclic transmission would put up to one full cycle of 500 ms of dead time in front of the warning; the event-triggered first frame removes it and gives the 2 s budget of SYS-REQ-010 a margin of more than an order of magnitude. 20 ms is one transmit task period plus worst-case queuing delay (plausible example values).","up":["SYS-REQ-010","TSR-005"],"down":[],"alloc":["ECU_LightingCtrl","CAN_FD_Transceiver","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-026.md","body":"<h4>Context<\/h4><p>Timing derivation: <code>04_architecture/ee_architecture.md<\/code>, section &quot;Bus load and timing analysis&quot;, chain B.<\/p>"},"SYS-REQ-027":{"id":"SYS-REQ-027","kind":"SYS-REQ","text":"The lighting ECU shall include a signal-group-specific data identifier in the checksum computation of every safety-relevant signal group, and shall use a different data identifier for each signal group.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-022","rationale":"Without a data identifier in the checksum, a correctly formed frame delivered to the wrong identifier - a masquerade or a mis-routed frame in the gateway - passes the counter and checksum check. The identifier is what makes the check sensitive to the source of the data, not only to its content.","up":["SYS-REQ-022"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-027.md","body":"<h4>Context<\/h4><p>Data identifier values are listed in the message catalogue of <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>; they are plausible example values and must be agreed with the gateway supplier (<code>OP-28<\/code>).<\/p>"},"SYS-REQ-028":{"id":"SYS-REQ-028","kind":"SYS-REQ","text":"The lighting ECU shall occupy not more than 1.0 % of the nominal capacity of the CAN FD segment to which it is connected with its own transmitted frames, measured over any 100 ms window and under any operating condition including the fault reaction.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-020","rationale":"Turns the transmit budget of the bus load analysis into a verifiable bound. The bound covers only what the ECU controls - its own frames - because the receive traffic is produced by the vehicle gateway. The 100 ms window matters: an event-triggered warning frame (SYS-REQ-026) on top of the cyclic frames must not create a burst in exactly the fault case in which the bus is needed. Calculated worst 100 ms window 0.66 %, long-term average 0.20 % (plausible example values).","up":["SYS-REQ-020"],"down":[],"alloc":["ECU_LightingCtrl","CAN_FD_Transceiver"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-028.md","body":"<h4>Context<\/h4><p>Derivation and the assumed background load of other ECUs (<code>A-14<\/code>): <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>, section &quot;Bus load and timing analysis&quot;.<\/p>"},"TC-021":{"id":"TC-021","kind":"TC","text":"Fault injection of an open load on low-beam channel 1: evidence of detection, fault reaction within the fault reaction time, driver warning and DTC entry.","type":"fault-injection","asil":"B","status":"draft","source":"","rationale":"","up":["SYS-REQ-014","SYS-REQ-018","FSR-001","SG-01"],"down":[],"alloc":["HiL"],"vby":[],"verifies":["CR-007","FSR-001","SG-01","SM-01","SYS-REQ-014"],"tags":[],"file":"07_verification/testcases/TC-021.md","body":"<h4>Context<\/h4><p>Golden Thread test case. The measured time must be assessed against the FTTI of SG-01 (300 ms), not merely against &quot;a reaction occurred&quot;. The result is duty-dependent, so the PWM duty is fixed in the preconditions and the test is run at both ends of the specified range.<\/p><h4>Change note (phase 3 refinement, hardware-engineer)<\/h4><p>Expected result &quot;within 50 ms plus debounce&quot; replaced by the explicit 80 ms detection budget; preconditions now fix the PWM duty; steps now capture off-phase samples. Status dropped to <code>draft<\/code>.<\/p>"},"TSR-001":{"id":"TSR-001","kind":"TSR","text":"The lighting ECU shall monitor its own program execution by an external watchdog with an independent time base and shall de-energise the LED driver stages into the defined off state if the watchdog is not served within 50 ms.","type":"safety","asil":"B","status":"draft","source":"FSR-002","rationale":"Covers loss of control of the microcontroller, which would otherwise allow unintended activation or deactivation of any channel. Independent time base is required so that a clock fault cannot disable the monitor. Plausible example value.","up":["FSR-002"],"down":["HW-REQ-016","HW-REQ-017","HW-REQ-018","HW-REQ-019","SM-02","SM-06"],"alloc":["ECU_LightingCtrl","ASIC_Watchdog"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-001.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-002":{"id":"TSR-002","kind":"TSR","text":"The lighting ECU shall prevent energising or de-energising of a low-beam channel that was not requested by the light request signal, by evaluating the commanded state and the measured channel state in every monitoring cycle.","type":"safety","asil":"B","status":"draft","source":"FSR-002","rationale":"Technical realisation of FSR-002 (hazard H-04, unintended deactivation). Command/feedback comparison is the mechanism.","up":["FSR-002"],"down":["HW-REQ-021","SM-04"],"alloc":["ECU_LightingCtrl","SWC_LightManager","Current_Sense_Chain"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-002.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-003":{"id":"TSR-003","kind":"TSR","text":"The lighting ECU shall detect the loss of load current in a low-beam channel and report it to the fault reaction within 100 ms of fault occurrence.","type":"safety","asil":"B","status":"draft","source":"FSR-001","rationale":"Golden Thread technical safety requirement. Realised by SM-01 with a worst-case detection time of 80 ms (HW-REQ-009); the 100 ms is the allocated cap of SYS-REQ-018. Detection budget plus the 150 ms fault reaction time stays below the 300 ms FTTI of SG-01.","up":["FSR-001"],"down":["HW-REQ-020","SM-01","SM-03"],"alloc":["ECU_LightingCtrl","SM-01","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-003.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-004":{"id":"TSR-004","kind":"TSR","text":"When the loss of a low-beam channel has been reported, the lighting ECU shall establish the safe state of SG-01 within 150 ms by continuing to operate the remaining channel and setting the fault status.","type":"safety","asil":"B","status":"draft","source":"FSR-003","rationale":"Fault reaction time from SG-01. The safe state is degraded but visible, not off.","up":["FSR-003","FSR-001"],"down":["HW-REQ-019"],"alloc":["ECU_LightingCtrl","SWC_LightManager","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-004.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-005":{"id":"TSR-005","kind":"TSR","text":"The lighting ECU shall transmit the driver warning request on the vehicle bus with a cyclic repetition of at most 500 ms while a low-beam channel is classified as failed.","type":"safety","asil":"B","status":"draft","source":"FSR-004","rationale":"Cyclic repetition so that a single lost frame does not suppress the warning that carries the C rating of hazard H-01 (assumption A-03). Plausible example value.","up":["FSR-004"],"down":["SYS-REQ-026"],"alloc":["ECU_LightingCtrl","Vehicle_Gateway"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-005.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-006":{"id":"TSR-006","kind":"TSR","text":"The lighting ECU shall determine the high-beam segment to be masked from the object data and shall command the corresponding LED driver stage accordingly.","type":"safety","asil":"QM(A)","status":"draft","source":"FSR-006","rationale":"QM path of the ASIL decomposition of FSR-005. Admissible only together with TSR-007 and a demonstrated independence argument (RISK-02, DFA in phase 5).","up":["FSR-006"],"down":[],"alloc":["SWC_HighBeamControl"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-006.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-007":{"id":"TSR-007","kind":"TSR","text":"The lighting ECU shall evaluate, in a monitor independent of the high-beam control path, whether the commanded high-beam state is plausible against vehicle speed and ambient brightness, and shall de-energise the high beam within 250 ms if it is not.","type":"safety","asil":"A(A)","status":"draft","source":"FSR-007","rationale":"Safety path of the decomposition. Uses different input signals from TSR-006 and acts directly on the driver enable, which is the substance of the independence claim. Fault reaction time from SG-02.","up":["FSR-007"],"down":[],"alloc":["ECU_LightingCtrl","SWC_HighBeamMonitor"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-007.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-008":{"id":"TSR-008","kind":"TSR","text":"The lighting ECU shall inhibit energising of the work-lamp output stages while the vehicle speed signal exceeds 10 km/h or while the vehicle speed signal is invalid.","type":"safety","asil":"A","status":"draft","source":"FSR-008","rationale":"Extends SYS-REQ-005 by the signal-invalid case: a missing speed signal must not enable the work lamps, otherwise the inhibit can be defeated by a communication fault.","up":["FSR-008"],"down":[],"alloc":["ECU_LightingCtrl","SWC_WorkLampControl"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-008.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to HW / SW / system measures see <a href=\"../../04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"}},"diagrams":[{"name":"act_low_beam","title":"Activity - Activate low beam including the fault case (SYS-REQ-001, FSR-001)","file":"03_model/plantuml/act_low_beam.puml","svg":"PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIiBjb250ZW50U3R5bGVUeXBlPSJ0ZXh0L2NzcyIgZGF0YS1kaWFncmFtLXR5cGU9IkFDVElWSVRZIiBoZWlnaHQ9IjExODhweCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSIgc3R5bGU9IndpZHRoOjEwNjZweDtoZWlnaHQ6MTE4OHB4O2JhY2tncm91bmQ6I0ZGRkZGRjsiIHZlcnNpb249IjEuMSIgdmlld0JveD0iMCAwIDEwNjYgMTE4OCIgd2lkdGg9IjEwNjZweCIgem9vbUFuZFBhbj0ibWFnbmlmeSI+PD9wbGFudHVtbCAxLjIwMjYuNj8+PGRlZnMvPjxnPjxnIGNsYXNzPSJ0aXRsZSIgZGF0YS1zb3VyY2UtbGluZT0iMSI+PHRleHQgZmlsbD0iIzAwMDAwMCIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZvbnQtd2VpZ2h0PSI3MDAiIGxlbmd0aEFkanVzdD0ic3BhY2luZyIgdGV4dExlbmd0aD0iNjA5LjU0IiB4PSIyMjcuNjM4MiIgeT0iMzIuOTk1MSI+QWN0aXZpdHkgLSBBY3RpdmF0ZSBsb3cgYmVhbSBpbmNsdWRpbmcgdGhlIGZhdWx0IGNhc2UgKFNZUy1SRVEtMDAxLCBGU1ItMDAxKTwvdGV4dD48L2c+PHJlY3QgZmlsbD0iI0ZGRkZDQyIgaG <script>
const D = JSON.parse(document.getElementById('data').textContent);
const items = D.items, mods = D.modules;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function kindPill(k) {
  const c = D.colors[k] || '#777';
  return `<span class="pill kind" style="background:${c}">${esc(k)}</span>`;
}
function chips(ids) {
  if (!ids || !ids.length) return '<span class="none">-</span>';
  return ids.map(id => items[id]
    ? `<a class="chip" href="#r/${encodeURIComponent(id)}">${esc(id)}</a>`
    : `<span class="chip" title="not a record">${esc(id)}</span>`).join('');
}

/* ---- filters ---- */
const F = { q:'', kind:'', asil:'', status:'' };
function fill(sel, label, values) {
  const el = document.getElementById(sel);
  el.innerHTML = `<option value="">${label}</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
}
fill('fKind', 'All types', D.kinds);
fill('fAsil', 'All ASIL', D.asils);
fill('fStatus', 'All statuses', D.statuses);

function matches(r) {
  if (F.kind && r.kind !== F.kind) return false;
  if (F.asil && r.asil !== F.asil) return false;
  if (F.status && r.status !== F.status) return false;
  if (F.q) {
    const hay = (r.id + ' ' + r.text + ' ' + r.rationale + ' ' + r.alloc.join(' ') + ' ' +
                 r.type + ' ' + r.file).toLowerCase();
    if (!hay.includes(F.q)) return false;
  }
  return true;
}

/* ---- navigation ---- */
function renderNav() {
  const cur = location.hash;
  const nav = document.getElementById('nav');
  const keepScroll = nav.scrollTop;
  // A record is "in" its module, so opening one keeps the module highlighted.
  let openMod = null;
  if (cur.startsWith('#r/')) {
    const r = items[decodeURIComponent(cur.slice(3))];
    if (r) openMod = (mods.find(m => m.ids.includes(r.id)) || {}).id;
  }
  let h = `<h2>Grouping</h2>
    <select id="grouping">
      <option value="aspice">ASPICE process areas</option>
      <option value="iso">ISO 26262 parts</option>
      <option value="folder">Repository folders</option>
    </select>
    <a class="mod${cur.startsWith('#v') || cur === '' ? ' sel' : ''}" href="#v/${grouping === 'folder' ? 'aspice' : grouping}">
       V-model overview<span class="sub">all process areas, populated or not</span></a>`;

  if (grouping === 'folder') {
    h += '<h2>Modules</h2>';
    for (const m of mods) {
      const n = m.ids.filter(id => matches(items[id])).length;
      const sel = (cur === '#m/' + encodeURIComponent(m.id) || m.id === openMod) ? ' sel' : '';
      h += `<a class="mod${sel}" href="#m/${encodeURIComponent(m.id)}">
              <span class="n">${n}/${m.ids.length}</span>${esc(m.title)}
              <span class="sub">${esc(m.path)}${m.process ? ' &middot; ' + esc(m.process) : ''}</span>
            </a>`;
    }
  } else {
    const fw = grouping === 'iso' ? 'ISO' : 'ASPICE';
    for (const lvl of D.levels) {
      const inLevel = D.areas.filter(a => a.framework === fw && a.level === lvl.id);
      if (!inLevel.length) continue;
      h += `<h2>${esc(lvl.title)}</h2>`;
      for (const a of inLevel) {
        const n = a.ids.filter(id => matches(items[id])).length;
        const sel = cur === '#a/' + encodeURIComponent(a.id) ? ' sel' : '';
        // Records and documents are different things; mixing them into one ratio made
        // an area with three documents and no records read as "0/3", i.e. as nothing done.
        const count = a.empty ? 'empty'
          : a.ids.length ? `${n}/${a.ids.length}`
          : `${a.docs.length} doc${a.docs.length > 1 ? 's' : ''}`;
        h += `<a class="mod${sel}" href="#a/${encodeURIComponent(a.id)}">
                <span class="n">${count}</span>${esc(a.id)}
                <span class="sub">${esc(a.name)}</span></a>`;
      }
    }
  }
  h += '<h2>Model views</h2>';
  for (const d of D.diagrams) {
    const sel = cur === '#d/' + encodeURIComponent(d.name) ? ' sel' : '';
    h += `<a class="mod${sel}" href="#d/${encodeURIComponent(d.name)}">${esc(d.name)}
            <span class="sub">${esc(d.title)}</span></a>`;
  }
  h += '<h2>Documents</h2>';
  for (const doc of D.documents) {
    h += `<a class="mod" href="../../${doc.path}">${esc(doc.title)}
            <span class="sub">${esc(doc.path)}</span></a>`;
  }
  nav.innerHTML = h;
  nav.scrollTop = keepScroll;
  const g = document.getElementById('grouping');
  g.value = grouping;
  // The grouping goes into the URL like everything else, so a reload keeps it and a
  // link can point at "the ISO view" rather than at whatever the recipient last chose.
  g.onchange = e => {
    grouping = e.target.value;
    location.hash = grouping === 'folder' ? '#m/' + encodeURIComponent(mods[0].id)
                                          : '#v/' + grouping;
  };
}

/* ---- views ---- */
let grouping = 'aspice';
let sortCol = 'id', sortAsc = true;
const COLS = [['id','ID'],['text','Text'],['type','Type'],['asil','ASIL'],
              ['status','Status'],['up','Derived from'],['down','Refined by'],['vby','Verified by']];

function table(ids) {
  const rows = ids.map(id => items[id]).filter(matches);
  rows.sort((a, b) => {
    let x = a[sortCol], y = b[sortCol];
    if (Array.isArray(x)) { x = x.length; y = y.length; }
    if (sortCol === 'id') {
      const na = parseInt(a.id.split('-').pop(), 10), nb = parseInt(b.id.split('-').pop(), 10);
      x = a.kind + String(na).padStart(4, '0'); y = b.kind + String(nb).padStart(4, '0');
    }
    return (x > y ? 1 : x < y ? -1 : 0) * (sortAsc ? 1 : -1);
  });
  if (!rows.length) return '<p class="none">No record matches the current filter.</p>';
  const head = COLS.map(([k, l]) =>
    `<th data-c="${k}">${l}${sortCol === k ? (sortAsc ? ' &uarr;' : ' &darr;') : ''}</th>`).join('');
  const body = rows.map(r => `<tr>
      <td class="id">${kindPill(r.kind)} <a href="#r/${encodeURIComponent(r.id)}">${esc(r.id)}</a></td>
      <td class="txt">${esc(r.text)}</td>
      <td>${esc(r.type)}</td>
      <td><span class="pill">${esc(r.asil || '-')}</span></td>
      <td><span class="pill">${esc(r.status)}</span></td>
      <td>${chips(r.up)}</td>
      <td>${chips(r.down)}</td>
      <td>${chips(r.vby.length ? r.vby : r.verifies)}</td>
    </tr>`).join('');
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function viewModule(id) {
  const m = mods.find(x => x.id === id) || mods[0];
  return `<h2 class="title">${esc(m.title)}</h2>
          <p class="sub">${esc(m.path)}${m.process ? ' &middot; ' + esc(m.process) : ''}
             &middot; ${m.ids.length} records</p>${table(m.ids)}`;
}

function viewRecord(id) {
  const r = items[id];
  if (!r) return `<p class="none">Unknown record ${esc(id)}.</p>`;
  return `<h2 class="title">${kindPill(r.kind)} ${esc(r.id)}</h2>
    <p class="sub">${esc(r.file)}</p>
    <div class="card"><h3>Requirement text</h3>
      <div class="reqtext">${esc(r.text)}</div></div>
    <dl class="grid">
      <dt>Type</dt><dd>${esc(r.type || '-')}</dd>
      <dt>ASIL</dt><dd><span class="pill">${esc(r.asil || '-')}</span></dd>
      <dt>Status</dt><dd><span class="pill">${esc(r.status || '-')}</span></dd>
      <dt>Source</dt><dd>${esc(r.source || '-')}</dd>
      <dt>Derived from</dt><dd>${chips(r.up)}</dd>
      <dt>Refined by</dt><dd>${chips(r.down)}</dd>
      <dt>Allocated to</dt><dd>${r.alloc.length
        ? r.alloc.map(a => `<span class="chip">${esc(a)}</span>`).join('') : '<span class="none">-</span>'}</dd>
      <dt>Verified by</dt><dd>${chips(r.vby)}</dd>
      ${r.verifies.length ? `<dt>Verifies</dt><dd>${chips(r.verifies)}</dd>` : ''}
      ${r.tags.length ? `<dt>Tags</dt><dd>${r.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</dd>` : ''}
    </dl>
    ${r.rationale ? `<div class="card"><h3>Rationale</h3><div>${esc(r.rationale)}</div></div>` : ''}
    ${r.body ? `<div class="body">${r.body}</div>` : ''}
    <p class="foot">Source of truth is the record file, not this page:
       <a href="../../${r.file}">${esc(r.file)}</a></p>`;
}

function viewDiagram(name) {
  const d = D.diagrams.find(x => x.name === name);
  if (!d) return '<p class="none">Unknown diagram.</p>';
  const img = d.svg
    ? `<div class="diagram"><img alt="${esc(d.title)}" src="data:image/svg+xml;base64,${d.svg}"></div>`
    : `<div class="banner">Not rendered - PlantUML was unavailable when this page was generated.
         The source below is authoritative either way.</div>`;
  return `<h2 class="title">${esc(d.title)}</h2>
    <p class="sub">${esc(d.file)}</p>${img}
    <p style="margin:12px 0"><button class="link" onclick="
       var e=document.getElementById('src');
       e.style.display = e.style.display === 'none' ? 'block' : 'none';">Show / hide source</button></p>
    <pre class="code" id="src" style="display:none">${esc(d.src)}</pre>`;
}

function areaCard(a) {
  const n = a.ids.filter(id => matches(items[id])).length;
  const bits = [];
  if (a.ids.length) bits.push(`${n}/${a.ids.length} records`);
  if (a.docs.length) bits.push(`${a.docs.length} document${a.docs.length > 1 ? 's' : ''}`);
  return `<a class="acard${a.empty ? ' empty' : ''}" href="#a/${encodeURIComponent(a.id)}">
            <span class="ac">${bits.length ? bits.join(' &middot; ') : 'not started'}</span>
            <span class="aid">${esc(a.id)}</span>
            <span class="an">${esc(a.name)}</span></a>`;
}

function viewVModel() {
  const fw = grouping === 'iso' ? 'ISO' : 'ASPICE';
  const label = fw === 'ISO' ? 'ISO 26262 parts' : 'ASPICE process areas';
  let h = `<h2 class="title">V-model overview</h2>
    <p class="sub">${esc(label)} &middot; allocation from
       <a href="../../09_process/aspice_mapping.md">09_process/aspice_mapping.md</a>.
       An area with a dashed border has no work product yet -- that is the project's state,
       not a rendering gap.</p>`;

  for (const lvl of D.levels) {
    const inLevel = D.areas.filter(a => a.framework === fw && a.level === lvl.id);
    if (!inLevel.length) continue;
    const left = inLevel.filter(a => a.side === 'left');
    const right = inLevel.filter(a => a.side === 'right');
    const sup = inLevel.filter(a => a.side === 'supporting');
    h += `<div class="vlevel"><h3>${esc(lvl.title)}</h3>`;
    // Two columns only where both arms exist. The ISO 26262 parts are not split into a
    // specification and a verification arm, so forcing the layout would print an empty
    // "Verification" column at every level and imply a gap that is not there.
    if (left.length && right.length) {
      h += `<div class="vcols">
              <div><h4>Specification</h4>${left.map(areaCard).join('')}</div>
              <div><h4>Verification</h4>${right.map(areaCard).join('')}</div>
            </div>`;
    } else if (left.length || right.length) {
      h += left.concat(right).map(areaCard).join('');
    }
    if (sup.length) h += sup.map(areaCard).join('');
    h += '</div>';
  }
  return h;
}

function viewArea(id) {
  const a = D.areas.find(x => x.id === id);
  if (!a) return `<p class="none">Unknown process area ${esc(id)}.</p>`;
  const side = a.side === 'left' ? 'specification' : a.side === 'right' ? 'verification' : 'supporting';
  let h = `<h2 class="title">${esc(a.id)} &mdash; ${esc(a.name)}</h2>
    <p class="sub">${esc(a.framework === 'ISO' ? 'ISO 26262' : 'ASPICE')} &middot;
       ${esc(a.level)} level &middot; ${esc(side)}</p>`;

  if (a.empty) {
    h += `<div class="banner">No work product is allocated to this area yet.
            The allocation itself is stated in
            <a href="../../09_process/aspice_mapping.md">aspice_mapping.md</a>;
            an empty area means the phase that would produce it has not been run.</div>`;
  }
  if (a.docs.length) {
    h += `<div class="card"><h3>Documents</h3><div class="doclist">` +
      a.docs.map(d => d.exists
        ? `<a href="../../${d.path}">${esc(d.path)}</a>`
        : `<span class="missing">${esc(d.path)} &mdash; allocated but not present</span>`).join('') +
      `</div></div>`;
  }
  if (a.ids.length) h += `<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.6px;
                            color:var(--muted);margin:18px 0 8px">Records</h3>` + table(a.ids);
  return h;
}

function viewSearch() {
  const total = Object.keys(items).length;
  const n = Object.keys(items).filter(id => matches(items[id])).length;
  return `<h2 class="title">Search results</h2>
    <p class="sub">${n} of ${total} records match &ldquo;${esc(F.q)}&rdquo;
       &middot; <button class="link" onclick="clearSearch()">clear the search</button></p>` +
    table(Object.keys(items));
}
function clearSearch() {
  F.q = '';
  document.getElementById('q').value = '';
  showSearch = false;
  render();
}

// Which of the two wins: typing in the search box shows results, following a link
// shows that record or diagram. Without this, clicking a search result appears to do
// nothing, because the results view would keep overriding it.
let showSearch = false;

function render() {
  const h = location.hash;
  let out;
  if (h.startsWith('#v/')) {
    const g = h.slice(3);
    if (g === 'aspice' || g === 'iso') grouping = g;
  } else if (h.startsWith('#m/')) {
    grouping = 'folder';
  } else if (h.startsWith('#a/')) {
    // Keep the sidebar on the framework the opened area belongs to.
    const a = D.areas.find(x => x.id === decodeURIComponent(h.slice(3)));
    if (a) grouping = a.framework === 'ISO' ? 'iso' : 'aspice';
  }
  if (F.q && showSearch) out = viewSearch();
  else if (h.startsWith('#a/')) out = viewArea(decodeURIComponent(h.slice(3)));
  else if (h.startsWith('#r/')) out = viewRecord(decodeURIComponent(h.slice(3)));
  else if (h.startsWith('#d/')) out = viewDiagram(decodeURIComponent(h.slice(3)));
  else if (h.startsWith('#m/')) out = viewModule(decodeURIComponent(h.slice(3)));
  else if (h === '#all') out = `<h2 class="title">All records</h2>
      <p class="sub">${Object.keys(items).length} records across ${mods.length} modules</p>` +
      table(Object.keys(items));
  else out = viewVModel();
  document.getElementById('content').innerHTML = out;
  document.getElementById('content').scrollTop = 0;
  document.querySelectorAll('th[data-c]').forEach(th => th.onclick = () => {
    const c = th.dataset.c;
    if (sortCol === c) sortAsc = !sortAsc; else { sortCol = c; sortAsc = true; }
    render();
  });
  renderNav();
}

document.getElementById('stats').innerHTML =
  Object.entries(D.stats).map(([k, v]) => `${esc(k)}: <strong>${esc(v)}</strong>`).join(' &middot; ') +
  ` &middot; ${D.ndiagrams} model views &middot; <a href="#v/aspice">V-model</a>
    &middot; <a href="#all">all records</a>`;

document.getElementById('q').oninput = e => {
  F.q = e.target.value.toLowerCase();
  showSearch = true;
  render();
};
for (const [sel, key] of [['fKind','kind'],['fAsil','asil'],['fStatus','status']]) {
  document.getElementById(sel).onchange = e => { F[key] = e.target.value; render(); };
}
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSearch();
});
window.addEventListener('hashchange', () => { showSearch = false; render(); });
render();
</script>
</body>
</html>
