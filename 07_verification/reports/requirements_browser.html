ata from the vehicle (<code>A-05<\/code>), <code>OBJ_List_1<\/code> deliberately without E2E<\/td><\/tr><tr><td>TSR-007<\/td><td>A(A)<\/td><td>Separate enable path to the high-beam driver stage<\/td><td><code>SWC_HighBeamMonitor<\/code>, separate task and memory partition; uses the E2E-protected groups <code>SG_VehicleDynamics<\/code> and <code>SG_Environment<\/code><\/td><td>Independence argument, DFA in phase 5 (<code>RISK-02<\/code>); ambient-signal staleness open (<code>OP-29<\/code>)<\/td><\/tr><tr><td>TSR-008<\/td><td>A<\/td><td>—<\/td><td><code>SWC_WorkLampControl<\/code>, inhibit incl. signal-invalid case<\/td><td>Speed signal timeout and E2E invalidation per <code>SYS-REQ-023<\/code>, <code>SYS-REQ-024<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong>Reading the matrix:<\/strong> a TSR with an entry in only one column is a warning sign. <code>TSR-006<\/code> is<br>QM-only by construction — that is exactly why it is admissible only in combination with <code>TSR-007<\/code>.<\/p><p><strong>What the communication refinement changed here.<\/strong> <code>TSR-002<\/code>, <code>TSR-005<\/code> and <code>TSR-008<\/code> previously<br>relied on the bus behaving well. They now name the mechanism that makes that assumption checkable:<br>an E2E-protected signal group with an explicit invalidation rule. <code>TSR-003<\/code> and <code>TSR-004<\/code> were not<br>weakened — they were shown to be independent of the bus altogether, which is the stronger statement.<\/p><h5>5.1 Allocation of the new system requirements<\/h5><div class='tw'><table><thead><tr><th>SYS-REQ<\/th><th>ASIL<\/th><th>Hardware element<\/th><th>Software element<\/th><th>System / external<\/th><\/tr><\/thead><tbody><tr><td>SYS-REQ-022<\/td><td>B<\/td><td><code>CAN_FD_Transceiver<\/code>, CAN controller of <code>MCU_Lockstep<\/code><\/td><td><code>SWC_LightManager<\/code> (E2E wrapper on every safety-relevant group)<\/td><td>Gateway counterpart (<code>A-15<\/code>, <code>OP-10<\/code>)<\/td><\/tr><tr><td>SYS-REQ-023<\/td><td>B<\/td><td>—<\/td><td><code>SWC_LightManager<\/code><\/td><td>—<\/td><\/tr><tr><td>SYS-REQ-024<\/td><td>B<\/td><td>—<\/td><td><code>SWC_LightManager<\/code><\/td><td>Timeout values from the interface table<\/td><\/tr><tr><td>SYS-REQ-025<\/td><td>B<\/td><td><code>LED_Driver_Stage_1<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td>Golden Thread, realises the SG-01 safe direction on communication loss<\/td><\/tr><tr><td>SYS-REQ-026<\/td><td>B<\/td><td><code>CAN_FD_Transceiver<\/code><\/td><td><code>SWC_LightManager<\/code><\/td><td>Gateway forwarding (<code>A-17<\/code>)<\/td><\/tr><tr><td>SYS-REQ-027<\/td><td>B<\/td><td>—<\/td><td><code>SWC_LightManager<\/code><\/td><td>Data identifiers agreed with the gateway supplier (<code>OP-28<\/code>)<\/td><\/tr><tr><td>SYS-REQ-028<\/td><td>B<\/td><td><code>CAN_FD_Transceiver<\/code><\/td><td><code>SWC_LightManager<\/code> transmit scheduling<\/td><td>Segment budget (<code>A-14<\/code>)<\/td><\/tr><\/tbody><\/table><\/div><p>The E2E handling is allocated to <code>SWC_LightManager<\/code> rather than to <code>SWC_DiagnosticManager<\/code>, because<br><code>SWC_DiagnosticManager<\/code> is QM and must not sit in an ASIL B data path. Whether the E2E wrapper<br>becomes a component of its own is a software architecture decision and is left to phase 7.<\/p><hr><h4>6 System-level decisions taken in this phase<\/h4><p><strong>OP-17 — gating below the minimum PWM on-time: decided in favour of <code>SYS-REQ-017<\/code>,<br>&quot;diagnosis not available&quot;.<\/strong> The forced diagnostic window of <code>HW-REQ-004<\/code> injects a current pulse<br>into a channel that the driver deliberately dimmed, which is visible as flicker at low duty and<br>constitutes an unrequested actuation of a safety-relevant output — precisely what <code>TSR-002<\/code> is meant<br>to prevent. Declaring the diagnosis unavailable is honest and bounded: it is reported on the bus,<br>and it is time-limited because low beam runs at duty ≥ 20 % under <code>A-09<\/code>. <code>HW-REQ-004<\/code> is therefore<br><strong>not<\/strong> implemented in the base variant and is retained as an option for work lamps, where deep<br>dimming is a normal operating case.<\/p><p><strong>OP-18 — per-string current sensing: decided against, with a compensating measure.<\/strong> Per-string<br>sensing would require a second shunt and sense channel per driver stage; the benefit is confined to<br>one failure mode (loss of one parallel string). The same failure mode is covered by the channel<br>voltage measurement <code>HW-REQ-006<\/code>, which is needed anyway to discriminate short-to-battery. The<br>decision is therefore <em>channel voltage instead of per-string current<\/em>, and it must be revisited if<br>the FMEDA in phase 5 shows the diagnostic coverage target cannot be met without it.<\/p><p>Both decisions change what the diagnosis can do, not only how it is built, and are consequently<br>recorded here rather than in the hardware requirements.<\/p><p><strong>OP-21 / OP-22 — end-to-end protection: decided for a counter-and-CRC profile, not for a plain<br>timeout.<\/strong> The alternative considered was to leave the interface at cyclic transmission plus timeout<br>and to argue integrity from the CAN CRC alone. That argument does not hold across a gateway: the CAN<br>CRC is regenerated per segment, so a corruption or a mis-routing inside <code>Vehicle_Gateway<\/code> is<br>invisible to the receiver. The counter also covers repetition and incorrect sequence, which no<br>transport-layer check covers. The cost is 2 bytes of payload and a receiver-side state machine per<br>group — cheap against the alternative of raising the whole gateway to ASIL B.<\/p><p><strong>Deliberately not protected: <code>OBJ_List_1<\/code>.<\/strong> Extending E2E to the object list would produce a<br>protected channel into a QM function. The decomposition (<code>TSR-006<\/code> QM(A) / <code>TSR-007<\/code> A(A)) already<br>states that the object path is not trusted; adding integrity there would blur exactly the boundary<br>the decomposition depends on.<\/p><hr><h4>7 Open points<\/h4><div class='tw'><table><thead><tr><th>ID<\/th><th>Point<\/th><th>Owner<\/th><th>Status<\/th><\/tr><\/thead><tbody><tr><td>OP-10<\/td><td>Interface agreement (DIA) for <code>ObjectList<\/code> with the vehicle manufacturer<\/td><td>safety-manager<\/td><td>open<\/td><\/tr><tr><td>OP-21<\/td><td>Message catalogue and signal encoding for CAN FD / J1939 at frame level<\/td><td>systems-engineer<\/td><td><strong>closed<\/strong> — section 3; residual items split to <code>OP-27<\/code> / <code>OP-28<\/code><\/td><\/tr><tr><td>OP-22<\/td><td>Bus load and timing analysis for the cycle times of the interface table<\/td><td>systems-engineer<\/td><td><strong>closed<\/strong> — section 4; residual assumption <code>A-14<\/code><\/td><\/tr><tr><td>OP-23<\/td><td>The decision against per-string sensing must be revisited after the FMEDA<\/td><td>safety-analyst<\/td><td>open<\/td><\/tr><tr><td>OP-27<\/td><td>Confirm PGNs, source addresses and the background bus load against the OEM J1939 database and network design (<code>A-14<\/code>, <code>A-16<\/code>)<\/td><td>systems-engineer, with safety-manager via the DIA<\/td><td>open<\/td><\/tr><tr><td>OP-28<\/td><td>Agree the E2E data identifiers, CRC parameters and counter handling with the gateway supplier (<code>A-15<\/code>)<\/td><td>safety-manager<\/td><td>open<\/td><\/tr><tr><td>OP-29<\/td><td><code>AmbientLight<\/code> timeout (500 ms) equals the SG-02 FTTI — decide between shortening the timeout and a staleness reaction in <code>SWC_HighBeamMonitor<\/code> (section 4.5)<\/td><td>safety-manager<\/td><td>open<\/td><\/tr><tr><td>OP-30<\/td><td><code>HW-REQ-004<\/code> is not implemented in the base variant but its record does not say so; the hardware requirement set needs the variant marking<\/td><td>hardware-engineer<\/td><td><strong>closed<\/strong> — variant applicability added to <code>HW-REQ-004<\/code><\/td><\/tr><tr><td>OP-31<\/td><td><code>HW-REQ-025<\/code> covers the bus short / dominant timeout of <code>CAN_FD_Transceiver<\/code>; still missing are bus-off recovery, wake behaviour and transceiver fault status readback, which <code>SYS-REQ-026<\/code> and <code>SYS-REQ-028<\/code> depend on<\/td><td>hardware-engineer<\/td><td>open<\/td><\/tr><tr><td>OP-32<\/td><td><code>ibd_ecu.puml<\/code> does not contain <code>CAN_FD_Transceiver<\/code> and <code>LIN_Transceiver<\/code>, which <code>bdd_system.puml<\/code> now shows as blocks of <code>ECU_LightingCtrl<\/code><\/td><td>mbse-modeler<\/td><td><strong>closed<\/strong> — both added by the parallel hardware refinement of <code>ibd_ecu.puml<\/code><\/td><\/tr><tr><td>OP-33<\/td><td>Verification methods and test cases for <code>SYS-REQ-022<\/code> … <code>SYS-REQ-028<\/code> (E2E fault injection, bus load measurement, latency measurement)<\/td><td>verification-engineer<\/td><td>open<\/td><\/tr><\/tbody><\/table><\/div><hr><p><strong>Work products:<\/strong> <code>ee_architecture.md<\/code> → <code>04_architecture/<\/code> · <code>allocation.md<\/code> →<br><code>04_architecture/<\/code> · <code>TSR-001<\/code> … <code>TSR-008<\/code> → <code>02_safety/04_tsc/<\/code> · <code>SYS-REQ-001<\/code> … <code>SYS-REQ-028<\/code> →<br><code>01_requirements/system/<\/code> · <code>bdd_ee_architecture.puml<\/code>, <code>bdd_system.puml<\/code>, <code>ctx_item.puml<\/code> →<br><code>03_model/plantuml/<\/code><br><strong>Open points:<\/strong> <code>OP-10<\/code>, <code>OP-23<\/code>, <code>OP-27<\/code> … <code>OP-33<\/code> remain open; <code>OP-21<\/code> and <code>OP-22<\/code> are closed by<br>sections 3 and 4.<br><strong>Process reference:<\/strong> ASPICE <strong>SYS.2<\/strong> (system requirements analysis), <strong>SYS.3<\/strong> (system<br>architectural design, incl. the interface and dynamic behaviour of the architectural elements) ·<br>ISO 26262 <strong>Part 4<\/strong> (technical safety concept, system design, and the allocation of technical<br>safety requirements to hardware and software) · <strong>Part 6<\/strong> (software-level realisation of the E2E<br>mechanism, phase 7) · <strong>Part 9<\/strong> (ASIL decomposition for <code>TSR-006<\/code> / <code>TSR-007<\/code>).<\/p>"},{"path":"05_hardware/analysis_current_sensing.md","title":"Analysis — low-beam current sensing and open-load detection (SM-01 / SYS-REQ-014)","folder":"05_hardware","exists":true,"html":"<p><strong>Status:<\/strong> <strong>Applied<\/strong> to the records. Resolves the open point &quot;tolerance analysis of the current<br>sensing&quot; attached to <code>SYS-REQ-014<\/code>. The records created or changed from this analysis are listed in<br>section 11; all of them carry a change note.<br><strong>Owner:<\/strong> hardware-engineer · <strong>Process:<\/strong> ASPICE HWE.1 · ISO 26262-5<\/p><blockquote>All numeric values are plausible example values of a teaching/reference project, not validated data. Design assumptions are marked as <code>A-xx<\/code> candidates.<\/blockquote><hr><h4>1 Assumed sensing topology (<code>A-08<\/code>, <code>A-09<\/code>, <code>A-11<\/code>)<\/h4><div class='tw'><table><thead><tr><th>Item<\/th><th>Plausible example value<\/th><\/tr><\/thead><tbody><tr><td>Channel set point, nominal<\/td><td>1.20 A (constant-current buck LED driver)<\/td><\/tr><tr><td>String topology<\/td><td>2 parallel strings x 600 mA, 6 LEDs each, Vf ~ 3.2 V<\/td><\/tr><tr><td>Shunt<\/td><td>50 mOhm, +/-1.0 % initial, TCR +/-50 ppm/K<\/td><\/tr><tr><td>Sense amplifier<\/td><td>gain 50 V/V, Vos +/-150 uV RTI, gain error +/-1.0 %<\/td><\/tr><tr><td>ADC<\/td><td>12 bit, Vref 3.3 V +/-0.5 %, offset +/-3 LSB, INL +/-2 LSB<\/td><\/tr><tr><td>PWM<\/td><td>400 Hz, duty &gt;= 20 % in normal operation<\/td><\/tr><tr><td>Operating range<\/td><td>-40 ... +85 °C ambient<\/td><\/tr><\/tbody><\/table><\/div><p>1 LSB = 0.32 mA of channel current.<\/p><h4>2 Tolerance chain at the 150 mA threshold<\/h4><div class='tw'><table><thead><tr><th>Group<\/th><th>Worst case<\/th><\/tr><\/thead><tbody><tr><td>Offset-type (amp Vos, ADC offset, INL, quantisation)<\/td><td>+/-4.8 mA<\/td><\/tr><tr><td>Gain-type (shunt tolerance + TCR + drift, amp gain, ADC reference)<\/td><td>+/-3.33 % = +/-5.0 mA<\/td><\/tr><tr><td>Residual conducted-disturbance error allowance<\/td><td>+/-10 mA<\/td><\/tr><tr><td><strong>Total at threshold<\/strong><\/td><td><strong>+/-20 mA<\/strong><\/td><\/tr><\/tbody><\/table><\/div><pre class='code'>Guaranteed trip      I_true &lt; 130 mA   always evaluated as below threshold\nGuaranteed no trip   I_true &gt; 170 mA   never evaluated as below threshold\nIndeterminate band   130 ... 170 mA    13 % of threshold, 1.7 % of nominal<\/pre><p>Worst-case reading at the minimum regulated current (1.14 A) is 1.097 A — a factor of 6.4 above the<br>upper band edge. <strong>The fixed 150 mA threshold is defensible for complete loss of load current.<\/strong><\/p><p><strong>Derived constraint:<\/strong> the threshold stays free of false trips only while the commanded set point<br>exceeds 191 mA. With a design margin, the <strong>thermal derating curve must never command a channel<br>below 400 mA<\/strong> — otherwise normal derating produces a spurious safe-state transition. This<br>constraint exists nowhere in the current record set.<\/p><h4>3 PWM dimming — gating<\/h4><p>The measured current is genuinely zero during every PWM off-phase, so an ungated comparison trips on<br>every dim cycle. Required:<\/p><ol><li><strong>PWM-synchronous, hardware-triggered sampling<\/strong> — a software trigger cannot guarantee the phase relationship under interrupt load, and a phase error of one on-time is a 100 % measurement error.<\/li><li><strong>Blanking<\/strong> — 50 us after the rising edge (driver rise 20 us, amplifier settling 15 us, filter group delay 8 us, edge ringing 10 us), 20 us guard before the falling edge, ~20 us conversion → minimum usable on-time <strong>150 us<\/strong> (6 % duty at 400 Hz).<\/li><li><strong>A validity concept below that on-time<\/strong> — either a forced diagnostic window of &gt;= 200 us every 10 ms, or the diagnosis is declared &quot;not available&quot;. Reusing a stale sample would make the detection time unbounded.<\/li><\/ol><p>Duty-averaged reconstruction is not acceptable as the sole ASIL B method: a duty error propagates<br>1:1 into the reconstructed current, and the duty command is itself part of the failure space.<\/p><h4>4 Timing budget<\/h4><pre class='code'>t_sync    worst-case wait for the next valid PWM on-window (400 Hz)  =   2.5 ms\nt_acq     blanking + aperture/conversion + filter delay              =   0.1 ms\nt_qual    below-threshold qualification window (20 valid samples)    =  50.0 ms\nt_deb     debounce (8 valid samples)                                 =  20.0 ms\nt_task    worst-case latency of the 5 ms monitoring task             =   5.0 ms\n---------------------------------------------------------------------------\nt_detect  worst case                                                 =  77.6 ms  -&gt; specify &lt;= 80 ms\nt_react   transition to limp-home (SG-01)                            = 150.0 ms\n---------------------------------------------------------------------------\nTotal                                                                = 230.0 ms\nFTTI (SG-01)                                                         = 300.0 ms\nMargin                                                               =  70.0 ms  (23 %)<\/pre><p><strong>The budget closes.<\/strong> The refined scheme costs 10 ms against the currently published 70 ms.<br>The published timing in <code>SG-01<\/code>, <code>SM-01<\/code> and <code>02_safety/02_hara/hara.md<\/code> section 4 would change from<br>70 / 220 / 80 ms to <strong>80 / 230 / 70 ms<\/strong>.<\/p><h4>5 Fault discrimination — what a single threshold cannot do<\/h4><div class='tw'><table><thead><tr><th>Fault<\/th><th>Signature at the shunt<\/th><th>Detected?<\/th><th>Additional criterion needed<\/th><\/tr><\/thead><tbody><tr><td>Complete open load<\/td><td>~ 0 mA<\/td><td><strong>yes<\/strong><\/td><td>—<\/td><\/tr><tr><td>Short-to-battery<\/td><td>current may bypass the shunt<\/td><td><strong>false positive<\/strong><\/td><td>channel output voltage in the off-state<\/td><\/tr><tr><td>Partial string failure (1 of 2 parallel)<\/td><td><strong>unchanged at 1.20 A<\/strong><\/td><td><strong>no — structurally blind<\/strong><\/td><td>channel output voltage, driver status<\/td><\/tr><tr><td>Series LED short inside a string<\/td><td>current maintained, voltage drops ~3.2 V<\/td><td>no<\/td><td>output voltage plausibility<\/td><\/tr><tr><td>Normal thermal derating<\/td><td>reduced set point by design<\/td><td>no false trip against the <em>fixed<\/em> threshold<\/td><td>commanded set point as a diagnosis input<\/td><\/tr><tr><td>Sense chain stuck-at-high<\/td><td>reads nominal regardless of load<\/td><td><strong>no — masks a real open load<\/strong><\/td><td>zero-current check in the PWM off-phase<\/td><\/tr><\/tbody><\/table><\/div><p>Two conclusions:<\/p><ul><li>The <strong>parallel-string case is the hard one<\/strong>: a constant-current driver makes it invisible in the current domain by construction. Current sensing alone therefore satisfies <code>SG-01<\/code> (complete loss) but <strong>not<\/strong> <code>CR-007<\/code> (&quot;detect the failure of a low-beam channel&quot;) for partial failures.<\/li><li>The <strong>PWM off-phase does double duty<\/strong>: it causes the gating problem and is simultaneously a free periodic test of the sense chain, because the true current is known to be ~0 there.<\/li><\/ul><h4>6 Diagnostic coverage — the 90 % claim in SM-01<\/h4><p><strong>Not defensible with current-threshold sensing alone<\/strong> — estimate for the bare scheme is<br><strong>DC ~ 60 %<\/strong> (plausible example value). Uncovered: partial load loss, short-to-battery<br>misclassification, and failures of the diagnostic path itself, which are latent and mask the fault<br>they should detect.<\/p><p>The 90 % claim becomes arguable if <strong>all four<\/strong> of these are added: off-phase zero-current check,<br>channel output voltage sense, LED driver status readback, and ADC reference plausibility check.<br>Even then the number belongs to <code>safety-analyst<\/code> to confirm against the FMEDA — hardware states only<br>that the claim is arguable <em>with<\/em> these measures and not arguable <em>without<\/em> them.<\/p><hr><h4>7 Requirement split (applied)<\/h4><p><code>SYS-REQ-014<\/code> keeps its original meaning and its ID — it is part of the Golden Thread. The current<br>text fails <em>atomic<\/em> (&quot;classify ... <strong>and<\/strong> increment the fault counter&quot;) and <em>unambiguous<\/em> (it does<br>not say which current, measured when).<\/p><div class='tw'><table><thead><tr><th>ID<\/th><th>Proposed text (EARS)<\/th><th>Type<\/th><th>ASIL<\/th><\/tr><\/thead><tbody><tr><td><strong>SYS-REQ-014<\/strong><\/td><td><strong>When<\/strong> the load current of a low-beam channel, measured during the PWM on-phase, remains below 150 mA for more than 50 ms, the lighting ECU <strong>shall<\/strong> classify the channel as &quot;open load&quot;.<\/td><td>functional<\/td><td>B<\/td><\/tr><tr><td>SYS-REQ-015<\/td><td><strong>When<\/strong> a low-beam channel is classified as &quot;open load&quot;, the lighting ECU <strong>shall<\/strong> increment the fault counter of that channel.<\/td><td>diagnostics<\/td><td>B<\/td><\/tr><tr><td>SYS-REQ-016<\/td><td>The lighting ECU <strong>shall<\/strong> measure the load current with a total uncertainty of not more than +/-20 mA at the 150 mA threshold, over -40 °C to +85 °C.<\/td><td>electrical<\/td><td>B<\/td><\/tr><tr><td>SYS-REQ-017<\/td><td><strong>While<\/strong> the PWM on-time is shorter than 150 us, the lighting ECU <strong>shall<\/strong> report the open-load diagnosis of that channel as &quot;not available&quot;.<\/td><td>diagnostics<\/td><td>B<\/td><\/tr><tr><td>SYS-REQ-018<\/td><td><strong>When<\/strong> an open load occurs, the lighting ECU <strong>shall<\/strong> report the fault to the fault reaction within 100 ms of fault occurrence.<\/td><td>safety<\/td><td>B<\/td><\/tr><tr><td>SYS-REQ-019<\/td><td><strong>When<\/strong> the measured load current falls below 150 mA, the lighting ECU <strong>shall<\/strong> classify the cause as exactly one of &quot;open load&quot;, &quot;short-to-battery&quot; or &quot;commanded current reduction&quot; before triggering a fault reaction.<\/td><td>diagnostics<\/td><td>B<\/td><\/tr><\/tbody><\/table><\/div><h4>8 Hardware requirements (applied)<\/h4><p>Ten records <code>HW-REQ-001 … HW-REQ-010<\/code>, all ASIL B, <code>status: draft<\/code>:<\/p><div class='tw'><table><thead><tr><th>ID<\/th><th>Subject<\/th><\/tr><\/thead><tbody><tr><td>HW-REQ-001<\/td><td>Measurement uncertainty &lt;= +/-20 mA at 150 mA over temperature incl. disturbance allowance<\/td><\/tr><tr><td>HW-REQ-002<\/td><td>Guaranteed trip below 130 mA, guaranteed no trip above 170 mA<\/td><\/tr><tr><td>HW-REQ-003<\/td><td>PWM-timer-triggered conversion, 50 us blanking, 20 us guard<\/td><\/tr><tr><td>HW-REQ-004<\/td><td>Forced diagnostic window &gt;= 200 us every 10 ms below the minimum on-time<\/td><\/tr><tr><td>HW-REQ-005<\/td><td>Off-phase zero-current self-test, fault above 30 mA for more than 20 ms<\/td><\/tr><tr><td>HW-REQ-006<\/td><td>Channel output voltage sense in both phases, 100 mV over 0–40 V<\/td><\/tr><tr><td>HW-REQ-007<\/td><td>LED driver OVP/OCP/thermal status readable, update &lt;= 10 ms<\/td><\/tr><tr><td>HW-REQ-008<\/td><td>Derating floor: never command below 400 mA while the channel is on<\/td><\/tr><tr><td>HW-REQ-009<\/td><td>Detection reported to the software fault reaction within 80 ms<\/td><\/tr><tr><td>HW-REQ-010<\/td><td>ADC reference plausibility check against an independent reference, &lt;= 100 ms<\/td><\/tr><\/tbody><\/table><\/div><h4>9 Change to SM-01 (applied)<\/h4><ul><li><code>text<\/code> — extend to PWM-synchronous measurement, off-phase self-test and discrimination against short-to-battery and commanded current reduction<\/li><li><code>detection_time<\/code> — <code>50 ms + 20 ms debounce<\/code> → <code>&lt;= 80 ms worst case<\/code>, allocated cap 100 ms<\/li><li><code>diagnostic_coverage<\/code> — 90 % becomes <strong>conditional<\/strong> on HW-REQ-005/006/007/010; without them ~60 %; confirmation owned by <code>safety-analyst<\/code> via the FMEDA<\/li><li><code>rationale<\/code> — updated arithmetic 80 + 150 = 230 ms &lt; 300 ms FTTI<\/li><\/ul><h4>10 New assumption candidates<\/h4><p><code>A-08<\/code> driver topology and set point · <code>A-09<\/code> PWM 400 Hz, duty &gt;= 20 % · <code>A-10<\/code> driver status signal<br>available · <code>A-11<\/code> sensing chain qualified over -40 … +85 °C · <code>A-12<\/code> derating never below 400 mA.<\/p><h4>11 Impact<\/h4><p><strong>Procedural:<\/strong> <code>SYS-REQ-014<\/code>, <code>SM-01<\/code>, <code>SG-01<\/code>, <code>FSR-001<\/code>, <code>CR-007<\/code>, <code>TC-021<\/code> are <code>reviewed<\/code>.<br>A change request with impact analysis is required; <code>SYS-REQ-014<\/code> and <code>SM-01<\/code> drop back to <code>draft<\/code><br>and need re-review.<\/p><div class='tw'><table><thead><tr><th>Artefact<\/th><th>Impact<\/th><\/tr><\/thead><tbody><tr><td><code>02_safety/02_hara/hara.md<\/code> §4<\/td><td>timing budget 70 / 220 / 80 → 80 / 230 / 70 ms<\/td><\/tr><tr><td><code>07_verification/testcases/TC-021.md<\/code><\/td><td>expected result &quot;within 50 ms plus debounce&quot; → <code>&lt;= 80 ms<\/code>; preconditions must fix the PWM duty; steps must capture off-phase sampling<\/td><\/tr><tr><td>FMEDA (<code>02_safety/05_analyses/<\/code>)<\/td><td>new rows for sense-chain failure modes; the DC row must be re-derived, not carried over; LFM directly affected<\/td><\/tr><tr><td>FTA<\/td><td>new basic-event paths: sense chain stuck-at-high masks the fault; PWM duty below minimum, diagnosis unavailable<\/td><\/tr><tr><td><code>06_software/<\/code><\/td><td>5 ms monitoring task, sample-count debounce, &quot;diagnosis not available&quot; state, DTC differentiation<\/td><\/tr><tr><td><code>04_architecture/<\/code><\/td><td>the sense chain becomes a named element with an explicit diagnostic interface<\/td><\/tr><tr><td><code>08_safety_case/<\/code> G-01<\/td><td>detection leg now rests on 80 ms; new leg for sense-chain self-test coverage<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Not affected:<\/strong> <code>SG-01<\/code> (FTTI and fault reaction time unchanged — the 10 ms is absorbed by margin),<br><code>CR-007<\/code>, <code>FSR-001<\/code>.<\/p><h4>12 Open points<\/h4><ol><li>Confirmation of the 90 % DC against the FMEDA — <code>safety-analyst<\/code> (blocks SM-01 returning to <code>reviewed<\/code>). The hardware side is now decomposed into six failure-mode groups with a per-measure sensitivity in <code>analysis_sm01_coverage.md<\/code>, so the claim is checkable rather than assertive.<\/li><li><del>Feasibility of the 400 mA derating floor against the LED module thermal design<\/del> — <strong>closed in phase 6<\/strong>: floor confirmed, unchanged, see <code>analysis_thermal_derating.md<\/code> and the confirmation note in <code>HW-REQ-008<\/code>. The condition is now <code>HW-REQ-024<\/code>.<\/li><li>Gating scheme below the minimum on-time: forced window vs. &quot;diagnosis not available&quot; — a system-level decision, <code>systems-engineer<\/code>, because it changes the availability of the diagnosis<\/li><li>Whether per-string current sensing is added — the only way to see parallel-string loss in the current domain; cost/benefit, <code>systems-engineer<\/code> with <code>hardware-engineer<\/code><\/li><li>New test cases for HW-REQ-001 … 010 — <code>verification-engineer<\/code><\/li><li>SYS-REQ ID range 015–019 to be confirmed as free against the later-phase requirement plan<\/li><\/ol><hr><h4>13 Phase 6 addendum (hardware-engineer)<\/h4><p>Section 6 of this analysis is extended by <a href=\"#doc/05_hardware/analysis_sm01_coverage.md\"><code>analysis_sm01_coverage.md<\/code><\/a>,<br>which turns the 60 % / 90 % statement into a failure-mode partition the FMEDA can confirm or reject.<br>Section 12 point 2 is closed by <a href=\"#doc/05_hardware/analysis_thermal_derating.md\"><code>analysis_thermal_derating.md<\/code><\/a>.<br>Nothing in sections 1–11 changed.<\/p>"},{"path":"05_hardware/analysis_sm01_coverage.md","title":"Analysis — hardware side of the SM-01 diagnostic coverage claim (preparation for OP-15)","folder":"05_hardware","exists":true,"html":"<p><strong>Status:<\/strong> preparation for the FMEDA. <strong>This document does not assert a diagnostic coverage<br>figure.<\/strong> It states what the hardware buys, so that <code>safety-analyst<\/code> can confirm or reject the<br>90 % claim of <code>SM-01<\/code> in phase 5.<br><strong>Owner:<\/strong> hardware-engineer · <strong>Process:<\/strong> ASPICE HWE.1 · ISO 26262-5 (evaluation of hardware<br>architectural metrics), ISO 26262-9 (FMEDA as a safety analysis)<\/p><blockquote>Teaching/reference project. <strong>All numeric values are plausible example values, not validated data.<\/strong> The failure-rate distribution below is a <em>hardware proposal for the partition<\/em>, not an FMEDA result. The FMEDA owns both the partition and the coverage per group.<\/blockquote><hr><h4>1 Why this document exists<\/h4><p><code>analysis_current_sensing.md<\/code> section 6 states that the bare threshold scheme is worth about <strong>60 %<\/strong><br>and that <strong>90 %<\/strong> becomes arguable only with four additional measures. That is a defensible<br>position, but it is not yet in a form the FMEDA can check: it names measures without saying <em>which<br>part of the failure space<\/em> each measure covers. A coverage claim that cannot be decomposed cannot be<br>confirmed — it can only be believed.<\/p><h4>2 🔍 DEEP DIVE — failure-mode partition of the low-beam output path<\/h4><p>Element under consideration: one low-beam channel, from the driver output stage through the harness<br>and LED module back through the shunt, amplifier, filter and ADC input.<\/p><div class='tw'><table><thead><tr><th>#<\/th><th>Failure-mode group<\/th><th>Proposed share of λ<\/th><th>Bare scheme<\/th><th>With the additional measure<\/th><th>Measure<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Complete open load — connector, harness open, driver output open, both strings lost<\/td><td>60 %<\/td><td>~99 %<\/td><td>~99 %<\/td><td><code>SM-01<\/code> core (threshold + debounce)<\/td><\/tr><tr><td>2<\/td><td>Partial load loss — one of two parallel strings<\/td><td>8 %<\/td><td><strong>0 %<\/strong><\/td><td>~85 %<\/td><td><code>HW-REQ-006<\/code> channel voltage<\/td><\/tr><tr><td>3<\/td><td>Short to battery on the channel output<\/td><td>7 %<\/td><td><strong>0 %<\/strong> (worse: misclassified)<\/td><td>~90 %<\/td><td><code>HW-REQ-006<\/code> + <code>SM-03<\/code> / <code>HW-REQ-020<\/code><\/td><\/tr><tr><td>4<\/td><td>Driver-internal faults — output stage, OVP/OCP/OT trip, regulation loop<\/td><td>10 %<\/td><td><strong>0 %<\/strong><\/td><td>~80 %<\/td><td><code>HW-REQ-007<\/code> status readback (<code>SM-04<\/code>)<\/td><\/tr><tr><td>5<\/td><td>Sense-chain faults — shunt open/short, amplifier stuck, offset drift<\/td><td>10 %<\/td><td><strong>0 %<\/strong> (masks the fault)<\/td><td>~85 %<\/td><td><code>HW-REQ-005<\/code> off-phase zero-current test<\/td><\/tr><tr><td>6<\/td><td>Reference and gain drift of the ADC path<\/td><td>5 %<\/td><td><strong>0 %<\/strong><\/td><td>~80 %<\/td><td><code>HW-REQ-010<\/code> reference plausibility<\/td><\/tr><\/tbody><\/table><\/div><p>Weighted result of this partition (plausible example arithmetic, <strong>not<\/strong> an FMEDA result):<\/p><pre class='code'>bare scheme        0.60 x 0.99                                     = 59.4 %   ~ 60 %\n+ HW-REQ-006       0.08 x 0.85 + 0.07 x 0.90                       = 13.1 pts\n+ HW-REQ-007       0.10 x 0.80                                     =  8.0 pts\n+ HW-REQ-005       0.10 x 0.85                                     =  8.5 pts\n+ HW-REQ-010       0.05 x 0.80                                     =  4.0 pts\n---------------------------------------------------------------------------------\nall measures                                                       = 93.0 %<\/pre><p>That is consistent with the 60 % / 90 % statement already published and leaves about <strong>3 percentage<br>points of margin<\/strong> on the 90 % claim — thin enough that removing any single measure breaks it:<\/p><div class='tw'><table><thead><tr><th>Measure removed<\/th><th>Resulting coverage<\/th><th>90 % still met?<\/th><\/tr><\/thead><tbody><tr><td><code>HW-REQ-005<\/code> (off-phase self-test)<\/td><td>84.5 %<\/td><td>no<\/td><\/tr><tr><td><code>HW-REQ-006<\/code> (channel voltage)<\/td><td>79.9 %<\/td><td>no<\/td><\/tr><tr><td><code>HW-REQ-007<\/code> (driver status)<\/td><td>85.0 %<\/td><td>no<\/td><\/tr><tr><td><code>HW-REQ-010<\/code> (reference plausibility)<\/td><td>89.0 %<\/td><td>no (marginally)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>None of the four is optional.<\/strong> That is the hardware-side statement, and it is the one the safety<br>case needs — not the 90 % itself.<\/p><h4>3 What the FMEDA has to decide, and what hardware must not pre-empt<\/h4><div class='tw'><table><thead><tr><th>Question<\/th><th>Owner<\/th><\/tr><\/thead><tbody><tr><td>Is the λ partition of section 2 realistic against the component list?<\/td><td><code>safety-analyst<\/code><\/td><\/tr><tr><td>Are the per-group coverages defensible (a table lookup for the diagnostic technique, not an opinion)?<\/td><td><code>safety-analyst<\/code><\/td><\/tr><tr><td>Which of these are single-point-fault detections and which reduce latent faults (LFM)?<\/td><td><code>safety-analyst<\/code><\/td><\/tr><tr><td>Does SPFM/LFM/PMHF meet the ASIL B targets with these numbers?<\/td><td><code>safety-analyst<\/code><\/td><\/tr><tr><td>Does the diagnostic test interval fit the FTTI (SPF) and the multiple-point fault detection interval (LFM)?<\/td><td>hardware provides the intervals, <code>safety-analyst<\/code> evaluates<\/td><\/tr><\/tbody><\/table><\/div><p>Test intervals hardware guarantees, for the FMEDA to use directly:<\/p><div class='tw'><table><thead><tr><th>Measure<\/th><th>Test interval<\/th><th>Purpose in the metric<\/th><\/tr><\/thead><tbody><tr><td><code>SM-01<\/code> core<\/td><td>continuous, per PWM period (2.5 ms), qualified over 50 ms<\/td><td>single-point fault detection inside the 300 ms FTTI<\/td><\/tr><tr><td><code>HW-REQ-005<\/code> off-phase test<\/td><td>every PWM period, fault after 20 ms<\/td><td>detects sense-chain faults that would otherwise be <strong>latent and masking<\/strong><\/td><\/tr><tr><td><code>HW-REQ-006<\/code> channel voltage<\/td><td>10 ms<\/td><td>single-point fault detection and cause discrimination<\/td><\/tr><tr><td><code>HW-REQ-007<\/code> driver status<\/td><td>10 ms<\/td><td>single-point fault detection<\/td><\/tr><tr><td><code>HW-REQ-010<\/code> reference plausibility<\/td><td>100 ms<\/td><td>latent-fault detection of the measurement path<\/td><\/tr><\/tbody><\/table><\/div><p>All of these are far shorter than one driving cycle, so the latent-fault argument does not depend on<br>a power-up test only.<\/p><h4>4 What <code>SM-01<\/code> must state so the claim is checkable<\/h4><p>The record has been updated accordingly (see the change note in <code>SM-01.md<\/code>). It must carry:<\/p><ol><li>the <strong>failure-mode partition<\/strong> it claims to cover, by reference to section 2 of this document — a coverage number without a denominator is not evidence;<\/li><li>the <strong>conditionality<\/strong>, naming the four requirements explicitly (already present);<\/li><li>the <strong>test interval per measure<\/strong> (section 3), because the FMEDA needs the interval, not only the coverage;<\/li><li>the <strong>detected-fault statement and the not-covered statement<\/strong> — <code>SM-01<\/code> previously had no explicit &quot;not covered&quot; field, and the uncovered residue is what the FMEDA prices;<\/li><li>the note that <code>HW-REQ-004<\/code> is <strong>not implemented in the base variant<\/strong> (decision <code>OP-17<\/code> in <code>04_architecture/ee_architecture.md<\/code> section 4), so no coverage may be claimed from it;<\/li><li>the statement that the number itself is <strong>owned by <code>safety-analyst<\/code><\/strong> and that <code>SM-01<\/code> stays <code>draft<\/code> until the FMEDA confirms it.<\/li><\/ol><h4>5 Consequences hardware already sees for the FMEDA<\/h4><ul><li><strong>Group 5 is the dangerous one.<\/strong> A sense chain stuck at a plausible value does not fail the diagnosis, it <em>masks<\/em> the fault it should detect. In the FTA this is an AND gate (open load AND sense chain stuck), in the FMEDA it is a latent fault. <code>HW-REQ-005<\/code> is what breaks it, and it costs nothing because the PWM off-phase is a free known-zero reference.<\/li><li><strong>Group 2 remains the weakest leg<\/strong> at ~85 % via the channel voltage. If the FMEDA cannot support 85 % there, <code>OP-23<\/code> (per-string sensing, decided against in phase 3) has to be reopened — the decision was explicitly made conditional on this.<\/li><li><strong>Groups 3 and 4 depend on components<\/strong>, not on design: <code>A-10<\/code> (driver status available) is a datasheet assumption. If a candidate driver does not provide the status, 8 percentage points disappear and the 90 % is gone.<\/li><\/ul><h4>6 Open points<\/h4><div class='tw'><table><thead><tr><th>#<\/th><th>Point<\/th><th>Owner<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><code>OP-15<\/code> — confirm or reject the 90 % against the FMEDA using the partition of section 2<\/td><td>safety-analyst<\/td><\/tr><tr><td>2<\/td><td>If group 2 cannot support ~85 %, reopen <code>OP-23<\/code> (per-string sensing)<\/td><td>safety-analyst, systems-engineer<\/td><\/tr><tr><td>3<\/td><td>Confirm <code>A-10<\/code> against a real LED driver datasheet during component selection<\/td><td>hardware-engineer<\/td><\/tr><tr><td>4<\/td><td>Fault injection at the level of the six groups — test design<\/td><td>verification-engineer<\/td><\/tr><\/tbody><\/table><\/div><hr><p><strong>Work products:<\/strong> <code>05_hardware/analysis_sm01_coverage.md<\/code>, updated <code>SM-01.md<\/code><br><strong>Open points:<\/strong> section 6<br><strong>Process reference:<\/strong> ASPICE <strong>HWE.1<\/strong> (hardware requirements analysis) with the safety analyses of<br><strong>SUP.9 / MAN.5<\/strong> feeding back · ISO 26262 <strong>Part 5<\/strong> (evaluation of the hardware architectural<br>metrics; hardware architectural design) · <strong>Part 9<\/strong> (safety analyses, FMEDA).<\/p>"},{"path":"05_hardware/analysis_supply_and_transients.md","title":"Analysis — supply range, overvoltage, load dump and transients (OP-24, OP-4)","folder":"05_hardware","exists":true,"html":"<p><strong>Status:<\/strong> applied to the records <code>HW-REQ-011 … HW-REQ-016<\/code>, <code>SM-06<\/code>.<br><strong>Owner:<\/strong> hardware-engineer · <strong>Process:<\/strong> ASPICE HWE.1 / HWE.2 · ISO 26262-5<\/p><blockquote>Teaching/reference project. <strong>All numeric values are plausible example values, not validated data.<\/strong> In a real project the test levels and the applicability of individual pulses come from the vehicle manufacturer&#x27;s test plan; here they are assumed (<code>A-19<\/code>).<\/blockquote><hr><h4>1 📋 OVERVIEW — what was undefined<\/h4><p><code>SYS-REQ-012<\/code> covers 16–32 V, <code>SYS-REQ-013<\/code> covers 9–16 V. Everything above 32 V, everything below<br>9 V and every transient was undefined — the remainder of <code>OP-2<\/code>, tracked as <code>OP-24<\/code>, plus <code>OP-4<\/code><br>(function class per <code>ISO 7637-2<\/code> pulse, originating from <code>CR-017<\/code>).<\/p><p>Two things had to be separated that the previous records conflated:<\/p><ul><li>the <strong>electrical survival<\/strong> question — does the hardware take damage, and<\/li><li>the <strong>functional<\/strong> question — what does the <em>lighting function<\/em> do while the disturbance lasts.<\/li><\/ul><p>The second is the safety-relevant one: a low beam that switches off during a load dump at night is<br>exactly hazard <code>H-01<\/code>, whatever the hardware survives.<\/p><h4>2 Operating-range table<\/h4><p>Functional status classes follow the classification scheme of <strong>ISO 16750-1 (functional status<br>classification)<\/strong> as used by <strong>ISO 16750-2 (electrical loads)<\/strong>: <strong>A<\/strong> full function, <strong>B<\/strong> reduced<br>function with automatic recovery, <strong>C<\/strong> loss of function with automatic recovery, <strong>D<\/strong> loss of<br>function requiring a reset or repair. No clause numbers are cited.<\/p><div class='tw'><table><thead><tr><th>Range (protected input)<\/th><th>Class<\/th><th>Behaviour of the lighting function<\/th><th>Record<\/th><\/tr><\/thead><tbody><tr><td>U &lt; 6 V<\/td><td>C<\/td><td>ECU unpowered, all channels de-energised, no unintended actuation on the way down or up; recovery ≤ 200 ms<\/td><td>HW-REQ-012<\/td><\/tr><tr><td>6 V ≤ U &lt; 9 V<\/td><td>C<\/td><td>Rails collapse in a controlled sequence; driver stages disabled through the enable gate before the rails leave tolerance<\/td><td>HW-REQ-012, HW-REQ-017<\/td><\/tr><tr><td>9 V ≤ U &lt; 16 V<\/td><td>B<\/td><td>Low beam energised at the 400 mA derating floor, DTC set; high beam and work lamps inhibited<\/td><td>SYS-REQ-013, HW-REQ-011<\/td><\/tr><tr><td>16 V ≤ U ≤ 32 V<\/td><td>A<\/td><td>Full function, unrestricted<\/td><td>SYS-REQ-012<\/td><\/tr><tr><td>32 V &lt; U ≤ 36 V<\/td><td>A<\/td><td>Full function; jump-start / overvoltage operating case of ISO 16750-2<\/td><td>HW-REQ-011, HW-REQ-012<\/td><\/tr><tr><td>36 V &lt; U ≤ 60 V, steady<\/td><td>B<\/td><td>Low beam maintained, work lamps and high beam inhibited, DTC set; condition reported within 10 ms<\/td><td>HW-REQ-012, HW-REQ-016<\/td><\/tr><tr><td>≤ 58 V, transient ≤ 400 ms (clamped load dump)<\/td><td>A<\/td><td>Low beam maintained at the commanded set point, no damage<\/td><td>HW-REQ-013<\/td><\/tr><tr><td>U &gt; 60 V<\/td><td>C<\/td><td>Hardware overvoltage shutdown of the driver stages within 1 ms; recovery ≤ 200 ms after the supply returns<\/td><td>HW-REQ-016<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Why the shutdown threshold is 60 V and not 40 V.<\/strong> The clamped load dump of a 24 V system reaches<br>58 V (<code>A-19<\/code>). A shutdown threshold below that would switch the low beam off during a disturbance<br><code>CR-017<\/code> explicitly requires it to survive. The threshold therefore sits <strong>above<\/strong> the load-dump<br>level and <strong>below<\/strong> the assumed 65 V rating of the output stage — a 5 V window that is a real<br>constraint on component selection, not a free parameter.<\/p><h4>3 Load dump<\/h4><p>Tested per <strong>ISO 16750-2 (electrical loads, load-dump test)<\/strong> using the pulse shape of<br><strong>ISO 7637-2 (pulses 5a / 5b)<\/strong>.<\/p><div class='tw'><table><thead><tr><th>Parameter<\/th><th>Plausible example value<\/th><\/tr><\/thead><tbody><tr><td>Clamped test level U_s*<\/td><td>58 V<\/td><\/tr><tr><td>Decay time constant<\/td><td>400 ms<\/td><\/tr><tr><td>Generator internal resistance<\/td><td>2 Ohm<\/td><\/tr><tr><td>Required function class<\/td><td>A for the low beam (<code>HW-REQ-013<\/code>)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Unsuppressed load dump (pulse 5a) is explicitly excluded<\/strong>, recorded as assumption <code>A-19<\/code>: the<br>vehicle is assumed to suppress load dump centrally. This has to be agreed with the vehicle<br>manufacturer — if it is wrong, the input stage has to absorb roughly an order of magnitude more<br>energy and the whole protection topology changes.<\/p><p><strong>Thermal side effect:<\/strong> during 400 ms at 58 V input the buck stage of a channel dissipates about<br>2.4 times its nominal loss (plausible example value). That is inside the pulse rating of the output<br>stage but it is a DV measurement item, not a calculation item — verification entry <code>HV-07<\/code>.<\/p><h4>4 🔍 Transient pulse table (closes the hardware side of <code>OP-4<\/code>)<\/h4><p>Levels per <strong>ISO 7637-2<\/strong> for 24 V systems; applicability per the vehicle test plan (<code>A-19<\/code>).<\/p><div class='tw'><table><thead><tr><th>Pulse<\/th><th>Physical origin<\/th><th>Plausible example level<\/th><th>Required class<\/th><th>Rationale<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Supply disconnection from an inductive source<\/td><td>−600 V, 2 ms<\/td><td><strong>A<\/strong><\/td><td>The input series element blocks the negative excursion. A 2 ms interruption of channel current is photometrically irrelevant; what matters is that it causes neither a reset nor a false open-load classification.<\/td><\/tr><tr><td>2a<\/td><td>Sudden interruption of current in a parallel load<\/td><td>+37 V<\/td><td><strong>A<\/strong><\/td><td>Inside the 60 V envelope of section 2, no functional effect.<\/td><\/tr><tr><td>2b<\/td><td>DC motor acting as a generator after switch-off<\/td><td>per test plan, 0.2–2 s<\/td><td><strong>A<\/strong><\/td><td>Slow pulse, handled as a temporary overvoltage by the range table.<\/td><\/tr><tr><td>3a<\/td><td>Switching transients, negative burst<\/td><td>−300 V<\/td><td><strong>A<\/strong><\/td><td>Coupled through the filter; required is immunity of the measurement path, not merely survival.<\/td><\/tr><tr><td>3b<\/td><td>Switching transients, positive burst<\/td><td>+300 V<\/td><td><strong>A<\/strong><\/td><td>The pulse most likely to disturb the current measurement — the source of the ±10 mA disturbance allowance in <code>HW-REQ-001<\/code>.<\/td><\/tr><tr><td>4<\/td><td>Supply reduction during cranking<\/td><td>down to 10 V<\/td><td><strong>B<\/strong><\/td><td>Coincides with the 9–16 V range: low beam at the 400 mA floor per <code>SYS-REQ-013<\/code>.<\/td><\/tr><tr><td>5a<\/td><td>Unsuppressed load dump<\/td><td>—<\/td><td><strong>not applicable<\/strong><\/td><td>Excluded by <code>A-19<\/code>, central suppression assumed.<\/td><\/tr><tr><td>5b<\/td><td>Clamped load dump<\/td><td>58 V, 400 ms<\/td><td><strong>A<\/strong><\/td><td><code>HW-REQ-013<\/code>.<\/td><\/tr><\/tbody><\/table><\/div><h5>Interaction with <code>SM-01<\/code> — why this is a safety analysis and not an EMC checklist<\/h5><p>Pulses 1, 3a and 3b last microseconds to milliseconds. <code>SM-01<\/code> qualifies an open load over a <strong>50 ms<br>window plus an 8-sample debounce<\/strong> (<code>HW-REQ-002<\/code>, <code>HW-REQ-009<\/code>). A transient can corrupt individual<br>samples but <strong>cannot<\/strong> produce a fault classification on its own — the debounce is not only a noise<br>filter, it is the argument why <code>CR-017<\/code> and <code>SG-01<\/code> do not conflict. The residual effect of a burst<br>is a measurement error, which is why <code>HW-REQ-001<\/code> carries an explicit ±10 mA disturbance allowance<br>instead of pretending the tolerance chain is a bench-top calculation.<\/p><h4>5 Hand-off to <code>systems-engineer<\/code><\/h4><ol><li><strong><code>CR-017<\/code> must change.<\/strong> Its current text (&quot;shall maintain the low-beam function without loss of function&quot; for <em>all<\/em> pulses) is neither achievable nor what the design does: pulse 4 gives reduced function (class B) by design and pulse 5a is excluded by assumption. Proposal: <code>CR-017<\/code> refers to the pulse table above and states a class per pulse. Hardware does not edit <code>CR-017<\/code>.<\/li><li><strong>System requirements are missing<\/strong> for the ranges the <code>SYS-REQ<\/code> set does not cover (&lt; 9 V and &gt; 32 V). The hardware side is specified in <code>HW-REQ-011<\/code> … <code>HW-REQ-016<\/code>, but the functional statement (&quot;what does the lighting do above 36 V&quot;) belongs at system level.<\/li><li><strong>Interface table<\/strong> in <code>04_architecture/ee_architecture.md<\/code>: two signals from the supply monitor to the microcontroller, <code>U_Batt<\/code> and <code>RailStatus<\/code>, 10 ms, ASIL B.<\/li><li><strong><code>A-19<\/code><\/strong> (central load-dump suppression) needs an interface agreement with the vehicle manufacturer, in the same way as <code>A-05<\/code>.<\/li><\/ol><h4>6 Open points<\/h4><div class='tw'><table><thead><tr><th>#<\/th><th>Point<\/th><th>Owner<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><code>CR-017<\/code> text change per section 5.1<\/td><td>systems-engineer<\/td><\/tr><tr><td>2<\/td><td>Confirm <code>A-19<\/code> (clamped load dump, 58 V) with the vehicle manufacturer<\/td><td>systems-engineer, safety-manager<\/td><\/tr><tr><td>3<\/td><td>No <code>SYS-REQ<\/code> exists for the behaviour above 36 V; today it is a hardware statement only<\/td><td>systems-engineer<\/td><\/tr><tr><td>4<\/td><td>Fix pulse levels and applicability in the DV test plan<\/td><td>verification-engineer<\/td><\/tr><\/tbody><\/table><\/div><hr><p><strong>Work products:<\/strong> <code>05_hardware/analysis_supply_and_transients.md<\/code>, <code>HW-REQ-011<\/code> … <code>HW-REQ-016<\/code>,<br><code>SM-06<\/code><br><strong>Open points:<\/strong> section 6<br><strong>Process reference:<\/strong> ASPICE <strong>HWE.1<\/strong> (hardware requirements analysis), <strong>HWE.2<\/strong> (hardware<br>design) · ISO 26262 <strong>Part 5<\/strong> (hardware development — hardware safety requirements and hardware<br>design) · robustness testing per <strong>ISO 16750-1/-2<\/strong> and <strong>ISO 7637-2<\/strong> (parts and topics named, no<br>clause numbers cited).<\/p>"},{"path":"05_hardware/analysis_thermal_derating.md","title":"Analysis — thermal derating and feasibility of the 400 mA floor (OP-16)","folder":"05_hardware","exists":true,"html":"<p><strong>Status:<\/strong> applied. <code>OP-16<\/code> is <strong>closed with the result &quot;floor confirmed, unchanged at 400 mA&quot;<\/strong>,<br>under the condition stated in section 6.<br><strong>Owner:<\/strong> hardware-engineer · <strong>Process:<\/strong> ASPICE HWE.1 / HWE.2 · ISO 26262-5<\/p><blockquote>Teaching/reference project. <strong>All numeric values are plausible example values, not validated data.<\/strong> The thermal model is a lumped two-resistance model, which is adequate for a feasibility statement and not adequate for a release.<\/blockquote><hr><h4>1 The question<\/h4><p><code>HW-REQ-008<\/code> and <code>A-12<\/code> forbid the derating function to command a channel below <strong>400 mA<\/strong>. The<br>floor exists for a diagnostic reason: below roughly 191 mA the fixed 150 mA open-load threshold of<br><code>SM-01<\/code> can no longer distinguish commanded derating from a real open load (<code>HW-REQ-002<\/code>).<\/p><p>A floor is a <strong>refusal to reduce power<\/strong>. The obvious objection is thermal: if the LED module runs<br>too hot and the ECU is not allowed to reduce further, does the junction temperature run away?<br><code>OP-16<\/code> is exactly that question.<\/p><h4>2 Thermal model and input values<\/h4><div class='tw'><table><thead><tr><th>Parameter<\/th><th>Plausible example value<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td>LEDs per channel<\/td><td>12 (2 parallel strings × 6)<\/td><td><code>A-08<\/code><\/td><\/tr><tr><td>Forward voltage at 600 mA / at 200 mA per string<\/td><td>3.2 V / 2.9 V<\/td><td><code>A-08<\/code>, <code>A-20<\/code><\/td><\/tr><tr><td>Radiant (optical) fraction of the electrical power<\/td><td>30 %<\/td><td><code>A-20<\/code><\/td><\/tr><tr><td>Thermal resistance junction → solder point, per LED<\/td><td>3.5 K/W<\/td><td><code>A-20<\/code><\/td><\/tr><tr><td>Thermal resistance module → headlamp cavity<\/td><td>2.2 K/W (channel)<\/td><td><code>A-20<\/code><\/td><\/tr><tr><td>Degraded heat path (soiling, dried thermal interface, blocked convection)<\/td><td>factor 2 → 4.4 K/W<\/td><td><code>A-20<\/code><\/td><\/tr><tr><td>Headlamp cavity temperature, hot case / extreme case<\/td><td>95 °C / 105 °C<\/td><td><code>A-20<\/code><\/td><\/tr><tr><td>Junction design limit / component rating<\/td><td>135 °C / 150 °C<\/td><td><code>A-20<\/code><\/td><\/tr><tr><td>Measured quantity of the derating function<\/td><td>solder-point temperature <code>T_LED<\/code> (module NTC)<\/td><td><code>HW-REQ-022<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Derived electrical/thermal figures:<\/p><pre class='code'>I_ch = 1.20 A  -&gt;  P_el = 12 x 3.2 V x 0.6 A = 23.0 W -&gt;  P_th = 16.1 W  (1.34 W per LED)\nI_ch = 0.40 A  -&gt;  P_el = 12 x 2.9 V x 0.2 A =  6.96 W -&gt;  P_th =  4.87 W (0.41 W per LED)\nLinearised:      P_th  ~ 13.4 W per ampere of channel current<\/pre><h4>3 Derating curve (<code>HW-REQ-023<\/code>)<\/h4><pre class='code'>I_set [A]\n 1.20 |-----------\\\n      |            \\        slope -40 mA/K\n 0.40 |             \\------------------------  floor (HW-REQ-008, A-12)\n      +-------------------------------------&gt;  T_LED [°C]\n                  105        125<\/pre><ul><li><code>T_LED<\/code> ≤ 105 °C: 1.20 A<\/li><li>105 … 125 °C: linear, −40 mA/K<\/li><li><code>T_LED<\/code> ≥ 125 °C: hold 400 mA, DTC, status on the bus<\/li><\/ul><p>The curve is closed-loop through the hardware: reducing the current reduces <code>P_th<\/code>, which reduces<br><code>T_LED<\/code>. The operating point is therefore the intersection of the curve with the thermal load line<br><code>T_LED = T_cavity + R_th,module × P_th(I)<\/code>, not the end of the curve.<\/p><h4>4 🔍 Load-line evaluation<\/h4><p>Load line: <code>T_LED = T_cav + R × 13.4 × I<\/code>, curve: <code>I = 1.20 − 0.04 × (T_LED − 105)<\/code>.<\/p><div class='tw'><table><thead><tr><th>Case<\/th><th>T_cav<\/th><th>R_th,module<\/th><th>Equilibrium T_LED<\/th><th>Equilibrium I<\/th><th>T_j<\/th><th>Margin to 135 °C<\/th><\/tr><\/thead><tbody><tr><td>A — nominal path, hot cavity<\/td><td>95 °C<\/td><td>2.2 K/W<\/td><td>116.7 °C<\/td><td>733 mA<\/td><td>119.6 °C<\/td><td>15 K<\/td><\/tr><tr><td>B — degraded path, hot cavity<\/td><td>95 °C<\/td><td>4.4 K/W<\/td><td>123.1 °C<\/td><td>476 mA<\/td><td>125.0 °C<\/td><td>10 K<\/td><\/tr><tr><td>C — degraded path, extreme cavity<\/td><td>105 °C<\/td><td>4.4 K/W<\/td><td>curve clamps → <strong>128.6 °C at the floor<\/strong><\/td><td><strong>400 mA<\/strong><\/td><td><strong>130.0 °C<\/strong><\/td><td><strong>5 K<\/strong><\/td><\/tr><tr><td>D — reference: no derating at all<\/td><td>95 °C<\/td><td>2.2 K/W<\/td><td>130.4 °C<\/td><td>1200 mA<\/td><td>135.1 °C<\/td><td>−0.1 K<\/td><\/tr><\/tbody><\/table><\/div><p>Case D is the reason derating exists at all: at full current the assumed thermal path reaches the<br>junction design limit exactly at the hot-cavity condition, with no margin.<\/p><p>Cases A and B <strong>never reach the floor<\/strong> — the loop settles at 733 mA and 476 mA. The floor is<br>reached only in case C, and there the equilibrium junction temperature is <strong>130 °C, 5 K below the<br>135 °C design limit and 20 K below the 150 °C component rating<\/strong>.<\/p><p><strong>Feasibility limit.<\/strong> At the floor the self-heating is <code>4.4 × 4.87 = 21.4 K<\/code> plus 1.4 K junction<br>rise, so the floor stays admissible as long as<\/p><pre class='code'>T_cavity &lt;= 135 - 1.4 - 21.4 = 112 °C   (degraded heat path)\nT_cavity &lt;= 135 - 1.4 - 10.7 = 123 °C   (nominal heat path)<\/pre><h4>5 Result for <code>OP-16<\/code><\/h4><p><strong>The 400 mA floor is confirmed. <code>HW-REQ-008<\/code> and <code>A-12<\/code> keep their value — no change note on the<br>number is required.<\/strong> What is added is the <em>condition<\/em> under which the confirmation holds, and that<br>condition is now an explicit requirement: <code>HW-REQ-024<\/code> (junction ≤ 135 °C at cavity 105 °C with a<br>doubled thermal resistance and derating active).<\/p><p>Two secondary results:<\/p><ol><li><strong>The floor is not the binding constraint in normal operation.<\/strong> In both realistic thermal cases the loop settles well above 400 mA. The floor is a boundary condition of the diagnosis, not a thermal operating point — which is the right way round.<\/li><li><strong>Above 140 °C solder-point temperature the design has no thermal answer.<\/strong> At 400 mA that temperature can only be reached by an external heat source or a secondary failure. Reducing current further would break <code>SM-01<\/code>; switching the channel off would produce hazard <code>H-01<\/code>. The design therefore keeps the channel at the floor and relies on the driver&#x27;s own junction protection (<code>SM-04<\/code>) as the last resort, reporting the event. <strong>This trade — component protection against <code>SG-01<\/code> — is a system-level decision and is handed to <code>systems-engineer<\/code>.<\/strong><\/li><\/ol><h4>6 Photometric consequence — a genuine open question<\/h4><p>With <code>A-13<\/code> (<code>Phi = 1200 lm × (I/1.20 A) × (1 − 0.004 × (T_j − 25 °C))<\/code>) the flux at the floor in<br>case C is<\/p><pre class='code'>Phi = 1200 x (0.40/1.20) x (1 - 0.004 x (130 - 25)) = 400 lm x 0.58 = 232 lm per channel<\/pre><p>roughly <strong>19 % of the nominal flux<\/strong> per channel. Whether two channels at 232 lm still meet the<br>legal photometric minimum for the passing beam is <strong>not a hardware question<\/strong> and is not answered<br>here. The same number applies to the undervoltage case of <code>SYS-REQ-013<\/code>, which uses the same 400 mA.<br>If the legal minimum is not met, the <em>limp-home state itself<\/em> is non-compliant, and that would<br>affect <code>SG-01<\/code>&#x27;s safe state, not just the derating curve. Hand-off to <code>systems-engineer<\/code>, see<br>section 7.<\/p><h4>7 Hand-off to <code>systems-engineer<\/code><\/h4><ol><li>Photometric compliance of the 400 mA operating point (derating floor and <code>SYS-REQ-013<\/code> undervoltage floor) against the legal minimum for the passing beam — potentially affects the definition of the safe state of <code>SG-01<\/code>.<\/li><li>The behaviour above 140 °C solder-point temperature (component protection versus <code>SG-01<\/code>) needs a system-level decision; hardware&#x27;s position is &quot;hold the floor and report&quot;.<\/li><li><code>SYS-REQ<\/code> level has no requirement for thermal derating at all — <code>HW-REQ-023<\/code> currently derives from <code>CR-014<\/code>, which is a QM environmental requirement. A <code>SYS-REQ<\/code> for derating with ASIL B is missing.<\/li><\/ol><h4>8 New assumptions<\/h4><p><code>A-20<\/code> (thermal model values) and <code>A-21<\/code> (thermal FTTI ≥ 10 s from the module time constant) are<br>appended in <code>09_process/assumptions.md<\/code>.<\/p><hr><p><strong>Work products:<\/strong> <code>05_hardware/analysis_thermal_derating.md<\/code>, <code>HW-REQ-022<\/code>, <code>HW-REQ-023<\/code>,<br><code>HW-REQ-024<\/code>, <code>SM-05<\/code>; confirmation note in <code>HW-REQ-008<\/code><br><strong>Open points:<\/strong> section 7; <code>HW-REQ-024<\/code> is a validation target for the DV thermal test (<code>HV-05<\/code>)<br><strong>Process reference:<\/strong> ASPICE <strong>HWE.1/HWE.2<\/strong> · ISO 26262 <strong>Part 5<\/strong> (hardware design and hardware<br>architectural constraints; derating and operating conditions) · environmental testing per<br><strong>ISO 16750-4 (climatic loads)<\/strong>.<\/p>"},{"path":"05_hardware/hw_architecture.md","title":"Hardware architecture — Lighting ECU","folder":"05_hardware","exists":true,"html":"<p><strong>Phase 6 · ASPICE HWE.1 / HWE.2 · ISO 26262-5<\/strong><br><strong>Status:<\/strong> draft · <strong>Owner:<\/strong> hardware-engineer<\/p><blockquote>Teaching/reference project. <strong>All numeric values are plausible example values, not validated data.<\/strong> Element names are binding and are taken from <a href=\"#doc/04_architecture/ee_architecture.md\"><code>../04_architecture/ee_architecture.md<\/code><\/a> — this document refines them internally, it does not rename or add top-level blocks.<\/blockquote><hr><h4>1 📋 OVERVIEW — blocks and what they own<\/h4><div class='tw'><table><thead><tr><th>Block<\/th><th>Hardware content (refinement)<\/th><th>Safety mechanisms<\/th><th>Owning HW-REQ<\/th><\/tr><\/thead><tbody><tr><td><code>Power_Supply_Unit<\/code><\/td><td>Reverse-polarity FET, TVS clamp, CM choke + pi filter; buck 24 V → 5 V, LDO 3.3 V, buffered <code>VBAT_PROT<\/code>, 3.3 V ADC reference; UV/OV window comparators<\/td><td><code>SM-06<\/code><\/td><td>HW-REQ-011 … 016<\/td><\/tr><tr><td><code>MCU_Lockstep<\/code><\/td><td>Dual-core lockstep, ADC with PWM-timer-triggered conversion, second reference for the plausibility check<\/td><td>contributes to <code>SM-01<\/code><\/td><td>HW-REQ-003, 010<\/td><\/tr><tr><td><code>ASIC_Watchdog<\/code><\/td><td>Independent time base, question/answer, rail monitor, reset and <code>SAFE_OFF<\/code> driver<\/td><td><code>SM-02<\/code>, rail leg of <code>SM-06<\/code><\/td><td>HW-REQ-017, 018<\/td><\/tr><tr><td><code>LED_Driver_Stage_1..n<\/code><\/td><td>Per-channel enable gate; constant-current buck, PWM 400 Hz, OCP/OVP/OT with status readback; channel voltage divider<\/td><td><code>SM-03<\/code>, <code>SM-04<\/code>, actuation leg of <code>SM-02<\/code><\/td><td>HW-REQ-006, 007, 019, 020, 021<\/td><\/tr><tr><td><code>Current_Sense_Chain<\/code><\/td><td>Shunt 50 mΩ → amplifier ×50 → anti-alias RC → clamp → ADC input<\/td><td><code>SM-01<\/code><\/td><td>HW-REQ-001 … 005, 009<\/td><\/tr><tr><td><code>Temp_Sense_Chain<\/code><\/td><td>NTC divider + RC + clamp per LED module, board sensor, plausibility band<\/td><td><code>SM-05<\/code><\/td><td>HW-REQ-022, 023, 024<\/td><\/tr><tr><td><code>CAN_FD_Transceiver<\/code><\/td><td>Bus-fault protection, dominant timeout<\/td><td>—<\/td><td>HW-REQ-025<\/td><\/tr><tr><td><code>LIN_Transceiver<\/code><\/td><td>Actuator link<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p>Three parts appear here that the E/E architecture does not list as blocks, deliberately kept<br><strong>inside<\/strong> the existing elements so that no element name is invented: the <strong>input protection<\/strong> and<br>the <strong>supply monitor<\/strong> inside <code>Power_Supply_Unit<\/code>, and the <strong>enable gate<\/strong> inside<br><code>LED_Driver_Stage_1..n<\/code>. If the E/E architecture wants them visible, that is a hand-off to<br><code>systems-engineer<\/code> (section 5).<\/p><h4>2 📋 OVERVIEW — internal block diagram<\/h4><div class=\"diagram\"><img alt=\"diagram\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIiBjb250ZW50U3R5bGVUeXBlPSJ0ZXh0L2NzcyIgZGF0YS1kaWFncmFtLXR5cGU9IkRFU0NSSVBUSU9OIiBoZWlnaHQ9IjEzNjBweCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSIgc3R5bGU9IndpZHRoOjIyNzJweDtoZWlnaHQ6MTM2MHB4O2JhY2tncm91bmQ6I0ZGRkZGRjsiIHZlcnNpb249IjEuMSIgdmlld0JveD0iMCAwIDIyNzIgMTM2MCIgd2lkdGg9IjIyNzJweCIgem9vbUFuZFBhbj0ibWFnbmlmeSI+PD9wbGFudHVtbCAxLjIwMjYuNj8+PGRlZnMvPjxnPjxnIGNsYXNzPSJ0aXRsZSIgZGF0YS1zb3VyY2UtbGluZT0iMSI+PHRleHQgZmlsbD0iIzAwMDAwMCIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZvbnQtd2VpZ2h0PSI3MDAiIGxlbmd0aEFkanVzdD0ic3BhY2luZyIgdGV4dExlbmd0aD0iNTc5Ljc5NjkiIHg9Ijg0Mi45NTY5IiB5PSIyMy41MzUyIj5JbnRlcm5hbCBibG9jayBkaWFncmFtIC0gRUNVX0xpZ2h0aW5nQ3RybCwgaGFyZHdhcmUgdmlldyAoTWFnaWNHcmlkLCBTdHJ1Y3R1cmUpPC90ZXh0PjwvZz48IS0tY2x1c3RlciBFQ1UtLT48ZyBjbGFzcz0iY2x1c3RlciIgZGF0YS1xdWFsaWZpZWQtbmFtZT0iRUNVIiBkYXRhLXNvdXJjZS1saW5lPSIxMyIgaWQ9ImVudDAwMDYiPjxyZWN0IGZpbGw9Im5vbmUiIGhlaWdodD0iMTA4NS4wMSIgcng9 rogram flow<\/td><td>≤ 50 ms<\/td><td>≤ 10 ms<\/td><td>300 ms / 500 ms<\/td><td>60 ms / <strong>240 ms (80 %)<\/strong><\/td><td>target 90 %, not confirmed<\/td><\/tr><tr><td><code>SM-03<\/code> short-to-battery<\/td><td>External short of the channel output to battery, output stuck conducting<\/td><td>≤ 45 ms<\/td><td>≤ 150 ms<\/td><td>300 ms<\/td><td>195 ms / <strong>105 ms (35 %)<\/strong><\/td><td>contributes to <code>SM-01<\/code>, not independent<\/td><\/tr><tr><td><code>SM-04<\/code> overcurrent<\/td><td>Short to ground, string short, output-stage overload<\/td><td>≤ 15 ms (limit engages in ≤ 10 µs)<\/td><td>≤ 150 ms<\/td><td>300 ms<\/td><td>165 ms / <strong>135 ms (45 %)<\/strong><\/td><td>target 60 %, not confirmed<\/td><\/tr><tr><td><code>SM-05<\/code> overtemperature + derating<\/td><td>Thermal overload of an LED module; NTC open or short via the plausibility band<\/td><td>≤ 305 ms<\/td><td>≤ 1 s (set-point ramp)<\/td><td>≥ 10 s thermal (<code>A-21<\/code>)<\/td><td>≈ 1.3 s / <strong>≥ 87 %<\/strong><\/td><td>target 70 %, not confirmed<\/td><\/tr><tr><td><code>SM-06<\/code> voltage monitoring<\/td><td>Under/overvoltage at the supply, load dump beyond the withstand level, rail or reference drift<\/td><td>≤ 10 ms<\/td><td>≤ 10 ms (1 ms above 60 V)<\/td><td>300 ms<\/td><td>20 ms / <strong>280 ms (93 %)<\/strong><\/td><td>target 90 %, not confirmed<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Every budget closes.<\/strong> Two remarks that matter more than the arithmetic:<\/p><ul><li><code>SM-05<\/code> does <strong>not<\/strong> run against the 300 ms FTTI of <code>SG-01<\/code>. Its hazard is thermal degradation with a module time constant of about 60 s (<code>A-21<\/code>), so a 1.3 s response is generous. Forcing it into the 300 ms budget would be a category error and would produce a needlessly fast, noisy derating loop.<\/li><li><code>SM-04<\/code> is a <strong>protection<\/strong> function first and a diagnosis second. The analogue current limit acts in microseconds, two orders of magnitude faster than the FTTI; what is actually in the FTTI budget is the <em>reporting<\/em> of the event through <code>DriverStatus<\/code> (<code>HW-REQ-007<\/code>). A latched channel with no status readback would be a silent channel loss.<\/li><li>All coverage figures except <code>SM-01<\/code> are stated as <strong>targets<\/strong>. <code>safety-analyst<\/code> owns the numbers (<code>OP-15<\/code> for <code>SM-01<\/code>; the rest enter the FMEDA in phase 5). Hardware does not assert DC values independently.<\/li><\/ul><h4>5 Hand-off to <code>systems-engineer<\/code><\/h4><ol><li><strong><code>SM-02<\/code> conflicts with <code>SG-01<\/code>.<\/strong> <code>TSR-001<\/code> requires <code>SAFE_OFF<\/code> to de-energise the LED driver stages. Applied to the low beam, that <em>creates<\/em> hazard <code>H-01<\/code> instead of preventing it — the safe state of <code>SG-01<\/code> is limp-home with a visible remaining channel, not darkness. Hardware&#x27;s position: the disable path must be differentiated by channel class (work lamps and high beam off, low beam into a hardware default state). This is a technical-safety-concept decision. See <code>SM-02.md<\/code>.<\/li><li><strong>Interface table additions<\/strong>: <code>U_Batt<\/code> and <code>RailStatus<\/code> (supply monitor → MCU, 10 ms, ASIL B), <code>SAFE_OFF<\/code> and <code>OV_SHUTDOWN<\/code> as separate signals into the enable gate.<\/li><li><strong>Block table<\/strong>: optionally list input protection, supply monitor and enable gate as parts of their parent blocks.<\/li><li><strong><code>CR-017<\/code> change<\/strong> and the missing <code>SYS-REQ<\/code> for supply ranges outside 9–32 V — see <a href=\"#doc/05_hardware/analysis_supply_and_transients.md\"><code>analysis_supply_and_transients.md<\/code><\/a> section 5.<\/li><li><strong>Missing <code>SYS-REQ<\/code> for thermal derating<\/strong> and the photometric question at the 400 mA floor — see <a href=\"#doc/05_hardware/analysis_thermal_derating.md\"><code>analysis_thermal_derating.md<\/code><\/a> section 7.<\/li><\/ol><h4>6 Open points<\/h4><div class='tw'><table><thead><tr><th>#<\/th><th>Point<\/th><th>Owner<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><code>OP-15<\/code> — confirm the <code>SM-01<\/code> coverage claim against the FMEDA<\/td><td>safety-analyst<\/td><\/tr><tr><td>2<\/td><td>Coverage targets of <code>SM-02<\/code> … <code>SM-06<\/code> to be confirmed or replaced by the FMEDA<\/td><td>safety-analyst<\/td><\/tr><tr><td>3<\/td><td><code>SAFE_OFF<\/code> versus the <code>SG-01<\/code> safe state (section 5.1)<\/td><td>systems-engineer<\/td><\/tr><tr><td>4<\/td><td>Photometric compliance at the 400 mA floor<\/td><td>systems-engineer<\/td><\/tr><tr><td>5<\/td><td>Component selection has to confirm <code>A-10<\/code> (driver status) and the 65 V output-stage rating<\/td><td>hardware-engineer<\/td><\/tr><tr><td>6<\/td><td>Test cases for <code>HW-REQ-011<\/code> … <code>HW-REQ-025<\/code> and <code>SM-02<\/code> … <code>SM-06<\/code> (<code>OP-19<\/code> extension)<\/td><td>verification-engineer<\/td><\/tr><\/tbody><\/table><\/div><hr><p><strong>Work products:<\/strong> <code>05_hardware/hw_architecture.md<\/code>, <code>03_model/plantuml/ibd_ecu.puml<\/code>,<br><code>03_model/plantuml/ibd_current_sense_chain.puml<\/code>, <code>SM-02<\/code> … <code>SM-06<\/code>, <code>HW-REQ-011<\/code> … <code>HW-REQ-025<\/code><br><strong>Open points:<\/strong> section 6<br><strong>Process reference:<\/strong> ASPICE <strong>HWE.1<\/strong> (hardware requirements analysis), <strong>HWE.2<\/strong> (hardware<br>design) · ISO 26262 <strong>Part 5<\/strong> (hardware development: hardware safety requirements, hardware<br>architectural design, hardware architectural metrics) · <strong>Part 9<\/strong> (safety analyses feeding the<br>coverage claims).<\/p>"},{"path":"05_hardware/hw_verification_plan.md","title":"Hardware verification plan — Lighting ECU","folder":"05_hardware","exists":true,"html":"<p><strong>Phase 6 · ASPICE HWE.3 (verification of hardware design) / HWE.4 (hardware verification) ·<br>ISO 26262-5 (hardware integration and verification)<\/strong><br><strong>Status:<\/strong> draft · <strong>Owner:<\/strong> hardware-engineer, with <code>verification-engineer<\/code> for the test cases<\/p><blockquote>Teaching/reference project. <strong>All numeric values, sample sizes and severities are plausible example values, not validated data.<\/strong><\/blockquote><hr><h4>1 Scope and the rule this plan enforces<\/h4><p>A safety mechanism without a verification entry is not evidence. Every <code>SM-xx<\/code> in <code>05_hardware/<\/code><br>therefore has at least one entry below, and every <code>HW-REQ<\/code> is referenced by at least one entry.<\/p><p><code>HV-xx<\/code> identifiers are <strong>verification-plan line items, not records of the project ID scheme<\/strong>. Each<br>one becomes one or more <code>TC-xxx<\/code> records in <code>07_verification/testcases/<\/code>, which is owned by<br><code>verification-engineer<\/code> — that is the hand-off, and it is what closes <code>OP-19<\/code> for the new records.<\/p><h4>2 Verification levels<\/h4><div class='tw'><table><thead><tr><th>Level<\/th><th>Object<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Component<\/td><td>Sample circuits, driver stage, sense chain on a test board<\/td><td>Tolerance chains, timing, thresholds — where a fault can still be injected precisely<\/td><\/tr><tr><td>ECU bench (DV)<\/td><td>Design-verification samples, series-intent design<\/td><td>Functional and safety-mechanism verification incl. fault injection, environmental and EMC<\/td><\/tr><tr><td>ECU (PV)<\/td><td>Production-validation samples from series tooling and process<\/td><td>Confirmation on the series process, reduced scope, statistically relevant sample<\/td><\/tr><tr><td>Vehicle<\/td><td>ECU with headlamp modules in the vehicle<\/td><td>Interaction with the real supply and bus, photometry<\/td><\/tr><\/tbody><\/table><\/div><p>DV runs on the design, PV on the process. A PV finding is a process finding; a DV finding is a design<br>finding. Mixing them is how a design defect gets shipped as a process deviation.<\/p><h4>3 🔍 DEEP DIVE — verification entries per safety mechanism<\/h4><div class='tw'><table><thead><tr><th>ID<\/th><th>Object<\/th><th>Method<\/th><th>Covers<\/th><th>Acceptance (plausible example)<\/th><\/tr><\/thead><tbody><tr><td><strong>HV-01<\/strong><\/td><td><code>SM-01<\/code> open-load detection 🔍<\/td><td>Component + DV bench, fault injection: string disconnect at the connector, single-string disconnect, shunt open/short, amplifier input shorted, ADC reference shifted; over −40 °C … +85 °C and duty 20 … 100 %<\/td><td><code>HW-REQ-001<\/code> … <code>005<\/code>, <code>009<\/code>, <code>SM-01<\/code><\/td><td>Measurement uncertainty ≤ ±20 mA at 150 mA; trip guaranteed below 130 mA, no trip above 170 mA; detection ≤ 80 ms in every injected case; no false trip in 8 h of normal operation<\/td><\/tr><tr><td><strong>HV-02<\/strong><\/td><td><code>SM-02<\/code> watchdog and disable path<\/td><td>DV bench: withhold the answer, wrong answer, answer with correct value but wrong time slot, MCU clock stopped, MCU held in reset<\/td><td><code>HW-REQ-017<\/code>, <code>018<\/code>, <code>019<\/code>, <code>SM-02<\/code><\/td><td><code>SAFE_OFF<\/code> within 50 ms, channel de-energised within a further 10 ms; <code>SAFE_OFF<\/code> dominant with the MCU enable signal forced active<\/td><\/tr><tr><td><strong>HV-03<\/strong><\/td><td><code>SM-03<\/code> short-to-battery<\/td><td>DV bench, fault injection: channel output shorted to <code>KL30<\/code> in the on-phase and in the off-phase, and through 10 Ω<\/td><td><code>HW-REQ-006<\/code>, <code>020<\/code>, <code>SM-03<\/code><\/td><td>Classification &quot;short to battery&quot;, not &quot;open load&quot;, within 45 ms; correct DTC<\/td><\/tr><tr><td><strong>HV-04<\/strong><\/td><td><code>SM-04<\/code> overcurrent<\/td><td>DV bench: output shorted to ground, string partially shorted, output capacitance increased<\/td><td><code>HW-REQ-007<\/code>, <code>021<\/code>, <code>SM-04<\/code><\/td><td>Current limited to ≤ 1.8 A, latch-off ≤ 5 ms, status readable ≤ 10 ms, no damage in 100 repetitions<\/td><\/tr><tr><td><strong>HV-05<\/strong><\/td><td><code>SM-05<\/code> derating and thermal design<\/td><td>Climatic chamber per <strong>ISO 16750-4 (climatic loads)<\/strong> with the LED module; cavity temperature stepped to 105 °C; heat path artificially degraded to twice its thermal resistance; junction temperature by the forward-voltage method<\/td><td><code>HW-REQ-008<\/code>, <code>022<\/code>, <code>023<\/code>, <code>024<\/code>, <code>SM-05<\/code><\/td><td>Set point follows the curve within ±5 %; set point never below 400 mA; junction ≤ 135 °C in the case-C condition; NTC open and short both detected<\/td><\/tr><tr><td><strong>HV-06<\/strong><\/td><td><code>SM-06<\/code> voltage monitoring<\/td><td>DV bench with a programmable supply: ramp 0 → 60 V and back; rails individually forced out of tolerance<\/td><td><code>HW-REQ-011<\/code>, <code>012<\/code>, <code>016<\/code>, <code>017<\/code>, <code>SM-06<\/code><\/td><td>Reporting ≤ 10 ms; hardware shutdown ≤ 1 ms above 60 V; recovery ≤ 200 ms; no unintended actuation on any ramp<\/td><\/tr><tr><td><strong>HV-07<\/strong><\/td><td>Load dump and transients<\/td><td>DV per <strong>ISO 16750-2 (electrical loads)<\/strong> and <strong>ISO 7637-2<\/strong>, pulse table of <code>analysis_supply_and_transients.md<\/code><\/td><td><code>HW-REQ-013<\/code>, <code>014<\/code><\/td><td>Function class per pulse as tabulated; <strong>no open-load classification triggered by any pulse<\/strong><\/td><\/tr><tr><td><strong>HV-08<\/strong><\/td><td>Reverse polarity<\/td><td>DV per <strong>ISO 16750-2<\/strong>, −32 V for 60 s<\/td><td><code>HW-REQ-015<\/code><\/td><td>No damage, no channel energised, function restored afterwards<\/td><\/tr><tr><td><strong>HV-09<\/strong><\/td><td>EMC<\/td><td>DV per <strong>ECE Regulation R10<\/strong>, with the emission and immunity test methods of <strong>CISPR 25<\/strong> and <strong>ISO 11452<\/strong> as referenced by the OEM test plan; low beam on, dimmed to 20 % duty and at the derating floor<\/td><td><code>CR-012<\/code>, indirectly <code>HW-REQ-001<\/code><\/td><td>Emission limits met; under immunity exposure no false open-load classification and no set-point deviation &gt; 5 %<\/td><\/tr><tr><td><strong>HV-10<\/strong><\/td><td>Environmental / mechanical<\/td><td>DV per <strong>ISO 16750-3 (mechanical loads)<\/strong>, <strong>-4 (climatic loads)<\/strong>, <strong>-5 (chemical loads)<\/strong>: vibration profile of the front module, thermal shock, damp heat cyclic, salt spray, IP protection<\/td><td><code>CR-013<\/code>, <code>CR-014<\/code>, <code>A-11<\/code><\/td><td>No functional deviation, no intermittent contact during vibration monitored on the channel current<\/td><\/tr><tr><td><strong>HV-11<\/strong><\/td><td>HALT / HASS<\/td><td>HALT on DV samples: stepped thermal and vibration stress beyond specification to the operational and destruct limits; HASS as a screening profile derived from the HALT result, applied in production<\/td><td>Design margin, not a requirement<\/td><td>Operational limits ≥ 20 K beyond the specified range; HASS profile ≤ 20 % of the destruct limit; no infant-mortality failure escaping the screen<\/td><\/tr><tr><td><strong>HV-12<\/strong><\/td><td>Bus transceivers<\/td><td>DV bench: bus lines shorted to supply and ground, TXD held dominant<\/td><td><code>HW-REQ-025<\/code><\/td><td>Bus released within 5 ms, no damage, recovery after fault removal<\/td><\/tr><\/tbody><\/table><\/div><p><strong>HALT is not a verification of a requirement<\/strong> — it is a search for the design margin, and it<br>belongs in this plan precisely because it produces findings no requirement-based test can. HASS,<br>derived from it, is a production screen and hence PV/series scope.<\/p><h4>4 DV / PV scope<\/h4><div class='tw'><table><thead><tr><th>Entry<\/th><th>DV<\/th><th>PV<\/th><th>Sample size (plausible example)<\/th><\/tr><\/thead><tbody><tr><td>HV-01 … HV-06<\/td><td>full<\/td><td>reduced (HV-01, HV-05, HV-06)<\/td><td>DV 6 units, PV 3 units per lot<\/td><\/tr><tr><td>HV-07, HV-08<\/td><td>full<\/td><td>—<\/td><td>3 units<\/td><\/tr><tr><td>HV-09 EMC<\/td><td>full<\/td><td>repeat only after a design change<\/td><td>3 units<\/td><\/tr><tr><td>HV-10 environmental<\/td><td>full<\/td><td>reduced (vibration, damp heat)<\/td><td>6 units DV, 3 PV<\/td><\/tr><tr><td>HV-11 HALT / HASS<\/td><td>HALT once per design<\/td><td>HASS 100 % in series<\/td><td>4 units HALT<\/td><\/tr><tr><td>HV-12<\/td><td>full<\/td><td>—<\/td><td>3 units<\/td><\/tr><\/tbody><\/table><\/div><h4>5 Fault injection — hand-off to <code>verification-engineer<\/code><\/h4><p>The fault list of <code>HV-01<\/code> is not a test-designer&#x27;s invention; it comes from the six failure-mode<br>groups of <a href=\"#doc/05_hardware/analysis_sm01_coverage.md\"><code>analysis_sm01_coverage.md<\/code><\/a> section 2. The coverage claim of<br><code>SM-01<\/code> is only demonstrated if <strong>each group<\/strong> has at least one injected fault and each of the four<br>conditional measures is shown to detect what it is credited with. In particular:<\/p><ul><li>Group 5 (sense chain stuck at a plausible value) must be injected <strong>together with<\/strong> an open load, because the danger is masking, not failure — a sequential test would pass while the masking case fails.<\/li><li>Group 2 (single string lost) must be run at several duty values, since the channel voltage signature is what carries the detection.<\/li><li>Every injection must also be run with the transients of <code>HV-07<\/code> active, otherwise the interaction between debounce and disturbance stays untested.<\/li><\/ul><h4>6 Open points<\/h4><div class='tw'><table><thead><tr><th>#<\/th><th>Point<\/th><th>Owner<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Turn <code>HV-01<\/code> … <code>HV-12<\/code> into <code>TC-xxx<\/code> records (<code>OP-19<\/code> extended to <code>HW-REQ-011<\/code> … <code>HW-REQ-025<\/code>)<\/td><td>verification-engineer<\/td><\/tr><tr><td>2<\/td><td>EMC test levels and the applicable OEM test plan to be fixed<\/td><td>systems-engineer, verification-engineer<\/td><\/tr><tr><td>3<\/td><td>Junction-temperature measurement method for <code>HV-05<\/code> to be agreed with the LED supplier<\/td><td>hardware-engineer<\/td><\/tr><tr><td>4<\/td><td>HALT/HASS profiles depend on the mechanical design, which does not exist yet<\/td><td>hardware-engineer<\/td><\/tr><\/tbody><\/table><\/div><hr><p><strong>Work products:<\/strong> <code>05_hardware/hw_verification_plan.md<\/code><br><strong>Open points:<\/strong> section 6<br><strong>Process reference:<\/strong> ASPICE <strong>HWE.3<\/strong> (verification against the hardware design) and <strong>HWE.4<\/strong><br>(hardware verification) · ISO 26262 <strong>Part 5<\/strong> (hardware integration and verification, including<br>fault injection as a verification measure) · robustness and environmental testing per <strong>ISO 16750<\/strong><br>series, transients per <strong>ISO 7637-2<\/strong>, EMC per <strong>ECE R10<\/strong> (parts and topics named, no clause<br>numbers cited).<\/p>"},{"path":"07_verification/reports/trace_explorer.html","title":"Trace explorer","folder":"07_verification/reports","exists":true,"html":""},{"path":"07_verification/reports/traceability_matrix.md","title":"Traceability matrix (generated)","folder":"07_verification/reports","exists":true,"html":"<blockquote>Generated automatically by <code>tools/trace_check.py<\/code> - do not edit manually.<\/blockquote><div class='tw'><table><thead><tr><th>ID<\/th><th>Type<\/th><th>ASIL<\/th><th>Status<\/th><th>derived_from<\/th><th>allocated_to<\/th><th>verified_by<\/th><th>File<\/th><\/tr>
