icitly says \\\"the decision criteria below\\\". ```plantuml ","task":"add a comment for the decision note with current_sense_chain with regards to the source of it","task_html":"<p>add a comment for the decision note with current_sense_chain with regards to the source of it<\/p>","context_html":"<p>Model view Activity - Activate low beam including the fault case (SYS-REQ-001, FSR-001) (03_model/plantuml/act_low_beam.puml)<\/p>","plan":"","plan_html":"","result_html":"<p>🔍 DEEP DIVE — <code>act_low_beam<\/code> (Golden Thread SG-01) ## Change made Added a provenance note anchored to the <code>Current_Sense_Chain samples I_load in the PWM on-phase<\/code> action, i.e. the sampling step that feeds both downstream decision nodes (<code>PWM on-time &gt;= 150 us?<\/code> and <code>I_load &lt; 150 mA for &gt; 50 ms?<\/code>). PlantUML activity-beta notes attach to actions, not to decision nodes, so the note sits on the action immediately preceding the decisions and explicitly says \\&quot;the decision criteria below\\&quot;. ```plantuml<\/p>","planned_at":"","approved_at":"","file":"09_process/jobs/JOB-001.md"},{"id":"JOB-002","status":"done","target":"SYS.1","target_kind":"area","agent":"systems-engineer","relates_to":[],"branch":"job/JOB-002","result":"Done. Working tree only, nothing committed. ## What I added — `CR-024 … CR-028` (SYS.1, illuminance) | ID | Text (abridged) | Type | ASIL | Source/trace | Verification | Status | |---|---|---|---|---|---|---| | CR-024 | **While** the low beam is active in its base light distribution, the system **shall** provide ≥ 12 lx at 75R. | functional | QM * | Cust. spec. sect. 4.7 (fictitious), `A-22` | Test | draft | | CR-025 | **While** the low beam is active, the system **shall not** exceed 0.7 lx at B","task":"add some customer requirements regarding the illuminance related to adaptive front light system","task_html":"<p>add some customer requirements regarding the illuminance related to adaptive front light system<\/p>","context_html":"<p>Process area SYS.1 - Requirements elicitation<\/p>","plan":"The plan is written to `/Users/tugcegulbicim/.claude/plans/this-task-concerns-sys-1-delightful-knuth.md`. Summary:\n\n**Add** five customer requirements `CR-024 … CR-028` in `01_requirements/customer/`, EARS-worded, Requirements-as-Code front matter, all `status: draft`:\n\n- `CR-024` low-beam illuminance level ≥ 12 lx at 75R (functional, ASIL B, SG-01)\n- `CR-025` glare limit ≤ 0.7 lx at B50L (legal, ASIL A, SG-02)\n- `CR-026` illuminance retained after a single low-beam channel failure (functional, ASIL B, SG-01)\n- `CR-027` AFS mode change completed within 1000 ms (functional, ASIL A)\n- `CR-028` illuminance stability ±10 % over the environmental range with derating inactive (functional, QM)\n\n**Supporting:** new assumption `A-22` (photometric measurement convention — 25 m screen, 75R/B50L, aim), CR count and a new open point in `09_process/project_status.md`, and regeneration of the generated indexes/browser.\n\n**Not touched:** no SYS-REQ derivation, no new weak requirements, no edits to `CR-001 … CR-023`, no HARA/FSC/TSC/architecture/HW changes, no commit or push.\n\n**Three decisions first:** how many CRs (3 / 5 / 6), how `CR-026` is quantified given the ~19 % flux at the 400 mA derating floor in `analysis_thermal_derating.md`, and whether I may set the ASIL myself (proposed, marked for safety-manager confirmation) or must default to QM.\n\n## Decisions (from the human, binding for this run)\n\n1. **Five CRs**, `CR-024 … CR-028`, as listed above.\n\n2. **Do not set an ASIL.** Every new record gets `asil: QM`. Determining the ASIL of a customer\n   requirement is the safety-manager's call and follows from the HARA, not from the systems\n   engineer's judgement — `OP-1` had to correct exactly that once already. State in each\n   `rationale` that the ASIL is open pending safety-manager assignment, and raise one open point\n   covering all five.\n\n3. **`CR-026` must not contradict the `SG-01` safe state.** The limp-home state operates the\n   remaining channel, which `analysis_thermal_derating.md` puts near 19 % of nominal flux at the\n   400 mA floor. A requirement demanding a fixed illuminance after a channel failure would make\n   the safe state a violation of the customer specification. So: word `CR-026` against the\n   *legal minimum* for a degraded low beam rather than against the nominal level, and if a\n   number is needed, derive it from the analysis and mark it as requiring confirmation. Do not\n   invent a value that the safe state cannot meet.\n\n**If any of this turns out to be unworkable, stop and say so rather than working around it.**","plan_html":"<p>The plan is written to <code>/Users/tugcegulbicim/.claude/plans/this-task-concerns-sys-1-delightful-knuth.md<\/code>. Summary:<\/p><p><strong>Add<\/strong> five customer requirements <code>CR-024 … CR-028<\/code> in <code>01_requirements/customer/<\/code>, EARS-worded, Requirements-as-Code front matter, all <code>status: draft<\/code>:<\/p><ul><li><code>CR-024<\/code> low-beam illuminance level ≥ 12 lx at 75R (functional, ASIL B, SG-01)<\/li><li><code>CR-025<\/code> glare limit ≤ 0.7 lx at B50L (legal, ASIL A, SG-02)<\/li><li><code>CR-026<\/code> illuminance retained after a single low-beam channel failure (functional, ASIL B, SG-01)<\/li><li><code>CR-027<\/code> AFS mode change completed within 1000 ms (functional, ASIL A)<\/li><li><code>CR-028<\/code> illuminance stability ±10 % over the environmental range with derating inactive (functional, QM)<\/li><\/ul><p><strong>Supporting:<\/strong> new assumption <code>A-22<\/code> (photometric measurement convention — 25 m screen, 75R/B50L, aim), CR count and a new open point in <code>09_process/project_status.md<\/code>, and regeneration of the generated indexes/browser.<\/p><p><strong>Not touched:<\/strong> no SYS-REQ derivation, no new weak requirements, no edits to <code>CR-001 … CR-023<\/code>, no HARA/FSC/TSC/architecture/HW changes, no commit or push.<\/p><p><strong>Three decisions first:<\/strong> how many CRs (3 / 5 / 6), how <code>CR-026<\/code> is quantified given the ~19 % flux at the 400 mA derating floor in <code>analysis_thermal_derating.md<\/code>, and whether I may set the ASIL myself (proposed, marked for safety-manager confirmation) or must default to QM.<\/p><h4>Decisions (from the human, binding for this run)<\/h4><ol><li><strong>Five CRs<\/strong>, <code>CR-024 … CR-028<\/code>, as listed above.<\/li><li><strong>Do not set an ASIL.<\/strong> Every new record gets <code>asil: QM<\/code>. Determining the ASIL of a customer requirement is the safety-manager&#x27;s call and follows from the HARA, not from the systems engineer&#x27;s judgement — <code>OP-1<\/code> had to correct exactly that once already. State in each <code>rationale<\/code> that the ASIL is open pending safety-manager assignment, and raise one open point covering all five.<\/li><li><strong><code>CR-026<\/code> must not contradict the <code>SG-01<\/code> safe state.<\/strong> The limp-home state operates the remaining channel, which <code>analysis_thermal_derating.md<\/code> puts near 19 % of nominal flux at the 400 mA floor. A requirement demanding a fixed illuminance after a channel failure would make the safe state a violation of the customer specification. So: word <code>CR-026<\/code> against the <em>legal minimum<\/em> for a degraded low beam rather than against the nominal level, and if a number is needed, derive it from the analysis and mark it as requiring confirmation. Do not invent a value that the safe state cannot meet.<\/li><\/ol><p><strong>If any of this turns out to be unworkable, stop and say so rather than working around it.<\/strong><\/p>","result_html":"<p>Done. Working tree only, nothing committed. ## What I added — <code>CR-024 … CR-028<\/code> (SYS.1, illuminance) | ID | Text (abridged) | Type | ASIL | Source/trace | Verification | Status | |---|---|---|---|---|---|---| | CR-024 | <strong>While<\/  in <code>OP-1<\/code>; <code>CR-024<\/code>/<code>CR-026<\/code> touch <code>SG-01<\/code>, <code>CR-025<\/code> touches <code>SG-02<\/code>","owner":"safety-manager","state":"Phase 5","done":false,"targets":["CR-024","CR-025","CR-026","CR-028","SG-01","SG-02"],"source":"09_process/project_status.md"}],"agents":[{"name":"config-manager","description":"Owns the GitHub-based configuration management and evidence layer — repo structure, Requirements-as-Code files, branching and commit conventions, baselines via tags/releases, issue"},{"name":"hardware-engineer","description":"Owns hardware requirements (HW-REQ), HW architecture blocks, hardware safety mechanisms (open load, short-to-battery, overcurrent, overtemperature with derating curve, watchdog, su"},{"name":"mbse-modeler","description":"Produces the SysML v1.6 / MagicGrid model views as renderable PlantUML — MagicGrid matrix, use case, requirements diagram with deriveReqt/satisfy/verify, activity, sequence, state "},{"name":"quality-assessor","description":"Independent reviewer and assessor. Checks work products against ASPICE base practices and ISO 26262 expectations, audits consistency of IDs, traces, ASIL and numeric values across "},{"name":"safety-analyst","description":"Executes the safety analyses — System-FMEA and DFMEA per AIAG-VDA 7-step method with B/A/E and task priority (AP, not RPZ), FTA with minimal cut sets, FMEDA with SPFM/LFM/PMHF comp"},{"name":"safety-manager","description":"Owns ISO 26262 concept-phase and safety-management work products — item definition, HARA with S/E/C rationale, safety goals with safe state/FTTI, functional safety concept (FSR), t"},{"name":"software-engineer","description":"Owns software requirements (SW-REQ) incl. timing, the layered SW architecture (MCAL/BSW/AUTOSAR Classic, Service, Application), the full detailed design of SWC_LightManager, MISRA "},{"name":"systems-engineer","description":"Authors and reviews customer requirements (CR), system requirements (SYS-REQ), the E/E system architecture and interface definitions. Use for ASPICE SYS.1, SYS.2, SYS.3 work produc"},{"name":"verification-engineer","description":"Owns the test strategy per V-model level, test cases TC-xxx in table form (precondition, steps, expected result, covered requirement ID, ASIL, MiL/SiL/HiL/vehicle), fault injection"}],"jobsPath":"09_process/jobs","jobsPort":8787,"levels":[{"id":"concept","title":"Concept phase"},{"id":"system","title":"System level"},{"id":"hardware","title":"Hardware level"},{"id":"software","title":"Software level"},{"id":"supporting","title":"Supporting and management processes"}],"items":{"CR-001":{"id":"CR-001","kind":"CR","text":"When the driver moves the light switch to the \"low beam\" position, the lighting system shall activate the low beam within 300 ms.","type":"functional","asil":"B","status":"draft","source":"Customer specification, sect. 4.1 (fictitious)","rationale":"Basic function. Response time is a plausible example value.","up":[],"down":["SYS-REQ-001"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-001.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> B — Contributes to SG-01: the low beam is the safety-relevant function.<\/p>"},"CR-002":{"id":"CR-002","kind":"CR","text":"When ambient brightness decreases, the lighting system shall switch to low beam in good time and with sufficient brightness.","type":"functional","asil":"B","status":"draft","source":"Customer specification, sect. 4.1 (fictitious)","rationale":"DELIBERATELY WEAK - see the phase 1 quality assessment. Do not use as a template.","up":[],"down":["SYS-REQ-002","SYS-REQ-003"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-002.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> B — Contributes to SG-01. A fault in the automatic switching path can de-energise the low beam at night (hazard H-04).<\/p>"},"CR-003":{"id":"CR-003","kind":"CR","text":"When the vehicle sensor system reports oncoming or preceding vehicles, the lighting system shall mask the affected high-beam segment within 500 ms.","type":"functional","asil":"A","status":"draft","source":"Customer specification, sect. 4.2 (fictitious)","rationale":"Glare-free high beam. The sensor system is outside the item boundary, see A-05.","up":[],"down":["SYS-REQ-004"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-003.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> A — Contributes to SG-02, hazard H-02.<\/p>"},"CR-004":{"id":"CR-004","kind":"CR","text":"While the vehicle speed exceeds 10 km/h, the lighting system shall prevent activation of the work lamps.","type":"functional","asil":"A","status":"draft","source":"Customer specification, sect. 4.4 (fictitious)","rationale":"Glare avoidance, relates to SG-02. Threshold is a plausible example value.","up":[],"down":["FSR-008","SYS-REQ-005"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-004.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> A — Contributes to SG-02, hazard H-03.<\/p>"},"CR-005":{"id":"CR-005","kind":"CR","text":"When the steering angle exceeds 15 degrees, the lighting system shall switch on the cornering light via the LIN-controlled stepper motor and shall additionally switch it off again when the angle falls below 5 degrees and store the state in the fault memory.","type":"functional","asil":"A","status":"draft","source":"Customer specification, sect. 4.3 (fictitious)","rationale":"DELIBERATELY WEAK - see the phase 1 quality assessment. Do not use as a template.","up":[],"down":["SYS-REQ-006","SYS-REQ-007","SYS-REQ-008"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-005.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> A — Contributes to SG-02, hazard H-07.<\/p>"},"CR-006":{"id":"CR-006","kind":"CR","text":"When the ignition is switched on, the lighting system shall activate the daytime running lights within 2 s.","type":"functional","asil":"QM","status":"draft","source":"ECE R48 switching requirement, customer specification sect. 4.1","rationale":"Legally driven basic function.","up":[],"down":["SYS-REQ-009"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-006.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> QM — Hazard H-06 results in QM. Remains legally relevant under ECE R48.<\/p>"},"CR-007":{"id":"CR-007","kind":"CR","text":"The lighting system shall detect the failure of a low-beam channel and indicate it visually to the driver in the instrument cluster within 2 s.","type":"functional","asil":"B","status":"reviewed","source":"Stakeholder OEM customer specification, sect. 4.3 (fictitious)","rationale":"Loss of the low beam during night driving is the design-driving case for SG-01. Indication time is a plausible example value, not validated data.","up":[],"down":["FSR-004","SYS-REQ-010","SYS-REQ-014"],"alloc":["ECU_LightingCtrl"],"vby":["TC-021"],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-007.md","body":"<h4>Context<\/h4><p>Reference record for the Requirements-as-Code format (see skill <code>requirements-authoring<\/code>).<br>Related: ECE R48 (installation), diagnostics via UDS ISO 14229.<\/p><h4>Open points<\/h4><ol><li>Alignment of the indication type with the OEM HMI concept - <code>A-04<\/code>.<\/li><\/ol>"},"CR-008":{"id":"CR-008","kind":"CR","text":"When a low-beam channel fails, the lighting system shall continue to operate the remaining channel and store the failure in the fault memory.","type":"functional","asil":"B","status":"draft","source":"Customer specification, sect. 4.6 (fictitious)","rationale":"Limp-home concept, feeds the safe state of SG-01.","up":[],"down":["SYS-REQ-011"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-008.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> B — Realises the safe state of SG-01.<\/p>"},"CR-009":{"id":"CR-009","kind":"CR","text":"The lighting system shall comply with the installation and switching requirements of ECE Regulation R48 for class N3 vehicles.","type":"legal","asil":"QM","status":"draft","source":"Homologation requirement","rationale":"Evidence via type approval report and installation inspection.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-009.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-010":{"id":"CR-010","kind":"CR","text":"The low-beam and high-beam functions shall meet the photometric requirements of ECE Regulations R112 and R123.","type":"legal","asil":"QM","status":"draft","source":"Homologation requirement","rationale":"R123 covers adaptive front-lighting. Evidence from the photometric laboratory.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-010.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-011":{"id":"CR-011","kind":"CR","text":"Where a rotating beacon is fitted, its control shall meet the requirements of ECE Regulation R65.","type":"legal","asil":"QM","status":"draft","source":"Homologation requirement","rationale":"EARS optional-feature pattern. Applies only to body variants with a beacon.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-011.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-012":{"id":"CR-012","kind":"CR","text":"The lighting system shall comply with the EMC requirements of ECE Regulation R10.","type":"legal","asil":"QM","status":"draft","source":"Homologation requirement","rationale":"Emission and immunity, evidence from the EMC laboratory.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-012.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-013":{"id":"CR-013","kind":"CR","text":"The lighting system shall withstand the mechanical loads per ISO 16750-3 for the front-module mounting location.","type":"environmental-mechanical","asil":"QM","status":"draft","source":"Customer specification, environmental section","rationale":"Vibration and shock, test plan in the HW verification plan.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-013.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-014":{"id":"CR-014","kind":"CR","text":"The lighting system shall remain functional across an ambient temperature range from -40 °C to +85 °C.","type":"environmental-mechanical","asil":"QM","status":"draft","source":"Customer specification, environmental section","rationale":"Climatic loads per ISO 16750-4. Limits are plausible example values.","up":[],"down":["HW-REQ-022","HW-REQ-023","HW-REQ-024","SM-05"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-014.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-015":{"id":"CR-015","kind":"CR","text":"The ECU housing shall meet protection class IP6K9K per ISO 20653.","type":"environmental-mechanical","asil":"QM","status":"draft","source":"Customer specification, environmental section","rationale":"Mounting location exposed to high-pressure cleaning.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-015.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-016":{"id":"CR-016","kind":"CR","text":"The lighting system shall be supplied via a buck converter with a downstream 5 V linear regulator so that it operates across the vehicle supply range from 16 V to 32 V.","type":"electrical","asil":"B","status":"draft","source":"Customer specification, electrical section","rationale":"DELIBERATELY WEAK - see the phase 1 quality assessment. Do not use as a template.","up":[],"down":["SYS-REQ-012","SYS-REQ-013"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-016.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> B — The supply feeds the low beam; loss of supply is a cause of hazard H-01.<\/p>"},"CR-017":{"id":"CR-017","kind":"CR","text":"While transients per ISO 7637-2 are present at the vehicle supply connection, the lighting system shall maintain the low-beam function without loss of function.","type":"electrical","asil":"B","status":"draft","source":"Customer specification, electrical section","rationale":"The required function class per pulse is still to be defined in the test plan - open point.","up":[],"down":["HW-REQ-013","HW-REQ-014","HW-REQ-015"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-017.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> B — Immunity of the low-beam function against supply transients, hazard H-01/H-04.<\/p>"},"CR-018":{"id":"CR-018","kind":"CR","text":"While the vehicle is in the ignition-off state, the lighting system shall not exceed a quiescent current of 1 mA after the run-on time has elapsed.","type":"electrical","asil":"QM","status":"draft","source":"Customer specification, electrical section","rationale":"Quiescent current limit is a plausible example value.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-018.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-019":{"id":"CR-019","kind":"CR","text":"When a diagnostic tester sends a UDS request per ISO 14229, the lighting system shall provide the stored DTCs within 100 ms.","type":"diagnostics","asil":"QM","status":"draft","source":"Customer specification, diagnostics section","rationale":"Response time is a plausible example value.","up":[],"down":["SYS-REQ-021"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-019.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> QM — Reading the fault memory is not part of the safety chain; the safety-relevant warning path is CR-007 / SYS-REQ-010.<\/p>"},"CR-020":{"id":"CR-020","kind":"CR","text":"The lighting system shall exchange control and status information with the vehicle via CAN FD per SAE J1939.","type":"communication","asil":"B","status":"draft","source":"Customer specification, communication section","rationale":"Message catalogue to be detailed in phase 3.","up":[],"down":["SYS-REQ-020","SYS-REQ-022"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-020.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> B — Carries the light request and the speed signal used by safety functions; ASIL inherited from the highest function using them.<\/p>"},"CR-021":{"id":"CR-021","kind":"CR","text":"The lighting system shall connect actuator-side components via LIN per ISO 17987.","type":"communication","asil":"QM","status":"draft","source":"Customer specification, communication section","rationale":"Applies to the actuator of the adaptive front-lighting system.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-021.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-022":{"id":"CR-022","kind":"CR","text":"The lighting system shall achieve an operating life of 30,000 h or a mileage of 1,500,000 km without exceeding the permissible failure rate.","type":"durability","asil":"QM","status":"draft","source":"Customer specification, reliability section","rationale":"N3 long-haul usage profile. Values are plausible example values.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-022.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1).<\/p><p><strong>ASIL set in phase 3 (closes OP-1):<\/strong> QM — Durability target. Random hardware failure rates are handled by the FMEDA, not by this requirement.<\/p>"},"CR-023":{"id":"CR-023","kind":"CR","text":"The lighting system shall meet the interface requirements of the vehicle-level cybersecurity concept per ISO 21434.","type":"interface","asil":"QM","status":"draft","source":"Vehicle-level cybersecurity concept","rationale":"Reference only. Detailed requirements are managed outside this project.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-023.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1). The ASIL is determined by the HARA in phase 2; until<br>then <code>asil: tbd<\/code>. Derivation to <code>SYS-REQ-xxx<\/code> follows in phase 3.<\/p>"},"CR-024":{"id":"CR-024","kind":"CR","text":"While the low beam is active in its base light distribution, the lighting system shall provide an illuminance of at least 12 lx at measuring point 75R on the measuring screen.","type":"functional","asil":"QM","status":"draft","source":"Customer specification, sect. 4.7 (fictitious)","rationale":"Customer-side illuminance level of the base low beam, above the homologation minimum of CR-010 (plausible example value, not validated). Measuring convention per A-22. The ASIL is open and is assigned by the safety-manager from the HARA (OP-41); asil: QM is a placeholder, not a classification result.","up":[],"down":[],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-024.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1), added in a later SYS.1 increment (illuminance topic).<\/p><p><code>CR-010<\/code> demands only compliance with the photometric requirements of ECE R112/R123. This record<br>adds the customer&#x27;s own, tighter level for the base light distribution and gives a single<br>measuring point that can be tested pass/fail.<\/p><p>The measuring convention (screen distance, point designations, aim) is captured as assumption<br><code>A-22<\/code>, because the customer specification extract does not state it.<\/p>"},"CR-025":{"id":"CR-025","kind":"CR","text":"While the low beam is active, the lighting system shall not exceed an illuminance of 0.7 lx at measuring point B50L on the measuring screen.","type":"legal","asil":"QM","status":"draft","source":"Homologation requirement, customer specification sect. 4.8 (fictitious)","rationale":"Glare limit towards oncoming traffic; the value is a plausible example value oriented on the order of magnitude of the passing-beam glare limits of ECE R112/R123 and is not taken from a clause. Measuring convention per A-22. The ASIL is open and is assigned by the safety-manager from the HARA (OP-41); asil: QM is a placeholder, not a classification result.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-025.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1), added in a later SYS.1 increment (illuminance topic).<\/p><p>Content-wise this record belongs to the <code>SG-02<\/code> thread (no unintended glare). It bounds the<br>static glare of the low beam; the dynamic, object-dependent glare-free high beam is covered by<br><code>CR-003<\/code>.<\/p><p>The exact regulatory value and the clause it comes from are <strong>not<\/strong> cited here — the number is a<br>project example value and must be replaced by the homologation figure before any baseline.<\/p>"},"CR-026":{"id":"CR-026","kind":"CR","text":"If one low-beam channel has failed, the lighting system shall continue to provide, with the remaining channel, at least the photometric minimum that the applicable ECE Regulation for the passing beam requires (ECE R112/R123, photometric requirements).","type":"functional","asil":"QM","status":"draft","source":"Customer specification, sect. 4.9 (fictitious)","rationale":"Deliberately worded against the *legal minimum* for a degraded passing beam, not against the nominal level of CR-024: the SG-01 safe state operates the remaining channel and may sit at the 400 mA derating floor, which 05_hardware/analysis_thermal_derating.md puts at about 232 lm (~19 % of nominal flux) per channel. A fixed nominal illuminance here would turn the safe state itself into a specification violation. No numeric illuminance value is fixed until OP-38 is answered. The ASIL is open and is assigned by the safety-manager from the HARA (OP-41); asil: QM is a placeholder, not a classification result.","up":[],"down":[],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-026.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1), added in a later SYS.1 increment (illuminance topic).<\/p><p>Complements <code>CR-008<\/code> (limp-home behaviour: keep operating the remaining channel, store the fault)<br>with the photometric side of the same state: how much light the degraded system still has to put<br>on the road.<\/p><p><strong>Deliberately not quantified.<\/strong> The candidate value would follow from <code>A-13<\/code> and the load-line<br>analysis in <code>05_hardware/analysis_thermal_derating.md<\/code> — a channel held at the 400 mA derating<br>floor produces roughly 232 lm, about 19 % of nominal flux. Whether that meets the legal passing-beam<br>minimum is exactly the question of <code>OP-38<\/code> and is not decided here. Any illuminance number entered<br>into this record before <code>OP-38<\/code> is closed requires confirmation against the photometric<br>measurement, and would, if set too high, contradict the safe state of <code>SG-01<\/code>.<\/p><p>Note also that the same 400 mA operating point occurs in the undervoltage case of <code>SYS-REQ-013<\/code>,<br>so the answer to <code>OP-38<\/code> applies to more than the channel-failure case.<\/p>"},"CR-027":{"id":"CR-027","kind":"CR","text":"When a change of the adaptive light-distribution mode is requested, the lighting system shall have completed the transition to the illuminance distribution of the new mode within 1000 ms.","type":"functional","asil":"QM","status":"draft","source":"Customer specification, sect. 4.10 (fictitious)","rationale":"Transition time of the AFS mode change (e.g. town / country / motorway light distribution); 1000 ms is a plausible example value, not validated. Deliberately bounds the completion of the transition, not its start, so the criterion is measurable photometrically. The ASIL is open and is assigned by the safety-manager from the HARA (OP-41); asil: QM is a placeholder, not a classification result.","up":[],"down":[],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-027.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1), added in a later SYS.1 increment (illuminance topic).<\/p><p>The requesting source (driver input, or the vehicle via CAN FD based on speed and navigation data)<br>is deliberately left open at customer-requirement level; the concrete trigger set belongs to<br><code>SYS.2<\/code>.<\/p><p>Distinct from <code>CR-001<\/code> (300 ms to activate the low beam from the switch), which bounds switch-on,<br>not a redistribution between two active light distributions. The set of supported modes is not<br>fixed by this record and has to be agreed with the OEM.<\/p>"},"CR-028":{"id":"CR-028","kind":"CR","text":"While the low beam is active and thermal derating is not active, the lighting system shall keep the illuminance at measuring point 75R within +/-10 % of its value at 25 degC ambient temperature over the ambient temperature range from -40 degC to +85 degC and over the normal supply-voltage range.","type":"functional","asil":"QM","status":"draft","source":"Customer specification, sect. 4.11 (fictitious)","rationale":"Stability of the light output, i.e. the customer's perceived-quality requirement on the constant- current control and the thermal design; +/-10 % is a plausible example value, not validated. The exclusion \"derating not active\" is essential: HW-REQ-023 lowers the channel current on purpose down to the 400 mA floor, which is far outside +/-10 % and must not be read as a violation of this record. The ASIL is open and is assigned by the safety-manager from the HARA (OP-41); asil: QM is a placeholder, not a classification result.","up":[],"down":[],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/customer/CR-028.md","body":"<h4>Context<\/h4><p>Customer requirement from phase 1 (SYS.1), added in a later SYS.1 increment (illuminance topic).<\/p><p>The temperature range is the one already agreed in <code>CR-014<\/code>; the normal supply range is the one of<br><code>CR-016<\/code> / <code>CR-017<\/code> (below 9 V the system enters the undervoltage behaviour of <code>SYS-REQ-013<\/code>, which<br>is likewise out of scope of this record).<\/p><p>Two intentional carve-outs, both because the system is designed to leave the band on purpose:<br>thermal derating (<code>HW-REQ-023<\/code>) and undervoltage operation (<code>SYS-REQ-013<\/code>). Whether further<br>carve-outs are needed (e.g. the LED warm-up phase after switch-on) is open and should be settled<br>with the OEM before this record leaves <code>draft<\/code>.<\/p>"},"FSR-001":{"id":"FSR-001","kind":"FSR","text":"When a low-beam channel fails, the lighting system shall detect the failure within the fault reaction time, transition to the safe state and warn the driver.","type":"safety","asil":"B","status":"reviewed","source":"SG-01","rationale":"Derived from SG-01; safe state and FTTI per the SG-01 record.","up":["SG-01"],"down":["HW-REQ-001","HW-REQ-005","HW-REQ-009","HW-REQ-010","SM-01","SYS-REQ-014","SYS-REQ-016","SYS-REQ-018","TC-021","TSR-003","TSR-004"],"alloc":["ECU_LightingCtrl","SM-01"],"vby":["TC-021"],"verifies":[],"tags":[],"file":"02_safety/03_fsc/FSR-001.md","body":"<h4>Context<\/h4><p>Example FSR record of the functional safety concept (ISO 26262-3, FSC).<\/p>"},"FSR-002":{"id":"FSR-002","kind":"FSR","text":"The lighting system shall prevent any deactivation of the low beam that was not requested by the driver.","type":"safety","asil":"B","status":"draft","source":"SG-01","rationale":"Derived from hazard H-04 (unintended deactivation), complementary to FSR-001 (failure detection).","up":["SG-01"],"down":["HW-REQ-012","HW-REQ-013","HW-REQ-016","HW-REQ-017","HW-REQ-021","HW-REQ-022","SM-02","SM-04","SM-05","SM-06","SYS-REQ-001","SYS-REQ-002","SYS-REQ-012","SYS-REQ-025","TSR-001","TSR-002"],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/03_fsc/FSR-002.md","body":"<h4>Context<\/h4><p>Addresses the fault class &quot;unintended deactivation&quot;, not component failure.<\/p>"},"FSR-003":{"id":"FSR-003","kind":"FSR","text":"While only one low-beam channel has failed, the lighting system shall continue to operate the remaining channel.","type":"safety","asil":"B","status":"draft","source":"SG-01","rationale":"Realises the safe state of SG-01 (limp-home operation). Presumes freedom from interference between the channels - to be demonstrated by the DFA in phase 5.","up":["SG-01"],"down":["SYS-REQ-011","SYS-REQ-013","TSR-004"],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/03_fsc/FSR-003.md","body":"<h4>Context<\/h4><p>The safe state is deliberately &quot;degraded but visible&quot;, not &quot;off&quot;.<\/p>"},"FSR-004":{"id":"FSR-004","kind":"FSR","text":"When the lighting system has detected the failure of a low-beam channel, it shall warn the driver visually within 2 s.","type":"safety","asil":"B","status":"draft","source":"SG-01, CR-007","rationale":"The warning supports controllability assumption A-03 of the HARA. The 2 s stem from CR-007 and are deliberately longer than the 300 ms FTTI - see the phase 2 timing budget.","up":["SG-01","CR-007"],"down":["HW-REQ-025","SYS-REQ-010","TSR-005"],"alloc":["ECU_LightingCtrl","Vehicle_Gateway"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/03_fsc/FSR-004.md","body":"<h4>Context<\/h4><p>The warning is the measure that underpins the C rating of the HARA; it does not replace the<br>technical fault reaction.<\/p>"},"FSR-005":{"id":"FSR-005","kind":"FSR","text":"When an oncoming or preceding vehicle is reported, the lighting system shall switch off the glaring high-beam segment within the fault reaction time.","type":"safety","asil":"A","status":"draft","source":"SG-02","rationale":"Carrier of the decomposition example. Independence argument and DFA required.","up":["SG-02"],"down":["FSR-006","FSR-007","SYS-REQ-004"],"alloc":["ECU_LightingCtrl"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/03_fsc/FSR-005.md","body":"<h4>Context<\/h4><p>Parent requirement of the ASIL decomposition on the second thread.<\/p>"},"FSR-006":{"id":"FSR-006","kind":"FSR","text":"The lighting system shall determine the high-beam segment to be deactivated from the reported object data and control it accordingly.","type":"safety","asil":"QM(A)","status":"draft","source":"FSR-005","rationale":"Functional path without its own safety argument; safety is carried by the monitor FSR-007.","up":["FSR-005"],"down":["TSR-006"],"alloc":["SWC_HighBeamControl"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/03_fsc/FSR-006.md","body":"<h4>Context<\/h4><p>Without the independent monitor this requirement would be ASIL A.<\/p>"},"FSR-007":{"id":"FSR-007","kind":"FSR","text":"When the high-beam state contradicts the reported traffic situation, a monitor independent of the control path shall switch off the high beam within the fault reaction time.","type":"safety","asil":"A(A)","status":"draft","source":"FSR-005","rationale":"Carries the safety argument of the decomposed path on its own.","up":["FSR-005"],"down":["TSR-007"],"alloc":["ECU_LightingCtrl","SWC_HighBeamMonitor"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/03_fsc/FSR-007.md","body":"<h4>Context<\/h4><p>The monitor must have its own input path and its own means of switching off.<\/p>"},"FSR-008":{"id":"FSR-008","kind":"FSR","text":"While the vehicle speed exceeds 10 km/h, the lighting system shall inhibit activation of the work lamps.","type":"safety","asil":"A","status":"draft","source":"SG-02, CR-004","rationale":"Derived from hazard H-03. Speed threshold taken from CR-004.","up":["SG-02","CR-004"],"down":["SYS-REQ-005","TSR-008"],"alloc":["ECU_LightingCtrl","SWC_WorkLampControl"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/03_fsc/FSR-008.md","body":"<h4>Context<\/h4><p>The speed signal arrives via CAN FD from the vehicle - interface to be secured in phase 3.<\/p>"},"H-01":{"id":"H-01","kind":"H","text":"Failure of the low beam (both channels) during night driving: carriageway unlit at 80 km/h, running off the road or colliding with an unlit obstacle.","type":"hazard","asil":"B","status":"draft","source":"HARA phase 2, operational situation BS-01","rationale":"S3: collision at 80 km/h with 18 t, life-threatening injuries including to third parties. E3: night driving on unlit rural roads occurs regularly but not predominantly (A-07). C2: the failure is noticed immediately, a controlled stop is achievable for the majority of drivers.","up":[],"down":["SG-01"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/02_hara/H-01.md","body":"<h4>Context<\/h4><p>Structured record of the hazard. The full derivation, the method and the borderline discussion are<br>in <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>; the class interpretation in <a href=\"#doc/02_safety/02_hara/sec_classification.md\"><code>sec_classification.md<\/code><\/a>.<\/p><blockquote>The values here and the table in <code>hara.md<\/code> must agree - update both when changing either.<\/blockquote>"},"H-02":{"id":"H-02","kind":"H","text":"High beam remains active despite a detected oncoming vehicle: glare to the oncoming driver, head-on collision.","type":"hazard","asil":"A","status":"draft","source":"HARA phase 2, operational situation BS-02","rationale":"S3: head-on collision with a likely fatal outcome. E2: night, oncoming traffic and a fault must coincide. C2: the dazzled driver can respond by decelerating and holding the lane.","up":[],"down":["SG-02"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/02_hara/H-02.md","body":"<h4>Context<\/h4><p>Structured record of the hazard. The full derivation, the method and the borderline discussion are<br>in <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>; the class interpretation in <a href=\"#doc/02_safety/02_hara/sec_classification.md\"><code>sec_classification.md<\/code><\/a>.<\/p><blockquote>The values here and the table in <code>hara.md<\/code> must agree - update both when changing either.<\/blockquote>"},"H-03":{"id":"H-03","kind":"H","text":"Work lamps unintentionally active while driving: glare to oncoming and following traffic.","type":"hazard","asil":"A","status":"draft","source":"HARA phase 2, operational situation BS-01","rationale":"S3: as H-02. E2: requires night driving plus a fault. C2: glare is brief and recognised as such.","up":[],"down":["SG-02"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/02_hara/H-03.md","body":"<h4>Context<\/h4><p>Structured record of the hazard. The full derivation, the method and the borderline discussion are<br>in <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>; the class interpretation in <a href=\"#doc/02_safety/02_hara/sec_classification.md\"><code>sec_classification.md<\/code><\/a>.<\/p><blockquote>The values here and the table in <code>hara.md<\/code> must agree - update both when changing either.<\/blockquote>"},"H-04":{"id":"H-04","kind":"H","text":"Unintended deactivation of the low beam during operation: same effect as H-01, additionally unexpected for the driver.","type":"hazard","asil":"B","status":"draft","source":"HARA phase 2, operational situation BS-03","rationale":"Rating identical to H-01 because the effect at vehicle level is identical. The difference is the fault class: failure (H-01) versus unintended deactivation (H-04).","up":[],"down":["SG-01"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/02_hara/H-04.md","body":"<h4>Context<\/h4><p>Structured record of the hazard. The full derivation, the method and the borderline discussion are<br>in <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>; the class interpretation in <a href=\"#doc/02_safety/02_hara/sec_classification.md\"><code>sec_classification.md<\/code><\/a>.<\/p><blockquote>The values here and the table in <code>hara.md<\/code> must agree - update both when changing either.<\/blockquote>"},"H-05":{"id":"H-05","kind":"H","text":"Headlamp levelling permanently set too high: sustained glare to oncoming traffic.","type":"hazard","asil":"A","status":"draft","source":"HARA phase 2, operational situation BS-01","rationale":"S2: glare builds up more slowly than in H-02, reaction time remains. E3: affects every night drive with oncoming traffic. C2: controllable by decelerating.","up":[],"down":["SG-02"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/02_hara/H-05.md","body":"<h4>Context<\/h4><p>Structured record of the hazard. The full derivation, the method and the borderline discussion are<br>in <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>; the class interpretation in <a href=\"#doc/02_safety/02_hara/sec_classification.md\"><code>sec_classification.md<\/code><\/a>.<\/p><blockquote>The values here and the table in <code>hara.md<\/code> must agree - update both when changing either.<\/blockquote>"},"H-06":{"id":"H-06","kind":"H","text":"Failure of the daytime running lights during daytime driving with good visibility: reduced conspicuity of the vehicle.","type":"hazard","asil":"QM","status":"draft","source":"HARA phase 2, operational situation BS-06","rationale":"S1: an 18 t vehicle remains clearly visible by its silhouette, at most light injuries. E3: daytime driving is frequent. C1: controllable by practically all road users. Result QM - no safety goal.","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/02_hara/H-06.md","body":"<h4>Context<\/h4><p>Structured record of the hazard. The full derivation, the method and the borderline discussion are<br>in <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>; the class interpretation in <a href=\"#doc/02_safety/02_hara/sec_classification.md\"><code>sec_classification.md<\/code><\/a>.<\/p><blockquote>The values here and the table in <code>hara.md<\/code> must agree - update both when changing either.<\/blockquote>"},"H-07":{"id":"H-07","kind":"H","text":"Cornering light swivels into the oncoming lane: glare to oncoming traffic, unexpected and not correctable by the affected driver.","type":"hazard","asil":"A","status":"draft","source":"HARA phase 2, operational situation BS-05","rationale":"S2: glare with remaining reaction time. E2: cornering at night with oncoming traffic plus a fault. C3: occurs unexpectedly, the affected driver can only decelerate.","up":[],"down":["SG-02"],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/02_hara/H-07.md","body":"<h4>Context<\/h4><p>Structured record of the hazard. The full derivation, the method and the borderline discussion are<br>in <a href=\"#doc/02_safety/02_hara/hara.md\"><code>hara.md<\/code><\/a>; the class interpretation in <a href=\"#doc/02_safety/02_hara/sec_classification.md\"><code>sec_classification.md<\/code><\/a>.<\/p><blockquote>The values here and the table in <code>hara.md<\/code> must agree - update both when changing either.<\/blockquote>"},"HW-REQ-001":{"id":"HW-REQ-001","kind":"HW-REQ","text":"The current sensing of a low-beam channel shall measure the channel load current with a total uncertainty of not more than +/-20 mA at a channel current of 150 mA, over an ambient temperature range of -40 C to +85 C and including the residual error under the conducted-disturbance test levels of the HW verification plan.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-016","rationale":"Tolerance chain: shunt (1.0 % initial, 50 ppm/K TCR, 0.5 % drift), amplifier (150 uV offset, 1.0 % gain), ADC (3.3 V reference +/-0.5 %, 12 bit, 3 LSB offset, 2 LSB INL) gives +/-9.8 mA worst case, plus a +/-10 mA allowance for residual conducted disturbance. All plausible example values, not validated data. Assumptions A-08, A-11.","up":["SYS-REQ-016","FSR-001"],"down":["HW-REQ-002","HW-REQ-010"],"alloc":["LED_Driver_Stage_1","Current_Sense_Chain","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-001.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p>"},"HW-REQ-002":{"id":"HW-REQ-002","kind":"HW-REQ","text":"The current sensing of a low-beam channel shall guarantee that a true channel current below 130 mA is always evaluated as below the classification threshold and that a true channel current above 170 mA is never evaluated as below the classification threshold.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-016","rationale":"Guaranteed-trip and guaranteed-no-trip bands around the 150 mA threshold following from HW-REQ-001. The 130 mA to 170 mA indeterminate band is accepted; it is 1.7 % of the nominal channel current of 1.2 A (plausible example value).","up":["SYS-REQ-016","HW-REQ-001"],"down":["HW-REQ-008"],"alloc":["LED_Driver_Stage_1","Current_Sense_Chain","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-002.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p>"},"HW-REQ-003":{"id":"HW-REQ-003","kind":"HW-REQ","text":"The analogue-to-digital conversion of the low-beam channel current shall be triggered by the PWM timer unit of the LED driver stage, with a sampling instant inside the PWM on-phase not earlier than 50 us after the rising edge and not later than 20 us before the falling edge.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-014","rationale":"Blanking covers driver current rise (20 us), sense amplifier settling (15 us), filter group delay (8 us) and switching-edge ringing (10 us). A software trigger cannot guarantee the phase relationship under interrupt load, and a phase error of one on-time is a 100 % measurement error. Plausible example values. Assumption A-09.","up":["SYS-REQ-014"],"down":[],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-003.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p>"},"HW-REQ-004":{"id":"HW-REQ-004","kind":"HW-REQ","text":"Where the commanded PWM on-time of a low-beam channel is shorter than 150 us, the LED driver stage shall insert a diagnostic measurement window of at least 200 us at the commanded set point at intervals of not more than 10 ms.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-017","rationale":"Below the minimum usable on-time no valid sample exists. Either this window or the \"diagnosis not available\" path of SYS-REQ-017 must apply; reuse of a stale sample would make the detection time unbounded. Plausible example values.","up":["SYS-REQ-017"],"down":[],"alloc":["LED_Driver_Stage_1","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-004.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p><h4>Variant applicability (change note, phase 6 — closes OP-30)<\/h4><p><strong>Not implemented in the base variant.<\/strong> The <code>OP-17<\/code> decision recorded in<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../04_architecture/ee_architecture.md<\/code><\/a> section 4 resolved<br>the gating question in favour of the &quot;diagnosis not available&quot; path of <code>SYS-REQ-017<\/code>: the forced<br>measurement window injects a current pulse into a deliberately dimmed channel, which is visible as<br>flicker at low duty and is an unrequested actuation of a safety-relevant output — the very thing<br><code>TSR-002<\/code> exists to prevent.<\/p><p>The requirement is <strong>retained as an option for the work-lamp channels<\/strong>, where deep dimming is a<br>normal operating case and no safety goal is attached to the output. It is therefore excluded from<br>the SM-01 coverage claim; see the <code>not_covered<\/code> field of <a href=\"../../05_hardware/SM-01.md\"><code>SM-01.md<\/code><\/a> and<br><a href=\"#doc/05_hardware/analysis_sm01_coverage.md\"><code>analysis_sm01_coverage.md<\/code><\/a>. The record text is unchanged — only its<br>applicability is stated here, because the decision was already published in phase 3.<\/p>"},"HW-REQ-005":{"id":"HW-REQ-005","kind":"HW-REQ","text":"The current sensing of a low-beam channel shall evaluate the measured current during the PWM off-phase and shall signal a current-sensing fault if the measured value exceeds 30 mA in the off-phase for more than 20 ms.","type":"diagnostics","asil":"B","status":"draft","source":"FSR-001","rationale":"The off-phase is a known-zero reference and therefore a stuck-at-high and offset-drift test of shunt, amplifier and ADC at no extra cost. Precondition for the diagnostic coverage claimed by SM-01; without it a sensing fault is latent and masks the open load. 30 mA is the offset band of HW-REQ-001 with margin (plausible example value).","up":["FSR-001","SYS-REQ-014"],"down":[],"alloc":["ECU_LightingCtrl","Current_Sense_Chain","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-005.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p>"},"HW-REQ-006":{"id":"HW-REQ-006","kind":"HW-REQ","text":"The LED driver stage shall provide the channel output voltage to the microcontroller as a measured value in both the PWM on-phase and the PWM off-phase, with a resolution of at least 100 mV over a range of 0 V to 40 V.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-019","rationale":"The off-phase channel voltage separates short-to-battery from open load; the on-phase channel voltage is the only signature of a parallel-string loss, which a constant-current driver renders invisible in the current domain. 100 mV resolves a single LED forward voltage step of about 3.2 V with large margin. Plausible example values.","up":["SYS-REQ-019"],"down":["HW-REQ-020"],"alloc":["LED_Driver_Stage_1","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-006.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p>"},"HW-REQ-007":{"id":"HW-REQ-007","kind":"HW-REQ","text":"The LED driver stage shall provide its over-voltage, over-current and over-temperature status to the microcontroller as a readable signal with an update interval of not more than 10 ms.","type":"interface","asil":"B","status":"draft","source":"SYS-REQ-019","rationale":"Driver-internal fault classes are not observable at the shunt. Contributes to the diagnostic coverage claimed by SM-01. Assumption A-10.","up":["SYS-REQ-019"],"down":["HW-REQ-021"],"alloc":["LED_Driver_Stage_1","ECU_LightingCtrl","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-007.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p>"},"HW-REQ-008":{"id":"HW-REQ-008","kind":"HW-REQ","text":"The thermal derating function of a low-beam channel shall not command a channel set point below 400 mA while the channel is commanded on.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-014","rationale":"A fixed 150 mA threshold stays free of false trips only while the commanded set point exceeds 191 mA (worst case from HW-REQ-002). 400 mA keeps a factor of 2.3 against the upper indeterminate band edge of 170 mA. Without this floor, normal derating produces a spurious safe-state transition. Plausible example values. Assumption A-12.","up":["SYS-REQ-014","HW-REQ-002"],"down":["HW-REQ-023"],"alloc":["LED_Driver_Stage_1","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-008.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p><h4>Confirmation note (phase 6, hardware-engineer) — closes <code>OP-16<\/code><\/h4><p><strong>The 400 mA floor is confirmed against the LED module thermal design; the value is unchanged and<br>no change note on the requirement is needed.<\/strong> Load-line evaluation in<br><a href=\"#doc/05_hardware/analysis_thermal_derating.md\"><code>analysis_thermal_derating.md<\/code><\/a>: in the two realistic thermal cases<br>the derating loop settles at 733 mA and 476 mA and never reaches the floor. The floor is reached<br>only with a heat path degraded to twice its nominal thermal resistance at a headlamp cavity<br>temperature of 105 °C, and there the junction settles at about 130 °C — 5 K below the 135 °C design<br>limit and 20 K below the 150 °C component rating (plausible example values).<\/p><p>The condition under which this holds is now an explicit requirement, <code>HW-REQ-024<\/code>. Assumption <code>A-12<\/code><br>therefore stays open but is no longer unsupported; its validation target is the DV thermal test<br><code>HV-05<\/code>. The photometric consequence of the floor (about 232 lm per channel) is a system-level<br>question and is handed to <code>systems-engineer<\/code>.<\/p>"},"HW-REQ-009":{"id":"HW-REQ-009","kind":"HW-REQ","text":"The hardware detection path of the low-beam open-load mechanism shall report a detected open load to the software fault reaction within 80 ms of the occurrence of the fault.","type":"safety","asil":"B","status":"draft","source":"SYS-REQ-018","rationale":"2.5 ms PWM synchronisation + 0.1 ms acquisition + 50 ms threshold window + 20 ms debounce + 5 ms task latency = 77.6 ms. With the 150 ms fault reaction time of SG-01 the total is 230 ms against an FTTI of 300 ms, margin 70 ms (23 %). Plausible example values.","up":["SYS-REQ-018","FSR-001"],"down":[],"alloc":["ECU_LightingCtrl","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-009.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p>"},"HW-REQ-010":{"id":"HW-REQ-010","kind":"HW-REQ","text":"The microcontroller shall verify the plausibility of the analogue-to-digital converter reference used for the low-beam current measurement against an independent reference at intervals of not more than 100 ms.","type":"diagnostics","asil":"B","status":"draft","source":"FSR-001","rationale":"Reference drift is a gain-type error that shifts the effective threshold without any other symptom. Together with HW-REQ-005 this covers the latent failure modes of the diagnostic path itself and is a precondition for the diagnostic coverage claimed by SM-01. Plausible example value.","up":["FSR-001","HW-REQ-001"],"down":[],"alloc":["ECU_LightingCtrl","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-010.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 3 refinement of SYS-REQ-014. Analysis and derivation:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a>. New test cases are a handoff to<br><code>verification-engineer<\/code>.<\/p>"},"HW-REQ-011":{"id":"HW-REQ-011","kind":"HW-REQ","text":"While the protected supply voltage is between 9 V and 36 V, the Power_Supply_Unit shall keep the internal supply rails within +/-2 % (5 V and 3.3 V rails) and within +/-0.5 % (3.3 V ADC reference) of their nominal values.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-012","rationale":"The rail band is what the tolerance chain of HW-REQ-001 assumes; a reference outside +/-0.5 % invalidates the 150 mA open-load threshold. The 9 V lower edge follows from SYS-REQ-013 (undervoltage operation), the 36 V upper edge from the jump-start / overvoltage operating case of ISO 16750-2 (electrical loads) for a 24 V system. Plausible example values.","up":["SYS-REQ-012","SYS-REQ-013"],"down":[],"alloc":["Power_Supply_Unit","SM-06"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-011.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Derivation: <a href=\"#doc/05_hardware/analysis_supply_and_transients.md\"><code>analysis_supply_and_transients.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a hand-off<br>to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-012":{"id":"HW-REQ-012","kind":"HW-REQ","text":"The lighting ECU shall meet the functional status class assigned to each supply voltage range in the operating-range table of analysis_supply_and_transients.md, and shall resume unrestricted operation within 200 ms after the supply voltage has returned into the range 16 V to 32 V.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-012","rationale":"Closes the overvoltage half of OP-2 / OP-24. Functional status classes follow the classification scheme of ISO 16750-1 (functional status classification) as used by ISO 16750-2 (electrical loads): class A full function, class B reduced function with automatic recovery, class C loss of function with automatic recovery, class D loss of function requiring a reset. The 200 ms recovery keeps a supply dip below the 300 ms FTTI of SG-01. Plausible example values.","up":["SYS-REQ-012","SYS-REQ-013","FSR-002"],"down":[],"alloc":["Power_Supply_Unit","LED_Driver_Stage_1","ECU_LightingCtrl"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-012.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Derivation: <a href=\"#doc/05_hardware/analysis_supply_and_transients.md\"><code>analysis_supply_and_transients.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a hand-off<br>to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-013":{"id":"HW-REQ-013","kind":"HW-REQ","text":"While a clamped load dump with a peak of 58 V and a decay time constant of 400 ms is applied at the supply input, the lighting ECU shall keep the low beam energised at the commanded set point and shall sustain no permanent damage.","type":"electrical","asil":"B","status":"draft","source":"CR-017","rationale":"Load dump is tested per ISO 16750-2 (electrical loads, load-dump test) using the pulse shape of ISO 7637-2 (pulse 5a / 5b). The 58 V clamped level presumes central suppression in the vehicle (A-19); the unsuppressed case is explicitly excluded and is an assumption to be validated with the vehicle manufacturer. Functional status class A is demanded because the low beam is the ASIL B function of SG-01 and a load dump is a plausible night-driving event. Plausible example values.","up":["CR-017","SYS-REQ-012","FSR-002"],"down":[],"alloc":["Power_Supply_Unit","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-013.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Derivation: <a href=\"#doc/05_hardware/analysis_supply_and_transients.md\"><code>analysis_supply_and_transients.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a hand-off<br>to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-014":{"id":"HW-REQ-014","kind":"HW-REQ","text":"While transient pulses per ISO 7637-2 are applied at the supply input, the lighting ECU shall meet the functional status class assigned to each pulse in the pulse table of analysis_supply_and_transients.md.","type":"electrical","asil":"B","status":"draft","source":"CR-017","rationale":"Closes the hardware side of OP-4. CR-017 demands \"without loss of function\" for all pulses, which is not achievable for the severe supply-interruption pulses at reasonable cost; the pulse table assigns class A to the pulses that occur during normal driving and class C only to pulses that represent a supply interruption. The resulting change to CR-017 is a hand-off to systems-engineer. Test severity levels per ISO 7637-2 for 24 V systems, plausible example values.","up":["CR-017"],"down":[],"alloc":["Power_Supply_Unit","ECU_LightingCtrl"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-014.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Derivation: <a href=\"#doc/05_hardware/analysis_supply_and_transients.md\"><code>analysis_supply_and_transients.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a hand-off<br>to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-015":{"id":"HW-REQ-015","kind":"HW-REQ","text":"The supply input of the lighting ECU shall withstand a continuous reverse voltage of -32 V for at least 60 s without damage and without energising any lighting channel.","type":"electrical","asil":"B","status":"draft","source":"CR-017","rationale":"Reverse-polarity condition of ISO 16750-2 (electrical loads) for a 24 V system, realised by a series reverse-polarity MOSFET ahead of the pre-regulator, a TVS clamp for the transient energy and a common-mode choke plus pi filter for the conducted emission limits of ECE R10 (CR-012). \"Without energising any channel\" is the safety-relevant part: a reverse-conducting body diode in the driver output path would be an uncommanded actuation. Plausible example values.","up":["CR-017","SYS-REQ-012"],"down":[],"alloc":["Power_Supply_Unit"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-015.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Derivation: <a href=\"#doc/05_hardware/analysis_supply_and_transients.md\"><code>analysis_supply_and_transients.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a hand-off<br>to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-016":{"id":"HW-REQ-016","kind":"HW-REQ","text":"When the protected supply voltage leaves the range 9 V to 36 V, the supply monitor of the Power_Supply_Unit shall signal the condition to the microcontroller within 10 ms, and when it exceeds 60 V the supply monitor shall de-energise the LED driver stages via the enable gate within 1 ms.","type":"safety","asil":"B","status":"draft","source":"FSR-002","rationale":"Owning requirement of SM-06 on the supply side. Two-stage response: a reported condition inside the operating envelope (software derates or sets a DTC) and a hardware shutdown above the component rating of the driver output stage, which cannot wait for software. The 60 V threshold lies above the 58 V clamped load-dump level that HW-REQ-013 requires the ECU to ride through and below the 65 V rating assumed for the output stage, so a load dump does not switch the low beam off. Detection 10 ms plus reaction 1 ms is far inside the 300 ms FTTI of SG-01. Plausible example values.","up":["FSR-002","SYS-REQ-012","TSR-001"],"down":[],"alloc":["Power_Supply_Unit","LED_Driver_Stage_1","SM-06"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-016.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Owning requirement of <code>SM-06<\/code>. Derivation: <a href=\"#doc/05_hardware/analysis_supply_and_transients.md\"><code>analysis_supply_and_transients.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-017":{"id":"HW-REQ-017","kind":"HW-REQ","text":"When an internal supply rail leaves its specified tolerance band, the ASIC_Watchdog shall hold the microcontroller in reset and assert SAFE_OFF within 5 ms of the deviation.","type":"safety","asil":"B","status":"draft","source":"TSR-001","rationale":"A microcontroller running on an out-of-tolerance rail produces arbitrary outputs, including arbitrary PWM. Rail monitoring must therefore sit outside the microcontroller. Second owning requirement of SM-06 and a precondition for the freedom-from-interference argument of phase 7. Plausible example value.","up":["TSR-001","FSR-002"],"down":[],"alloc":["ASIC_Watchdog","Power_Supply_Unit","SM-06"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-017.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Owning requirement of <code>SM-06<\/code>. Derivation: <a href=\"#doc/05_hardware/analysis_supply_and_transients.md\"><code>analysis_supply_and_transients.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-018":{"id":"HW-REQ-018","kind":"HW-REQ","text":"The ASIC_Watchdog shall run a question/answer protocol on a time base independent of the microcontroller clock and shall assert SAFE_OFF within 50 ms of the first missing or incorrect answer.","type":"safety","asil":"B","status":"draft","source":"TSR-001","rationale":"Owning requirement of SM-02. Window/question-answer watchdog rather than a simple timeout, because a stuck task that still toggles a pin satisfies a timeout watchdog. The independent time base is what makes the mechanism valid against a clock fault, which the lockstep core cannot cover. Detection 50 ms plus reaction 10 ms (HW-REQ-019) is inside the 300 ms FTTI of SG-01. Plausible example value.","up":["TSR-001"],"down":[],"alloc":["ASIC_Watchdog","MCU_Lockstep","SM-02"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-018.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Owning requirement of <code>SM-02<\/code>. Architecture: <a href=\"#doc/05_hardware/hw_architecture.md\"><code>hw_architecture.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-019":{"id":"HW-REQ-019","kind":"HW-REQ","text":"The enable input of each LED driver stage shall be driven by the logical conjunction of the microcontroller enable signal and the negated SAFE_OFF and OV_SHUTDOWN signals, and shall bring the channel into its de-energised state within 10 ms of SAFE_OFF or OV_SHUTDOWN becoming active.","type":"electrical","asil":"B","status":"draft","source":"TSR-001","rationale":"Defines the topology of the disable path: SAFE_OFF is dominant, so a hung microcontroller that holds its enable signal active cannot prevent de-energisation, and the path contains no software. Realised per channel so that the channel-wise independence assumed by SYS-REQ-011 is not defeated by a shared gate. Plausible example value.","up":["TSR-001","TSR-004"],"down":[],"alloc":["LED_Driver_Stage_1","ASIC_Watchdog","SM-02"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-019.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Owning requirement of <code>SM-02<\/code> (disable path topology). Architecture: <a href=\"#doc/05_hardware/hw_architecture.md\"><code>hw_architecture.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-020":{"id":"HW-REQ-020","kind":"HW-REQ","text":"When the channel output voltage of a low-beam channel measured during the PWM off-phase exceeds 3 V for more than 30 ms, the lighting ECU shall classify the channel as \"short to battery\".","type":"diagnostics","asil":"B","status":"draft","source":"SYS-REQ-019","rationale":"Owning requirement of SM-03. In the off-phase the channel output is pulled low by the driver, so any voltage above the divider error band comes from an external source. 3 V is one LED forward voltage below the first string node and well above the 100 mV resolution of HW-REQ-006. Detection 30 ms plus the 150 ms fault reaction of TSR-004 is 180 ms against the 300 ms FTTI of SG-01. Plausible example values.","up":["SYS-REQ-019","TSR-003","HW-REQ-006"],"down":[],"alloc":["LED_Driver_Stage_1","ECU_LightingCtrl","SM-03"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-020.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Owning requirement of <code>SM-03<\/code>. Derivation: <a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a> section 5.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-021":{"id":"HW-REQ-021","kind":"HW-REQ","text":"The LED driver stage shall limit the channel output current to 1.8 A, shall latch the channel off within 5 ms if the limit is active continuously, and shall report the event in DriverStatus within 10 ms.","type":"electrical","asil":"B","status":"draft","source":"FSR-002","rationale":"Owning requirement of SM-04. 1.8 A is 1.5 times the 1.20 A nominal set point (A-08) and therefore above every regulated operating case including the inrush of the output capacitance, and below the pulse rating of the output stage. The latch-off protects the harness on a short to ground; the status report is what makes the event visible to the fault reaction rather than a silent channel loss. Plausible example values.","up":["FSR-002","TSR-002","HW-REQ-007"],"down":[],"alloc":["LED_Driver_Stage_1","SM-04"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-021.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Owning requirement of <code>SM-04<\/code>. Architecture: <a href=\"#doc/05_hardware/hw_architecture.md\"><code>hw_architecture.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-022":{"id":"HW-REQ-022","kind":"HW-REQ","text":"The Temp_Sense_Chain shall measure the LED module temperature over the range -40 C to +150 C with an accuracy of +/-3 K between +80 C and +140 C, shall update the value at least every 100 ms, and shall classify a measured value outside the band -50 C to +160 C as a sensor fault.","type":"electrical","asil":"B","status":"draft","source":"CR-014","rationale":"An NTC divider with a pull-up rail reads towards one supply end on an open circuit and towards the other on a short, so both sensor failure modes leave the plausibility band and are detected without an extra component. +/-3 K in the derating region is what makes the 105 C / 125 C breakpoints of HW-REQ-023 meaningful; outside that region the accuracy is irrelevant to the function. Plausible example values.","up":["CR-014","FSR-002"],"down":["HW-REQ-023"],"alloc":["Temp_Sense_Chain","SM-05"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-022.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Owning requirement of <code>SM-05<\/code> (sensing path). Derivation: <a href=\"#doc/05_hardware/analysis_thermal_derating.md\"><code>analysis_thermal_derating.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-023":{"id":"HW-REQ-023","kind":"HW-REQ","text":"While the measured LED module temperature is above 105 C, the lighting ECU shall reduce the channel set point linearly by 40 mA per kelvin from 1.20 A down to the derating floor of HW-REQ-008, and shall hold the set point at that floor above 125 C.","type":"electrical","asil":"B","status":"draft","source":"CR-014","rationale":"Owning requirement of SM-05 and the derating curve behind A-12. Breakpoints derived in analysis_thermal_derating.md: with the assumed thermal path the junction reaches its 135 C design limit at a solder-point temperature of about 130 C at full current, so derating has to start clearly below that. The floor is held rather than reducing further, because reducing below 400 mA would make the open-load threshold of SM-01 ambiguous (HW-REQ-002). Plausible example values. Assumptions A-12, A-20.","up":["CR-014","HW-REQ-008","HW-REQ-022"],"down":["HW-REQ-024"],"alloc":["LED_Driver_Stage_1","Temp_Sense_Chain","SM-05"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-023.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Owning requirement of <code>SM-05<\/code> (derating curve). Derivation: <a href=\"#doc/05_hardware/analysis_thermal_derating.md\"><code>analysis_thermal_derating.md<\/code><\/a>.<br>Verificat
