ion entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-024":{"id":"HW-REQ-024","kind":"HW-REQ","text":"The thermal design of a low-beam channel shall keep the LED junction temperature at or below 135 C for a headlamp cavity temperature up to 105 C, with the derating curve of HW-REQ-023 active and the module heat path degraded to twice its nominal thermal resistance.","type":"electrical","asil":"B","status":"draft","source":"CR-014","rationale":"This is the condition under which the 400 mA floor of HW-REQ-008 is thermally admissible: in the worst case analysed (cavity 105 C, thermal path degraded by a factor of two) the equilibrium junction temperature is about 130 C, leaving 5 K against the 135 C design limit and 15 K against the 150 C component rating. Derivation and load-line arithmetic in analysis_thermal_derating.md. Plausible example values. Assumptions A-20, A-21.","up":["CR-014","HW-REQ-023"],"down":[],"alloc":["LED_Driver_Stage_1","Temp_Sense_Chain"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-024.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Thermal design constraint behind the derating floor. Derivation: <a href=\"#doc/05_hardware/analysis_thermal_derating.md\"><code>analysis_thermal_derating.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"HW-REQ-025":{"id":"HW-REQ-025","kind":"HW-REQ","text":"The CAN_FD_Transceiver shall withstand a permanent short of either bus line to the supply voltage or to ground without damage and shall release the bus within 5 ms if its transmit input remains dominant.","type":"interface","asil":"B","status":"draft","source":"SYS-REQ-020","rationale":"The driver warning of FSR-004 and the lighting status travel over this bus, so a transceiver that babbles takes down the communication of the whole segment including its own warning path. The dominant timeout is the standard transceiver-level containment for that failure mode. Plausible example value.","up":["SYS-REQ-020","FSR-004"],"down":[],"alloc":["CAN_FD_Transceiver"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/HW-REQ-025.md","body":"<h4>Context<\/h4><p>Hardware requirement from the phase 6 refinement of the E/E architecture (HWE.1 / HWE.2).<br>Architecture: <a href=\"#doc/05_hardware/hw_architecture.md\"><code>hw_architecture.md<\/code><\/a>.<br>Verification entry: <a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>. Test cases are a<br>hand-off to <code>verification-engineer<\/code>.<\/p>"},"RISK-01":{"id":"RISK-01","kind":"RISK","text":"The exposure rating of hazard H-01 (E3 rather than E4) determines ASIL B versus ASIL C for the entire Golden Thread and therefore the target ASIL of the project.","type":"risk","asil":"","status":"draft","source":"HARA H-01, phase 2","rationale":"","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/05_analyses/RISK-01.md","body":"<h4>Context<\/h4><p>The most sensitive single decision of the HARA. Until confirmed, ASIL B is the working assumption.<\/p>"},"RISK-02":{"id":"RISK-02","kind":"RISK","text":"The ASIL decomposition of FSR-005 into FSR-006 (QM(A)) and FSR-007 (A(A)) is not demonstrated until the DFA is available.","type":"risk","asil":"","status":"draft","source":"FSC phase 2, ISO 26262-9","rationale":"","up":[],"down":[],"alloc":[],"vby":[],"verifies":[],"tags":[],"file":"02_safety/05_analyses/RISK-02.md","body":"<h4>Context<\/h4><p>Until demonstrated, the QM path must not be argued as discharged in the safety case.<\/p>"},"SG-01":{"id":"SG-01","kind":"SG","text":"No undetected failure of the low beam while driving.","type":"safety-goal","asil":"B","status":"reviewed","source":"HARA H-01, H-04","rationale":"S/E/C classification see 02_safety/02_hara/. FTTI and fault reaction time are plausible example values, not validated data.","up":["H-01","H-04"],"down":["FSR-001","FSR-002","FSR-003","FSR-004","TC-021"],"alloc":["Item_LightingSystem"],"vby":["TC-021"],"verifies":[],"tags":[],"file":"02_safety/03_fsc/SG-01.md","body":"<h4>Context<\/h4><p>Golden Thread of the project. Deep-dive chain: SG-01 -&gt; FSR-001 -&gt; TSR-003 -&gt; SM-01 / SW-REQ-xxx<br>-&gt; <code>SWC_LightManager<\/code> -&gt; TC-021 -&gt; FTA path -&gt; FMEDA row -&gt; safety case node G-01.<\/p>"},"SG-02":{"id":"SG-02","kind":"SG","text":"No unintended glare to other road users caused by high beam or work lamps.","type":"safety-goal","asil":"A","status":"draft","source":"HARA H-02, H-03, H-05, H-07","rationale":"Merged from four hazards sharing the same goal wording; the highest resulting ASIL (A) governs. FTTI is a plausible example value.","up":["H-02","H-03","H-05","H-07"],"down":["FSR-005","FSR-008"],"alloc":["Item_LightingSystem"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/03_fsc/SG-02.md","body":"<h4>Context<\/h4><p>Second, deliberately shallower thread for contrast with SG-01. Carries the ASIL decomposition<br>example (FSR-005 -&gt; FSR-006 / FSR-007).<\/p>"},"SM-01":{"id":"SM-01","kind":"SM","text":"Open-load detection in the low-beam channel via PWM-synchronous shunt current measurement with threshold comparison, debouncing, off-phase zero-current self-test and discrimination against short-to-battery and commanded current reduction using the channel output voltage and the LED driver status; reported to SWC_LightManager for the fault reaction.","type":"safety-mechanism","asil":"B","status":"draft","source":"FSR-001","rationale":"Detection time (80 ms) + reaction time (150 ms) = 230 ms < FTTI (300 ms) of SG-01, margin 70 ms (23 %). Threshold secured by the tolerance analysis in HW-REQ-001 / HW-REQ-002: guaranteed trip below 130 mA, guaranteed no trip above 170 mA.","up":["FSR-001","TSR-003"],"down":[],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1","Current_Sense_Chain"],"vby":["TC-021"],"verifies":[],"tags":[],"file":"05_hardware/SM-01.md","body":"<h4>Context<\/h4><p>Golden Thread safety mechanism.<\/p><h4>Change note (phase 3 refinement, hardware-engineer)<\/h4><ul><li><code>detection_time<\/code> 70 ms -&gt; <strong>80 ms<\/strong>: the PWM-synchronous measurement adds 2.5 ms synchronisation, 0.1 ms acquisition and 5 ms task latency. The budget still closes against the 300 ms FTTI.<\/li><li><code>diagnostic_coverage<\/code>: the bare 90 % was not defensible. Current-threshold sensing alone leaves partial load loss, short-to-battery misclassification and failures of the diagnostic path itself uncovered - approximately 60 %. The 90 % claim is now explicitly conditional on four measures.<\/li><li>Status dropped from <code>reviewed<\/code> to <code>draft<\/code>; re-review required, and the DC number needs confirmation by <code>safety-analyst<\/code> against the FMEDA before it returns to <code>reviewed<\/code>.<\/li><\/ul><p>Analysis: <a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>analysis_current_sensing.md<\/code><\/a><\/p><h4>Change note (phase 6 hardware refinement, hardware-engineer)<\/h4><p><strong>No published value changed.<\/strong> Detection time stays at 80 ms and the diagnostic coverage claim<br>stays at a conditional 90 %. Added fields only, so that the FMEDA can check the claim instead of<br>having to trust it:<\/p><ul><li><code>detected_fault<\/code> and <code>not_covered<\/code> — the claim now has a denominator. The explicit exclusion of <code>HW-REQ-004<\/code> records decision <code>OP-17<\/code>: it is not implemented in the base variant, so no coverage may be claimed from it.<\/li><li><code>reaction_time<\/code> and <code>ftti_budget<\/code> — the arithmetic was previously only in <code>rationale<\/code>; it is now a field, consistently with <code>SM-02<\/code> … <code>SM-06<\/code>.<\/li><li><code>diagnostic_test_interval<\/code> — the FMEDA needs the interval per measure, not only the coverage.<\/li><li><code>diagnostic_coverage<\/code> extended by a reference to <a href=\"#doc/05_hardware/analysis_sm01_coverage.md\"><code>analysis_sm01_coverage.md<\/code><\/a>, which decomposes the 90 % into six failure-mode groups and shows that no single one of the four conditional measures can be dropped.<\/li><\/ul><p>Status stays <code>draft<\/code>; <code>OP-15<\/code> (confirmation by <code>safety-analyst<\/code>) remains the blocker for<br><code>reviewed<\/code>.<\/p>"},"SM-02":{"id":"SM-02","kind":"SM","text":"Program-execution monitoring by the ASIC_Watchdog with an independent time base and a question/answer protocol, with a hardware disable path (SAFE_OFF) to the enable gate of every LED driver stage that is dominant over the microcontroller enable signal.","type":"safety-mechanism","asil":"B","status":"draft","source":"TSR-001","rationale":"A lockstep core covers random faults of the computing core but not a stalled clock or a hung application; that gap is what this mechanism closes, which is why the architecture carries both (see 04_architecture/ee_architecture.md section 1).","up":["TSR-001","FSR-002"],"down":[],"alloc":["ASIC_Watchdog","MCU_Lockstep","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/SM-02.md","body":"<h4>Context<\/h4><p>📋 OVERVIEW mechanism. Verification entries HV-02 in<br><a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>.<\/p><h4>Open conflict (hand-off to systems-engineer)<\/h4><p><code>TSR-001<\/code> requires SAFE_OFF to de-energise the LED driver stages. For the low beam this is in<br>direct conflict with the safe state of <code>SG-01<\/code>, which is limp-home operation with the remaining<br>channel visible, not darkness. Asserting SAFE_OFF on the low-beam channels therefore <em>creates<\/em> the<br>hazard H-01 that <code>SG-01<\/code> exists to prevent. The hardware view is that the disable path must be<br>differentiated by channel class (work lamps and high beam off, low beam into a hardware default<br>state), but that is a technical-safety-concept decision and is left to <code>systems-engineer<\/code>.<\/p>"},"SM-03":{"id":"SM-03","kind":"SM","text":"Short-to-battery detection on a low-beam channel by evaluating the channel output voltage during the PWM off-phase against a threshold, debounced, and used to discriminate a short to battery from an open load before the fault reaction is triggered.","type":"safety-mechanism","asil":"B","status":"draft","source":"SYS-REQ-019","rationale":"Without this mechanism a short to battery is read at the shunt as a current collapse and is misclassified as an open load, which is a wrong fault reaction on a channel that is in fact conducting. See analysis_current_sensing.md section 5.","up":["SYS-REQ-019","TSR-003"],"down":[],"alloc":["LED_Driver_Stage_1","ECU_LightingCtrl"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/SM-03.md","body":"<h4>Context<\/h4><p>📋 OVERVIEW mechanism, but it is the discrimination leg the Golden Thread depends on<br>(<code>SYS-REQ-019<\/code>). Verification entry HV-03 in<br><a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>.<\/p>"},"SM-04":{"id":"SM-04","kind":"SM","text":"Overcurrent protection in the LED driver stage: hardware current limit at the output stage, latch-off on a persistent limit condition, and reporting of the event through DriverStatus to the microcontroller.","type":"safety-mechanism","asil":"B","status":"draft","source":"FSR-002","rationale":"Without the status readback the latch-off is indistinguishable from an open load at the shunt, and the fault reaction would be correct by accident rather than by evidence.","up":["FSR-002","TSR-002"],"down":[],"alloc":["LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/SM-04.md","body":"<h4>Context<\/h4><p>📋 OVERVIEW mechanism. Verification entry HV-04 in<br><a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>.<\/p>"},"SM-05":{"id":"SM-05","kind":"SM","text":"Overtemperature protection of the LED modules by NTC measurement with plausibility band and a linear derating curve that reduces the channel set point between 105 C and 125 C down to the 400 mA derating floor, with a diagnostic trouble code once derating is active.","type":"safety-mechanism","asil":"B","status":"draft","source":"CR-014","rationale":"The derating floor makes this mechanism a safety mechanism rather than a pure protection function: it must reduce power without ever taking the low beam below the level at which SM-01 can still distinguish a real open load from commanded derating (HW-REQ-002, HW-REQ-008).","up":["CR-014","FSR-002"],"down":[],"alloc":["Temp_Sense_Chain","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/SM-05.md","body":"<h4>Context<\/h4><p>📋 OVERVIEW mechanism with a quantified derating curve, because it interlocks with the Golden<br>Thread through the 400 mA floor. Derivation:<br><a href=\"#doc/05_hardware/analysis_thermal_derating.md\"><code>analysis_thermal_derating.md<\/code><\/a>. Verification entry HV-05 in<br><a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>.<\/p>"},"SM-06":{"id":"SM-06","kind":"SM","text":"Supply voltage monitoring: window comparators on the protected battery voltage in the Power_Supply_Unit with a reported condition and a hardware overvoltage shutdown of the driver stages, plus independent monitoring of the internal rails by the ASIC_Watchdog with reset and SAFE_OFF.","type":"safety-mechanism","asil":"B","status":"draft","source":"FSR-002","rationale":"Both the open-load threshold of SM-01 and the constant-current regulation of the driver stage rest on rails that are within tolerance; an undetected reference drift shifts the 150 mA threshold with no other symptom. Voltage monitoring is therefore a precondition of SM-01, not an independent mechanism.","up":["FSR-002","TSR-001","SYS-REQ-012"],"down":[],"alloc":["Power_Supply_Unit","ASIC_Watchdog","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"05_hardware/SM-06.md","body":"<h4>Context<\/h4><p>📋 OVERVIEW mechanism. Verification entry HV-06 in<br><a href=\"#doc/05_hardware/hw_verification_plan.md\"><code>hw_verification_plan.md<\/code><\/a>.<\/p>"},"SYS-REQ-001":{"id":"SYS-REQ-001","kind":"SYS-REQ","text":"When the driver requests low beam via the light switch signal, the lighting ECU shall energise both low-beam channels within 300 ms.","type":"functional","asil":"B","status":"draft","source":"CR-001","rationale":"Response time taken from CR-001. ASIL from SG-01: the low beam is the safety-relevant function.","up":["CR-001","FSR-002"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-001.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-002":{"id":"SYS-REQ-002","kind":"SYS-REQ","text":"When the ambient brightness signal remains below 1000 lx for more than 3 s, the lighting ECU shall switch from daytime running lights to low beam within 500 ms.","type":"functional","asil":"B","status":"draft","source":"CR-002","rationale":"Quantifies the deliberately weak CR-002. Threshold, debounce and switching time are plausible example values; the hysteresis for switching back is SYS-REQ-003.","up":["CR-002","FSR-002"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-002.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-003":{"id":"SYS-REQ-003","kind":"SYS-REQ","text":"When the ambient brightness signal remains above 2000 lx for more than 30 s, the lighting ECU shall switch from low beam to daytime running lights within 2 s.","type":"functional","asil":"B","status":"draft","source":"CR-002","rationale":"Hysteresis against oscillation at dusk. Switching off the low beam in bright conditions is not safety-relevant; QM.","up":["CR-002"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-003.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-004":{"id":"SYS-REQ-004","kind":"SYS-REQ","text":"When the vehicle gateway reports an oncoming or preceding vehicle, the lighting ECU shall mask the affected high-beam segment within 500 ms.","type":"functional","asil":"A","status":"draft","source":"CR-003","rationale":"ASIL from SG-02. The object data originate outside the item boundary (A-05).","up":["CR-003","FSR-005"],"down":[],"alloc":["ECU_LightingCtrl","SWC_HighBeamControl"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-004.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-005":{"id":"SYS-REQ-005","kind":"SYS-REQ","text":"While the vehicle speed signal exceeds 10 km/h, the lighting ECU shall inhibit energising of the work-lamp output stages.","type":"functional","asil":"A","status":"draft","source":"CR-004","rationale":"ASIL from SG-02, hazard H-03. Threshold from CR-004.","up":["CR-004","FSR-008"],"down":[],"alloc":["ECU_LightingCtrl","SWC_WorkLampControl"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-005.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-006":{"id":"SYS-REQ-006","kind":"SYS-REQ","text":"When the steering angle signal exceeds 15 degrees, the lighting ECU shall activate the cornering light of the corresponding side within 200 ms.","type":"functional","asil":"A","status":"draft","source":"CR-005","rationale":"Split out of the deliberately weak CR-005, without the solution prescription. ASIL from SG-02, hazard H-07.","up":["CR-005"],"down":[],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-006.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-007":{"id":"SYS-REQ-007","kind":"SYS-REQ","text":"When the steering angle signal falls below 5 degrees, the lighting ECU shall deactivate the cornering light within 200 ms.","type":"functional","asil":"A","status":"draft","source":"CR-005","rationale":"Second statement split out of CR-005.","up":["CR-005"],"down":[],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-007.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-008":{"id":"SYS-REQ-008","kind":"SYS-REQ","text":"When the cornering light does not reach its commanded state, the lighting ECU shall store a diagnostic trouble code.","type":"diagnostics","asil":"A","status":"draft","source":"CR-005","rationale":"Third statement split out of CR-005.","up":["CR-005"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-008.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-009":{"id":"SYS-REQ-009","kind":"SYS-REQ","text":"When the ignition signal changes to on, the lighting ECU shall energise the daytime running lights within 2 s.","type":"functional","asil":"QM","status":"draft","source":"CR-006","rationale":"Hazard H-06 results in QM. The requirement remains legally relevant (ECE R48).","up":["CR-006"],"down":[],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-009.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-010":{"id":"SYS-REQ-010","kind":"SYS-REQ","text":"When the lighting ECU has classified a low-beam channel as failed, it shall request the driver warning via the vehicle gateway within 2 s of the classification.","type":"functional","asil":"B","status":"draft","source":"CR-007","rationale":"The 2 s are the customer requirement and lie outside the fault reaction budget of SG-01.","up":["CR-007","FSR-004"],"down":["SYS-REQ-026"],"alloc":["ECU_LightingCtrl","Vehicle_Gateway"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-010.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-011":{"id":"SYS-REQ-011","kind":"SYS-REQ","text":"While exactly one low-beam channel is classified as failed, the lighting ECU shall continue to operate the remaining channel at its commanded set point.","type":"functional","asil":"B","status":"draft","source":"CR-008","rationale":"Realises the safe state of SG-01. Presumes freedom from interference between the channels, to be demonstrated by the DFA in phase 5.","up":["CR-008","FSR-003"],"down":[],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-011.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-012":{"id":"SYS-REQ-012","kind":"SYS-REQ","text":"While the vehicle supply voltage is within 16 V to 32 V, the lighting ECU shall provide all lighting functions without restriction.","type":"electrical","asil":"B","status":"draft","source":"CR-016","rationale":"Replaces the solution-prescribing CR-016 with an implementation-free statement. Range from CR-016.","up":["CR-016","FSR-002"],"down":["HW-REQ-011","HW-REQ-012","HW-REQ-013","HW-REQ-015","HW-REQ-016","SM-06"],"alloc":["ECU_LightingCtrl"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-012.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-013":{"id":"SYS-REQ-013","kind":"SYS-REQ","text":"While the vehicle supply voltage is between 9 V and 16 V, the lighting ECU shall keep the low beam energised at a reduced set point of at least 400 mA per channel and shall set a diagnostic trouble code.","type":"electrical","asil":"B","status":"draft","source":"CR-016","rationale":"Closes open point OP-2: undervoltage behaviour was undefined. The 400 mA floor is the derating floor of HW-REQ-008, so the open-load threshold stays valid. Plausible example values.","up":["CR-016","FSR-003"],"down":["HW-REQ-011","HW-REQ-012"],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-013.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-014":{"id":"SYS-REQ-014","kind":"SYS-REQ","text":"When the load current of a low-beam channel, measured during the PWM on-phase, remains below 150 mA for more than 50 ms, the lighting ECU shall classify the channel as \"open load\".","type":"functional","asil":"B","status":"draft","source":"CR-007","rationale":"Threshold and debounce time derived from the FTTI budget of SG-01 (150 mA / 50 ms: plausible example values, not validated data). Measurement uncertainty at the threshold is +/-20 mA per HW-REQ-001; guaranteed trip below 130 mA, guaranteed no trip above 170 mA per HW-REQ-002.","up":["CR-007","FSR-001"],"down":["HW-REQ-003","HW-REQ-005","HW-REQ-008","SYS-REQ-015","SYS-REQ-016","SYS-REQ-017","SYS-REQ-018","SYS-REQ-019","TC-021"],"alloc":["ECU_LightingCtrl","SWC_LightManager","SM-01"],"vby":["TC-021"],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-014.md","body":"<h4>Context<\/h4><p>Reference record for the Requirements-as-Code format and part of the Golden Thread.<\/p><h4>Change note (phase 3 refinement, hardware-engineer)<\/h4><p>Previous wording: &quot;When the load current of a low-beam channel falls below 150 mA for more than<br>50 ms, the lighting ECU shall classify the channel as &#x27;open load&#x27; and increment the fault counter.&quot;<\/p><p>Two defects were resolved:<\/p><ol><li><strong>Not atomic<\/strong> — the fault counter was a second testable statement. Split out as <code>SYS-REQ-015<\/code>.<\/li><li><strong>Not unambiguous<\/strong> — the text did not say when the current is measured. Under PWM dimming the current is genuinely zero in every off-phase, so an ungated comparison trips on every dim cycle. The measurement is now bound to the PWM on-phase.<\/li><\/ol><p>The ID is retained because it carries the original meaning and is part of the Golden Thread.<br>Status dropped from <code>reviewed<\/code> to <code>draft<\/code>; re-review required. Analysis:<br><a href=\"#doc/05_hardware/analysis_current_sensing.md\"><code>../../05_hardware/analysis_current_sensing.md<\/code><\/a><\/p><h4>Open points<\/h4><ol><li>Tolerance analysis of the current sensing — <strong>closed<\/strong>, see <code>HW-REQ-001<\/code> / <code>HW-REQ-002<\/code>.<\/li><\/ol>"},"SYS-REQ-015":{"id":"SYS-REQ-015","kind":"SYS-REQ","text":"When a low-beam channel is classified as \"open load\", the lighting ECU shall increment the fault counter of that channel.","type":"diagnostics","asil":"B","status":"draft","source":"SYS-REQ-014","rationale":"Split out of SYS-REQ-014 for atomicity - counting is a separate testable statement from classifying.","up":["SYS-REQ-014"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-015.md","body":"<h4>Context<\/h4><p>Created with the phase 3 refinement of SYS-REQ-014.<\/p>"},"SYS-REQ-016":{"id":"SYS-REQ-016","kind":"SYS-REQ","text":"The lighting ECU shall measure the load current of a low-beam channel with a total uncertainty of not more than +/-20 mA at the 150 mA classification threshold, over an ambient temperature range of -40 C to +85 C.","type":"electrical","asil":"B","status":"draft","source":"SYS-REQ-014, FSR-001","rationale":"Makes the 150 mA threshold verifiable. Without a stated uncertainty the threshold cannot be tested and the classification is not falsifiable. Value from the tolerance chain, plausible example value.","up":["SYS-REQ-014","FSR-001"],"down":["HW-REQ-001","HW-REQ-002"],"alloc":["ECU_LightingCtrl","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-016.md","body":"<h4>Context<\/h4><p>Realised in hardware by HW-REQ-001 and HW-REQ-002.<\/p>"},"SYS-REQ-017":{"id":"SYS-REQ-017","kind":"SYS-REQ","text":"While the PWM on-time of a low-beam channel is shorter than 150 us, the lighting ECU shall report the open-load diagnosis of that channel as \"not available\".","type":"diagnostics","asil":"B","status":"draft","source":"SYS-REQ-014","rationale":"Below the minimum usable on-time no valid sample exists. Reusing the last valid sample would make the detection time unbounded, which cannot be argued against the FTTI. Plausible example value.","up":["SYS-REQ-014"],"down":["HW-REQ-004"],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-017.md","body":"<h4>Context<\/h4><p>Alternative to HW-REQ-004 (forced diagnostic window). Which of the two applies is a system-level<br>decision - see open point in the analysis document.<\/p>"},"SYS-REQ-018":{"id":"SYS-REQ-018","kind":"SYS-REQ","text":"When an open load occurs in a low-beam channel, the lighting ECU shall report the fault to the fault reaction within 100 ms of fault occurrence.","type":"safety","asil":"B","status":"draft","source":"SYS-REQ-014, FSR-001","rationale":"Makes the detection budget explicit and testable. 100 ms is the allocated cap; the worst-case design value is 80 ms (HW-REQ-009). With the 150 ms fault reaction time of SG-01 the total stays below the 300 ms FTTI under any implementation variant.","up":["SYS-REQ-014","FSR-001"],"down":["HW-REQ-009","TC-021"],"alloc":["ECU_LightingCtrl","SM-01"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-018.md","body":"<h4>Context<\/h4><p>The cap, not the design value, is the requirement - it leaves the implementation room while keeping<br>the FTTI argument valid.<\/p>"},"SYS-REQ-019":{"id":"SYS-REQ-019","kind":"SYS-REQ","text":"When the measured load current of a low-beam channel falls below 150 mA, the lighting ECU shall classify the cause as exactly one of \"open load\", \"short-to-battery\" or \"commanded current reduction\" before triggering a fault reaction.","type":"diagnostics","asil":"B","status":"draft","source":"SYS-REQ-014","rationale":"A single current threshold cannot separate these causes. Short-to-battery reads as open load, and a commanded reduction through thermal derating is not a fault at all. Implementation-free - the means are specified in HW-REQ-006 and HW-REQ-007.","up":["SYS-REQ-014"],"down":["HW-REQ-006","HW-REQ-007","HW-REQ-020","SM-03"],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-019.md","body":"<h4>Context<\/h4><p>Does not cover partial string failure: with a constant-current driver that fault is invisible in the<br>current domain, see the analysis document.<\/p>"},"SYS-REQ-020":{"id":"SYS-REQ-020","kind":"SYS-REQ","text":"The lighting ECU shall exchange light request, vehicle speed, steering angle, ambient brightness, object data and lighting status with the vehicle gateway via CAN FD according to SAE J1939.","type":"communication","asil":"B","status":"draft","source":"CR-020","rationale":"Carries signals used by safety functions; ASIL inherited from the highest function using them (SG-01, B). Signal detail in the interface table.","up":["CR-020"],"down":["HW-REQ-025","SYS-REQ-022","SYS-REQ-028"],"alloc":["ECU_LightingCtrl","Vehicle_Gateway"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-020.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-021":{"id":"SYS-REQ-021","kind":"SYS-REQ","text":"When a diagnostic tester sends a UDS request according to ISO 14229, the lighting ECU shall provide the stored diagnostic trouble codes within 100 ms.","type":"diagnostics","asil":"QM","status":"draft","source":"CR-019","rationale":"Reading the fault memory is not part of the safety chain; the safety-relevant warning path is SYS-REQ-010. QM.","up":["CR-019"],"down":[],"alloc":["ECU_LightingCtrl"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-021.md","body":"<h4>Context<\/h4><p>System requirement from phase 3 (ASPICE SYS.2). Allocation to HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"SYS-REQ-022":{"id":"SYS-REQ-022","kind":"SYS-REQ","text":"The lighting ECU shall protect every safety-relevant signal group exchanged with the vehicle gateway with an alive counter and a checksum computed over the payload of that signal group.","type":"communication","asil":"B","status":"draft","source":"CR-020","rationale":"SYS-REQ-020 fixed the transport (CAN FD / SAE J1939) but not the data integrity. A bus signal that carries an ASIL B function needs protection against loss, repetition, insertion, incorrect sequence and corruption; a timeout alone covers only loss. Counter plus checksum is the minimum set. The concrete profile (4-bit alive counter, CRC-8, data identifier) is fixed in the message catalogue of the E/E architecture and is a plausible example value.","up":["CR-020","SYS-REQ-020"],"down":["SYS-REQ-023","SYS-REQ-024","SYS-REQ-027"],"alloc":["ECU_LightingCtrl","CAN_FD_Transceiver","SWC_LightManager","Vehicle_Gateway"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-022.md","body":"<h4>Context<\/h4><p>Created with the phase 3 refinement of the E/E architecture (open point <code>OP-21<\/code> / <code>OP-22<\/code>).<br>Signal groups, data identifiers and the byte position of counter and checksum:<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>, section<br>&quot;Message catalogue&quot;.<\/p><p>The receiver-side counterpart in the vehicle gateway is outside the item boundary and is covered by<br>assumption <code>A-15<\/code>; it is part of the interface agreement tracked as <code>OP-10<\/code>.<\/p>"},"SYS-REQ-023":{"id":"SYS-REQ-023","kind":"SYS-REQ","text":"If the alive counter of a received safety-relevant signal group does not increase by one modulo its range, or if the received checksum does not match the checksum recomputed over the payload, the lighting ECU shall mark that signal group as invalid within one reception cycle.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-022","rationale":"Detection rule belonging to the protection of SYS-REQ-022. \"Within one reception cycle\" makes the detection latency bounded and testable; a tolerance of repeated counters is deliberately not granted, because the receiving functions all run slower than the transmit cycle.","up":["SYS-REQ-022"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-023.md","body":"<h4>Context<\/h4><p>The reaction to an invalid signal group is function-specific and is not part of this requirement:<br>low beam see <code>SYS-REQ-025<\/code>, work-lamp inhibit see <code>TSR-008<\/code>, high-beam monitor see <code>TSR-007<\/code>.<\/p>"},"SYS-REQ-024":{"id":"SYS-REQ-024","kind":"SYS-REQ","text":"If a safety-relevant signal group is not received within the timeout defined for that signal group in the interface table, the lighting ECU shall mark that signal group as invalid.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-022","rationale":"Makes the timeout column of the interface table a requirement instead of a table entry. Covers the loss failure mode, which the counter and checksum of SYS-REQ-023 cannot cover on their own once transmission stops entirely.","up":["SYS-REQ-022"],"down":["SYS-REQ-025"],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-024.md","body":"<h4>Context<\/h4><p>The timeout values themselves stay in the interface table of<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a> so that they<br>are maintained in one place. <code>TSR-008<\/code> is the oldest instance of this rule and is now a special<br>case of it.<\/p>"},"SYS-REQ-025":{"id":"SYS-REQ-025","kind":"SYS-REQ","text":"While the light request signal group is marked as invalid and the low beam was energised at the moment of invalidation, the lighting ECU shall keep the low-beam channels energised at the last valid set point until a valid light request signal group is received again or the ignition signal changes to off.","type":"safety","asil":"B","status":"draft","source":"SYS-REQ-024","rationale":"Golden Thread. A communication fault must not switch off the low beam at night: that would be exactly hazard H-04 (unintended deactivation) triggered by the safety measure itself. Failing silent towards \"keep the light on\" is the correct direction for SG-01, and it is bounded because the loss is reported by SYS-REQ-024 and shown to the driver via the warning path.","up":["SYS-REQ-024","FSR-002"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-025.md","body":"<h4>Context<\/h4><p>The mirror case - light request invalid while the low beam is <em>not<\/em> energised - deliberately does<br>not switch the low beam on. Automatic activation is covered by the ambient-brightness path<br>(<code>SYS-REQ-002<\/code>), which carries its own validity information.<\/p>"},"SYS-REQ-026":{"id":"SYS-REQ-026","kind":"SYS-REQ","text":"When the lighting ECU has classified a low-beam channel as failed, it shall transmit the driver warning signal group as an event-triggered frame within 20 ms of the classification and subsequently with a cyclic repetition of 500 ms.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-010","rationale":"TSR-005 fixes only the cyclic repetition. Purely cyclic transmission would put up to one full cycle of 500 ms of dead time in front of the warning; the event-triggered first frame removes it and gives the 2 s budget of SYS-REQ-010 a margin of more than an order of magnitude. 20 ms is one transmit task period plus worst-case queuing delay (plausible example values).","up":["SYS-REQ-010","TSR-005"],"down":[],"alloc":["ECU_LightingCtrl","CAN_FD_Transceiver","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-026.md","body":"<h4>Context<\/h4><p>Timing derivation: <code>04_architecture/ee_architecture.md<\/code>, section &quot;Bus load and timing analysis&quot;,<br>chain B.<\/p>"},"SYS-REQ-027":{"id":"SYS-REQ-027","kind":"SYS-REQ","text":"The lighting ECU shall include a signal-group-specific data identifier in the checksum computation of every safety-relevant signal group, and shall use a different data identifier for each signal group.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-022","rationale":"Without a data identifier in the checksum, a correctly formed frame delivered to the wrong identifier - a masquerade or a mis-routed frame in the gateway - passes the counter and checksum check. The identifier is what makes the check sensitive to the source of the data, not only to its content.","up":["SYS-REQ-022"],"down":[],"alloc":["ECU_LightingCtrl","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-027.md","body":"<h4>Context<\/h4><p>Data identifier values are listed in the message catalogue of<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>; they are<br>plausible example values and must be agreed with the gateway supplier (<code>OP-28<\/code>).<\/p>"},"SYS-REQ-028":{"id":"SYS-REQ-028","kind":"SYS-REQ","text":"The lighting ECU shall occupy not more than 1.0 % of the nominal capacity of the CAN FD segment to which it is connected with its own transmitted frames, measured over any 100 ms window and under any operating condition including the fault reaction.","type":"communication","asil":"B","status":"draft","source":"SYS-REQ-020","rationale":"Turns the transmit budget of the bus load analysis into a verifiable bound. The bound covers only what the ECU controls - its own frames - because the receive traffic is produced by the vehicle gateway. The 100 ms window matters: an event-triggered warning frame (SYS-REQ-026) on top of the cyclic frames must not create a burst in exactly the fault case in which the bus is needed. Calculated worst 100 ms window 0.66 %, long-term average 0.20 % (plausible example values).","up":["SYS-REQ-020"],"down":[],"alloc":["ECU_LightingCtrl","CAN_FD_Transceiver"],"vby":[],"verifies":[],"tags":[],"file":"01_requirements/system/SYS-REQ-028.md","body":"<h4>Context<\/h4><p>Derivation and the assumed background load of other ECUs (<code>A-14<\/code>):<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>, section<br>&quot;Bus load and timing analysis&quot;.<\/p>"},"TC-021":{"id":"TC-021","kind":"TC","text":"Fault injection of an open load on low-beam channel 1: evidence of detection, fault reaction within the fault reaction time, driver warning and DTC entry.","type":"fault-injection","asil":"B","status":"draft","source":"","rationale":"","up":["SYS-REQ-014","SYS-REQ-018","FSR-001","SG-01"],"down":[],"alloc":["HiL"],"vby":[],"verifies":["CR-007","FSR-001","SG-01","SM-01","SYS-REQ-014"],"tags":[],"file":"07_verification/testcases/TC-021.md","body":"<h4>Context<\/h4><p>Golden Thread test case. The measured time must be assessed against the FTTI of SG-01 (300 ms), not<br>merely against &quot;a reaction occurred&quot;. The result is duty-dependent, so the PWM duty is fixed in the<br>preconditions and the test is run at both ends of the specified range.<\/p><h4>Change note (phase 3 refinement, hardware-engineer)<\/h4><p>Expected result &quot;within 50 ms plus debounce&quot; replaced by the explicit 80 ms detection budget;<br>preconditions now fix the PWM duty; steps now capture off-phase samples. Status dropped to <code>draft<\/code>.<\/p>"},"TSR-001":{"id":"TSR-001","kind":"TSR","text":"The lighting ECU shall monitor its own program execution by an external watchdog with an independent time base and shall de-energise the LED driver stages into the defined off state if the watchdog is not served within 50 ms.","type":"safety","asil":"B","status":"draft","source":"FSR-002","rationale":"Covers loss of control of the microcontroller, which would otherwise allow unintended activation or deactivation of any channel. Independent time base is required so that a clock fault cannot disable the monitor. Plausible example value.","up":["FSR-002"],"down":["HW-REQ-016","HW-REQ-017","HW-REQ-018","HW-REQ-019","SM-02","SM-06"],"alloc":["ECU_LightingCtrl","ASIC_Watchdog"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-001.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to<br>HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-002":{"id":"TSR-002","kind":"TSR","text":"The lighting ECU shall prevent energising or de-energising of a low-beam channel that was not requested by the light request signal, by evaluating the commanded state and the measured channel state in every monitoring cycle.","type":"safety","asil":"B","status":"draft","source":"FSR-002","rationale":"Technical realisation of FSR-002 (hazard H-04, unintended deactivation). Command/feedback comparison is the mechanism.","up":["FSR-002"],"down":["HW-REQ-021","SM-04"],"alloc":["ECU_LightingCtrl","SWC_LightManager","Current_Sense_Chain"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-002.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to<br>HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-003":{"id":"TSR-003","kind":"TSR","text":"The lighting ECU shall detect the loss of load current in a low-beam channel and report it to the fault reaction within 100 ms of fault occurrence.","type":"safety","asil":"B","status":"draft","source":"FSR-001","rationale":"Golden Thread technical safety requirement. Realised by SM-01 with a worst-case detection time of 80 ms (HW-REQ-009); the 100 ms is the allocated cap of SYS-REQ-018. Detection budget plus the 150 ms fault reaction time stays below the 300 ms FTTI of SG-01.","up":["FSR-001"],"down":["HW-REQ-020","SM-01","SM-03"],"alloc":["ECU_LightingCtrl","SM-01","SWC_LightManager"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-003.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to<br>HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-004":{"id":"TSR-004","kind":"TSR","text":"When the loss of a low-beam channel has been reported, the lighting ECU shall establish the safe state of SG-01 within 150 ms by continuing to operate the remaining channel and setting the fault status.","type":"safety","asil":"B","status":"draft","source":"FSR-003","rationale":"Fault reaction time from SG-01. The safe state is degraded but visible, not off.","up":["FSR-003","FSR-001"],"down":["HW-REQ-019"],"alloc":["ECU_LightingCtrl","SWC_LightManager","LED_Driver_Stage_1"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-004.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to<br>HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-005":{"id":"TSR-005","kind":"TSR","text":"The lighting ECU shall transmit the driver warning request on the vehicle bus with a cyclic repetition of at most 500 ms while a low-beam channel is classified as failed.","type":"safety","asil":"B","status":"draft","source":"FSR-004","rationale":"Cyclic repetition so that a single lost frame does not suppress the warning that carries the C rating of hazard H-01 (assumption A-03). Plausible example value.","up":["FSR-004"],"down":["SYS-REQ-026"],"alloc":["ECU_LightingCtrl","Vehicle_Gateway"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-005.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to<br>HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-006":{"id":"TSR-006","kind":"TSR","text":"The lighting ECU shall determine the high-beam segment to be masked from the object data and shall command the corresponding LED driver stage accordingly.","type":"safety","asil":"QM(A)","status":"draft","source":"FSR-006","rationale":"QM path of the ASIL decomposition of FSR-005. Admissible only together with TSR-007 and a demonstrated independence argument (RISK-02, DFA in phase 5).","up":["FSR-006"],"down":[],"alloc":["SWC_HighBeamControl"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-006.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to<br>HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-007":{"id":"TSR-007","kind":"TSR","text":"The lighting ECU shall evaluate, in a monitor independent of the high-beam control path, whether the commanded high-beam state is plausible against vehicle speed and ambient brightness, and shall de-energise the high beam within 250 ms if it is not.","type":"safety","asil":"A(A)","status":"draft","source":"FSR-007","rationale":"Safety path of the decomposition. Uses different input signals from TSR-006 and acts directly on the driver enable, which is the substance of the independence claim. Fault reaction time from SG-02.","up":["FSR-007"],"down":[],"alloc":["ECU_LightingCtrl","SWC_HighBeamMonitor"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc/TSR-007.md","body":"<h4>Context<\/h4><p>Technical safety requirement from phase 3 (ISO 26262-4, technical safety concept). Allocation to<br>HW / SW / system measures see<br><a href=\"#doc/04_architecture/ee_architecture.md\"><code>../../04_architecture/ee_architecture.md<\/code><\/a>.<\/p>"},"TSR-008":{"id":"TSR-008","kind":"TSR","text":"The lighting ECU shall inhibit energising of the work-lamp output stages while the vehicle speed signal exceeds 10 km/h or while the vehicle speed signal is invalid.","type":"safety","asil":"A","status":"draft","source":"FSR-008","rationale":"Extends SYS-REQ-005 by the signal-invalid case: a missing speed signal must not enable the work lamps, otherwise the inhibit can be defeated by a communication fault.","up":["FSR-008"],"down":[],"alloc":["ECU_LightingCtrl","SWC_WorkLampControl"],"vby":[],"verifies":[],"tags":[],"file":"02_safety/04_tsc _ee_architecture\ntitle E/E architecture - Lighting ECU (SYS.3)\nskinparam componentStyle rectangle\nskinparam rectangle {\n  BackgroundColor White\n}\n\nrectangle \"Vehicle\" as VEH #LightGray {\n  rectangle \"Vehicle_Gateway\\nCAN FD / J1939, SA 0x27\\nE2E counterpart (A-15)\" as GW\n  rectangle \"Vehicle supply 24 V\" as PWR\n}\n\nrectangle \"ECU_LightingCtrl\" as ECU #LightYellow {\n  rectangle \"MCU_Lockstep\\n«block» ASIL B\" as MCU\n  rectangle \"ASIC_Watchdog\\n«block» ASIL B\\nTSR-001\" as WD\n  rectangle \"Power_Supply_Unit\\n16-32 V\" as PSU\n  rectangle \"CAN_FD_Transceiver\\n500 kbit/s arb. / 2 Mbit/s data\\nSA 0x21, E2E SYS-REQ-022\" as CAN\n  rectangle \"LIN_Transceiver\" as LIN\n  rectangle \"LED_Driver_Stage_1..n\\n«block» ASIL B\\nbase variant w/o HW-REQ-004\" as DRV\n  rectangle \"Current_Sense_Chain\\nSM-01 / HW-REQ-001\\ndetection <= 80 ms\" as CS\n  rectangle \"Temp_Sense_Chain\" as TS\n}\n\nrectangle \"Headlamp modules\\nlow / high / cornering\" as LAMP\nrectangle \"Work-lamp output stages\" as WORK\n\nPWR --> PSU : KL30 / KL15\nGW --> CAN : LGT_Request_1 100 ms\\nVEH_Dynamics_1 20 ms\\nVEH_Environment_1 100 ms\\nOBJ_List_1 50 ms (no E2E)\nCAN --> GW : LGT_Status_1 100 ms\\nLGT_Warning_1 event + 500 ms\nCAN <--> MCU : E2E counter / CRC / data ID\nMCU --> DRV : PWM, enable\nMCU <--> WD : question / answer\nWD --> DRV : disable (TSR-001)\nDRV --> LAMP : channel current\nDRV --> WORK\nDRV --> CS : shunt voltage\nCS --> MCU : I_load (PWM-synchronous)\nTS --> MCU : T_LED, T_board\nDRV --> MCU : OVP / OCP / thermal status\nMCU --> LIN : actuator command\n\nnote bottom of CS\n  SG-01 chain A runs DRV -> CS -> MCU -> DRV and never\n  leaves the ECU: 80 ms detection + 150 ms reaction\n  < 300 ms FTTI, with no share for the bus.\nend note\n\nnote bottom of CAN\n  Lighting signal set approx. 1.9 % bus load, of which\n  0.20 % transmitted by this ECU (SYS-REQ-028).\n  Plausible example values.\nend note\n@enduml\n"},{"name":"bdd_system","title":"Block def \" as D\n\n== Normal operation ==\nLM -> DRV : PWM 400 Hz, enable\nDRV -> CS : shunt voltage\nCS -> LM : I_load = 1.20 A (PWM-synchronous, 2.5 ms raster)\n\n== Fault occurs: open load ==\nDRV -> CS : shunt voltage ~ 0\nCS -> LM : I_load < 150 mA\nnote right of LM\n  t = 0 ms   fault occurs\n  qualification window 50 ms\n  debounce            20 ms\n  sync + acquisition   2.6 ms\n  task latency         5 ms\nend note\nLM -> LM : classify \"open load\"\\n(SYS-REQ-014) at t <= 80 ms\nLM -> CS : off-phase zero check (HW-REQ-005)\nCS --> LM : sense chain healthy\nLM -> DRV : keep remaining channel,\\nreduce set point\nnote right of LM : safe state reached\\nat t <= 230 ms < FTTI 300 ms\nLM -> DM : set DTC \"low beam ch.1 open load\"\nLM -> GW : DriverWarningReq = lowBeamFault\nGW -> D : warning in instrument cluster (<= 2 s)\n\n== Workshop ==\nparticipant \"Diagnostic tester\" as T\nT -> DM : UDS 0x19 read DTC\nDM --> T : DTC + snapshot (<= 100 ms)\n@enduml\n"},{"name":"stm_lighting","title":"State machine - Lighting system operating states incl. safe state (SG-01)","file":"03_model/plantuml/stm_lighting.puml","svg":"PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIiBjb250ZW50U3R5bGVUeXBlPSJ0ZXh0L2NzcyIgZGF0YS1kaWFncmFtLXR5cGU9IlNUQVRFIiBoZWlnaHQ9IjU4MXB4IiBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBzdHlsZT0id2lkdGg6Nzk2cHg7aGVpZ2h0OjU4MXB4O2JhY2tncm91bmQ6I0ZGRkZGRjsiIHZlcnNpb249IjEuMSIgdmlld0JveD0iMCAwIDc5NiA1ODEiIHdpZHRoPSI3OTZweCIgem9vbUFuZFBhbj0ibWFnbmlmeSI+PD9wbGFudHVtbCAxLjIwMjYuNj8+PGRlZnMvPjxnPjxnIGNsYXNzPSJ0aXRsZSIgZGF0YS1zb3VyY2UtbGluZT0iMSI+PHRleHQgZmlsbD0iIzAwMDAwMCIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZvbnQtd2VpZ2h0PSI3MDAiIGxlbmd0aEFkanVzdD0ic3BhY2luZyIgdGV4dExlbmd0aD0iNTI3LjA2NDUiIHg9IjEzMS4zNDA5IiB5PSIyMy41MzUyIj5TdGF0ZSBtYWNoaW5lIC0gTGlnaHRpbmcgc3lzdGVtIG9wZXJhdGluZyBzdGF0ZXMgaW5jbC4gc2FmZSBzdGF0ZSAoU0ctMDEpPC90ZXh0PjwvZz48ZyBjbGFzcz0iZW50aXR5IiBkYXRhLXF1YWxpZmllZC1uYW1lPSJJbml0IiBkYX
