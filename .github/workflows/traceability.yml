name: Traceability & Requirements Gate

# ASPICE: SUP.1 (QA), SUP.8 (Konfigurationsmanagement), SYS.2/SYS.5 (Traceability)
# ISO 26262: Part 8 (Requirements Management) -- erzeugt auditierbaren Nachweis pro PR.
#
# Der Job ist ein Required Check in den Branch Protection Rules: ohne gruenen Lauf
# ist kein Merge nach main moeglich (technisch erzwungene Freigabe, SUP.4).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  traceability:
    name: Traceability-Konsistenzpruefung
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (volle Historie fuer Baseline-Bezug)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Traceability pruefen und Matrix erzeugen
        id: trace
        run: |
          set -o pipefail
          python3 tools/trace_check.py \
            --matrix 07_verification/reports/traceability_matrix.md \
            | tee trace_report.txt
        continue-on-error: true

      - name: KPIs als JSON erzeugen
        if: always()
        run: python3 tools/trace_check.py --json > trace_report.json || true

      - name: Nachweis als Artefakt aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-evidence-${{ github.sha }}
          path: |
            trace_report.txt
            trace_report.json
            07_verification/reports/traceability_matrix.md
          retention-days: 90

      - name: Ergebnis als PR-Kommentar
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('trace_report.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Traceability-Check\n\n```\n' + report.slice(0, 60000) + '\n```'
            });

      - name: Gate durchsetzen
        if: steps.trace.outcome == 'failure'
        run: |
          echo "::error::Traceability-Findings vorhanden - Merge blockiert."
          exit 1

  plantuml:
    name: Modell-Syntaxpruefung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PlantUML installieren
        run: sudo apt-get update && sudo apt-get install -y plantuml

      - name: PlantUML-Quellen pruefen
        run: |
          shopt -s nullglob
          files=(03_model/plantuml/*.puml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Noch keine PlantUML-Quellen vorhanden - Pruefung uebersprungen."
            exit 0
          fi
          plantuml -checkonly "${files[@]}"

      - name: Modellsichten rendern
        if: success()
        run: |
          shopt -s nullglob
          files=(03_model/plantuml/*.puml)
          [ ${#files[@]} -eq 0 ] && exit 0
          mkdir -p 03_model/exports
          plantuml -tsvg -o "$(pwd)/03_model/exports" "${files[@]}"

      - name: Gerenderte Sichten aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-views-${{ github.sha }}
          path: 03_model/exports/
          retention-days: 90
          if-no-files-found: ignore
