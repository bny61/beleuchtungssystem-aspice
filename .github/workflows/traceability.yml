name: Traceability & Requirements Gate

# ASPICE: SUP.1 (QA), SUP.8 (configuration management), SYS.2/SYS.5 (traceability)
# ISO 26262: Part 8 (requirements management) -- produces auditable evidence per PR.
#
# This job is a required check in the branch protection rules: without a green run
# no merge into main is possible (technically enforced approval, SUP.4).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  traceability:
    name: Traceability consistency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for baseline reference)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check traceability and generate matrix
        id: trace
        run: |
          set -o pipefail
          python3 tools/trace_check.py \
            --matrix 07_verification/reports/traceability_matrix.md \
            | tee trace_report.txt
        continue-on-error: true

      - name: Generate KPIs as JSON
        if: always()
        run: python3 tools/trace_check.py --json > trace_report.json || true

      - name: Retain evidence as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-evidence-${{ github.sha }}
          path: |
            trace_report.txt
            trace_report.json
            07_verification/reports/traceability_matrix.md
          retention-days: 90

      - name: Post result as a PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('trace_report.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Traceability check\n\n```\n' + report.slice(0, 60000) + '\n```'
            });

      - name: Enforce gate
        if: steps.trace.outcome == 'failure'
        run: |
          echo "::error::Traceability findings present - merge blocked."
          exit 1

  plantuml:
    name: Model syntax check
    runs-on: ubuntu-latest

    # The PlantUML version is pinned deliberately. Previously the job installed
    # whatever `apt-get install plantuml` happened to ship, which is several years
    # behind the current release: diagrams that pass locally then fail the gate on
    # syntax the runner's version does not know yet (this hit the portin/portout
    # ports in ibd_ecu.puml). A pinned, checksummed jar makes the check reproducible
    # and turns a version bump into a reviewable change instead of a surprise.
    #
    # When raising the version, update BOTH values below (get the checksum from the
    # release asset) and re-run the check against the whole model, not just the
    # diagram in hand.
    env:
      PLANTUML_VERSION: '1.2026.6'
      PLANTUML_SHA256: '89948f14c93756c7a3fb7b69078ff37e8489fd79dd430c582b931e2f65358690'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install pinned PlantUML
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          echo "${PLANTUML_SHA256}  plantuml.jar" | sha256sum -c -
          java -jar plantuml.jar -version | head -n 3
          # Fails loudly if Graphviz is missing or unusable, rather than letting
          # every later diagram fail with an obscure error.
          java -jar plantuml.jar -testdot

      - name: Check PlantUML sources
        run: |
          shopt -s nullglob
          files=(03_model/plantuml/*.puml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PlantUML sources yet - check skipped."
            exit 0
          fi
          java -jar plantuml.jar -checkonly "${files[@]}"

      - name: Render model views
        if: success()
        run: |
          shopt -s nullglob
          files=(03_model/plantuml/*.puml)
          [ ${#files[@]} -eq 0 ] && exit 0
          mkdir -p 03_model/exports
          java -jar plantuml.jar -tsvg -o "$(pwd)/03_model/exports" "${files[@]}"

      - name: Retain rendered views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-views-${{ github.sha }}
          path: 03_model/exports/
          retention-days: 90
          if-no-files-found: ignore
