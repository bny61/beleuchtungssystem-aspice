name: Traceability & Requirements Gate

# ASPICE: SUP.1 (QA), SUP.8 (configuration management), SYS.2/SYS.5 (traceability)
# ISO 26262: Part 8 (requirements management) -- produces auditable evidence per PR.
#
# This job is a required check in the branch protection rules: without a green run
# no merge into main is possible (technically enforced approval, SUP.4).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  traceability:
    name: Traceability consistency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for baseline reference)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check traceability and generate matrix
        id: trace
        run: |
          set -o pipefail
          python3 tools/trace_check.py \
            --matrix 07_verification/reports/traceability_matrix.md \
            | tee trace_report.txt
        continue-on-error: true

      - name: Generate KPIs as JSON
        if: always()
        run: python3 tools/trace_check.py --json > trace_report.json || true

      - name: Retain evidence as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-evidence-${{ github.sha }}
          path: |
            trace_report.txt
            trace_report.json
            07_verification/reports/traceability_matrix.md
          retention-days: 90

      - name: Post result as a PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('trace_report.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Traceability check\n\n```\n' + report.slice(0, 60000) + '\n```'
            });

      - name: Enforce gate
        if: steps.trace.outcome == 'failure'
        run: |
          echo "::error::Traceability findings present - merge blocked."
          exit 1

  plantuml:
    name: Model syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned and checksum-verified; the version lives in the composite action so that
      # every workflow touching model views agrees on it.
      - uses: ./.github/actions/setup-plantuml

      - name: Check PlantUML sources
        run: |
          shopt -s nullglob
          files=(03_model/plantuml/*.puml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PlantUML sources yet - check skipped."
            exit 0
          fi
          plantuml -checkonly "${files[@]}"

      - name: Render model views
        if: success()
        run: |
          shopt -s nullglob
          files=(03_model/plantuml/*.puml)
          [ ${#files[@]} -eq 0 ] && exit 0
          mkdir -p 03_model/exports
          plantuml -tsvg -o "$(pwd)/03_model/exports" "${files[@]}"

      - name: Retain rendered views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-views-${{ github.sha }}
          path: 03_model/exports/
          retention-days: 90
          if-no-files-found: ignore
