name: Requirement overviews

# Keeps the generated folder overviews (README.md per requirement folder) up to date.
# ASPICE: SUP.8 (configuration management), SUP.1 (QA)
# ISO 26262: Part 8 (requirements management) -- the overviews are derived
# artefacts; the source remains the respective record.
#
# Two modes:
#   Pull request -> check only. A stale overview blocks the merge.
#   Push to main -> regenerate and commit back automatically.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Overviews up to date?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check freshness
        run: python3 tools/gen_index.py --check

  update:
    name: Update overviews
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Token with write permission so the commit can be pushed back
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate overviews
        run: python3 tools/gen_index.py

      - name: Commit changes back
        run: |
          if git diff --quiet; then
            echo "No change to the overviews - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*/README.md"
          git commit -m "chore(index): update requirement overviews

          Generated automatically by tools/gen_index.py.
          [skip ci]"
          git push
