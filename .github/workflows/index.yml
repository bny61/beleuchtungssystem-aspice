name: Requirement overviews and traceability views

# Keeps the generated folder overviews (README.md per requirement folder) and the
# traceability views (Mermaid + HTML explorer) up to date.
# ASPICE: SUP.8 (configuration management), SUP.1 (QA)
# ISO 26262: Part 8 (requirements management) -- the overviews are derived
# artefacts; the source remains the respective record.
#
# Two modes:
#   Pull request -> check only. A stale overview blocks the merge.
#   Push to main -> regenerate and commit back automatically.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Overviews up to date?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The browser embeds the rendered model views, so the check needs the same
      # PlantUML the author had -- otherwise it would report a false staleness.
      - uses: ./.github/actions/setup-plantuml
      - name: Check freshness of the folder overviews
        run: python3 tools/gen_index.py --check

      - name: Check freshness of the traceability views
        run: python3 tools/gen_trace_graph.py --check

      - name: Check freshness of the requirements browser
        run: python3 tools/gen_req_browser.py --check

  update:
    name: Update overviews
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Token with write permission so the commit can be pushed back
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Without PlantUML the browser would regenerate with every diagram stripped out.
      - uses: ./.github/actions/setup-plantuml

      - name: Generate overviews
        run: python3 tools/gen_index.py

      - name: Generate traceability views
        run: python3 tools/gen_trace_graph.py

      - name: Generate the requirements browser
        run: python3 tools/gen_req_browser.py

      - name: Commit changes back
        run: |
          if git diff --quiet; then
            echo "No change to the overviews - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*/README.md" 07_verification/reports/traceability_views.md \
                  07_verification/reports/trace_explorer.html \
                  07_verification/reports/requirements_browser.html
          git commit -m "chore(index): update requirement overviews and traceability views

          Generated automatically by tools/gen_index.py.
          [skip ci]"
          git push
