name: Safety Anomaly (ISO 26262)
description: Safety-relevant deviation with a possible violation of a safety goal
title: "[SAFETY] "
labels: ["safety-relevant", "asil-b", "impact-analysis-required"]
body:
  - type: input
    id: sg
    attributes:
      label: Affected safety goal
      placeholder: "SG-01"
    validations:
      required: true
  - type: textarea
    id: anomaly
    attributes:
      label: Description of the anomaly
    validations:
      required: true
  - type: textarea
    id: violation
    attributes:
      label: Assessment of the safety goal violation
      value: |
        - Violation possible? (yes/no/unclear):
        - Affected safety mechanism (SM-xx):
        - Effect on FTTI / fault reaction time:
        - Effect on HW metrics (SPFM/LFM/PMHF):
    validations:
      required: true
  - type: textarea
    id: containment
    attributes:
      label: Immediate action / containment
    validations:
      required: true
  - type: checkboxes
    id: followup
    attributes:
      label: Follow-up activities
      options:
        - label: Safety analyses updated (FMEA / FTA / FMEDA / DFA)
        - label: Affected requirements updated
        - label: Safety case updated
        - label: Confirmation review required
