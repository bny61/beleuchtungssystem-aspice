name: Change Request (SUP.10)
description: Request a change to a released work product
title: "[CR] "
labels: ["change-request", "impact-analysis-required"]
body:
  - type: input
    id: affected
    attributes:
      label: Affected IDs / work products
      placeholder: "SYS-REQ-014, SM-01, 03_model/plantuml/stm_lighting.puml"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Description of the change
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Rationale
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact analysis
      description: Effect on requirements, architecture, safety analyses, tests, baseline
      value: |
        - Requirements:
        - Architecture / model:
        - Safety analyses (FMEA/FTA/FMEDA/DFA):
        - Tests / regression:
        - Affected baseline (tag):
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety-relevant?
      options: ["yes - ASIL B", "yes - QM", "no"]
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Approval
      options:
        - label: Impact analysis performed
        - label: Safety manager informed (if safety-relevant)
        - label: Affected tests identified
