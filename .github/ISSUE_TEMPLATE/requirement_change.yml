name: Requirement Change
description: Change to an existing requirement (text, ASIL, trace, status)
title: "[REQ] "
labels: ["requirement-change", "impact-analysis-required"]
body:
  - type: input
    id: reqid
    attributes:
      label: Requirement ID
      placeholder: "SYS-REQ-014"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current version
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed version (EARS-compliant)
    validations:
      required: true
  - type: dropdown
    id: asilchange
    attributes:
      label: Does the ASIL change?
      options: ["no", "yes - rationale below", "unclear"]
    validations:
      required: true
  - type: textarea
    id: downstream
    attributes:
      label: Affected derived artefacts
      description: Take from the traceability matrix (derived_from / allocated_to / verified_by)
      value: |
        - Derived requirements:
        - Design elements:
        - Test cases:
        - Safety analyses:
    validations:
      required: true
