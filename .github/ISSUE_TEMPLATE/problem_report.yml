name: Problem Report (SUP.9)
description: Report a deviation, defect or inconsistency
title: "[PR] "
labels: ["problem-report"]
body:
  - type: input
    id: where
    attributes:
      label: Location (file / ID / baseline)
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour / finding
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["blocker", "major", "minor", "observation"]
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety relevance
      description: If "yes", additionally handle as a safety anomaly
      options: ["yes", "no", "unclear - assessment required"]
    validations:
      required: true
  - type: textarea
    id: analysis
    attributes:
      label: Root cause analysis / corrective action
      value: |
        - Root cause:
        - Immediate action:
        - Corrective action:
        - Verification of the correction:
